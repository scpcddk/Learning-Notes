span>，<span class=\"math-inline\">\\(\\frac{dy}{dx}=u+x\\frac{du}{dx}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>一阶线性<\/strong><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(y&#x27;+P(x)y=Q(x)\\)<\/span><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(\\boxed{y=e^{-\\int Pdx}\\left[\\int Qe^{\\int Pdx}dx+C\\right]}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>伯努利<\/strong><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(y&#x27;+P(x)y=Q(x)y^\\alpha\\)<\/span><\/td>\n<td style=\"text-align:left\">令 <span class=\"math-inline\">\\(z=y^{1-\\alpha}\\)<\/span>，化为一阶线性<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>全微分<\/strong><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(Pdx+Qdy=0\\)<\/span> 且 <span class=\"math-inline\">\\(\\frac{\\partial P}{\\partial y}=\\frac{\\partial Q}{\\partial x}\\)<\/span><\/td>\n<td style=\"text-align:left\">求 <span class=\"math-inline\">\\(u(x,y)\\)<\/span> 使 <span class=\"math-inline\">\\(du=Pdx+Qdy\\)<\/span>，通解 <span class=\"math-inline\">\\(u=C\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>缺 <span class=\"math-inline\">\\(y\\)<\/span> 型<\/strong><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(y&#x27;&#x27;=f(x,y&#x27;)\\)<\/span><\/td>\n<td style=\"text-align:left\">令 <span class=\"math-inline\">\\(p=y&#x27;\\)<\/span>，则 <span class=\"math-inline\">\\(y&#x27;&#x27;=\\frac{dp}{dx}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>缺 <span class=\"math-inline\">\\(x\\)<\/span> 型<\/strong><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(y&#x27;&#x27;=f(y,y&#x27;)\\)<\/span><\/td>\n<td style=\"text-align:left\">令 <span class=\"math-inline\">\\(p=y&#x27;\\)<\/span>，则 <span class=\"math-inline\">\\(\\boxed{y&#x27;&#x27;=p\\frac{dp}{dy}}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>二阶常系数齐次<\/strong><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(y&#x27;&#x27;+py&#x27;+qy=0\\)<\/span><\/td>\n<td style=\"text-align:left\">特征方程 <span class=\"math-inline\">\\(r^2+pr+q=0\\)<\/span>，按 <span class=\"math-inline\">\\(\\Delta&gt;0/\\!=0/&lt;0\\)<\/span> 写通解<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>二阶常系数非齐次<\/strong><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(y&#x27;&#x27;+py&#x27;+qy=f(x)\\)<\/span><\/td>\n<td style=\"text-align:left\">通解 = 齐次通解 <span class=\"math-inline\">\\(Y\\)<\/span> + 特解 <span class=\"math-inline\">\\(y^*\\)<\/span>（待定系数法）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-ode-full-h3\">🎯 二阶常系数非齐次特解怎么设？<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><span class=\"math-inline\">\\(f(x)\\)<\/span> 的形式<\/th>\n<th style=\"text-align:left\">特解 <span class=\"math-inline\">\\(y^*\\)<\/span> 怎么设<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(P_m(x)e^{\\lambda x}\\)<\/span><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(x^k \\cdot Q_m(x) \\cdot e^{\\lambda x}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(e^{\\alpha x}[P_l\\cos\\beta x + P_n\\sin\\beta x]\\)<\/span><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(x^k \\cdot e^{\\alpha x}[R_m\\cos\\beta x + S_m\\sin\\beta x]\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong><span class=\"math-inline\">\\(k\\)<\/span> 的取值规则：<\/strong><\/p>\n<ul>\n<li><span class=\"math-inline\">\\(k=0\\)<\/span>：<span class=\"math-inline\">\\(\\lambda\\)<\/span>（或 <span class=\"math-inline\">\\(\\alpha+i\\beta\\)<\/span>）<strong>不是<\/strong>特征根<\/li>\n<li><span class=\"math-inline\">\\(k=1\\)<\/span>：<span class=\"math-inline\">\\(\\lambda\\)<\/span>（或 <span class=\"math-inline\">\\(\\alpha+i\\beta\\)<\/span>）<strong>是单根<\/strong><\/li>\n<li><span class=\"math-inline\">\\(k=2\\)<\/span>：<span class=\"math-inline\">\\(\\lambda\\)<\/span> 是<strong>二重根<\/strong>（仅第一种情形）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"topic-ode-full-h4\">🔑 一句话口诀<\/h2>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>一阶看形式，高阶看系数；齐次看特征，非齐次待定系数<\/strong><\/p>\n<\/blockquote>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">场景<\/th>\n<th style=\"text-align:left\">口诀<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">一阶方程不会分<\/td>\n<td style=\"text-align:left\">&quot;分离、齐次换元、线性套公式、伯努利换 <span class=\"math-inline\">\\(z\\)<\/span>&quot;<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">高阶方程第一步<\/td>\n<td style=\"text-align:left\">&quot;缺谁换谁&quot;（缺 <span class=\"math-inline\">\\(y\\)<\/span> 换 <span class=\"math-inline\">\\(p=y&#x27;\\)<\/span>，缺 <span class=\"math-inline\">\\(x\\)<\/span> 换 <span class=\"math-inline\">\\(p=y&#x27;\\)<\/span> 且 <span class=\"math-inline\">\\(y&#x27;&#x27;=p\\frac{dp}{dy}\\)<\/span>）<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">二阶常系数<\/td>\n<td style=\"text-align:left\">&quot;先写特征方程，再找根，最后待定系数凑特解&quot;<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">非齐次通解<\/td>\n<td style=\"text-align:left\">&quot;齐次通解 + 非齐次特解 = 全部&quot;<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n", "search": "\n\n---\n\n   🗺️ 拿到题先看什么？判断流程\n\n```text\n┌─────────────────────────────────────────────────────────┐\n│  第一步：看是几阶？                                       │\n│  ├─ 一阶 → 进入第二步                                    │\n│  └─ 二阶及以上 → 进入第三步                               │\n└─────────────────────────────────────────────────────────┘\n                              │\n        ┌─────────────────────┴─────────────────────┐\n        ▼                                               ▼\n┌───────────────┐                           ┌─────────────────┐\n│ 第二步：一阶方程│                          │ 第三步：高阶方程  │\n│ 看能不能写成：  │                          │ 看右边有没有f(x) │\n│ dy/dx = ...   │                           │ （非齐次项）     │\n└───────────────┘                           └─────────────────┘\n        │                                               │\n        ▼                                               ▼\n┌─────────────────────────────────────┐    ┌─────────────────────────┐\n│ 右边是 f(x)·g(y) 的乘积形式？        │    │ y\" = f(x) 或 y\" = f(x,y')│\n│  ✓ 是 → 【可分离变量】               │    │  或 y\" = f(y,y')？       │\n│  ✗ 否 → 继续看                      │    │  ✓ 是 → 【可降阶】        │\n│                                     │    │  ✗ 否 → 看系数           │\n│ 右边是 φ(y/x) 的形式？               │    │    常系数 → 【特征方程法】 │\n│  ✓ 是 → 【齐次方程】令 u=y/x         │    │    变系数 → 超纲/其他方法  │\n│  ✗ 否 → 继续看                      │    └─────────────────────────┘\n│                                     │\n│ 能写成 y' + P(x)y = Q(x)？           │\n│  ✓ 是 → 【一阶线性】套公式           │\n│  ✗ 否 → 继续看                      │\n│                                     │\n│ 能写成 y' + P(x)y = Q(x)y^α？       │\n│  ✓ 是 → 【伯努利方程】令 z=y^(1-α)   │\n│  ✗ 否 → 继续看                      │\n│                                     │\n│ Pdx + Qdy = 0，且 ∂P/∂y = ∂Q/∂x？   │\n│  ✓ 是 → 【全微分方程】求 u(x,y)=C    │\n│  ✗ 否 → 尝试找【积分因子】           │\n└─────────────────────────────────────┘\n```\n\n---\n\n   📋   公式速查卡  \n\n| 类型 | 识别标志 | 核心公式/操作 |\n| :--- | :--- | :--- |\n|   可分离变量   |   frac dy  dx =f(x) cdot g(y)  |   int frac dy  g(y) = int f(x)dx+C  |\n|   齐次方程   |   frac dy  dx = varphi( frac y  x )  | 令  u= frac y  x  ，则  y=ux ，  frac dy  dx =u+x frac du  dx   |\n|   一阶线性   |  y'+P(x)y=Q(x)  |   boxed y=e^ - int Pdx  left[ int Qe^  int Pdx dx+C right]   |\n|   伯努利   |  y'+P(x)y=Q(x)y^ alpha  | 令  z=y^ 1- alpha  ，化为一阶线性 |\n|   全微分   |  Pdx+Qdy=0  且   frac  partial P   partial y = frac  partial Q   partial x   | 求  u(x,y)  使  du=Pdx+Qdy ，通解  u=C  |\n|   缺  y  型   |  y''=f(x,y')  | 令  p=y' ，则  y''= frac dp  dx   |\n|   缺  x  型   |  y''=f(y,y')  | 令  p=y' ，则   boxed y''=p frac dp  dy    |\n|   二阶常系数齐次   |  y''+py'+qy=0  | 特征方程  r^2+pr+q=0 ，按   Delta 0/ !=0/<0  写通解 |\n|   二阶常系数非齐次   |  y''+py'+qy=f(x)  | 通解 = 齐次通解  Y  + 特解  y^  （待定系数法） |\n\n---\n\n   🎯 二阶常系数非齐次特解怎么设？\n\n|  f(x)  的形式 | 特解  y^   怎么设 |\n| :--- | :--- |\n|  P_m(x)e^  lambda x   |  x^k  cdot Q_m(x)  cdot e^  lambda x   |\n|  e^  alpha x [P_l cos beta x + P_n sin beta x]  |  x^k  cdot e^  alpha x [R_m cos beta x + S_m sin beta x]  |\n\n   k  的取值规则：  \n\n-  k=0 ：  lambda （或   alpha+i beta ）  不是  特征根\n-  k=1 ：  lambda （或   alpha+i beta ）  是单根  \n-  k=2 ：  lambda  是  二重根  （仅第一种情形）\n\n---\n\n   🔑 一句话口诀\n\n  [!TIP]\n    一阶看形式，高阶看系数；齐次看特征，非齐次待定系数  \n\n| 场景 | 口诀 |\n| :--- | :--- |\n| 一阶方程不会分 | \"分离、齐次换元、线性套公式、伯努利换  z \" |\n| 高阶方程第一步 | \"缺谁换谁\"（缺  y  换  p=y' ，缺  x  换  p=y'  且  y''=p frac dp  dy  ） |\n| 二阶常系数 | \"先写特征方程，再找根，最后待定系数凑特解\" |\n| 非齐次通解 | \"齐次通解 + 非齐次特解 = 全部\" |\n\n---\n"}, {"id": "sec-practice", "number": "30", "kind": "practice", "title": "章节自测与解析", "description": "十章各三道题，先独立作答，再展开解析。", "tags": ["30 道自测", "折叠解析", "错题记录"], "source": "../../%E6%95%B0%E5%AD%A6/%E9%AB%98%E7%AD%89%E6%95%B0%E5%AD%A6/%E9%A2%98%E7%9B%AE/%E7%AB%A0%E8%8A%82%E8%87%AA%E6%B5%8B%E4%B8%8E%E8%A7%A3%E6%9E%90.md", "full": "<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p>本页为配合现有笔记编写的 <strong>30 道自测题，每章 3 道<\/strong>，不摘录历年试卷。先独立作答，再展开解析；判断题必须给出理由或反例。<\/p>\n<\/blockquote>\n<p>返回：<a href=\"#overview\">高等数学学习导航<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h1\">第一章：极限与连续<\/h2>\n<h3 id=\"sec-practice-full-h2\">1.1 相减后的阶数<\/h3>\n<p>求 <span class=\"math-inline\">\\(\\displaystyle\\lim_{x\\to0}\\frac{e^x-1-x}{1-\\cos x}\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h3\">1.2 递推数列<\/h3>\n<p>设 <span class=\"math-inline\">\\(a_1=1,\\ a_{n+1}=\\sqrt{2+a_n}\\)<\/span>。证明数列收敛并求极限。<\/p>\n<h3 id=\"sec-practice-full-h4\">1.3 判断并给反例<\/h3>\n<p>“数列有界，则必收敛。”是否正确？<\/p>\n<details>\n<summary>展开第一章解析<\/summary>\n<p><strong>1.1<\/strong> 分子、分母的主项均为 <span class=\"math-inline\">\\(x^2/2\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\frac{e^x-1-x}{1-\\cos x}\n=\\frac{x^2/2+o(x^2)}{x^2/2+o(x^2)}\\longrightarrow\\boxed1.\\]<\/span><\/p>\n<p><strong>关键<\/strong>：分子相减抵消了一次项，不能只用 <span class=\"math-inline\">\\(e^x-1\\sim x\\)<\/span>。<\/p>\n<p><strong>1.2<\/strong> 归纳得 <span class=\"math-inline\">\\(1\\leq a_n&lt;2\\)<\/span>。又有：<\/p>\n<p><span class=\"math-display\">\\[2+a_n-a_n^2=(2-a_n)(a_n+1)&gt;0,\\]<\/span><\/p>\n<p>所以 <span class=\"math-inline\">\\(a_{n+1}&gt;a_n\\)<\/span>。由单调有界原理，存在极限 <span class=\"math-inline\">\\(L\\in[1,2]\\)<\/span>，满足 <span class=\"math-inline\">\\(L=\\sqrt{2+L}\\)<\/span>，故 <span class=\"math-inline\">\\(\\boxed{L=2}\\)<\/span>。<\/p>\n<p><strong>1.3<\/strong> 错。<span class=\"math-inline\">\\(a_n=(-1)^n\\)<\/span> 有界，但奇、偶子列分别趋于 <span class=\"math-inline\">\\(-1\\)<\/span>、<span class=\"math-inline\">\\(1\\)<\/span>，所以不收敛。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-limits\">极限方法与展开阶数<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h5\">第二章：导数与微分<\/h2>\n<h3 id=\"sec-practice-full-h6\">2.1 用定义求导<\/h3>\n<p>设 <span class=\"math-inline\">\\(f(x)=x^2\\sin(1/x)\\)<\/span>（<span class=\"math-inline\">\\(x\\neq0\\)<\/span>），<span class=\"math-inline\">\\(f(0)=0\\)<\/span>。求 <span class=\"math-inline\">\\(f&#x27;(0)\\)<\/span>，并判断导函数在零点是否连续。<\/p>\n<h3 id=\"sec-practice-full-h7\">2.2 参数方程的二阶导数<\/h3>\n<p>曲线 <span class=\"math-inline\">\\(x=t^2,\\ y=t^3\\)<\/span>，求 <span class=\"math-inline\">\\(t=1\\)<\/span> 时的切线方程及 <span class=\"math-inline\">\\(d^2y/dx^2\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h8\">2.3 判断并解释<\/h3>\n<p>“一元函数在一点连续，则在该点可微。”是否正确？<\/p>\n<details>\n<summary>展开第二章解析<\/summary>\n<p><strong>2.1<\/strong><\/p>\n<p><span class=\"math-display\">\\[f&#x27;(0)=\\lim_{h\\to0}h\\sin(1/h)=\\boxed0.\\]<\/span><\/p>\n<p>当 <span class=\"math-inline\">\\(x\\neq0\\)<\/span>，<span class=\"math-inline\">\\(f&#x27;(x)=2x\\sin(1/x)-\\cos(1/x)\\)<\/span>，在零点没有极限，故导函数不连续。<\/p>\n<p><strong>关键<\/strong>：函数可导，不代表导函数连续。<\/p>\n<p><strong>2.2<\/strong><\/p>\n<p><span class=\"math-display\">\\[\\frac{dy}{dx}=\\frac{3t^2}{2t}=\\frac{3t}{2},\\qquad\n\\frac{d^2y}{dx^2}=\\frac{d(3t/2)/dt}{2t}=\\frac3{4t}.\\]<\/span><\/p>\n<p>在 <span class=\"math-inline\">\\(t=1\\)<\/span> 时，点为 <span class=\"math-inline\">\\((1,1)\\)<\/span>，故切线为：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{y-1=\\frac32(x-1)},\\qquad\n\\boxed{\\frac{d^2y}{dx^2}=\\frac34}.\\]<\/span><\/p>\n<p><strong>2.3<\/strong> 错。<span class=\"math-inline\">\\(f(x)=|x|\\)<\/span> 在零点连续，但左右导数为 <span class=\"math-inline\">\\(-1\\)<\/span>、<span class=\"math-inline\">\\(1\\)<\/span>，不可导，因而不可微。<\/p>\n<\/details>\n<hr />\n<h2 id=\"sec-practice-full-h9\">第三章：中值定理与导数的应用<\/h2>\n<h3 id=\"sec-practice-full-h10\">3.1 构造辅助函数<\/h3>\n<p>设 <span class=\"math-inline\">\\(f\\in C[0,1]\\)<\/span>，在 <span class=\"math-inline\">\\((0,1)\\)<\/span> 可导，且 <span class=\"math-inline\">\\(f(0)=f(1)=0\\)<\/span>。证明存在 <span class=\"math-inline\">\\(\\xi\\in(0,1)\\)<\/span>，使 <span class=\"math-inline\">\\(f&#x27;(\\xi)+2f(\\xi)=0\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h11\">3.2 中值定理证明不等式<\/h3>\n<p>证明当 <span class=\"math-inline\">\\(x&gt;0\\)<\/span> 时：<\/p>\n<p><span class=\"math-display\">\\[\\frac{x}{1+x}&lt;\\ln(1+x)&lt;x.\\]<\/span><\/p>\n<h3 id=\"sec-practice-full-h12\">3.3 驻点是否一定是极值点？<\/h3>\n<p>分析 <span class=\"math-inline\">\\(f(x)=x^3\\)<\/span> 在零点的驻点、极值与拐点情况。<\/p>\n<details>\n<summary>展开第三章解析<\/summary>\n<p><strong>3.1<\/strong> 令 <span class=\"math-inline\">\\(F(x)=e^{2x}f(x)\\)<\/span>。它闭区间连续、开区间可导，且 <span class=\"math-inline\">\\(F(0)=F(1)=0\\)<\/span>。由罗尔定理：<\/p>\n<p><span class=\"math-display\">\\[F&#x27;(\\xi)=e^{2\\xi}[f&#x27;(\\xi)+2f(\\xi)]=0.\\]<\/span><\/p>\n<p>指数因子非零，结论成立。<\/p>\n<p><strong>3.2<\/strong> 对 <span class=\"math-inline\">\\(g(t)=\\ln(1+t)\\)<\/span> 在 <span class=\"math-inline\">\\([0,x]\\)<\/span> 用拉格朗日中值定理，存在 <span class=\"math-inline\">\\(\\eta\\in(0,x)\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\ln(1+x)=\\frac{x}{1+\\eta}.\\]<\/span><\/p>\n<p>因为 <span class=\"math-inline\">\\(1&lt;1+\\eta&lt;1+x\\)<\/span>，得到所证严格不等式。<\/p>\n<p><strong>3.3<\/strong> <span class=\"math-inline\">\\(f&#x27;(0)=0\\)<\/span>，故是驻点；但 <span class=\"math-inline\">\\(x^3\\)<\/span> 严格递增，原点不是极值点。<span class=\"math-inline\">\\(f&#x27;&#x27;(x)=6x\\)<\/span> 在零点两侧变号，所以 <span class=\"math-inline\">\\((0,0)\\)<\/span> 是拐点。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-rolle\">罗尔定理的使用<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h13\">第四章：积分及其应用<\/h2>\n<h3 id=\"sec-practice-full-h14\">4.1 变限积分求导<\/h3>\n<p>设 <span class=\"math-inline\">\\(F(x)=\\displaystyle\\int_x^{x^2}e^{t^2}\\,dt\\)<\/span>，求 <span class=\"math-inline\">\\(F&#x27;(x)\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h15\">4.2 反常积分判断<\/h3>\n<p>分别判断：<\/p>\n<ol>\n<li><span class=\"math-inline\">\\(\\displaystyle\\int_{-1}^{1}\\frac{dx}{x}\\)<\/span> 是否收敛？它的柯西主值是多少？<\/li>\n<li><span class=\"math-inline\">\\(\\displaystyle\\int_0^1x^{-p}\\,dx\\)<\/span> 对哪些实数 <span class=\"math-inline\">\\(p\\)<\/span> 收敛？<\/li>\n<\/ol>\n<h3 id=\"sec-practice-full-h16\">4.3 三角函数积分<\/h3>\n<p>计算 <span class=\"math-inline\">\\(\\displaystyle\\int_0^{\\pi/2}\\sin^2x\\cos^2x\\,dx\\)<\/span>。<\/p>\n<details>\n<summary>展开第四章解析<\/summary>\n<p><strong>4.1<\/strong> 被积函数连续，由变限积分求导与链式法则：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{F&#x27;(x)=2x\\,e^{x^4}-e^{x^2}}.\\]<\/span><\/p>\n<p><strong>4.2<\/strong><\/p>\n<ol>\n<li>零点是瑕点，左右两项分别发散到 <span class=\"math-inline\">\\(-\\infty\\)<\/span>、<span class=\"math-inline\">\\(+\\infty\\)<\/span>，所以通常反常积分<strong>发散<\/strong>；对称截断的柯西主值为 <span class=\"math-inline\">\\(\\boxed0\\)<\/span>。<\/li>\n<li>当且仅当 <span class=\"math-inline\">\\(\\boxed{p&lt;1}\\)<\/span> 时收敛，积分为 <span class=\"math-inline\">\\(1/(1-p)\\)<\/span>；<span class=\"math-inline\">\\(p=1\\)<\/span> 时对数发散，<span class=\"math-inline\">\\(p&gt;1\\)<\/span> 时也发散。<\/li>\n<\/ol>\n<p><strong>4.3<\/strong><\/p>\n<p><span class=\"math-display\">\\[\\sin^2x\\cos^2x=\\frac{1-\\cos4x}{8},\\]<\/span><\/p>\n<p>所以：<\/p>\n<p><span class=\"math-display\">\\[\\int_0^{\\pi/2}\\sin^2x\\cos^2x\\,dx\n=\\left[\\frac{x}{8}-\\frac{\\sin4x}{32}\\right]_0^{\\pi/2}\n=\\boxed{\\frac{\\pi}{16}}.\\]<\/span><\/p>\n<p>也可用混合华莱士公式核对。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-improper\">反常积分<\/a>、<a href=\"#topic-wallis\">华莱士公式<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h17\">第五章：无穷级数<\/h2>\n<h3 id=\"sec-practice-full-h18\">5.1 平移幂级数<\/h3>\n<p>求 <span class=\"math-inline\">\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(x-1)^n}{n2^n}\\)<\/span> 的收敛域，并区分端点的绝对、条件收敛情况。<\/p>\n<h3 id=\"sec-practice-full-h19\">5.2 求和函数<\/h3>\n<p>求 <span class=\"math-inline\">\\(\\displaystyle\\sum_{n=1}^{\\infty}nx^n\\)<\/span> 的和函数及收敛域。<\/p>\n<h3 id=\"sec-practice-full-h20\">5.3 任意项级数<\/h3>\n<p>判断 <span class=\"math-inline\">\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{\\sqrt n}\\)<\/span> 是绝对收敛、条件收敛还是发散。<\/p>\n<details>\n<summary>展开第五章解析<\/summary>\n<p><strong>5.1<\/strong> 令 <span class=\"math-inline\">\\(t=(x-1)/2\\)<\/span>，内部条件为 <span class=\"math-inline\">\\(|t|&lt;1\\)<\/span>，即 <span class=\"math-inline\">\\(-1&lt;x&lt;3\\)<\/span>。<\/p>\n<ul>\n<li><span class=\"math-inline\">\\(x=-1\\)<\/span>：<span class=\"math-inline\">\\(\\sum(-1)^n/n\\)<\/span> 条件收敛。<\/li>\n<li><span class=\"math-inline\">\\(x=3\\)<\/span>：<span class=\"math-inline\">\\(\\sum1/n\\)<\/span> 发散。<\/li>\n<\/ul>\n<p>故 <span class=\"math-inline\">\\(\\boxed{[-1,3)}\\)<\/span> 为收敛域；内部绝对收敛，左端点条件收敛。<\/p>\n<p><strong>5.2<\/strong> 在 <span class=\"math-inline\">\\(|x|&lt;1\\)<\/span> 内，由几何级数逐项求导再乘 <span class=\"math-inline\">\\(x\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{\\sum_{n=1}^{\\infty}nx^n=\\frac{x}{(1-x)^2}}.\\]<\/span><\/p>\n<p>端点 <span class=\"math-inline\">\\(x=\\pm1\\)<\/span> 时通项都不趋于零，故收敛域为 <span class=\"math-inline\">\\(\\boxed{(-1,1)}\\)<\/span>。<\/p>\n<p><strong>5.3<\/strong> <span class=\"math-inline\">\\(1/\\sqrt n\\)<\/span> 单调趋零，交错级数由莱布尼茨判别法收敛；绝对值级数是 <span class=\"math-inline\">\\(p=1/2\\)<\/span> 的发散 <span class=\"math-inline\">\\(p\\)<\/span>-级数。因此为<strong>条件收敛<\/strong>。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-power\">幂级数特殊题型<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h21\">第六章：向量与空间解析几何<\/h2>\n<h3 id=\"sec-practice-full-h22\">6.1 点积与叉积<\/h3>\n<p>设 <span class=\"math-inline\">\\(\\boldsymbol a=(1,1,0)\\)<\/span>，<span class=\"math-inline\">\\(\\boldsymbol b=(1,0,1)\\)<\/span>，求两向量夹角及以它们为邻边的平行四边形面积。<\/p>\n<h3 id=\"sec-practice-full-h23\">6.2 平面方程与距离<\/h3>\n<p>求过 <span class=\"math-inline\">\\((1,0,0)\\)<\/span>、法向量为 <span class=\"math-inline\">\\((1,2,-1)\\)<\/span> 的平面方程，以及原点到该平面的距离。<\/p>\n<h3 id=\"sec-practice-full-h24\">6.3 直线与平面交点<\/h3>\n<p>求直线 <span class=\"math-inline\">\\(x=1+t,\\ y=t,\\ z=1-t\\)<\/span> 与平面 <span class=\"math-inline\">\\(x+y+z=3\\)<\/span> 的交点。<\/p>\n<details>\n<summary>展开第六章解析<\/summary>\n<p><strong>6.1<\/strong><\/p>\n<p><span class=\"math-display\">\\[\\boldsymbol a\\cdot\\boldsymbol b=1,\\quad\n|\\boldsymbol a|=|\\boldsymbol b|=\\sqrt2,\\quad\n\\cos\\theta=\\frac12.\\]<\/span><\/p>\n<p>故 <span class=\"math-inline\">\\(\\boxed{\\theta=\\pi/3}\\)<\/span>。叉积为 <span class=\"math-inline\">\\((1,-1,-1)\\)<\/span>，面积为其模 <span class=\"math-inline\">\\(\\boxed{\\sqrt3}\\)<\/span>。<\/p>\n<p><strong>6.2<\/strong> 点法式给出：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{x+2y-z-1=0},\\qquad\n\\boxed{d=\\frac1{\\sqrt6}}.\\]<\/span><\/p>\n<p><strong>6.3<\/strong> 代入平面方程，<span class=\"math-inline\">\\(2+t=3\\)<\/span>，得 <span class=\"math-inline\">\\(t=1\\)<\/span>，故交点为 <span class=\"math-inline\">\\(\\boxed{(2,1,0)}\\)<\/span>。<\/p>\n<\/details>\n<hr />\n<h2 id=\"sec-practice-full-h25\">第七章：多元微分与极值<\/h2>\n<h3 id=\"sec-practice-full-h26\">7.1 路径反例<\/h3>\n<p>判断 <span class=\"math-inline\">\\(\\displaystyle\\lim_{(x,y)\\to(0,0)}\\frac{x^2y}{x^4+y^2}\\)<\/span> 是否存在。<\/p>\n<h3 id=\"sec-practice-full-h27\">7.2 连续与可微<\/h3>\n<p>设 <span class=\"math-inline\">\\(f(x,y)=xy/\\sqrt{x^2+y^2}\\)<\/span>（非原点），<span class=\"math-inline\">\\(f(0,0)=0\\)<\/span>。判断原点处的连续性、偏导数与可微性。<\/p>\n<h3 id=\"sec-practice-full-h28\">7.3 条件最值<\/h3>\n<p>在约束 <span class=\"math-inline\">\\(x+y=2\\)<\/span> 下求 <span class=\"math-inline\">\\(f=x^2+y^2\\)<\/span> 的最小值，并判断是否有最大值。<\/p>\n<details>\n<summary>展开第七章解析<\/summary>\n<p><strong>7.1<\/strong> 沿 <span class=\"math-inline\">\\(y=0\\)<\/span> 函数值为零；沿 <span class=\"math-inline\">\\(y=x^2\\)<\/span> 函数值为 <span class=\"math-inline\">\\(1/2\\)<\/span>。路径极限不同，故<strong>不存在<\/strong>。<\/p>\n<p><strong>7.2<\/strong> 设 <span class=\"math-inline\">\\(r=\\sqrt{x^2+y^2}\\)<\/span>，由 <span class=\"math-inline\">\\(|xy|\\leq r^2/2\\)<\/span> 得 <span class=\"math-inline\">\\(|f|\\leq r/2\\to0\\)<\/span>，所以连续。沿两坐标轴为零，故 <span class=\"math-inline\">\\(f_x(0,0)=f_y(0,0)=0\\)<\/span>。<\/p>\n<p>但：<\/p>\n<p><span class=\"math-display\">\\[\\frac{f(x,y)}r=\\frac{xy}{x^2+y^2}\\]<\/span><\/p>\n<p>沿 <span class=\"math-inline\">\\(y=x\\)<\/span> 不趋于零，故<strong>不可微<\/strong>。<\/p>\n<p><strong>7.3<\/strong> 约束梯度 <span class=\"math-inline\">\\((1,1)\\neq0\\)<\/span>，可用拉格朗日乘数法，得到 <span class=\"math-inline\">\\(x=y=1\\)<\/span>。为确认全局最小值，可直接写：<\/p>\n<p><span class=\"math-display\">\\[x^2+(2-x)^2=2(x-1)^2+2\\geq2.\\]<\/span><\/p>\n<p>故最小值为 <span class=\"math-inline\">\\(\\boxed2\\)<\/span>，在 <span class=\"math-inline\">\\((1,1)\\)<\/span> 取得；当 <span class=\"math-inline\">\\(|x|\\to\\infty\\)<\/span> 时函数无界，故<strong>无最大值<\/strong>。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-counterexamples\">多元极限与可微反例<\/a>、<a href=\"#topic-extrema\">区域最值问题<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h29\">第八章：重积分<\/h2>\n<h3 id=\"sec-practice-full-h30\">8.1 交换积分次序<\/h3>\n<p>计算 <span class=\"math-inline\">\\(\\displaystyle I=\\int_0^1dx\\int_x^1e^{y^2}\\,dy\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h31\">8.2 极坐标<\/h3>\n<p>计算 <span class=\"math-inline\">\\(\\displaystyle\\iint_{x^2+y^2\\leq1}(x^2+y^2)\\,dxdy\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h32\">8.3 球坐标<\/h3>\n<p>计算 <span class=\"math-inline\">\\(\\displaystyle\\iiint_{x^2+y^2+z^2\\leq1}(x^2+y^2+z^2)\\,dV\\)<\/span>。<\/p>\n<details>\n<summary>展开第八章解析<\/summary>\n<p><strong>8.1<\/strong> 区域为 <span class=\"math-inline\">\\(0\\leq x\\leq y\\leq1\\)<\/span>。交换次序：<\/p>\n<p><span class=\"math-display\">\\[I=\\int_0^1dy\\int_0^ye^{y^2}\\,dx\n=\\int_0^1ye^{y^2}\\,dy\n=\\boxed{\\frac{e-1}{2}}.\\]<\/span><\/p>\n<p><strong>8.2<\/strong> <span class=\"math-inline\">\\(x^2+y^2=r^2\\)<\/span>，面积元 <span class=\"math-inline\">\\(dxdy=r\\,drd\\theta\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\int_0^{2\\pi}d\\theta\\int_0^1r^3\\,dr\n=\\boxed{\\frac{\\pi}{2}}.\\]<\/span><\/p>\n<p><strong>8.3<\/strong> 球坐标体积元 <span class=\"math-inline\">\\(dV=r^2\\sin\\varphi\\,drd\\varphi d\\theta\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\int_0^{2\\pi}d\\theta\\int_0^\\pi\\sin\\varphi\\,d\\varphi\n\\int_0^1r^4\\,dr\n=\\boxed{\\frac{4\\pi}{5}}.\\]<\/span><\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-substitution\">二重积分换元法<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h33\">第九章：曲线积分与曲面积分<\/h2>\n<h3 id=\"sec-practice-full-h34\">9.1 奇点与格林公式<\/h3>\n<p>沿单位圆逆时针计算：<\/p>\n<p><span class=\"math-display\">\\[\\oint_L-\\frac{y}{x^2+y^2}\\,dx+\\frac{x}{x^2+y^2}\\,dy.\\]<\/span><\/p>\n<p>为什么不能直接根据 <span class=\"math-inline\">\\(Q_x-P_y=0\\)<\/span> 得出结果为零？<\/p>\n<h3 id=\"sec-practice-full-h35\">9.2 高斯公式补面<\/h3>\n<p>设 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 为单位球面的上半球，取外侧，计算：<\/p>\n<p><span class=\"math-display\">\\[\\iint_\\Sigma x\\,dydz+y\\,dzdx+z\\,dxdy.\\]<\/span><\/p>\n<h3 id=\"sec-practice-full-h36\">9.3 斯托克斯公式<\/h3>\n<p>设 <span class=\"math-inline\">\\(\\Gamma\\)<\/span> 为平面 <span class=\"math-inline\">\\(x+y+z=1\\)<\/span> 在第一卦限的三角形边界，从 <span class=\"math-inline\">\\(z\\)<\/span> 轴正向看为逆时针，计算 <span class=\"math-inline\">\\(\\displaystyle\\oint_\\Gamma-y\\,dx+x\\,dy\\)<\/span>。<\/p>\n<details>\n<summary>展开第九章解析<\/summary>\n<p><strong>9.1<\/strong> 取 <span class=\"math-inline\">\\(x=\\cos t,\\ y=\\sin t\\)<\/span>，<span class=\"math-inline\">\\(0\\leq t\\leq2\\pi\\)<\/span>，被积式为 <span class=\"math-inline\">\\(dt\\)<\/span>，结果 <span class=\"math-inline\">\\(\\boxed{2\\pi}\\)<\/span>。<\/p>\n<p>原点位于圆内，场在原点无定义，不能在整个圆盘上直接使用格林公式。可挖去小圆，计入顺时针的内边界。<\/p>\n<p><strong>9.2<\/strong> 场为 <span class=\"math-inline\">\\((x,y,z)\\)<\/span>，散度为 <span class=\"math-inline\">\\(3\\)<\/span>。补上 <span class=\"math-inline\">\\(z=0\\)<\/span> 的底圆盘并取下侧，封闭立体为上半单位球：<\/p>\n<p><span class=\"math-display\">\\[3V=3\\cdot\\frac{2\\pi}{3}=2\\pi.\\]<\/span><\/p>\n<p>底面 <span class=\"math-inline\">\\(z=0\\)<\/span>，通量为零，所以所求为 <span class=\"math-inline\">\\(\\boxed{2\\pi}\\)<\/span>。<\/p>\n<p><strong>9.3<\/strong> 取向上的三角形曲面。旋度为 <span class=\"math-inline\">\\((0,0,2)\\)<\/span>，在 <span class=\"math-inline\">\\(xOy\\)<\/span> 面的投影面积为 <span class=\"math-inline\">\\(1/2\\)<\/span>，故：<\/p>\n<p><span class=\"math-display\">\\[\\oint_\\Gamma-y\\,dx+x\\,dy=2\\cdot\\frac12=\\boxed1.\\]<\/span><\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-theorems\">三大积分公式的选择<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h37\">第十章：微分方程<\/h2>\n<h3 id=\"sec-practice-full-h38\">10.1 一阶线性初值问题<\/h3>\n<p>解 <span class=\"math-inline\">\\(y&#x27;+y=e^x,\\ y(0)=0\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h39\">10.2 重根与非齐次特解<\/h3>\n<p>求 <span class=\"math-inline\">\\(y&#x27;&#x27;-2y&#x27;+y=e^x\\)<\/span> 的通解。<\/p>\n<h3 id=\"sec-practice-full-h40\">10.3 分离变量可能漏解<\/h3>\n<p>对 <span class=\"math-inline\">\\(y&#x27;=y^2,\\ y(0)=0\\)<\/span>，能否直接除以 <span class=\"math-inline\">\\(y^2\\)<\/span> 后求解？求满足初值的解。<\/p>\n<details>\n<summary>展开第十章解析<\/summary>\n<p><strong>10.1<\/strong> 乘积分因子 <span class=\"math-inline\">\\(e^x\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[(e^xy)&#x27;=e^{2x},\\qquad\ny=\\frac12e^x+Ce^{-x}.\\]<\/span><\/p>\n<p>由 <span class=\"math-inline\">\\(y(0)=0\\)<\/span>，<span class=\"math-inline\">\\(C=-1/2\\)<\/span>，故：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{y=\\frac{e^x-e^{-x}}2}.\\]<\/span><\/p>\n<p><strong>10.2<\/strong> 特征方程 <span class=\"math-inline\">\\((r-1)^2=0\\)<\/span>，齐次通解为 <span class=\"math-inline\">\\((C_1+C_2x)e^x\\)<\/span>。右端指数对应二重根，设 <span class=\"math-inline\">\\(y^*=Ax^2e^x\\)<\/span>，代入得 <span class=\"math-inline\">\\(2A=1\\)<\/span>，故：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{y=(C_1+C_2x+\\tfrac12x^2)e^x}.\\]<\/span><\/p>\n<p><strong>10.3<\/strong> 除以 <span class=\"math-inline\">\\(y^2\\)<\/span> 会排除 <span class=\"math-inline\">\\(y=0\\)<\/span>，应先检查平衡解。<span class=\"math-inline\">\\(y\\equiv0\\)<\/span> 满足方程和初值；右端 <span class=\"math-inline\">\\(y^2\\)<\/span> 对 <span class=\"math-inline\">\\(y\\)<\/span> 的导数 <span class=\"math-inline\">\\(2y\\)<\/span> 连续，初值问题局部解唯一，故所求为：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{y(x)\\equiv0}.\\]<\/span><\/p>\n<p>它可延拓到整个实轴。非零解 <span class=\"math-inline\">\\(y=-1/(x+C)\\)<\/span> 无法满足 <span class=\"math-inline\">\\(y(0)=0\\)<\/span>。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-ode\">微分方程判断过程<\/a>、<a href=\"#topic-conditions\">定理条件速查<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h41\">错题记录模板<\/h2>\n<p>每次只记录实际出现的问题，复习时先遮住答案重新做。<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>题号<\/th>\n<th>我的错误或卡点<\/th>\n<th>正确的识别线索<\/th>\n<th>必查条件<\/th>\n<th>重做日期与结果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>待填写<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>建议把错误归因到具体步骤，例如“没拆内部瑕点”“把驻点当成极值点”“积分次序对应的区域写反”，再回到对应章节或专题复习。<\/p>\n", "summary": "<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p>本页为配合现有笔记编写的 <strong>30 道自测题，每章 3 道<\/strong>，不摘录历年试卷。先独立作答，再展开解析；判断题必须给出理由或反例。<\/p>\n<\/blockquote>\n<p>返回：<a href=\"#overview\">高等数学学习导航<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h1\">第一章：极限与连续<\/h2>\n<h3 id=\"sec-practice-full-h2\">1.1 相减后的阶数<\/h3>\n<p>求 <span class=\"math-inline\">\\(\\displaystyle\\lim_{x\\to0}\\frac{e^x-1-x}{1-\\cos x}\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h3\">1.2 递推数列<\/h3>\n<p>设 <span class=\"math-inline\">\\(a_1=1,\\ a_{n+1}=\\sqrt{2+a_n}\\)<\/span>。证明数列收敛并求极限。<\/p>\n<h3 id=\"sec-practice-full-h4\">1.3 判断并给反例<\/h3>\n<p>“数列有界，则必收敛。”是否正确？<\/p>\n<details>\n<summary>展开第一章解析<\/summary>\n<p><strong>1.1<\/strong> 分子、分母的主项均为 <span class=\"math-inline\">\\(x^2/2\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\frac{e^x-1-x}{1-\\cos x}\n=\\frac{x^2/2+o(x^2)}{x^2/2+o(x^2)}\\longrightarrow\\boxed1.\\]<\/span><\/p>\n<p><strong>关键<\/strong>：分子相减抵消了一次项，不能只用 <span class=\"math-inline\">\\(e^x-1\\sim x\\)<\/span>。<\/p>\n<p><strong>1.2<\/strong> 归纳得 <span class=\"math-inline\">\\(1\\leq a_n&lt;2\\)<\/span>。又有：<\/p>\n<p><span class=\"math-display\">\\[2+a_n-a_n^2=(2-a_n)(a_n+1)&gt;0,\\]<\/span><\/p>\n<p>所以 <span class=\"math-inline\">\\(a_{n+1}&gt;a_n\\)<\/span>。由单调有界原理，存在极限 <span class=\"math-inline\">\\(L\\in[1,2]\\)<\/span>，满足 <span class=\"math-inline\">\\(L=\\sqrt{2+L}\\)<\/span>，故 <span class=\"math-inline\">\\(\\boxed{L=2}\\)<\/span>。<\/p>\n<p><strong>1.3<\/strong> 错。<span class=\"math-inline\">\\(a_n=(-1)^n\\)<\/span> 有界，但奇、偶子列分别趋于 <span class=\"math-inline\">\\(-1\\)<\/span>、<span class=\"math-inline\">\\(1\\)<\/span>，所以不收敛。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-limits\">极限方法与展开阶数<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h5\">第二章：导数与微分<\/h2>\n<h3 id=\"sec-practice-full-h6\">2.1 用定义求导<\/h3>\n<p>设 <span class=\"math-inline\">\\(f(x)=x^2\\sin(1/x)\\)<\/span>（<span class=\"math-inline\">\\(x\\neq0\\)<\/span>），<span class=\"math-inline\">\\(f(0)=0\\)<\/span>。求 <span class=\"math-inline\">\\(f&#x27;(0)\\)<\/span>，并判断导函数在零点是否连续。<\/p>\n<h3 id=\"sec-practice-full-h7\">2.2 参数方程的二阶导数<\/h3>\n<p>曲线 <span class=\"math-inline\">\\(x=t^2,\\ y=t^3\\)<\/span>，求 <span class=\"math-inline\">\\(t=1\\)<\/span> 时的切线方程及 <span class=\"math-inline\">\\(d^2y/dx^2\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h8\">2.3 判断并解释<\/h3>\n<p>“一元函数在一点连续，则在该点可微。”是否正确？<\/p>\n<details>\n<summary>展开第二章解析<\/summary>\n<p><strong>2.1<\/strong><\/p>\n<p><span class=\"math-display\">\\[f&#x27;(0)=\\lim_{h\\to0}h\\sin(1/h)=\\boxed0.\\]<\/span><\/p>\n<p>当 <span class=\"math-inline\">\\(x\\neq0\\)<\/span>，<span class=\"math-inline\">\\(f&#x27;(x)=2x\\sin(1/x)-\\cos(1/x)\\)<\/span>，在零点没有极限，故导函数不连续。<\/p>\n<p><strong>关键<\/strong>：函数可导，不代表导函数连续。<\/p>\n<p><strong>2.2<\/strong><\/p>\n<p><span class=\"math-display\">\\[\\frac{dy}{dx}=\\frac{3t^2}{2t}=\\frac{3t}{2},\\qquad\n\\frac{d^2y}{dx^2}=\\frac{d(3t/2)/dt}{2t}=\\frac3{4t}.\\]<\/span><\/p>\n<p>在 <span class=\"math-inline\">\\(t=1\\)<\/span> 时，点为 <span class=\"math-inline\">\\((1,1)\\)<\/span>，故切线为：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{y-1=\\frac32(x-1)},\\qquad\n\\boxed{\\frac{d^2y}{dx^2}=\\frac34}.\\]<\/span><\/p>\n<p><strong>2.3<\/strong> 错。<span class=\"math-inline\">\\(f(x)=|x|\\)<\/span> 在零点连续，但左右导数为 <span class=\"math-inline\">\\(-1\\)<\/span>、<span class=\"math-inline\">\\(1\\)<\/span>，不可导，因而不可微。<\/p>\n<\/details>\n<hr />\n<h2 id=\"sec-practice-full-h9\">第三章：中值定理与导数的应用<\/h2>\n<h3 id=\"sec-practice-full-h10\">3.1 构造辅助函数<\/h3>\n<p>设 <span class=\"math-inline\">\\(f\\in C[0,1]\\)<\/span>，在 <span class=\"math-inline\">\\((0,1)\\)<\/span> 可导，且 <span class=\"math-inline\">\\(f(0)=f(1)=0\\)<\/span>。证明存在 <span class=\"math-inline\">\\(\\xi\\in(0,1)\\)<\/span>，使 <span class=\"math-inline\">\\(f&#x27;(\\xi)+2f(\\xi)=0\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h11\">3.2 中值定理证明不等式<\/h3>\n<p>证明当 <span class=\"math-inline\">\\(x&gt;0\\)<\/span> 时：<\/p>\n<p><span class=\"math-display\">\\[\\frac{x}{1+x}&lt;\\ln(1+x)&lt;x.\\]<\/span><\/p>\n<h3 id=\"sec-practice-full-h12\">3.3 驻点是否一定是极值点？<\/h3>\n<p>分析 <span class=\"math-inline\">\\(f(x)=x^3\\)<\/span> 在零点的驻点、极值与拐点情况。<\/p>\n<details>\n<summary>展开第三章解析<\/summary>\n<p><strong>3.1<\/strong> 令 <span class=\"math-inline\">\\(F(x)=e^{2x}f(x)\\)<\/span>。它闭区间连续、开区间可导，且 <span class=\"math-inline\">\\(F(0)=F(1)=0\\)<\/span>。由罗尔定理：<\/p>\n<p><span class=\"math-display\">\\[F&#x27;(\\xi)=e^{2\\xi}[f&#x27;(\\xi)+2f(\\xi)]=0.\\]<\/span><\/p>\n<p>指数因子非零，结论成立。<\/p>\n<p><strong>3.2<\/strong> 对 <span class=\"math-inline\">\\(g(t)=\\ln(1+t)\\)<\/span> 在 <span class=\"math-inline\">\\([0,x]\\)<\/span> 用拉格朗日中值定理，存在 <span class=\"math-inline\">\\(\\eta\\in(0,x)\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\ln(1+x)=\\frac{x}{1+\\eta}.\\]<\/span><\/p>\n<p>因为 <span class=\"math-inline\">\\(1&lt;1+\\eta&lt;1+x\\)<\/span>，得到所证严格不等式。<\/p>\n<p><strong>3.3<\/strong> <span class=\"math-inline\">\\(f&#x27;(0)=0\\)<\/span>，故是驻点；但 <span class=\"math-inline\">\\(x^3\\)<\/span> 严格递增，原点不是极值点。<span class=\"math-inline\">\\(f&#x27;&#x27;(x)=6x\\)<\/span> 在零点两侧变号，所以 <span class=\"math-inline\">\\((0,0)\\)<\/span> 是拐点。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-rolle\">罗尔定理的使用<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h13\">第四章：积分及其应用<\/h2>\n<h3 id=\"sec-practice-full-h14\">4.1 变限积分求导<\/h3>\n<p>设 <span class=\"math-inline\">\\(F(x)=\\displaystyle\\int_x^{x^2}e^{t^2}\\,dt\\)<\/span>，求 <span class=\"math-inline\">\\(F&#x27;(x)\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h15\">4.2 反常积分判断<\/h3>\n<p>分别判断：<\/p>\n<ol>\n<li><span class=\"math-inline\">\\(\\displaystyle\\int_{-1}^{1}\\frac{dx}{x}\\)<\/span> 是否收敛？它的柯西主值是多少？<\/li>\n<li><span class=\"math-inline\">\\(\\displaystyle\\int_0^1x^{-p}\\,dx\\)<\/span> 对哪些实数 <span class=\"math-inline\">\\(p\\)<\/span> 收敛？<\/li>\n<\/ol>\n<h3 id=\"sec-practice-full-h16\">4.3 三角函数积分<\/h3>\n<p>计算 <span class=\"math-inline\">\\(\\displaystyle\\int_0^{\\pi/2}\\sin^2x\\cos^2x\\,dx\\)<\/span>。<\/p>\n<details>\n<summary>展开第四章解析<\/summary>\n<p><strong>4.1<\/strong> 被积函数连续，由变限积分求导与链式法则：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{F&#x27;(x)=2x\\,e^{x^4}-e^{x^2}}.\\]<\/span><\/p>\n<p><strong>4.2<\/strong><\/p>\n<ol>\n<li>零点是瑕点，左右两项分别发散到 <span class=\"math-inline\">\\(-\\infty\\)<\/span>、<span class=\"math-inline\">\\(+\\infty\\)<\/span>，所以通常反常积分<strong>发散<\/strong>；对称截断的柯西主值为 <span class=\"math-inline\">\\(\\boxed0\\)<\/span>。<\/li>\n<li>当且仅当 <span class=\"math-inline\">\\(\\boxed{p&lt;1}\\)<\/span> 时收敛，积分为 <span class=\"math-inline\">\\(1/(1-p)\\)<\/span>；<span class=\"math-inline\">\\(p=1\\)<\/span> 时对数发散，<span class=\"math-inline\">\\(p&gt;1\\)<\/span> 时也发散。<\/li>\n<\/ol>\n<p><strong>4.3<\/strong><\/p>\n<p><span class=\"math-display\">\\[\\sin^2x\\cos^2x=\\frac{1-\\cos4x}{8},\\]<\/span><\/p>\n<p>所以：<\/p>\n<p><span class=\"math-display\">\\[\\int_0^{\\pi/2}\\sin^2x\\cos^2x\\,dx\n=\\left[\\frac{x}{8}-\\frac{\\sin4x}{32}\\right]_0^{\\pi/2}\n=\\boxed{\\frac{\\pi}{16}}.\\]<\/span><\/p>\n<p>也可用混合华莱士公式核对。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-improper\">反常积分<\/a>、<a href=\"#topic-wallis\">华莱士公式<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h17\">第五章：无穷级数<\/h2>\n<h3 id=\"sec-practice-full-h18\">5.1 平移幂级数<\/h3>\n<p>求 <span class=\"math-inline\">\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(x-1)^n}{n2^n}\\)<\/span> 的收敛域，并区分端点的绝对、条件收敛情况。<\/p>\n<h3 id=\"sec-practice-full-h19\">5.2 求和函数<\/h3>\n<p>求 <span class=\"math-inline\">\\(\\displaystyle\\sum_{n=1}^{\\infty}nx^n\\)<\/span> 的和函数及收敛域。<\/p>\n<h3 id=\"sec-practice-full-h20\">5.3 任意项级数<\/h3>\n<p>判断 <span class=\"math-inline\">\\(\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^{n-1}}{\\sqrt n}\\)<\/span> 是绝对收敛、条件收敛还是发散。<\/p>\n<details>\n<summary>展开第五章解析<\/summary>\n<p><strong>5.1<\/strong> 令 <span class=\"math-inline\">\\(t=(x-1)/2\\)<\/span>，内部条件为 <span class=\"math-inline\">\\(|t|&lt;1\\)<\/span>，即 <span class=\"math-inline\">\\(-1&lt;x&lt;3\\)<\/span>。<\/p>\n<ul>\n<li><span class=\"math-inline\">\\(x=-1\\)<\/span>：<span class=\"math-inline\">\\(\\sum(-1)^n/n\\)<\/span> 条件收敛。<\/li>\n<li><span class=\"math-inline\">\\(x=3\\)<\/span>：<span class=\"math-inline\">\\(\\sum1/n\\)<\/span> 发散。<\/li>\n<\/ul>\n<p>故 <span class=\"math-inline\">\\(\\boxed{[-1,3)}\\)<\/span> 为收敛域；内部绝对收敛，左端点条件收敛。<\/p>\n<p><strong>5.2<\/strong> 在 <span class=\"math-inline\">\\(|x|&lt;1\\)<\/span> 内，由几何级数逐项求导再乘 <span class=\"math-inline\">\\(x\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{\\sum_{n=1}^{\\infty}nx^n=\\frac{x}{(1-x)^2}}.\\]<\/span><\/p>\n<p>端点 <span class=\"math-inline\">\\(x=\\pm1\\)<\/span> 时通项都不趋于零，故收敛域为 <span class=\"math-inline\">\\(\\boxed{(-1,1)}\\)<\/span>。<\/p>\n<p><strong>5.3<\/strong> <span class=\"math-inline\">\\(1/\\sqrt n\\)<\/span> 单调趋零，交错级数由莱布尼茨判别法收敛；绝对值级数是 <span class=\"math-inline\">\\(p=1/2\\)<\/span> 的发散 <span class=\"math-inline\">\\(p\\)<\/span>-级数。因此为<strong>条件收敛<\/strong>。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-power\">幂级数特殊题型<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h21\">第六章：向量与空间解析几何<\/h2>\n<h3 id=\"sec-practice-full-h22\">6.1 点积与叉积<\/h3>\n<p>设 <span class=\"math-inline\">\\(\\boldsymbol a=(1,1,0)\\)<\/span>，<span class=\"math-inline\">\\(\\boldsymbol b=(1,0,1)\\)<\/span>，求两向量夹角及以它们为邻边的平行四边形面积。<\/p>\n<h3 id=\"sec-practice-full-h23\">6.2 平面方程与距离<\/h3>\n<p>求过 <span class=\"math-inline\">\\((1,0,0)\\)<\/span>、法向量为 <span class=\"math-inline\">\\((1,2,-1)\\)<\/span> 的平面方程，以及原点到该平面的距离。<\/p>\n<h3 id=\"sec-practice-full-h24\">6.3 直线与平面交点<\/h3>\n<p>求直线 <span class=\"math-inline\">\\(x=1+t,\\ y=t,\\ z=1-t\\)<\/span> 与平面 <span class=\"math-inline\">\\(x+y+z=3\\)<\/span> 的交点。<\/p>\n<details>\n<summary>展开第六章解析<\/summary>\n<p><strong>6.1<\/strong><\/p>\n<p><span class=\"math-display\">\\[\\boldsymbol a\\cdot\\boldsymbol b=1,\\quad\n|\\boldsymbol a|=|\\boldsymbol b|=\\sqrt2,\\quad\n\\cos\\theta=\\frac12.\\]<\/span><\/p>\n<p>故 <span class=\"math-inline\">\\(\\boxed{\\theta=\\pi/3}\\)<\/span>。叉积为 <span class=\"math-inline\">\\((1,-1,-1)\\)<\/span>，面积为其模 <span class=\"math-inline\">\\(\\boxed{\\sqrt3}\\)<\/span>。<\/p>\n<p><strong>6.2<\/strong> 点法式给出：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{x+2y-z-1=0},\\qquad\n\\boxed{d=\\frac1{\\sqrt6}}.\\]<\/span><\/p>\n<p><strong>6.3<\/strong> 代入平面方程，<span class=\"math-inline\">\\(2+t=3\\)<\/span>，得 <span class=\"math-inline\">\\(t=1\\)<\/span>，故交点为 <span class=\"math-inline\">\\(\\boxed{(2,1,0)}\\)<\/span>。<\/p>\n<\/details>\n<hr />\n<h2 id=\"sec-practice-full-h25\">第七章：多元微分与极值<\/h2>\n<h3 id=\"sec-practice-full-h26\">7.1 路径反例<\/h3>\n<p>判断 <span class=\"math-inline\">\\(\\displaystyle\\lim_{(x,y)\\to(0,0)}\\frac{x^2y}{x^4+y^2}\\)<\/span> 是否存在。<\/p>\n<h3 id=\"sec-practice-full-h27\">7.2 连续与可微<\/h3>\n<p>设 <span class=\"math-inline\">\\(f(x,y)=xy/\\sqrt{x^2+y^2}\\)<\/span>（非原点），<span class=\"math-inline\">\\(f(0,0)=0\\)<\/span>。判断原点处的连续性、偏导数与可微性。<\/p>\n<h3 id=\"sec-practice-full-h28\">7.3 条件最值<\/h3>\n<p>在约束 <span class=\"math-inline\">\\(x+y=2\\)<\/span> 下求 <span class=\"math-inline\">\\(f=x^2+y^2\\)<\/span> 的最小值，并判断是否有最大值。<\/p>\n<details>\n<summary>展开第七章解析<\/summary>\n<p><strong>7.1<\/strong> 沿 <span class=\"math-inline\">\\(y=0\\)<\/span> 函数值为零；沿 <span class=\"math-inline\">\\(y=x^2\\)<\/span> 函数值为 <span class=\"math-inline\">\\(1/2\\)<\/span>。路径极限不同，故<strong>不存在<\/strong>。<\/p>\n<p><strong>7.2<\/strong> 设 <span class=\"math-inline\">\\(r=\\sqrt{x^2+y^2}\\)<\/span>，由 <span class=\"math-inline\">\\(|xy|\\leq r^2/2\\)<\/span> 得 <span class=\"math-inline\">\\(|f|\\leq r/2\\to0\\)<\/span>，所以连续。沿两坐标轴为零，故 <span class=\"math-inline\">\\(f_x(0,0)=f_y(0,0)=0\\)<\/span>。<\/p>\n<p>但：<\/p>\n<p><span class=\"math-display\">\\[\\frac{f(x,y)}r=\\frac{xy}{x^2+y^2}\\]<\/span><\/p>\n<p>沿 <span class=\"math-inline\">\\(y=x\\)<\/span> 不趋于零，故<strong>不可微<\/strong>。<\/p>\n<p><strong>7.3<\/strong> 约束梯度 <span class=\"math-inline\">\\((1,1)\\neq0\\)<\/span>，可用拉格朗日乘数法，得到 <span class=\"math-inline\">\\(x=y=1\\)<\/span>。为确认全局最小值，可直接写：<\/p>\n<p><span class=\"math-display\">\\[x^2+(2-x)^2=2(x-1)^2+2\\geq2.\\]<\/span><\/p>\n<p>故最小值为 <span class=\"math-inline\">\\(\\boxed2\\)<\/span>，在 <span class=\"math-inline\">\\((1,1)\\)<\/span> 取得；当 <span class=\"math-inline\">\\(|x|\\to\\infty\\)<\/span> 时函数无界，故<strong>无最大值<\/strong>。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-counterexamples\">多元极限与可微反例<\/a>、<a href=\"#topic-extrema\">区域最值问题<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h29\">第八章：重积分<\/h2>\n<h3 id=\"sec-practice-full-h30\">8.1 交换积分次序<\/h3>\n<p>计算 <span class=\"math-inline\">\\(\\displaystyle I=\\int_0^1dx\\int_x^1e^{y^2}\\,dy\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h31\">8.2 极坐标<\/h3>\n<p>计算 <span class=\"math-inline\">\\(\\displaystyle\\iint_{x^2+y^2\\leq1}(x^2+y^2)\\,dxdy\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h32\">8.3 球坐标<\/h3>\n<p>计算 <span class=\"math-inline\">\\(\\displaystyle\\iiint_{x^2+y^2+z^2\\leq1}(x^2+y^2+z^2)\\,dV\\)<\/span>。<\/p>\n<details>\n<summary>展开第八章解析<\/summary>\n<p><strong>8.1<\/strong> 区域为 <span class=\"math-inline\">\\(0\\leq x\\leq y\\leq1\\)<\/span>。交换次序：<\/p>\n<p><span class=\"math-display\">\\[I=\\int_0^1dy\\int_0^ye^{y^2}\\,dx\n=\\int_0^1ye^{y^2}\\,dy\n=\\boxed{\\frac{e-1}{2}}.\\]<\/span><\/p>\n<p><strong>8.2<\/strong> <span class=\"math-inline\">\\(x^2+y^2=r^2\\)<\/span>，面积元 <span class=\"math-inline\">\\(dxdy=r\\,drd\\theta\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\int_0^{2\\pi}d\\theta\\int_0^1r^3\\,dr\n=\\boxed{\\frac{\\pi}{2}}.\\]<\/span><\/p>\n<p><strong>8.3<\/strong> 球坐标体积元 <span class=\"math-inline\">\\(dV=r^2\\sin\\varphi\\,drd\\varphi d\\theta\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\int_0^{2\\pi}d\\theta\\int_0^\\pi\\sin\\varphi\\,d\\varphi\n\\int_0^1r^4\\,dr\n=\\boxed{\\frac{4\\pi}{5}}.\\]<\/span><\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-substitution\">二重积分换元法<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h33\">第九章：曲线积分与曲面积分<\/h2>\n<h3 id=\"sec-practice-full-h34\">9.1 奇点与格林公式<\/h3>\n<p>沿单位圆逆时针计算：<\/p>\n<p><span class=\"math-display\">\\[\\oint_L-\\frac{y}{x^2+y^2}\\,dx+\\frac{x}{x^2+y^2}\\,dy.\\]<\/span><\/p>\n<p>为什么不能直接根据 <span class=\"math-inline\">\\(Q_x-P_y=0\\)<\/span> 得出结果为零？<\/p>\n<h3 id=\"sec-practice-full-h35\">9.2 高斯公式补面<\/h3>\n<p>设 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 为单位球面的上半球，取外侧，计算：<\/p>\n<p><span class=\"math-display\">\\[\\iint_\\Sigma x\\,dydz+y\\,dzdx+z\\,dxdy.\\]<\/span><\/p>\n<h3 id=\"sec-practice-full-h36\">9.3 斯托克斯公式<\/h3>\n<p>设 <span class=\"math-inline\">\\(\\Gamma\\)<\/span> 为平面 <span class=\"math-inline\">\\(x+y+z=1\\)<\/span> 在第一卦限的三角形边界，从 <span class=\"math-inline\">\\(z\\)<\/span> 轴正向看为逆时针，计算 <span class=\"math-inline\">\\(\\displaystyle\\oint_\\Gamma-y\\,dx+x\\,dy\\)<\/span>。<\/p>\n<details>\n<summary>展开第九章解析<\/summary>\n<p><strong>9.1<\/strong> 取 <span class=\"math-inline\">\\(x=\\cos t,\\ y=\\sin t\\)<\/span>，<span class=\"math-inline\">\\(0\\leq t\\leq2\\pi\\)<\/span>，被积式为 <span class=\"math-inline\">\\(dt\\)<\/span>，结果 <span class=\"math-inline\">\\(\\boxed{2\\pi}\\)<\/span>。<\/p>\n<p>原点位于圆内，场在原点无定义，不能在整个圆盘上直接使用格林公式。可挖去小圆，计入顺时针的内边界。<\/p>\n<p><strong>9.2<\/strong> 场为 <span class=\"math-inline\">\\((x,y,z)\\)<\/span>，散度为 <span class=\"math-inline\">\\(3\\)<\/span>。补上 <span class=\"math-inline\">\\(z=0\\)<\/span> 的底圆盘并取下侧，封闭立体为上半单位球：<\/p>\n<p><span class=\"math-display\">\\[3V=3\\cdot\\frac{2\\pi}{3}=2\\pi.\\]<\/span><\/p>\n<p>底面 <span class=\"math-inline\">\\(z=0\\)<\/span>，通量为零，所以所求为 <span class=\"math-inline\">\\(\\boxed{2\\pi}\\)<\/span>。<\/p>\n<p><strong>9.3<\/strong> 取向上的三角形曲面。旋度为 <span class=\"math-inline\">\\((0,0,2)\\)<\/span>，在 <span class=\"math-inline\">\\(xOy\\)<\/span> 面的投影面积为 <span class=\"math-inline\">\\(1/2\\)<\/span>，故：<\/p>\n<p><span class=\"math-display\">\\[\\oint_\\Gamma-y\\,dx+x\\,dy=2\\cdot\\frac12=\\boxed1.\\]<\/span><\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-theorems\">三大积分公式的选择<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h37\">第十章：微分方程<\/h2>\n<h3 id=\"sec-practice-full-h38\">10.1 一阶线性初值问题<\/h3>\n<p>解 <span class=\"math-inline\">\\(y&#x27;+y=e^x,\\ y(0)=0\\)<\/span>。<\/p>\n<h3 id=\"sec-practice-full-h39\">10.2 重根与非齐次特解<\/h3>\n<p>求 <span class=\"math-inline\">\\(y&#x27;&#x27;-2y&#x27;+y=e^x\\)<\/span> 的通解。<\/p>\n<h3 id=\"sec-practice-full-h40\">10.3 分离变量可能漏解<\/h3>\n<p>对 <span class=\"math-inline\">\\(y&#x27;=y^2,\\ y(0)=0\\)<\/span>，能否直接除以 <span class=\"math-inline\">\\(y^2\\)<\/span> 后求解？求满足初值的解。<\/p>\n<details>\n<summary>展开第十章解析<\/summary>\n<p><strong>10.1<\/strong> 乘积分因子 <span class=\"math-inline\">\\(e^x\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[(e^xy)&#x27;=e^{2x},\\qquad\ny=\\frac12e^x+Ce^{-x}.\\]<\/span><\/p>\n<p>由 <span class=\"math-inline\">\\(y(0)=0\\)<\/span>，<span class=\"math-inline\">\\(C=-1/2\\)<\/span>，故：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{y=\\frac{e^x-e^{-x}}2}.\\]<\/span><\/p>\n<p><strong>10.2<\/strong> 特征方程 <span class=\"math-inline\">\\((r-1)^2=0\\)<\/span>，齐次通解为 <span class=\"math-inline\">\\((C_1+C_2x)e^x\\)<\/span>。右端指数对应二重根，设 <span class=\"math-inline\">\\(y^*=Ax^2e^x\\)<\/span>，代入得 <span class=\"math-inline\">\\(2A=1\\)<\/span>，故：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{y=(C_1+C_2x+\\tfrac12x^2)e^x}.\\]<\/span><\/p>\n<p><strong>10.3<\/strong> 除以 <span class=\"math-inline\">\\(y^2\\)<\/span> 会排除 <span class=\"math-inline\">\\(y=0\\)<\/span>，应先检查平衡解。<span class=\"math-inline\">\\(y\\equiv0\\)<\/span> 满足方程和初值；右端 <span class=\"math-inline\">\\(y^2\\)<\/span> 对 <span class=\"math-inline\">\\(y\\)<\/span> 的导数 <span class=\"math-inline\">\\(2y\\)<\/span> 连续，初值问题局部解唯一，故所求为：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{y(x)\\equiv0}.\\]<\/span><\/p>\n<p>它可延拓到整个实轴。非零解 <span class=\"math-inline\">\\(y=-1/(x+C)\\)<\/span> 无法满足 <span class=\"math-inline\">\\(y(0)=0\\)<\/span>。<\/p>\n<\/details>\n<p>相关专题：<a href=\"#topic-ode\">微分方程判断过程<\/a>、<a href=\"#topic-conditions\">定理条件速查<\/a>。<\/p>\n<hr />\n<h2 id=\"sec-practice-full-h41\">错题记录模板<\/h2>\n<p>每次只记录实际出现的问题，复习时先遮住答案重新做。<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>题号<\/th>\n<th>我的错误或卡点<\/th>\n<th>正确的识别线索<\/th>\n<th>必查条件<\/th>\n<th>重做日期与结果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>待填写<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>建议把错误归因到具体步骤，例如“没拆内部瑕点”“把驻点当成极值点”“积分次序对应的区域写反”，再回到对应章节或专题复习。<\/p>\n", "search": "\n  [!NOTE]\n  本页为配合现有笔记编写的   30 道自测题，每章 3 道  ，不摘录历年试卷。先独立作答，再展开解析；判断题必须给出理由或反例。\n\n返回：[高等数学学习导航](../README.md)。\n\n---\n\n   第一章：极限与连续\n\n    1.1 相减后的阶数\n\n求   displaystyle lim_ x to0  frac e^x-1-x  1- cos x  。\n\n    1.2 递推数列\n\n设  a_1=1,  a_ n+1 = sqrt 2+a_n  。证明数列收敛并求极限。\n\n    1.3 判断并给反例\n\n“数列有界，则必收敛。”是否正确？\n\n<details \n<summary 展开第一章解析<\/summary \n\n  1.1   分子、分母的主项均为  x^2/2 ：\n\n  \n frac e^x-1-x  1- cos x \n= frac x^2/2+o(x^2)  x^2/2+o(x^2)  longrightarrow boxed1.\n  \n\n  关键  ：分子相减抵消了一次项，不能只用  e^x-1 sim x 。\n\n  1.2   归纳得  1 leq a_n<2 。又有：\n\n  \n2+a_n-a_n^2=(2-a_n)(a_n+1) 0,\n  \n\n所以  a_ n+1  a_n 。由单调有界原理，存在极限  L in[1,2] ，满足  L= sqrt 2+L  ，故   boxed L=2  。\n\n  1.3   错。 a_n=(-1)^n  有界，但奇、偶子列分别趋于  -1 、 1 ，所以不收敛。\n\n<\/details \n\n相关专题：[极限方法与展开阶数](../补充理解/极限计算方法选择与泰勒阶数.md)。\n\n---\n\n   第二章：导数与微分\n\n    2.1 用定义求导\n\n设  f(x)=x^2 sin(1/x) （ x neq0 ）， f(0)=0 。求  f'(0) ，并判断导函数在零点是否连续。\n\n    2.2 参数方程的二阶导数\n\n曲线  x=t^2,  y=t^3 ，求  t=1  时的切线方程及  d^2y/dx^2 。\n\n    2.3 判断并解释\n\n“一元函数在一点连续，则在该点可微。”是否正确？\n\n<details \n<summary 展开第二章解析<\/summary \n\n  2.1  \n\n  \nf'(0)= lim_ h to0 h sin(1/h)= boxed0.\n  \n\n当  x neq0 ， f'(x)=2x sin(1/x)- cos(1/x) ，在零点没有极限，故导函数不连续。\n\n  关键  ：函数可导，不代表导函数连续。\n\n  2.2  \n\n  \n frac dy  dx = frac 3t^2  2t = frac 3t  2 , qquad\n frac d^2y  dx^2 = frac d(3t/2)/dt  2t = frac3 4t .\n  \n\n在  t=1  时，点为  (1,1) ，故切线为：\n\n  \n boxed y-1= frac32(x-1) , qquad\n boxed  frac d^2y  dx^2 = frac34 .\n  \n\n  2.3   错。 f(x)=|x|  在零点连续，但左右导数为  -1 、 1 ，不可导，因而不可微。\n\n<\/details \n\n---\n\n   第三章：中值定理与导数的应用\n\n    3.1 构造辅助函数\n\n设  f in C[0,1] ，在  (0,1)  可导，且  f(0)=f(1)=0 。证明存在   xi in(0,1) ，使  f'( xi)+2f( xi)=0 。\n\n    3.2 中值定理证明不等式\n\n证明当  x 0  时：\n\n  \n frac x  1+x < ln(1+x)<x.\n  \n\n    3.3 驻点是否一定是极值点？\n\n分析  f(x)=x^3  在零点的驻点、极值与拐点情况。\n\n<details \n<summary 展开第三章解析<\/summary \n\n  3.1   令  F(x)=e^ 2x f(x) 。它闭区间连续、开区间可导，且  F(0)=F(1)=0 。由罗尔定理：\n\n  \nF'( xi)=e^ 2 xi [f'( xi)+2f( xi)]=0.\n  \n\n指数因子非零，结论成立。\n\n  3.2   对  g(t)= ln(1+t)  在  [0,x]  用拉格朗日中值定理，存在   eta in(0,x) ：\n\n  \n ln(1+x)= frac x  1+ eta .\n  \n\n因为  1<1+ eta<1+x ，得到所证严格不等式。\n\n  3.3    f'(0)=0 ，故是驻点；但  x^3  严格递增，原点不是极值点。 f''(x)=6x  在零点两侧变号，所以  (0,0)  是拐点。\n\n<\/details \n\n相关专题：[罗尔定理的使用](../补充理解/罗尔定理的使用.md)。\n\n---\n\n   第四章：积分及其应用\n\n    4.1 变限积分求导\n\n设  F(x)= displaystyle int_x^ x^2 e^ t^2  ,dt ，求  F'(x) 。\n\n    4.2 反常积分判断\n\n分别判断：\n\n1.   displaystyle int_ -1 ^ 1  frac dx  x   是否收敛？它的柯西主值是多少？\n2.   displaystyle int_0^1x^ -p  ,dx  对哪些实数  p  收敛？\n\n    4.3 三角函数积分\n\n计算   displaystyle int_0^  pi/2  sin^2x cos^2x ,dx 。\n\n<details \n<summary 展开第四章解析<\/summary \n\n  4.1   被积函数连续，由变限积分求导与链式法则：\n\n  \n boxed F'(x)=2x ,e^ x^4 -e^ x^2  .\n  \n\n  4.2  \n\n1. 零点是瑕点，左右两项分别发散到  - infty 、 + infty ，所以通常反常积分  发散  ；对称截断的柯西主值为   boxed0 。\n2. 当且仅当   boxed p<1   时收敛，积分为  1/(1-p) ； p=1  时对数发散， p 1  时也发散。\n\n  4.3  \n\n  \n sin^2x cos^2x= frac 1- cos4x  8 ,\n  \n\n所以：\n\n  \n int_0^  pi/2  sin^2x cos^2x ,dx\n= left[ frac x  8 - frac  sin4x  32  right]_0^  pi/2 \n= boxed  frac  pi  16  .\n  \n\n也可用混合华莱士公式核对。\n\n<\/details \n\n相关专题：[反常积分](../补充理解/反常积分的拆分与收敛判断.md)、[华莱士公式](../补充理解/华莱士公式.md)。\n\n---\n\n   第五章：无穷级数\n\n    5.1 平移幂级数\n\n求   displaystyle sum_ n=1 ^  infty  frac (x-1)^n  n2^n   的收敛域，并区分端点的绝对、条件收敛情况。\n\n    5.2 求和函数\n\n求   displaystyle sum_ n=1 ^  infty nx^n  的和函数及收敛域。\n\n    5.3 任意项级数\n\n判断   displaystyle sum_ n=1 ^  infty  frac (-1)^ n-1    sqrt n   是绝对收敛、条件收敛还是发散。\n\n<details \n<summary 展开第五章解析<\/summary \n\n  5.1   令  t=(x-1)/2 ，内部条件为  |t|<1 ，即  -1<x<3 。\n\n-  x=-1 ：  sum(-1)^n/n  条件收敛。\n-  x=3 ：  sum1/n  发散。\n\n故   boxed [-1,3)   为收敛域；内部绝对收敛，左端点条件收敛。\n\n  5.2   在  |x|<1  内，由几何级数逐项求导再乘  x ：\n\n  \n boxed  sum_ n=1 ^  infty nx^n= frac x  (1-x)^2  .\n  \n\n端点  x= pm1  时通项都不趋于零，故收敛域为   boxed (-1,1)  。\n\n  5.3    1/ sqrt n  单调趋零，交错级数由莱布尼茨判别法收敛；绝对值级数是  p=1/2  的发散  p -级数。因此为  条件收敛  。\n\n<\/details \n\n相关专题：[幂级数特殊题型](../补充理解/幂级数特殊题型.md)。\n\n---\n\n   第六章：向量与空间解析几何\n\n    6.1 点积与叉积\n\n设   boldsymbol a=(1,1,0) ，  boldsymbol b=(1,0,1) ，求两向量夹角及以它们为邻边的平行四边形面积。\n\n    6.2 平面方程与距离\n\n求过  (1,0,0) 、法向量为  (1,2,-1)  的平面方程，以及原点到该平面的距离。\n\n    6.3 直线与平面交点\n\n求直线  x=1+t,  y=t,  z=1-t  与平面  x+y+z=3  的交点。\n\n<details \n<summary 展开第六章解析<\/summary \n\n  6.1  \n\n  \n boldsymbol a cdot boldsymbol b=1, quad\n| boldsymbol a|=| boldsymbol b|= sqrt2, quad\n cos theta= frac12.\n  \n\n故   boxed  theta= pi/3  。叉积为  (1,-1,-1) ，面积为其模   boxed  sqrt3  。\n\n  6.2   点法式给出：\n\n  \n boxed x+2y-z-1=0 , qquad\n boxed d= frac1  sqrt6  .\n  \n\n  6.3   代入平面方程， 2+t=3 ，得  t=1 ，故交点为   boxed (2,1,0)  。\n\n<\/details \n\n---\n\n   第七章：多元微分与极值\n\n    7.1 路径反例\n\n判断   displaystyle lim_ (x,y) to(0,0)  frac x^2y  x^4+y^2   是否存在。\n\n    7.2 连续与可微\n\n设  f(x,y)=xy/ sqrt x^2+y^2  （非原点）， f(0,0)=0 。判断原点处的连续性、偏导数与可微性。\n\n    7.3 条件最值\n\n在约束  x+y=2  下求  f=x^2+y^2  的最小值，并判断是否有最大值。\n\n<details \n<summary 展开第七章解析<\/summary \n\n  7.1   沿  y=0  函数值为零；沿  y=x^2  函数值为  1/2 。路径极限不同，故  不存在  。\n\n  7.2   设  r= sqrt x^2+y^2  ，由  |xy| leq r^2/2  得  |f| leq r/2 to0 ，所以连续。沿两坐标轴为零，故  f_x(0,0)=f_y(0,0)=0 。\n\n但：\n\n  \n frac f(x,y) r= frac xy  x^2+y^2 \n  \n\n沿  y=x  不趋于零，故  不可微  。\n\n  7.3   约束梯度  (1,1) neq0 ，可用拉格朗日乘数法，得到  x=y=1 。为确认全局最小值，可直接写：\n\n  \nx^2+(2-x)^2=2(x-1)^2+2 geq2.\n  \n\n故最小值为   boxed2 ，在  (1,1)  取得；当  |x| to infty  时函数无界，故  无最大值  。\n\n<\/details \n\n相关专题：[多元极限与可微反例](../补充理解/多元极限与可微反例.md)、[区域最值问题](../补充理解/区域最值问题.md)。\n\n---\n\n   第八章：重积分\n\n    8.1 交换积分次序\n\n计算   displaystyle I= int_0^1dx int_x^1e^ y^2  ,dy 。\n\n    8.2 极坐标\n\n计算   displaystyle iint_ x^2+y^2 leq1 (x^2+y^2) ,dxdy 。\n\n    8.3 球坐标\n\n计算   displaystyle iiint_ x^2+y^2+z^2 leq1 (x^2+y^2+z^2) ,dV 。\n\n<details \n<summary 展开第八章解析<\/summary \n\n  8.1   区域为  0 leq x leq y leq1 。交换次序：\n\n  \nI= int_0^1dy int_0^ye^ y^2  ,dx\n= int_0^1ye^ y^2  ,dy\n= boxed  frac e-1  2  .\n  \n\n  8.2    x^2+y^2=r^2 ，面积元  dxdy=r ,drd theta ：\n\n  \n int_0^ 2 pi d theta int_0^1r^3 ,dr\n= boxed  frac  pi  2  .\n  \n\n  8.3   球坐标体积元  dV=r^2 sin varphi ,drd varphi d theta ：\n\n  \n int_0^ 2 pi d theta int_0^ pi sin varphi ,d varphi\n int_0^1r^4 ,dr\n= boxed  frac 4 pi  5  .\n  \n\n<\/details \n\n相关专题：[二重积分换元法](../补充理解/二重积分换元法.md)。\n\n---\n\n   第九章：曲线积分与曲面积分\n\n    9.1 奇点与格林公式\n\n沿单位圆逆时针计算：\n\n  \n oint_L- frac y  x^2+y^2  ,dx+ frac x  x^2+y^2  ,dy.\n  \n\n为什么不能直接根据  Q_x-P_y=0  得出结果为零？\n\n    9.2 高斯公式补面\n\n设   Sigma  为单位球面的上半球，取外侧，计算：\n\n  \n iint_ Sigma x ,dydz+y ,dzdx+z ,dxdy.\n  \n\n    9.3 斯托克斯公式\n\n设   Gamma  为平面  x+y+z=1  在第一卦限的三角形边界，从  z  轴正向看为逆时针，计算   displaystyle oint_ Gamma-y ,dx+x ,dy 。\n\n<details \n<summary 展开第九章解析<\/summary \n\n  9.1   取  x= cos t,  y= sin t ， 0 leq t leq2 pi ，被积式为  dt ，结果   boxed 2 pi  。\n\n原点位于圆内，场在原点无定义，不能在整个圆盘上直接使用格林公式。可挖去小圆，计入顺时针的内边界。\n\n  9.2   场为  (x,y,z) ，散度为  3 。补上  z=0  的底圆盘并取下侧，封闭立体为上半单位球：\n\n  \n3V=3 cdot frac 2 pi  3 =2 pi.\n  \n\n底面  z=0 ，通量为零，所以所求为   boxed 2 pi  。\n\n  9.3   取向上的三角形曲面。旋度为  (0,0,2) ，在  xOy  面的投影面积为  1/2 ，故：\n\n  \n oint_ Gamma-y ,dx+x ,dy=2 cdot frac12= boxed1.\n  \n\n<\/details \n\n相关专题：[三大积分公式的选择](../补充理解/格林高斯斯托克斯公式的选择.md)。\n\n---\n\n   第十章：微分方程\n\n    10.1 一阶线性初值问题\n\n解  y'+y=e^x,  y(0)=0 。\n\n    10.2 重根与非齐次特解\n\n求  y''-2y'+y=e^x  的通解。\n\n    10.3 分离变量可能漏解\n\n对  y'=y^2,  y(0)=0 ，能否直接除以  y^2  后求解？求满足初值的解。\n\n<details \n<summary 展开第十章解析<\/summary \n\n  10.1   乘积分因子  e^x ：\n\n  \n(e^xy)'=e^ 2x , qquad\ny= frac12e^x+Ce^ -x .\n  \n\n由  y(0)=0 ， C=-1/2 ，故：\n\n  \n boxed y= frac e^x-e^ -x  2 .\n  \n\n  10.2   特征方程  (r-1)^2=0 ，齐次通解为  (C_1+C_2x)e^x 。右端指数对应二重根，设  y^ =Ax^2e^x ，代入得  2A=1 ，故：\n\n  \n boxed y=(C_1+C_2x+ tfrac12x^2)e^x .\n  \n\n  10.3   除以  y^2  会排除  y=0 ，应先检查平衡解。 y equiv0  满足方程和初值；右端  y^2  对  y  的导数  2y  连续，初值问题局部解唯一，故所求为：\n\n  \n boxed y(x) equiv0 .\n  \n\n它可延拓到整个实轴。非零解  y=-1/(x+C)  无法满足  y(0)=0 。\n\n<\/details \n\n相关专题：[微分方程判断过程](../补充理解/微分方程判断过程.md)、[定理条件速查](../补充理解/定理条件与反例速查.md)。\n\n---\n\n   错题记录模板\n\n每次只记录实际出现的问题，复习时先遮住答案重新做。\n\n| 题号 | 我的错误或卡点 | 正确的识别线索 | 必查条件 | 重做日期与结果 |\n| --- | --- | --- | --- | --- |\n| 待填写 |  |  |  |  |\n\n建议把错误归因到具体步骤，例如“没拆内部瑕点”“把驻点当成极值点”“积分次序对应的区域写反”，再回到对应章节或专题复习。\n"}, {"id": "sec-formula", "number": "∑", "kind": "formula", "title": "公式速查", "description": "把常用公式与适用条件，放在同一页。", "tags": ["条件先行", "公式索引"], "source": "", "full": "<h2 id=\"sec-formula-full-h1\">极限与局部近似<\/h2>\n<p><span class=\"math-display\">\\[\\frac{\\sin x}{x}\\to1,\\quad\\frac{\\ln(1+x)}x\\to1,\\quad\n\\frac{e^x-1}x\\to1\\qquad(x\\to0).\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\sin x=x-\\frac{x^3}{6}+o(x^3),\\quad\n\\ln(1+x)=x-\\frac{x^2}{2}+o(x^2).\\]<\/span><\/p>\n<h2 id=\"sec-formula-full-h2\">导数与变限积分<\/h2>\n<p><span class=\"math-display\">\\[\\frac{dy}{dx}=\\frac{dy}{du}\\frac{du}{dx},\\qquad\n\\frac d{dx}\\int_{\\varphi(x)}^{\\psi(x)}f(t)\\,dt\n=f(\\psi(x))\\psi&#x27;(x)-f(\\varphi(x))\\varphi&#x27;(x).\\]<\/span><\/p>\n<p>变限积分公式在被积函数连续、上下限可导等条件下使用。<\/p>\n<h2 id=\"sec-formula-full-h3\">积分计算<\/h2>\n<p><span class=\"math-display\">\\[\\int u\\,dv=uv-\\int v\\,du,\\qquad\n\\int_a^b f(x)\\,dx=F(b)-F(a)\\quad(F&#x27;=f,\\ f\\text{ 连续}).\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\int_0^{\\pi/2}\\sin^m x\\cos^n x\\,dx\n=\\frac{(m-1)!!(n-1)!!}{(m+n)!!}\n\\begin{cases}\\pi/2,&amp;m,n\\text{ 均偶},\\\\1,&amp;\\text{其他情况}.\\end{cases}\\]<\/span><\/p>\n<p>最后一式要求 <span class=\"math-inline\">\\(m,n\\)<\/span> 为非负整数，约定 <span class=\"math-inline\">\\((-1)!!=0!!=1\\)<\/span>。<\/p>\n<h2 id=\"sec-formula-full-h4\">常见收敛条件<\/h2>\n<p><span class=\"math-display\">\\[\\sum_{n=1}^\\infty\\frac1{n^p}\\text{ 收敛}\\iff p&gt;1,\\qquad\n\\int_0^1\\frac{dx}{x^p}\\text{ 收敛}\\iff p&lt;1.\\]<\/span><\/p>\n<h2 id=\"sec-formula-full-h5\">多元微分与梯度<\/h2>\n<p><span class=\"math-display\">\\[dz=f_x\\,dx+f_y\\,dy,\\qquad\nD_{\\boldsymbol e}f=\\nabla f\\cdot\\boldsymbol e\n\\quad(f\\text{ 可微},\\ |\\boldsymbol e|=1).\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[D=f_{xx}f_{yy}-f_{xy}^2.\\]<\/span><\/p>\n<p>在驻点且邻域内有连续二阶偏导时，<span class=\"math-inline\">\\(D&gt;0\\)<\/span> 配合 <span class=\"math-inline\">\\(f_{xx}\\)<\/span> 的符号判极小或极大；<span class=\"math-inline\">\\(D&lt;0\\)<\/span> 为鞍点，<span class=\"math-inline\">\\(D=0\\)<\/span> 另行判断。<\/p>\n<h2 id=\"sec-formula-full-h6\">面积元与体积元<\/h2>\n<p><span class=\"math-display\">\\[dxdy=r\\,drd\\theta,\\qquad\ndV=r^2\\sin\\varphi\\,drd\\varphi d\\theta.\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[dS=\\sqrt{1+z_x^2+z_y^2}\\,dxdy,\\qquad\ndxdy=\\left|\\frac{\\partial(x,y)}{\\partial(u,v)}\\right|dudv.\\]<\/span><\/p>\n<h2 id=\"sec-formula-full-h7\">三大积分公式<\/h2>\n<p><span class=\"math-display\">\\[\\oint_{\\partial D}^{+}Pdx+Qdy=\\iint_D(Q_x-P_y)\\,dxdy.\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\oiint_{\\partial\\Omega,\\text{外}}\\boldsymbol F\\cdot\\boldsymbol n\\,dS\n=\\iiint_\\Omega\\nabla\\cdot\\boldsymbol F\\,dV.\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\oint_{\\partial\\Sigma}^{+}\\boldsymbol F\\cdot d\\boldsymbol r\n=\\iint_\\Sigma(\\nabla\\times\\boldsymbol F)\\cdot\\boldsymbol n\\,dS.\\]<\/span><\/p>\n<p>检查边界、方向、区域内的光滑性与奇点，不能只看公式形式。<\/p>\n<h2 id=\"sec-formula-full-h8\">一阶线性与二阶常系数<\/h2>\n<p><span class=\"math-display\">\\[y&#x27;+P(x)y=Q(x),\\qquad\ny=e^{-\\int Pdx}\\left[\\int Qe^{\\int Pdx}\\,dx+C\\right].\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[y&#x27;&#x27;+py&#x27;+qy=0\\quad\\longrightarrow\\quad r^2+pr+q=0.\\]<\/span><\/p>\n<p>相异实根对应两个指数解，二重实根对应 <span class=\"math-inline\">\\((C_1+C_2x)e^{rx}\\)<\/span>，共轭复根对应指数乘正弦、余弦。<\/p>\n", "summary": "<h2 id=\"sec-formula-full-h1\">极限与局部近似<\/h2>\n<p><span class=\"math-display\">\\[\\frac{\\sin x}{x}\\to1,\\quad\\frac{\\ln(1+x)}x\\to1,\\quad\n\\frac{e^x-1}x\\to1\\qquad(x\\to0).\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\sin x=x-\\frac{x^3}{6}+o(x^3),\\quad\n\\ln(1+x)=x-\\frac{x^2}{2}+o(x^2).\\]<\/span><\/p>\n<h2 id=\"sec-formula-full-h2\">导数与变限积分<\/h2>\n<p><span class=\"math-display\">\\[\\frac{dy}{dx}=\\frac{dy}{du}\\frac{du}{dx},\\qquad\n\\frac d{dx}\\int_{\\varphi(x)}^{\\psi(x)}f(t)\\,dt\n=f(\\psi(x))\\psi&#x27;(x)-f(\\varphi(x))\\varphi&#x27;(x).\\]<\/span><\/p>\n<p>变限积分公式在被积函数连续、上下限可导等条件下使用。<\/p>\n<h2 id=\"sec-formula-full-h3\">积分计算<\/h2>\n<p><span class=\"math-display\">\\[\\int u\\,dv=uv-\\int v\\,du,\\qquad\n\\int_a^b f(x)\\,dx=F(b)-F(a)\\quad(F&#x27;=f,\\ f\\text{ 连续}).\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\int_0^{\\pi/2}\\sin^m x\\cos^n x\\,dx\n=\\frac{(m-1)!!(n-1)!!}{(m+n)!!}\n\\begin{cases}\\pi/2,&amp;m,n\\text{ 均偶},\\\\1,&amp;\\text{其他情况}.\\end{cases}\\]<\/span><\/p>\n<p>最后一式要求 \longrightarrow\\quad r^2+pr+q=0.$$\n\n相异实根对应两个指数解，二重实根对应 $(C_1+C_2x)e^{rx}$，共轭复根对应指数乘正弦、余弦。"}]</script>

        escape(page.title) + '</strong><p>' + escape(page.description) + '</p></button>').join('') + '</div></section>' +
      '<section class="practice-banner"><div class="practice-copy"><span class="practice-number">30</span><div><h2>把理解，变成会做。</h2><p>十章分章自测 · 计算、判断与证明 · 解析可折叠</p></div></div><button data-page="sec-practice">开始自测 ↗</button></section>' +
      '<section class="learning-route"><div class="section-label">一条贯穿十章的线索</div><div class="route"><div><strong>极限与局部变化</strong>导数 · 微分 · 近似</div><span class="arrow">→</span><div><strong>累积与无穷表达</strong>积分 · 级数</div><span class="arrow">→</span><div><strong>空间与变化规律</strong>多元微积分 · 微分方程</div></div></section>' +
      '<p class="home-note">先用「精要速查」建立框架，再进入「完整笔记」阅读推导和例题。补充专题与自测题可从左侧目录打开。阅读偏好只保存在当前浏览器。<br><a href="../../数学/高等数学/README.md">Markdown 学习导航 ↗</a> · <a href="../linear-algebra/速查笔记.html">线性代数阅读页 ↗</a></p>';
  }

  function wrapExamples(body) {
    const heads = [...body.querySelectorAll('h2,h3,h4')].filter(heading =>
      /完整例题|贯通例题|经典反例|^反例[：:]|^例题[：:]/.test(heading.textContent));
    for (const head of heads) {
      if (head.closest('details')) continue;
      const level = Number(head.tagName[1]);
      const items = [];
      let node = head.nextSibling;
      while (node) {
        if (node.nodeType === 1 && /^H[1-6]$/.test(node.tagName) && Number(node.tagName[1]) <= level) break;
        items.push(node);
        node = node.nextSibling;
      }
      const details = document.createElement('details');
      details.className = 'worked-example';
      const summary = document.createElement('summary');
      summary.textContent = head.textContent.replace(/^(完整例题|贯通例题)[：:]/, '');
      const content = document.createElement('div');
      content.className = 'example-body';
      head.before(details);
      content.append(head, ...items);
      details.append(summary, content);
    }
  }
  function makeToc() {
    tocItems = [...main.querySelectorAll('.prose h2,.prose h3')];
    $('toc').innerHTML = tocItems.map(heading =>
      '<a class="' + (heading.tagName === 'H3' ? 'sub' : '') + '" href="#' + heading.id +
      '" data-anchor="' + heading.id + '">' + heading.innerHTML + '</a>').join('');
    updateProgress();
  }
  function reveal(element) {
    let details = element.closest('details');
    while (details) {
      details.open = true;
      details = details.parentElement.closest('details');
    }
  }
  function gotoHeading(id) {
    const element = document.getElementById(id);
    if (!element) return;
    reveal(element);
    element.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  $('toc').addEventListener('click', event => {
    const link = event.target.closest('[data-anchor]');
    if (!link) return;
    event.preventDefault();
    gotoHeading(link.dataset.anchor);
  });

  function showMathNotice() {
    if (current === 'overview' || $('math-notice')) return;
    const notice = document.createElement('p');
    notice.id = 'math-notice';
    notice.className = 'math-notice';
    notice.textContent = '本地公式组件未能加载。请将“阅读资源”文件夹与本页放在一起，再重新打开；原始公式与文字仍可阅读。';
    main.querySelector('.prose')?.before(notice);
  }
  function typeset() {
    if (!window.MathJax?.typesetPromise) return;
    const body = main.querySelector('.prose');
    const token = routeNumber;
    if (!body) return;
    mathQueue = mathQueue.catch(() => {}).then(async () => {
      await MathJax.startup.promise;
      if (token !== routeNumber || !body.isConnected) return;
      await MathJax.typesetPromise([body, $('toc')]);
      updateProgress();
    }).catch(error => {
      console.error('MathJax formula rendering failed:', error);
      mathFailed = true;
      showMathNotice();
    });
  }

  function render() {
    routeNumber++;
    let hash;
    try { hash = decodeURIComponent(location.hash.slice(1)); } catch (_) { hash = ''; }
    const anchor = hash.match(/^((?:sec|topic)-[a-z]+)-(quick|full)-h\d+$/);
    if (anchor) {
      if (current === anchor[1] && mode === (anchor[2] === 'full' ? 'full' : 'summary')) {
        gotoHeading(hash);
        return;
      }
      current = anchor[1];
      mode = anchor[2] === 'full' ? 'full' : 'summary';
    } else {
      current = pages.some(page => page.id === hash) ? hash : 'overview';
    }
    if (window.MathJax?.typesetClear) MathJax.typesetClear([main, $('toc')]);
    const isHome = current === 'overview';
    layout.classList.toggle('home-layout', isHome);
    rail.hidden = isHome;
    tocItems = [];
    $('toc').replaceChildren();
    document.querySelectorAll('.sidebar [data-page]').forEach(button => {
      if (button.dataset.page === current) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    const page = pages.find(item => item.id === current);
    $('breadcrumb-title').textContent = page?.title || '学习总览';
    document.title = (page?.title || '学习总览') + ' · 高等数学笔记';
    if (isHome) {
      home();
    } else {
      const index = pages.indexOf(page);
      if (page.kind !== 'formula') store.set('calculus-last', page.id);
      const isChapter = page.kind === 'chapter';
      const buttons = isChapter ? '<div class="mode-switch" role="group" aria-label="阅读模式"><button data-mode="summary" aria-pressed="' +
        (mode === 'summary') + '">精要速查</button><button data-mode="full" aria-pressed="' + (mode === 'full') + '">完整笔记</button></div>' : '';
      const eyebrow = isChapter ? 'CHAPTER ' + page.number + ' / 第' + ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'][index] + '章' :
        page.kind === 'topic' ? 'EXPLORE / 补充理解' : page.kind === 'practice' ? 'PRACTICE / 先思考，再核对' : 'FORMULA INDEX / 常用公式';
      const content = isChapter ? page[mode] : page.full;
      main.innerHTML = '<header class="chapter-header"><div class="eyebrow">' + eyebrow + '</div><h1>' +
        escape(page.title) + '</h1><p>' + escape(page.description) + '</p>' + tags(page.tags) +
        '<div class="chapter-tools">' + buttons + (page.source ? '<a class="source-link" href="' + page.source +
          '">查看 Markdown 原笔记 ↗</a>' : '') + '</div></header><p class="reading-note"><span class="dot"></span>' +
        (isChapter ? mode === 'summary' ? '先理清主线，再进入完整笔记看推导。' : '完整笔记 · 结合例题理解条件与方法。' :
          page.kind === 'practice' ? '先独立作答，再展开该章解析。' : '阅读时同时检查条件、方法与结论。') +
        '</p>' + (page.kind === 'practice' ? '<div class="practice-controls"><button data-solutions="open">展开全部解析</button><button data-solutions="close">收起全部解析</button></div>' : '') +
        '<article class="prose">' + content + '</article><nav class="chapter-footer" aria-label="前后篇目"><button class="page-nav" data-page="' +
        (pages[index - 1]?.id || 'overview') + '"><small>← ' + (index ? '上一篇' : '返回') + '</small>' +
        escape(pages[index - 1]?.title || '学习总览') + '</button><button class="page-nav next" data-page="' +
        (pages[index + 1]?.id || 'overview') + '"><small>' + (index < pages.length - 1 ? '下一篇' : '返回') +
        ' →</small>' + escape(pages[index + 1]?.title || '学习总览') + '</button></nav>';
      if (page.kind !== 'practice' && (!isChapter || mode === 'full')) wrapExamples(main.querySelector('.prose'));
      makeToc();
      typeset();
      if (mathFailed) showMathNotice();
    }
    window.scrollTo({ top: 0, behavior: 'instant' });
    updateProgress();
    if (anchor) requestAnimationFrame(() => gotoHeading(hash));
    if (pendingQuery) {
      const query = pendingQuery.toLowerCase();
      pendingQuery = '';
      requestAnimationFrame(() => {
        const target = [...main.querySelectorAll('.prose h2,.prose h3,.prose h4,.prose p,.prose li')]
          .find(element => element.textContent.toLowerCase().includes(query));
        if (!target) return;
        reveal(target);
        target.scrollIntoView({ block: 'center' });
        target.classList.add('search-hit');
        setTimeout(() => target.classList.remove('search-hit'), 4000);
      });
    }
  }
  main.addEventListener('click', event => {
    const button = event.target.closest('[data-mode]');
    if (button) {
      mode = button.dataset.mode;
      store.set('calculus-mode', mode);
      render();
    }
    const solutions = event.target.closest('[data-solutions]');
    if (solutions) {
      main.querySelectorAll('.prose details').forEach(details => { details.open = solutions.dataset.solutions === 'open'; });
    }
  });

  function updateProgress() {
    const article = main.querySelector('.prose');
    let progress = 0;
    if (article) {
      const top = article.getBoundingClientRect().top + scrollY;
      const available = article.offsetHeight - innerHeight + 110;
      progress = available <= 0 ? 1 : Math.min(1, Math.max(0, (scrollY - top + 110) / available));
    }
    document.documentElement.style.setProperty('--progress', progress);
    $('progress-label').textContent = Math.round(progress * 100) + '%';
    let active = tocItems[0];
    for (const heading of tocItems) {
      if (heading.closest('details:not([open])')) continue;
      if (heading.getBoundingClientRect().top < 170) active = heading;
    }
    $('toc').querySelectorAll('a').forEach(link => link.classList.toggle('active', link.dataset.anchor === active?.id));
  }
  let scheduled = false;
  window.addEventListener('scroll', () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => { scheduled = false; updateProgress(); });
  }, { passive: true });
  window.addEventListener('resize', updateProgress);
  main.addEventListener('toggle', updateProgress, true);
  $('menu-btn').addEventListener('click', () => {
    const open = !$('sidebar').classList.contains('open');
    $('sidebar').classList.toggle('open', open);
    $('mobile-shade').classList.toggle('show', open);
    $('menu-btn').setAttribute('aria-expanded', String(open));
  });
  $('mobile-shade').addEventListener('click', closeMenu);
  function updateThemeButton() {
    const dark = document.documentElement.dataset.theme === 'dark';
    $('theme-btn').setAttribute('aria-label', dark ? '切换为浅色模式' : '切换为深色模式');
    $('theme-btn').setAttribute('aria-pressed', String(dark));
  }
  updateThemeButton();
  $('theme-btn').addEventListener('click', () => {
    const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    store.set('calculus-theme', theme);
    updateThemeButton();
  });
  let printState = [];
  window.addEventListener('beforeprint', () => {
    printState = [...main.querySelectorAll('details')].map(details => [details, details.open]);
    printState.forEach(([details]) => { details.open = true; });
  });
  window.addEventListener('afterprint', () => {
    printState.forEach(([details, open]) => { details.open = open; });
    printState = [];
  });
  $('print-btn').addEventListener('click', () => window.print());

  function search() {
    const value = $('search-input').value.trim().toLowerCase();
    const terms = value.split(/\s+/).filter(Boolean);
    const results = value ? pages.filter(page => terms.every(term =>
      (page.title + ' ' + page.tags.join(' ') + ' ' + page.search).toLowerCase().includes(term)))
      .sort((a, b) => Number(b.title.toLowerCase().includes(value)) - Number(a.title.toLowerCase().includes(value))) : chapters;
    $('search-results').replaceChildren();
    if (!results.length) {
      $('search-results').innerHTML = '<div class="search-empty">没有找到相关内容，试试“可微”“主值”或“收敛”。</div>';
      return;
    }
    results.slice(0, 12).forEach(page => {
      const button = document.createElement('button');
      button.className = 'search-result';
      const strong = document.createElement('strong');
      strong.textContent = page.title + ' · ' + kindLabel[page.kind];
      const description = document.createElement('p');
      const pos = page.search.toLowerCase().indexOf(terms[0]);
      description.textContent = value && pos >= 0 ? page.search.slice(Math.max(0, pos - 18), pos + 95).replace(/\s+/g, ' ') : page.description;
      button.append(strong, description);
      button.addEventListener('click', () => {
        $('search-dialog').close();
        mode = 'full';
        store.set('calculus-mode', mode);
        pendingQuery = $('search-input').value.trim();
        navigate(page.id);
      });
      $('search-results').append(button);
    });
  }
  function openSearch() {
    search();
    $('search-dialog').showModal();
    $('search-input').focus();
  }
  $('search-results').setAttribute('aria-live', 'polite');
  $('search-trigger').addEventListener('click', openSearch);
  $('search-close').addEventListener('click', () => $('search-dialog').close());
  $('search-dialog').addEventListener('close', () => $('search-trigger').focus({ preventScroll: true }));
  $('search-input').addEventListener('input', search);
  $('search-dialog').addEventListener('click', event => { if (event.target === $('search-dialog')) $('search-dialog').close(); });
  document.addEventListener('keydown', event => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      if (!$('search-dialog').open) openSearch();
    }
    if (event.key === 'Escape') {
      const menuOpen = $('sidebar').classList.contains('open');
      closeMenu();
      if (menuOpen) $('menu-btn').focus();
    }
    if ($('search-dialog').open && event.key === 'ArrowDown' && event.target === $('search-input')) {
      event.preventDefault();
      $('search-results').querySelector('button')?.focus();
    }
  });
  window.addEventListener('hashchange', render);
  render();
  const script = document.createElement('script');
  script.src = '阅读资源/tex-svg.js';
  script.async = true;
  script.onload = typeset;
  script.onerror = () => { mathFailed = true; showMathNotice(); };
  document.head.append(script);
})();

</script>
</body>
</html>
