\\(\\theta\\)<\/span> 是梯度与方向 <span class=\"math-inline\">\\(\\vec{l}\\)<\/span> 的夹角<\/p>\n<blockquote class=\"callout important\"><p class=\"callout-label\">关键结论<\/p><p><strong>梯度的性质<\/strong>：<\/p>\n<ol>\n<li><strong><span class=\"math-inline\">\\(\\theta = 0\\)<\/span> 时<\/strong>（沿梯度方向）：方向导数最大，最大值为 <span class=\"math-inline\">\\(|\\text{grad } f|\\)<\/span> —— <strong>函数增长最快<\/strong><\/li>\n<li><strong><span class=\"math-inline\">\\(\\theta = \\pi\\)<\/span> 时<\/strong>（沿梯度反方向）：方向导数最小，最小值为 <span class=\"math-inline\">\\(-|\\text{grad } f|\\)<\/span> —— <strong>函数下降最快<\/strong><\/li>\n<li><strong><span class=\"math-inline\">\\(\\theta = \\frac{\\pi}{2}\\)<\/span> 时<\/strong>（垂直于梯度方向）：方向导数为0 —— <strong>函数变化率为0<\/strong><\/li>\n<\/ol>\n<p><strong>核心结论<\/strong>：梯度方向是函数值<strong>增加最快<\/strong>的方向，梯度的模是最大变化率<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"sec-multivariable-full-h31\">7.7.4 等值线与等值面<\/h3>\n<ul>\n<li><strong>等值线<\/strong>：<span class=\"math-inline\">\\(f(x,y) = c\\)<\/span>，曲面上高度相同的点的投影<\/li>\n<li><strong>等值面<\/strong>：<span class=\"math-inline\">\\(f(x,y,z) = c\\)<\/span><\/li>\n<li><strong>梯度垂直于等值线/等值面<\/strong>：<span class=\"math-inline\">\\(\\text{grad } f\\)<\/span> 是等值线的法向量<\/li>\n<\/ul>\n<hr />\n<h2 id=\"sec-multivariable-full-h32\">7.8 多元函数的极值及其求法<\/h2>\n<h3 id=\"sec-multivariable-full-h33\">7.8.1 <strong>多元函数的极值及最大值、最小值<\/strong><\/h3>\n<p><strong>极值定义<\/strong>：在 <span class=\"math-inline\">\\(P_0\\)<\/span> 的某邻域内，<span class=\"math-inline\">\\(f(x,y) \\leq f(x_0,y_0)\\)<\/span>（极大值）或 <span class=\"math-inline\">\\(f(x,y) \\geq f(x_0,y_0)\\)<\/span>（极小值）<\/p>\n<p><strong>必要条件<\/strong>：\n若 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 在 <span class=\"math-inline\">\\((x_0,y_0)\\)<\/span> 处有偏导数且取得极值，则\n<span class=\"math-display\">\\[\\boxed{f_x(x_0,y_0) = 0, \\quad f_y(x_0,y_0) = 0}\\]<\/span><\/p>\n<p><strong>驻点<\/strong>：使 <span class=\"math-inline\">\\(f_x=0\\)<\/span> 且 <span class=\"math-inline\">\\(f_y=0\\)<\/span> 的点<\/p>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p>驻点<strong>不一定<\/strong>是极值点（如 <span class=\"math-inline\">\\(z=xy\\)<\/span> 在原点）<\/p>\n<\/blockquote>\n<p><strong>充分条件<\/strong>：\n设 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 在 <span class=\"math-inline\">\\((x_0,y_0)\\)<\/span> 的某邻域内有二阶连续偏导数，且 <span class=\"math-inline\">\\(f_x=f_y=0\\)<\/span><\/p>\n<p>令 <span class=\"math-inline\">\\(A = f_{xx}(x_0,y_0)\\)<\/span>，<span class=\"math-inline\">\\(B = f_{xy}(x_0,y_0)\\)<\/span>，<span class=\"math-inline\">\\(C = f_{yy}(x_0,y_0)\\)<\/span><\/p>\n<p><strong>判别式<\/strong>：\n<span class=\"math-display\">\\[\\boxed{D = AC - B^2 = \\begin{vmatrix} A &amp; B \\\\ B &amp; C \\end{vmatrix}}\\]<\/span><\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">\\(D &gt; 0\\)<\/span> 且 <span class=\"math-inline\">\\(A &lt; 0\\)<\/span><\/td>\n<td><strong>极大值<\/strong><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(D &gt; 0\\)<\/span> 且 <span class=\"math-inline\">\\(A &gt; 0\\)<\/span><\/td>\n<td><strong>极小值<\/strong><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(D &lt; 0\\)<\/span><\/td>\n<td><strong>不是极值<\/strong>（鞍点）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(D = 0\\)<\/span><\/td>\n<td><strong>不能确定<\/strong>（需另作讨论）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h3 id=\"sec-multivariable-full-h34\">7.8.2 <strong>条件极值 — 拉格朗日乘数法<\/strong><\/h3>\n<p>求函数 <span class=\"math-inline\">\\(u=f(x,y,z)\\)<\/span> 在约束条件 <span class=\"math-inline\">\\(\\varphi(x,y,z)=0\\)<\/span> 下的极值<\/p>\n<p><strong>适用条件<\/strong>：<span class=\"math-inline\">\\(f,\\varphi\\)<\/span> 在候选点附近为 <span class=\"math-inline\">\\(C^1\\)<\/span>，且该点 <span class=\"math-inline\">\\(\\nabla\\varphi\\neq\\vec0\\)<\/span>。约束梯度为零的奇异点须单独检查，不能只解乘数方程。<\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p><strong>构造拉格朗日函数<\/strong>：\n<span class=\"math-display\">\\[\\boxed{L(x,y,z,\\lambda) = f(x,y,z) + \\lambda\\varphi(x,y,z)}\\]<\/span><\/p>\n<\/blockquote>\n<p><strong>解方程组<\/strong>：<\/p>\n<p><span class=\"math-display\">\\[\\begin{cases} L_x = f_x + \\lambda\\varphi_x = 0 \\\\ L_y = f_y + \\lambda\\varphi_y = 0 \\\\ L_z = f_z + \\lambda\\varphi_z = 0 \\\\ L_\\lambda = \\varphi(x,y,z) = 0 \\end{cases}\\]<\/span><\/p>\n<p>解出的 <span class=\"math-inline\">\\((x,y,z)\\)<\/span> 就是可能的极值点<\/p>\n<p><strong>多个约束条件时，增加相应的拉格朗日乘数，并检查各约束梯度在候选点处线性无关。<\/strong> 解出的点只是候选点，仍须判定极值或比较函数值。<\/p>\n<hr />\n<h2 id=\"sec-multivariable-full-h35\">第7章 核心关系图<\/h2>\n<pre><code class=\"language-text\">偏导数连续 ——→ 可微 ——→ 偏导数存在\n　　　│　　　　　│\n　　　└─→ 连续 ←─┘\n所有箭头均不可逆\n<\/code><\/pre>\n<hr />\n<h2 id=\"sec-multivariable-full-h36\"><strong>核心公式速查表<\/strong><\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>公式<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>偏导数定义<\/td>\n<td><span class=\"math-inline\">\\(f_x = \\lim_{\\Delta x \\to 0} \\frac{f(x+\\Delta x,y)-f(x,y)}{\\Delta x}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>混合偏导<\/td>\n<td><span class=\"math-inline\">\\(f_{xy} = f_{yx}\\)<\/span>（连续条件下）<\/td>\n<\/tr>\n<tr>\n<td>全微分<\/td>\n<td><span class=\"math-inline\">\\(dz = f_x dx + f_y dy\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>可微充分条件<\/td>\n<td>偏导数连续 <span class=\"math-inline\">\\(\\Rightarrow\\)<\/span> 可微<\/td>\n<\/tr>\n<tr>\n<td>链式法则<\/td>\n<td><span class=\"math-inline\">\\(\\frac{\\partial z}{\\partial x} = \\frac{\\partial z}{\\partial u}\\frac{\\partial u}{\\partial x} + \\frac{\\partial z}{\\partial v}\\frac{\\partial v}{\\partial x}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>隐函数求导<\/td>\n<td><span class=\"math-inline\">\\(\\frac{dy}{dx} = -\\frac{F_x}{F_y}\\)<\/span>，<span class=\"math-inline\">\\(\\frac{\\partial z}{\\partial x} = -\\frac{F_x}{F_z}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>曲线切线<\/td>\n<td><span class=\"math-inline\">\\(\\frac{x-x_0}{x&#x27;(t_0)} = \\frac{y-y_0}{y&#x27;(t_0)} = \\frac{z-z_0}{z&#x27;(t_0)}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>曲面切平面<\/td>\n<td><span class=\"math-inline\">\\(F_x(x-x_0) + F_y(y-y_0) + F_z(z-z_0) = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>方向导数<\/td>\n<td><span class=\"math-inline\">\\(\\frac{\\partial f}{\\partial l} = f_x\\cos\\alpha + f_y\\cos\\beta\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>梯度<\/td>\n<td><span class=\"math-display\">\\[\\text{grad } f = (f_x, f_y), \\quad \\text{方向导数最大值为 } \\|\\text{grad } f\\| = \\sqrt{f_x^2 + f_y^2}\\]<\/span><\/td>\n<\/tr>\n<tr>\n<td>极值判别<\/td>\n<td><span class=\"math-inline\">\\(D = AC-B^2\\)<\/span>：<span class=\"math-inline\">\\(D&gt;0\\)<\/span> 且 <span class=\"math-inline\">\\(A&lt;0\\)<\/span> 极大；<span class=\"math-inline\">\\(D&gt;0\\)<\/span> 且 <span class=\"math-inline\">\\(A&gt;0\\)<\/span> 极小；<span class=\"math-inline\">\\(D&lt;0\\)<\/span> 非极值<\/td>\n<\/tr>\n<tr>\n<td>拉格朗日函数<\/td>\n<td><span class=\"math-inline\">\\(L = f + \\lambda\\varphi\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"sec-multivariable-full-h37\"><strong>记忆口诀<\/strong><\/h2>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><\/p>\n<ul>\n<li><strong>偏导连续则可微，可微必连续；可微未必偏导连续<\/strong><\/li>\n<li>链式法则：连线相乘，分线相加<\/li>\n<li>隐函数求导：负的交叉比（<span class=\"math-inline\">\\(-\\frac{F_x}{F_y}\\)<\/span>）<\/li>\n<li>梯度方向增长最快，反方向下降最快<\/li>\n<li>极值判别：<span class=\"math-inline\">\\(D=AC-B^2\\)<\/span>，大于零有极值，<span class=\"math-inline\">\\(A\\)<\/span> 负极大 <span class=\"math-inline\">\\(A\\)<\/span> 正极小<\/li>\n<\/ul>\n<\/blockquote>\n<hr />\n", "summary": "<h2 id=\"sec-multivariable-quick-h1\">可微，是同一个平面近似所有方向<\/h2>\n<p>令 <span class=\"math-inline\">\\(\\rho=\\sqrt{(\\Delta x)^2+(\\Delta y)^2}\\)<\/span>，可微意味着：<\/p>\n<p><span class=\"math-display\">\\[\\Delta f=f_x\\Delta x+f_y\\Delta y+o(\\rho).\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\text{偏导连续}\\Longrightarrow\\text{可微}\n\\Longrightarrow\\text{连续与偏导存在}.\\]<\/span><\/p>\n<h2 id=\"sec-multivariable-quick-h2\">梯度与极值<\/h2>\n<p>函数可微时，沿单位方向 <span class=\"math-inline\">\\(\\boldsymbol e\\)<\/span> 的方向导数为：<\/p>\n<p><span class=\"math-display\">\\[D_{\\boldsymbol e}f=\\nabla f\\cdot\\boldsymbol e.\\]<\/span><\/p>\n<p>驻点附近有连续二阶偏导时，令 <span class=\"math-inline\">\\(A=f_{xx},B=f_{xy},C=f_{yy}\\)<\/span>，<span class=\"math-inline\">\\(D=AC-B^2\\)<\/span>：<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">\\(D&gt;0,A&gt;0\\)<\/span><\/td>\n<td>极小值<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(D&gt;0,A&lt;0\\)<\/span><\/td>\n<td>极大值<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(D&lt;0\\)<\/span><\/td>\n<td>鞍点<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(D=0\\)<\/span><\/td>\n<td>不能据此判断<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p>所有直线路径极限相同，仍不能证明二重极限存在。拉格朗日乘数法须检查约束梯度，奇异点另查；区域最值还须检查边界。<\/p>\n<\/blockquote>\n<p>进一步阅读：<a href=\"#topic-counterexamples\">多元反例<\/a>、<a href=\"#topic-differentiability\">可微性证明<\/a>、<a href=\"#topic-extrema\">区域最值<\/a>。<\/p>\n", "search": "\n\n   7.1 多元函数的概念\n\n    7.1.1 多元函数的概念\n\n-   二元函数  ： z = f(x,y) ，定义域  D  是平面点集，值域  R(f) \n-    n  元函数  ： u = f(x_1, x_2, ..., x_n) \n-   图形  ：二元函数的图形是空间中的一张  曲面  \n\n---\n\n    7.1.2 二元函数的极限（二重极限）\n\n-   邻域  ： U(P_0,  delta) =   (x,y) |  sqrt (x-x_0)^2+(y-y_0)^2  <  delta   \n-   去心邻域  ：  mathring U (P_0,  delta) （不含  P_0  本身）\n-   聚点  ：  forall  delta   0 ，去心邻域内总有  E  中的点\n-   二重极限定义  ：\n   lim_ (x,y)  to (x_0,y_0)  f(x,y) = A  \n\n  [!NOTE]\n    ⚠️ 关键区别  ： (x,y)  to (x_0,y_0)  的方式有  无穷多种  （沿任意路径），必须所有路径极限都存在且相等，二重极限才存在。\n  沿某条直线路径极限存在   ≠   二重极限存在\n\n---\n\n    7.1.3 多元函数的连续性\n\n-   连续定义  ：  lim_ (x,y)  to (x_0,y_0)  f(x,y) = f(x_0,y_0) \n\n- 多元初等函数在其  定义域内连续  \n\n-   间断点  ： f(x,y) =  frac 1  x^2+y^2-1   的间断点是圆  x^2+y^2=1  上的所有点\n\n  与一元函数不同：多元函数的间断点可以是  曲线  （甚至区域）\n\n---\n\n    7.1.4 多元连续函数的性质\n\n  平面点集基本概念  ：\n\n-   内点  ：存在邻域完全包含于  E \n-   边界点  ：任意邻域内既有  E  的点，也有不属于  E  的点\n-   开集  ：所有点都是内点\n-   闭集  ：包含所有边界点\n-   连通集  ：任意两点可用折线连接\n-   区域  ：连通的开集\n-   闭区域  ：区域连同其边界\n\n  性质  （类比一元函数）：\n\n-   有界性  ：有界闭区域上的连续函数必有界\n-   最值定理  ：有界闭区域上的连续函数必取得最大值和最小值\n-   介值定理  ：有界闭区域上的连续函数必取得介于最大值与最小值之间的任何值\n\n---\n\n   7.2 偏导数\n\n    7.2.1 偏导数的定义及其计算方法\n\n  定义  ：对  x  的偏导数（固定  y ，对  x  求导）\n\n  f_x(x_0,y_0) =  lim_  Delta x  to 0   frac f(x_0+ Delta x, y_0) - f(x_0,y_0)   Delta x   \n\n  记号  ：  frac  partial z   partial x  ，  frac  partial f   partial x  ， z_x ， f_x(x,y) ， f_1' \n\n  计算方法  ：求  f_x  时把  y  看作  常数  ，对  x  求一元函数导数\n\n  [!TIP]\n    指数型复合函数  ：求偏导数时，  底数不变，乘   ln  底数，再乘内层偏导  \n \n   z = a^ u(x,y)   时，  frac  partial z   partial x  = a^ u   cdot  ln a  cdot  frac  partial u   partial x  \n\n---\n\n    7.2.2 偏导数的几何意义\n\n f_x(x_0,y_0) ：曲面  z=f(x,y)  与平面  y=y_0  的交线在点  (x_0,y_0,f(x_0,y_0))  处切线对  x  轴的  斜率  \n\n---\n\n    7.2.3   多元函数的偏导数与连续的关系  \n\n  [!WARNING]\n    偏导数存在   nRightarrow  连续  \n    连续   nRightarrow  偏导数存在  \n\n-   一元函数  ：可导   Rightarrow  连续\n-   多元函数  ：偏导数存在   推不出   连续（因为只沿坐标轴方向变化）\n\n---\n\n    7.2.4   高阶偏导数  \n\n  二阶偏导数  （共4个）：\n\n   frac  partial^2 z   partial x^2  = f_ xx ,  quad  frac  partial^2 z   partial y^2  = f_ yy ,  quad  frac  partial^2 z   partial x  partial y  = f_ xy ,  quad  frac  partial^2 z   partial y  partial x  = f_ yx   \n\n==  混合偏导数相等定理  ==：\n   boxed  text 若   f_ xy   text  和   f_ yx   text  在区域   D  text  内连续，则   f_ xy  = f_ yx    \n即：二阶混合偏导数在  连续  的条件下与求导次序无关\n\n---\n\n   7.3 全微分\n\n    7.3.1 全微分的定义\n\n  全增量  ：  Delta z = f(x+ Delta x, y+ Delta y) - f(x,y) \n\n  可微定义  ：若   Delta z = A Delta x + B Delta y + o( rho) ，其中   rho =  sqrt ( Delta x)^2+( Delta y)^2  \n\n则称  z=f(x,y)  在点  (x,y)  处  可微  \n\n==  全微分  ==：\n   boxed dz =  frac  partial z   partial x dx +  frac  partial z   partial y dy   \n\n---\n\n    7.3.2   可微的条件  \n\n  必要条件  ：可微   Rightarrow  偏导数存在，且  A =  frac  partial z   partial x  ， B =  frac  partial z   partial y  \n\n  充分条件  ：偏导数   frac  partial z   partial x  ，  frac  partial z   partial y     连续     Rightarrow  可微\n\n  [!IMPORTANT]\n    关系链  （必记）：\n     boxed  text 偏导数连续    Rightarrow  text  可微    Rightarrow  text  偏导数存在    \n     boxed  text 可微    Rightarrow  text  连续    \n \n  注意：以上箭头均  不可逆  \n\n---\n\n    7.3.3 全微分在近似计算中的应用\n\n  f(x+ Delta x, y+ Delta y)  approx f(x,y) + f_x(x,y) Delta x + f_y(x,y) Delta y  \n\n或\n\n   Delta z  approx dz = f_x dx + f_y dy  \n\n---\n\n   7.4 多元复合函数的求导法则\n\n    7.4.1 复合函数的全导数\n\n设  u = f(x,y,z) ， x=x(t) ， y=y(t) ， z=z(t) \n\n  全导数公式  ：\n   boxed  frac du  dt  =  frac  partial u   partial x  frac dx  dt  +  frac  partial u   partial y  frac dy  dt  +  frac  partial u   partial z  frac dz  dt    \n\n---\n\n    7.4.2 多元复合函数的情形\n\n设  z = f(u,v) ， u=u(x,y) ， v=v(x,y) \n\n  链式法则  ：\n   boxed  frac  partial z   partial x  =  frac  partial z   partial u  frac  partial u   partial x  +  frac  partial z   partial v  frac  partial v   partial x    \n   boxed  frac  partial z   partial y  =  frac  partial z   partial u  frac  partial u   partial y  +  frac  partial z   partial v  frac  partial v   partial y    \n\n    口诀  ：  连线相乘，分线相加  \n\n---\n\n    7.4.3 其他情形\n\n- 中间变量或自变量个数不同，公式类似\n- 求二阶偏导数时，注意   frac  partial z   partial u  ，  frac  partial z   partial v   仍然是  u,v  的函数\n\n---\n\n    7.4.4 全微分形式不变性\n\n无论  u,v  是自变量还是中间变量，全微分形式相同：\n\n  dz =  frac  partial z   partial u du +  frac  partial z   partial v dv  \n\n利用全微分形式不变性求偏导数，有时更简便\n\n---\n\n   7.5 隐函数的求导公式\n\n    7.5.1   一个方程的情形  \n\n  隐函数存在定理1  ：\n设  F(x,y)  在  P(x_0,y_0)  的某邻域内有连续偏导数， F(x_0,y_0)=0 ， F_y(x_0,y_0)  neq 0 ，则方程  F(x,y)=0  在  P  的某邻域内唯一确定一个连续可导函数  y=f(x) \n\n  [!NOTE]\n    求导公式  ：\n     boxed  frac dy  dx  = - frac F_x  F_y    \n\n  隐函数存在定理2  （三元）：\n设  F(x,y,z)  满足类似条件， F_z  neq 0 ，则  F(x,y,z)=0  确定  z=z(x,y) \n\n  [!NOTE]\n    求偏导公式  ：\n     boxed  frac  partial z   partial x  = - frac F_x  F_z ,  quad  frac  partial z   partial y  = - frac F_y  F_z    \n\n---\n\n    7.5.2   方程组的情形  \n\n设   begin cases  F(x,y,u,v)=0    G(x,y,u,v)=0  end cases   确定  u=u(x,y) ， v=v(x,y) \n\n==  雅可比行列式  ==：\n\n  J =  frac  partial(F,G)   partial(u,v)  =  begin vmatrix  F_u & F_v    G_u & G_v  end vmatrix   \n\n当  J  neq 0  时：\n\n   frac  partial u   partial x  = - frac 1  J  frac  partial(F,G)   partial(x,v) ,  quad  frac  partial v   partial x  = - frac 1  J  frac  partial(F,G)   partial(u,x)   \n\n  [!TIP]\n    记忆规律  ：分母是  J ，分子将求导变量替换到对应位置\n\n---\n\n   7.6 多元函数微分学的几何应用\n\n    7.6.1 一元向量函数及曲线切向量\n\n  曲线参数方程  ：  vec r (t) = (x(t), y(t), z(t)) \n\n  切向量  ：  vec r '(t) = (x'(t), y'(t), z'(t)) \n\n---\n\n    7.6.2   空间曲线的切线与法平面  \n\n设 ==  曲线  ==   Gamma: x=x(t), y=y(t), z=z(t) ，在  t=t_0  处对应点  M_0(x_0,y_0,z_0) \n\n  切向量  ：  vec T  = (x'(t_0), y'(t_0), z'(t_0)) \n\n  以下公式假设参数函数在  t_0  附近连续可导，且   vec T  neq vec0 。某个方向分量为零时，应改用切线参数式   vec r= vec r(t_0)+s vec T ，避免在对称式中除以零。\n\n==  切线方程  ==（点向式）：\n   boxed  frac x-x_0  x'(t_0)  =  frac y-y_0  y'(t_0)  =  frac z-z_0  z'(t_0)    \n\n==  法平面方程  ==（点法式）：\n   boxed x'(t_0)(x-x_0) + y'(t_0)(y-y_0) + z'(t_0)(z-z_0) = 0   \n\n---\n\n    7.6.3   曲面的切平面及法线  \n\n设 ==  曲面  ==   Sigma: F(x,y,z)=0 ，点  M_0(x_0,y_0,z_0)  在曲面上\n\n  适用条件  ： F  在  M_0  的邻域内具有连续一阶偏导数，且   nabla F(M_0) neq vec0 。梯度为零时不能直接套下面的切平面与法线公式，应另行分析。\n\n  法向量  ：  vec n  = (F_x(x_0,y_0,z_0), F_y(x_0,y_0,z_0), F_z(x_0,y_0,z_0)) \n\n==  切平面方程  ==（点法式）：\n   boxed F_x(x_0,y_0,z_0)(x-x_0) + F_y(x_0,y_0,z_0)(y-y_0) + F_z(x_0,y_0,z_0)(z-z_0) = 0   \n\n==  法线方程  ==（点向式）：\n   boxed  frac x-x_0  F_x(x_0,y_0,z_0)  =  frac y-y_0  F_y(x_0,y_0,z_0)  =  frac z-z_0  F_z(x_0,y_0,z_0)    \n\n法向量中有零分量时，改写为法线参数式   vec r= vec r_0+s nabla F(M_0) ，对应坐标保持不变。\n\n若曲面为  z=f(x,y) ，则令  F(x,y,z)=f(x,y)-z ，法向量为  (f_x, f_y, -1) \n\n---\n\n   7.7 方向导数与梯度\n\n    7.7.1 方向导数的定义\n\n  定义  ：函数  f(x,y)  在点  P_0(x_0,y_0)  沿方向   vec l  （方向角   alpha,  beta ）的方向导数：\n\n   frac  partial f   partial l  bigg|_ (x_0,y_0)  =  lim_ t  to 0^+   frac f(x_0+t cos alpha, y_0+t cos beta) - f(x_0,y_0)  t   \n\n---\n\n    7.7.2   方向导数的计算  \n\n  定理  ：若  f(x,y)  可微分，则方向导数存在，且\n\n   boxed  frac  partial f   partial l  = f_x  cos alpha + f_y  cos beta = (f_x, f_y)  cdot ( cos alpha,  cos beta)   \n\n  三元函数类似  ：  frac  partial f   partial l  = f_x cos alpha + f_y cos beta + f_z cos gamma \n\n---\n\n    7.7.3   梯度  \n\n  定义  ：  text grad   f(x_0,y_0) = (f_x(x_0,y_0), f_y(x_0,y_0)) =  nabla f \n\n  方向导数与梯度的关系  ：\n\n   frac  partial f   partial l  =  text grad   f  cdot  vec e _l = | text grad   f|  cos theta  \n\n其中   theta  是梯度与方向   vec l   的夹角\n\n  [!IMPORTANT]\n    梯度的性质  ：\n \n  1.     theta = 0  时  （沿梯度方向）：方向导数最大，最大值为  | text grad   f|  ——   函数增长最快  \n  2.     theta =  pi  时  （沿梯度反方向）：方向导数最小，最小值为  -| text grad   f|  ——   函数下降最快  \n  3.     theta =  frac  pi  2   时  （垂直于梯度方向）：方向导数为0 ——   函数变化率为0  \n \n    核心结论  ：梯度方向是函数值  增加最快  的方向，梯度的模是最大变化率\n\n---\n\n    7.7.4 等值线与等值面\n\n-   等值线  ： f(x,y) = c ，曲面上高度相同的点的投影\n-   等值面  ： f(x,y,z) = c \n-   梯度垂直于等值线/等值面  ：  text grad   f  是等值线的法向量\n\n---\n\n   7.8 多元函数的极值及其求法\n\n    7.8.1   多元函数的极值及最大值、最小值  \n\n  极值定义  ：在  P_0  的某邻域内， f(x,y)  leq f(x_0,y_0) （极大值）或  f(x,y)  geq f(x_0,y_0) （极小值）\n\n  必要条件  ：\n若  f(x,y)  在  (x_0,y_0)  处有偏导数且取得极值，则\n   boxed f_x(x_0,y_0) = 0,  quad f_y(x_0,y_0) = 0   \n\n  驻点  ：使  f_x=0  且  f_y=0  的点\n\n  [!WARNING]\n  驻点  不一定  是极值点（如  z=xy  在原点）\n\n==  充分条件  ==：\n设  f(x,y)  在  (x_0,y_0)  的某邻域内有二阶连续偏导数，且  f_x=f_y=0 \n\n令  A = f_ xx (x_0,y_0) ， B = f_ xy (x_0,y_0) ， C = f_ yy (x_0,y_0) \n\n==  判别式  ==：\n   boxed D = AC - B^2 =  begin vmatrix  A & B    B & C  end vmatrix    \n\n| 条件 | 结论 |\n| ------ | ------ |\n|  D   0  且  A < 0  |   极大值   |\n|  D   0  且  A   0  |   极小值   |\n|  D < 0  |   不是极值  （鞍点） |\n|  D = 0  |   不能确定  （需另作讨论） |\n\n---\n\n    7.8.2   条件极值 — 拉格朗日乘数法  \n\n求函数  u=f(x,y,z)  在约束条件   varphi(x,y,z)=0  下的极值\n\n  适用条件  ： f, varphi  在候选点附近为  C^1 ，且该点   nabla varphi neq vec0 。约束梯度为零的奇异点须单独检查，不能只解乘数方程。\n\n  [!NOTE]\n    构造拉格朗日函数  ：\n     boxed L(x,y,z, lambda) = f(x,y,z) +  lambda varphi(x,y,z)   \n\n==  解方程组  ==：\n\n   begin cases  L_x = f_x +  lambda varphi_x = 0    L_y = f_y +  lambda varphi_y = 0    L_z = f_z +  lambda varphi_z = 0    L_ lambda =  varphi(x,y,z) = 0  end cases   \n\n解出的  (x,y,z)  就是可能的极值点\n\n  多个约束条件时，增加相应的拉格朗日乘数，并检查各约束梯度在候选点处线性无关。   解出的点只是候选点，仍须判定极值或比较函数值。\n\n---\n\n   第7章 核心关系图\n\n```text\n偏导数连续 ——→ 可微 ——→ 偏导数存在\n　　　│　　　　　│\n　　　└─→ 连续 ←─┘\n所有箭头均不可逆\n```\n\n---\n\n     核心公式速查表  \n\n| 公式 | 内容 |\n| ------ | ------ |\n| 偏导数定义 |  f_x =  lim_  Delta x  to 0   frac f(x+ Delta x,y)-f(x,y)   Delta x   |\n| 混合偏导 |  f_ xy  = f_ yx  （连续条件下） |\n| 全微分 |  dz = f_x dx + f_y dy  |\n| 可微充分条件 | 偏导数连续   Rightarrow  可微 |\n| 链式法则 |   frac  partial z   partial x  =  frac  partial z   partial u  frac  partial u   partial x  +  frac  partial z   partial v  frac  partial v   partial x   |\n| 隐函数求导 |   frac dy  dx  = - frac F_x  F_y  ，  frac  partial z   partial x  = - frac F_x  F_z   |\n| 曲线切线 |   frac x-x_0  x'(t_0)  =  frac y-y_0  y'(t_0)  =  frac z-z_0  z'(t_0)   |\n| 曲面切平面 |  F_x(x-x_0) + F_y(y-y_0) + F_z(z-z_0) = 0  |\n| 方向导数 |   frac  partial f   partial l  = f_x cos alpha + f_y cos beta  |\n| 梯度 |    text grad   f = (f_x, f_y),  quad  text 方向导数最大值为    | text grad   f | =  sqrt f_x^2 + f_y^2    |\n| 极值判别 |  D = AC-B^2 ： D 0  且  A<0  极大； D 0  且  A 0  极小； D<0  非极值 |\n| 拉格朗日函数 |  L = f +  lambda varphi  |\n\n---\n\n     记忆口诀  \n\n  [!TIP]\n \n  -   偏导连续则可微，可微必连续；可微未必偏导连续  \n  - 链式法则：连线相乘，分线相加\n  - 隐函数求导：负的交叉比（ - frac F_x  F_y  ）\n  - 梯度方向增长最快，反方向下降最快\n  - 极值判别： D=AC-B^2 ，大于零有极值， A  负极大  A  正极小\n\n---\n"}, {"id": "sec-multiple", "number": "08", "kind": "chapter", "title": "重积分", "description": "读懂区域，用合适的坐标完成累积。", "tags": ["积分次序", "坐标换元", "空间微元"], "source": "../../%E6%95%B0%E5%AD%A6/%E9%AB%98%E7%AD%89%E6%95%B0%E5%AD%A6/%E9%AB%98%E7%AD%89%E6%95%B0%E5%AD%A6%E5%9F%BA%E7%A1%80%E6%A6%82%E5%BF%B5/%E7%AC%AC%E5%85%AB%E7%AB%A0%20%E9%87%8D%E7%A7%AF%E5%88%86.md", "full": "<hr />\n<h2 id=\"sec-multiple-full-h1\">8.1 二重积分的概念及性质<\/h2>\n<h3 id=\"sec-multiple-full-h2\">8.1.1 二重积分的概念<\/h3>\n<h4 id=\"sec-multiple-full-h3\">1. 曲顶柱体的体积<\/h4>\n<p><strong>曲顶柱体<\/strong>：底面是 <span class=\"math-inline\">\\(xOy\\)<\/span> 平面上的闭区域 <span class=\"math-inline\">\\(D\\)<\/span>，侧面是以 <span class=\"math-inline\">\\(D\\)<\/span> 的边界曲线为准线、母线平行于 <span class=\"math-inline\">\\(z\\)<\/span> 轴的柱面，顶部是曲面 <span class=\"math-inline\">\\(z = f(x,y)\\)<\/span>（<span class=\"math-inline\">\\(f(x,y) \\geq 0\\)<\/span>，且在 <span class=\"math-inline\">\\(D\\)<\/span> 上连续）<\/p>\n<p><strong>体积求法<\/strong>（分割 → 近似 → 求和 → 取极限）：<\/p>\n<p><span class=\"math-display\">\\[V = \\iint_D f(x,y) \\, d\\sigma = \\lim_{\\lambda \\to 0} \\sum_{i=1}^n f(\\xi_i, \\eta_i) \\Delta \\sigma_i\\]<\/span><\/p>\n<p>其中 <span class=\"math-inline\">\\(d\\sigma = dxdy\\)<\/span> 称为<strong>面积元素<\/strong><\/p>\n<h4 id=\"sec-multiple-full-h4\">2. 平面薄片的质量<\/h4>\n<p>设平面薄片占有闭区域 <span class=\"math-inline\">\\(D\\)<\/span>，面密度为 <span class=\"math-inline\">\\(\\rho(x,y)\\)<\/span>，则质量：<\/p>\n<p><span class=\"math-display\">\\[M = \\iint_D \\rho(x,y) \\, d\\sigma\\]<\/span><\/p>\n<h4 id=\"sec-multiple-full-h5\">3. 二重积分的定义<\/h4>\n<p>设 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 在有界闭区域 <span class=\"math-inline\">\\(D\\)<\/span> 上有界，将 <span class=\"math-inline\">\\(D\\)<\/span> 任意分成 <span class=\"math-inline\">\\(n\\)<\/span> 个小闭区域 <span class=\"math-inline\">\\(\\Delta \\sigma_i\\)<\/span>，在每个 <span class=\"math-inline\">\\(\\Delta \\sigma_i\\)<\/span> 上任取一点 <span class=\"math-inline\">\\((\\xi_i, \\eta_i)\\)<\/span>，若极限<\/p>\n<p><span class=\"math-display\">\\[\\iint_D f(x,y) \\, d\\sigma = \\lim_{\\lambda \\to 0} \\sum_{i=1}^n f(\\xi_i, \\eta_i) \\Delta \\sigma_i\\]<\/span><\/p>\n<p>存在，则称 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 在 <span class=\"math-inline\">\\(D\\)<\/span> 上<strong>可积<\/strong><\/p>\n<blockquote>\n<p><strong>注意<\/strong>：以后总假设 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 在闭区域 <span class=\"math-inline\">\\(D\\)<\/span> 上连续，则 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 在 <span class=\"math-inline\">\\(D\\)<\/span> 上必可积<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"sec-multiple-full-h6\">8.1.2 <strong>二重积分的性质<\/strong><\/h3>\n<p>设 <span class=\"math-inline\">\\(k_1, k_2\\)<\/span> 为常数：<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>性质<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>线性性<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_D [k_1 f + k_2 g] \\, d\\sigma = k_1 \\iint_D f \\, d\\sigma + k_2 \\iint_D g \\, d\\sigma\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>区域可加性<\/strong><\/td>\n<td>若 <span class=\"math-inline\">\\(D = D_1 \\cup D_2\\)<\/span>，<span class=\"math-inline\">\\(D_1\\)<\/span> 与 <span class=\"math-inline\">\\(D_2\\)<\/span> 无公共内点，则 <span class=\"math-inline\">\\(\\iint_D f \\, d\\sigma = \\iint_{D_1} f \\, d\\sigma + \\iint_{D_2} f \\, d\\sigma\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>面积公式<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_D 1 \\, d\\sigma = A\\)<\/span>（<span class=\"math-inline\">\\(A\\)<\/span> 为 <span class=\"math-inline\">\\(D\\)<\/span> 的面积）<\/td>\n<\/tr>\n<tr>\n<td><strong>保号性<\/strong><\/td>\n<td>若在 <span class=\"math-inline\">\\(D\\)<\/span> 上 <span class=\"math-inline\">\\(f(x,y) \\leq g(x,y)\\)<\/span>，则 <span class=\"math-inline\">\\(\\iint_D f \\, d\\sigma \\leq \\iint_D g \\, d\\sigma\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>估值定理<\/strong><\/td>\n<td>若 <span class=\"math-inline\">\\(m \\leq f(x,y) \\leq M\\)<\/span>，则 <span class=\"math-inline\">\\(mA \\leq \\iint_D f \\, d\\sigma \\leq MA\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>中值定理<\/strong><\/td>\n<td>存在 <span class=\"math-inline\">\\((\\xi, \\eta) \\in D\\)<\/span>，使 <span class=\"math-inline\">\\(\\iint_D f \\, d\\sigma = f(\\xi, \\eta) \\cdot A\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"sec-multiple-full-h7\">8.2 二重积分的计算方法<\/h2>\n<h3 id=\"sec-multiple-full-h8\">8.2.1 利用直角坐标计算二重积分<\/h3>\n<h4 id=\"sec-multiple-full-h9\">1. 核心思想<\/h4>\n<p>把二重积分化为<strong>二次积分<\/strong>（累次积分）。<\/p>\n<h4 id=\"sec-multiple-full-h10\">2. X-型区域<\/h4>\n<p><span class=\"math-display\">\\[D = \\{(x,y) \\mid a \\leq x \\leq b, \\; y_1(x) \\leq y \\leq y_2(x)\\}\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\iint_D f(x,y) \\, dxdy = \\int_a^b dx \\int_{y_1(x)}^{y_2(x)} f(x,y) \\, dy\\]<\/span><\/p>\n<blockquote>\n<p><strong>口诀<\/strong>：先对 <span class=\"math-inline\">\\(y\\)<\/span> 积分（穿竖线），后对 <span class=\"math-inline\">\\(x\\)<\/span> 积分<\/p>\n<\/blockquote>\n<h4 id=\"sec-multiple-full-h11\">3. Y-型区域<\/h4>\n<p><span class=\"math-display\">\\[D = \\{(x,y) \\mid c \\leq y \\leq d, \\; x_1(y) \\leq x \\leq x_2(y)\\}\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\iint_D f(x,y) \\, dxdy = \\int_c^d dy \\int_{x_1(y)}^{x_2(y)} f(x,y) \\, dx\\]<\/span><\/p>\n<blockquote>\n<p><strong>口诀<\/strong>：先对 <span class=\"math-inline\">\\(x\\)<\/span> 积分（穿横线），后对 <span class=\"math-inline\">\\(y\\)<\/span> 积分<\/p>\n<\/blockquote>\n<h4 id=\"sec-multiple-full-h12\">4. 混合型区域<\/h4>\n<p>若 <span class=\"math-inline\">\\(D\\)<\/span> 既不是 X-型也不是 Y-型，用<strong>分割法<\/strong>：将 <span class=\"math-inline\">\\(D\\)<\/span> 分成若干 X-型或 Y-型区域，利用可加性分别计算<\/p>\n<p><span class=\"math-display\">\\[\\iint_D f \\, d\\sigma = \\iint_{D_1} f \\, d\\sigma + \\iint_{D_2} f \\, d\\sigma + \\iint_{D_3} f \\, d\\sigma\\]<\/span><\/p>\n<h4 id=\"sec-multiple-full-h13\">5. 利用直角坐标计算的一般步骤<\/h4>\n<ol>\n<li><strong>画草图<\/strong>：画出积分区域 <span class=\"math-inline\">\\(D\\)<\/span><\/li>\n<li><strong>选次序<\/strong>：根据区域形状和被积函数特点，合理选择积分次序，确定积分限<\/li>\n<li><strong>计算<\/strong>：按次序计算两个定积分<\/li>\n<\/ol>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>关键<\/strong>：选择积分次序时，要兼顾<strong>被积函数<\/strong>是否易求原函数和<strong>积分区域<\/strong>的复杂程度。必要时交换积分次序<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"sec-multiple-full-h14\">8.2.2 <strong>利用极坐标计算二重积分<\/strong><\/h3>\n<h4 id=\"sec-multiple-full-h15\">1. 变换公式<\/h4>\n<p><span class=\"math-display\">\\[\\begin{cases} x = r\\cos\\theta \\\\ y = r\\sin\\theta \\end{cases}\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\iint_D f(x,y) \\, dxdy = \\iint_D f(r\\cos\\theta, r\\sin\\theta) \\cdot r \\, drd\\theta\\]<\/span><\/p>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p><strong>千万别漏 <span class=\"math-inline\">\\(r\\)<\/span>！<\/strong> <span class=\"math-inline\">\\(d\\sigma = r \\, drd\\theta\\)<\/span><\/p>\n<\/blockquote>\n<h4 id=\"sec-multiple-full-h16\">2. 极坐标下的二次积分<\/h4>\n<p><strong>一般形式<\/strong>：<\/p>\n<p><span class=\"math-display\">\\[\\iint_D f(r\\cos\\theta, r\\sin\\theta) \\cdot r \\, drd\\theta = \\int_\\alpha^\\beta d\\theta \\int_{r_1(\\theta)}^{r_2(\\theta)} f(r\\cos\\theta, r\\sin\\theta) \\cdot r \\, dr\\]<\/span><\/p>\n<h4 id=\"sec-multiple-full-h17\">3. 何时用极坐标？<\/h4>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>情况<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>积分区域是圆、圆环、扇形等<\/td>\n<td>极坐标简化区域描述<\/td>\n<\/tr>\n<tr>\n<td>被积函数含 <span class=\"math-inline\">\\(x^2+y^2\\)<\/span>、<span class=\"math-inline\">\\(\\frac{y}{x}\\)<\/span> 等<\/td>\n<td>极坐标简化被积函数<\/td>\n<\/tr>\n<tr>\n<td>边界曲线含 <span class=\"math-inline\">\\(x^2+y^2\\)<\/span><\/td>\n<td>优先考虑极坐标<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4 id=\"sec-multiple-full-h18\">4. 常见区域的极坐标表示<\/h4>\n<ul>\n<li><strong>圆域<\/strong> <span class=\"math-inline\">\\(x^2+y^2 \\leq R^2\\)<\/span>：<span class=\"math-inline\">\\(0 \\leq r \\leq R\\)<\/span>，<span class=\"math-inline\">\\(0 \\leq \\theta \\leq 2\\pi\\)<\/span><\/li>\n<li><strong>圆域<\/strong> <span class=\"math-inline\">\\(x^2+y^2 \\leq 2Rx\\)<\/span>（<span class=\"math-inline\">\\(R&gt;0\\)<\/span>）：<span class=\"math-inline\">\\(0 \\leq r \\leq 2R\\cos\\theta\\)<\/span>，<span class=\"math-inline\">\\(-\\frac{\\pi}{2} \\leq \\theta \\leq \\frac{\\pi}{2}\\)<\/span><\/li>\n<\/ul>\n<blockquote>\n<p>此圆的圆心为 <span class=\"math-inline\">\\((R,0)\\)<\/span>，半径为 <span class=\"math-inline\">\\(R\\)<\/span>，位于右半平面。取 <span class=\"math-inline\">\\(r\\geq0\\)<\/span> 时须使 <span class=\"math-inline\">\\(\\cos\\theta\\geq0\\)<\/span>；上述极角范围覆盖上、下半圆。<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"sec-multiple-full-h19\">8.2.3 <strong>二重积分的对称性<\/strong><\/h3>\n<h4 id=\"sec-multiple-full-h20\">1. <strong>关于坐标轴的对称性<\/strong><\/h4>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">\\(D\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 轴对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_D f(x,y) \\, d\\sigma = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(D\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 轴对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_D f(x,y) \\, d\\sigma = 2\\iint_{D_1} f(x,y) \\, d\\sigma\\)<\/span>（<span class=\"math-inline\">\\(D_1\\)<\/span> 为右半部分）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(D\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 轴对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_D f(x,y) \\, d\\sigma = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(D\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 轴对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_D f(x,y) \\, d\\sigma = 2\\iint_{D_1} f(x,y) \\, d\\sigma\\)<\/span>（<span class=\"math-inline\">\\(D_1\\)<\/span> 为上半部分）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4 id=\"sec-multiple-full-h21\">2. 关于直线 <span class=\"math-inline\">\\(y=x\\)<\/span> 的对称性<\/h4>\n<p>若 <span class=\"math-inline\">\\(D\\)<\/span> 关于 <span class=\"math-inline\">\\(y=x\\)<\/span> 对称，则：<\/p>\n<p><span class=\"math-display\">\\[\\iint_D f(x,y) \\, d\\sigma = \\iint_D f(y,x) \\, d\\sigma\\]<\/span><\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p>可用来<strong>简化计算<\/strong>，如 <span class=\"math-inline\">\\(\\iint_D x^2 \\, d\\sigma = \\iint_D y^2 \\, d\\sigma = \\frac{1}{2}\\iint_D (x^2+y^2) \\, d\\sigma\\)<\/span><\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"sec-multiple-full-h22\">8.3 三重积分的概念及计算<\/h2>\n<h3 id=\"sec-multiple-full-h23\">8.3.1 三重积分的概念<\/h3>\n<p>由二重积分和定积分的定义，类似地定义三重积分：<\/p>\n<p><span class=\"math-display\">\\[\\iiint_\\Omega f(x,y,z) \\, dV = \\lim_{\\lambda \\to 0} \\sum_{i=1}^n f(\\xi_i, \\eta_i, \\zeta_i) \\Delta V_i\\]<\/span><\/p>\n<p><strong>物理意义<\/strong>：当 <span class=\"math-inline\">\\(f(x,y,z) = \\rho(x,y,z)\\)<\/span> 为密度时，表示空间立体 <span class=\"math-inline\">\\(\\Omega\\)<\/span> 的质量<\/p>\n<p><span class=\"math-display\">\\[M = \\iiint_\\Omega \\rho(x,y,z) \\, dV\\]<\/span><\/p>\n<p><strong>体积<\/strong>：<span class=\"math-inline\">\\(V = \\iiint_\\Omega 1 \\, dV\\)<\/span><\/p>\n<hr />\n<h3 id=\"sec-multiple-full-h24\">8.3.2 <strong>利用直角坐标计算三重积分<\/strong><\/h3>\n<h4 id=\"sec-multiple-full-h25\">1. 方法一：<strong>先一后二法<\/strong>（投影法）<\/h4>\n<p>将 <span class=\"math-inline\">\\(\\Omega\\)<\/span> 向 <span class=\"math-inline\">\\(xOy\\)<\/span> 面投影得 <span class=\"math-inline\">\\(D_{xy}\\)<\/span>，<span class=\"math-inline\">\\(z\\)<\/span> 的范围为 <span class=\"math-inline\">\\(z_1(x,y) \\leq z \\leq z_2(x,y)\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\iiint_\\Omega f(x,y,z) \\, dV = \\iint_{D_{xy}} \\left[\\int_{z_1(x,y)}^{z_2(x,y)} f(x,y,z) \\, dz\\right] dxdy\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[= \\int_a^b dx \\int_{y_1(x)}^{y_2(x)} dy \\int_{z_1(x,y)}^{z_2(x,y)} f(x,y,z) \\, dz\\]<\/span><\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>口诀<\/strong>：先 <span class=\"math-inline\">\\(z\\)<\/span> 后 <span class=\"math-inline\">\\(y\\)<\/span> 再 <span class=\"math-inline\">\\(x\\)<\/span>（或根据投影面调整顺序）<\/p>\n<\/blockquote>\n<h4 id=\"sec-multiple-full-h26\">2. 方法二：<strong>先二后一法<\/strong>（截面法）<\/h4>\n<p>将 <span class=\"math-inline\">\\(\\Omega\\)<\/span> 向 <span class=\"math-inline\">\\(z\\)<\/span> 轴投影得 <span class=\"math-inline\">\\([c,d]\\)<\/span>，在 <span class=\"math-inline\">\\([c,d]\\)<\/span> 内任取 <span class=\"math-inline\">\\(z\\)<\/span>，作平行于 <span class=\"math-inline\">\\(xOy\\)<\/span> 面的截面 <span class=\"math-inline\">\\(D_z\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\iiint_\\Omega f(x,y,z) \\, dV = \\int_c^d \\left[\\iint_{D_z} f(x,y,z) \\, dxdy\\right] dz\\]<\/span><\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>适用<\/strong>：当 <span class=\"math-inline\">\\(f(x,y,z)\\)<\/span> 仅与 <span class=\"math-inline\">\\(z\\)<\/span> 有关，或截面 <span class=\"math-inline\">\\(D_z\\)<\/span> 形状简单时特别方便<\/p>\n<\/blockquote>\n<hr />\n<h3 id=\"sec-multiple-full-h27\">8.3.3 利用柱面坐标计算三重积分<\/h3>\n<h4 id=\"sec-multiple-full-h28\">1. 柱面坐标与直角坐标的关系<\/h4>\n<p><span class=\"math-display\">\\[\\begin{cases} x = r\\cos\\theta \\\\ y = r\\sin\\theta \\\\ z = z \\end{cases}\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\iiint_\\Omega f(x,y,z) \\, dV = \\iiint_\\Omega f(r\\cos\\theta, r\\sin\\theta, z) \\cdot r \\, drd\\theta dz\\]<\/span><\/p>\n<blockquote>\n<p><strong>别忘了 <span class=\"math-inline\">\\(r\\)<\/span>！<\/strong> <span class=\"math-inline\">\\(dV = r \\, drd\\theta dz\\)<\/span><\/p>\n<\/blockquote>\n<h4 id=\"sec-multiple-full-h29\">2. <strong>何时用柱面坐标<\/strong>？<\/h4>\n<ul>\n<li>积分区域为柱体、锥体、旋转体等<\/li>\n<li>被积函数含 <span class=\"math-inline\">\\(x^2+y^2\\)<\/span>、<span class=\"math-inline\">\\(\\frac{y}{x}\\)<\/span> 等<\/li>\n<\/ul>\n<hr />\n<h3 id=\"sec-multiple-full-h30\">8.3.4 <strong>利用球面坐标计算三重积分<\/strong><\/h3>\n<h4 id=\"sec-multiple-full-h31\">1. <strong>球面坐标与直角坐标的关系<\/strong><\/h4>\n<p><span class=\"math-display\">\\[\\begin{cases} x = r\\sin\\varphi\\cos\\theta \\\\ y = r\\sin\\varphi\\sin\\theta \\\\ z = r\\cos\\varphi \\end{cases}\\]<\/span><\/p>\n<p>其中：<\/p>\n<ul>\n<li><span class=\"math-inline\">\\(r\\)<\/span>：点到原点的距离，<span class=\"math-inline\">\\(0 \\leq r &lt; +\\infty\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\(\\varphi\\)<\/span>：<span class=\"math-inline\">\\(z\\)<\/span> 轴正向与 <span class=\"math-inline\">\\(OM\\)<\/span> 的夹角，<span class=\"math-inline\">\\(0 \\leq \\varphi \\leq \\pi\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\(\\theta\\)<\/span>：<span class=\"math-inline\">\\(x\\)<\/span> 轴正向与 <span class=\"math-inline\">\\(OM\\)<\/span> 在 <span class=\"math-inline\">\\(xOy\\)<\/span> 面投影的夹角，<span class=\"math-inline\">\\(0 \\leq \\theta \\leq 2\\pi\\)<\/span><\/li>\n<\/ul>\n<p><span class=\"math-display\">\\[\\iiint_\\Omega f(x,y,z) \\, dV = \\iiint_\\Omega f(r\\sin\\varphi\\cos\\theta, r\\sin\\varphi\\sin\\theta, r\\cos\\varphi) \\cdot r^2\\sin\\varphi \\, drd\\varphi d\\theta\\]<\/span><\/p>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p><strong>别忘了 <span class=\"math-inline\">\\(r^2\\sin\\varphi\\)<\/span>！<\/strong> <span class=\"math-inline\">\\(dV = r^2\\sin\\varphi \\, drd\\varphi d\\theta\\)<\/span><\/p>\n<\/blockquote>\n<h4 id=\"sec-multiple-full-h32\">2. <strong>何时用球面坐标<\/strong>？<\/h4>\n<ul>\n<li>积分区域为球体、球壳、锥球组合体等<\/li>\n<li>被积函数含 <span class=\"math-inline\">\\(x^2+y^2+z^2\\)<\/span> 等<\/li>\n<\/ul>\n<hr />\n<h3 id=\"sec-multiple-full-h33\">8.3.5 <strong>三重积分的对称性<\/strong><\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">\\(\\Omega\\)<\/span> 关于 <span class=\"math-inline\">\\(xOy\\)<\/span> 面对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(z\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f(x,y,z) \\, dV = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(\\Omega\\)<\/span> 关于 <span class=\"math-inline\">\\(xOy\\)<\/span> 面对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(z\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f(x,y,z) \\, dV = 2\\iiint_{\\Omega_1} f(x,y,z) \\, dV\\)<\/span>（<span class=\"math-inline\">\\(\\Omega_1\\)<\/span> 为上半部分）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>类似地，有关于 <span class=\"math-inline\">\\(yOz\\)<\/span> 面、<span class=\"math-inline\">\\(zOx\\)<\/span> 面对称的情况<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"sec-multiple-full-h34\">8.4 <strong>重积分的应用<\/strong><\/h2>\n<h3 id=\"sec-multiple-full-h35\">8.4.1 重积分的微元法<\/h3>\n<p>类似于定积分的微元法，重积分求某量 <span class=\"math-inline\">\\(U\\)<\/span>：<\/p>\n<ol>\n<li>在区域 <span class=\"math-inline\">\\(D\\)<\/span>（或 <span class=\"math-inline\">\\(\\Omega\\)<\/span>）内取微元 <span class=\"math-inline\">\\(d\\sigma\\)<\/span>（或 <span class=\"math-inline\">\\(dV\\)<\/span>）<\/li>\n<li>求微元上的近似值 <span class=\"math-inline\">\\(dU = f(x,y) \\, d\\sigma\\)<\/span>（或 <span class=\"math-inline\">\\(f(x,y,z) \\, dV\\)<\/span>）<\/li>\n<li>积分得总量 <span class=\"math-inline\">\\(U = \\iint_D f(x,y) \\, d\\sigma\\)<\/span>（或 <span class=\"math-inline\">\\(\\iiint_\\Omega f(x,y,z) \\, dV\\)<\/span>）<\/li>\n<\/ol>\n<hr />\n<h3 id=\"sec-multiple-full-h36\">8.4.2 重积分在几何上的应用<\/h3>\n<h4 id=\"sec-multiple-full-h37\">1. <strong>曲面的面积<\/strong><\/h4>\n<p>设曲面 <span class=\"math-inline\">\\(\\Sigma: z = f(x,y)\\)<\/span>，在 <span class=\"math-inline\">\\(xOy\\)<\/span> 面上的投影区域为 <span class=\"math-inline\">\\(D\\)<\/span>，则：<\/p>\n<p><span class=\"math-display\">\\[A = \\iint_D \\sqrt{1 + \\left(\\frac{\\partial z}{\\partial x}\\right)^2 + \\left(\\frac{\\partial z}{\\partial y}\\right)^2} \\, dxdy\\]<\/span><\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>记忆<\/strong>：<span class=\"math-inline\">\\(dA = \\sqrt{1 + z_x^2 + z_y^2} \\, dxdy\\)<\/span><\/p>\n<\/blockquote>\n<h4 id=\"sec-multiple-full-h38\">2. 利用参数方程求曲面面积<\/h4>\n<p>若曲面 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 由参数方程 <span class=\"math-inline\">\\(\\begin{cases} x = x(u,v) \\\\ y = y(u,v) \\\\ z = z(u,v) \\end{cases}\\)<\/span>，<span class=\"math-inline\">\\((u,v) \\in D\\)<\/span> 给出，则：<\/p>\n<p><span class=\"math-display\">\\[A = \\iint_D \\sqrt{EG - F^2} \\, dudv\\]<\/span><\/p>\n<p>其中：<\/p>\n<ul>\n<li><span class=\"math-inline\">\\(E = x_u^2 + y_u^2 + z_u^2\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\(F = x_u x_v + y_u y_v + z_u z_v\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\(G = x_v^2 + y_v^2 + z_v^2\\)<\/span><\/li>\n<\/ul>\n<hr />\n<h3 id=\"sec-multiple-full-h39\">8.4.3 <strong>重积分在物理上的应用<\/strong><\/h3>\n<h4 id=\"sec-multiple-full-h40\">1. <strong>质心（形心）坐标<\/strong><\/h4>\n<p><strong>平面薄片<\/strong>（面密度 <span class=\"math-inline\">\\(\\rho(x,y)\\)<\/span>）：<\/p>\n<p><span class=\"math-display\">\\[\\bar{x} = \\frac{\\iint_D x\\rho(x,y) \\, d\\sigma}{\\iint_D \\rho(x,y) \\, d\\sigma}, \\quad \\bar{y} = \\frac{\\iint_D y\\rho(x,y) \\, d\\sigma}{\\iint_D \\rho(x,y) \\, d\\sigma}\\]<\/span><\/p>\n<p><strong>均匀薄片<\/strong>（<span class=\"math-inline\">\\(\\rho\\)<\/span> 为常数）：<\/p>\n<p><span class=\"math-display\">\\[\\bar{x} = \\frac{1}{A}\\iint_D x \\, d\\sigma, \\quad \\bar{y} = \\frac{1}{A}\\iint_D y \\, d\\sigma\\]<\/span><\/p>\n<p><strong>空间立体<\/strong>（体密度 <span class=\"math-inline\">\\(\\rho(x,y,z)\\)<\/span>）：<\/p>\n<p><span class=\"math-display\">\\[\\bar{x} = \\frac{\\iiint_\\Omega x\\rho \\, dV}{\\iiint_\\Omega \\rho \\, dV}, \\quad \\bar{y} = \\frac{\\iiint_\\Omega y\\rho \\, dV}{\\iiint_\\Omega \\rho \\, dV}, \\quad \\bar{z} = \\frac{\\iiint_\\Omega z\\rho \\, dV}{\\iiint_\\Omega \\rho \\, dV}\\]<\/span><\/p>\n<h4 id=\"sec-multiple-full-h41\">2. <strong>转动惯量<\/strong><\/h4>\n<p><strong>定义<\/strong>：转动惯量 = 质点的质量 <span class=\"math-inline\">\\(\\times\\)<\/span> 到转动轴距离的平方<\/p>\n<h5 id=\"sec-multiple-full-h42\">(1) 平面薄片（面密度 <span class=\"math-inline\">\\(\\mu(x,y)\\)<\/span>）<\/h5>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>转动轴<\/th>\n<th>公式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>绕 <span class=\"math-inline\">\\(x\\)<\/span> 轴<\/td>\n<td><span class=\"math-inline\">\\(I_x = \\iint_D y^2 \\mu(x,y) \\, d\\sigma\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>绕 <span class=\"math-inline\">\\(y\\)<\/span> 轴<\/td>\n<td><span class=\"math-inline\">\\(I_y = \\iint_D x^2 \\mu(x,y) \\, d\\sigma\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>绕原点（<span class=\"math-inline\">\\(z\\)<\/span> 轴）<\/td>\n<td><span class=\"math-inline\">\\(I_O = \\iint_D (x^2+y^2) \\mu(x,y) \\, d\\sigma\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>理解记忆<\/strong>：<\/p>\n<ul>\n<li>绕 <span class=\"math-inline\">\\(x\\)<\/span> 轴转 → 距离是 <span class=\"math-inline\">\\(|y|\\)<\/span> → 用 <span class=\"math-inline\">\\(y^2\\)<\/span><\/li>\n<li>绕 <span class=\"math-inline\">\\(y\\)<\/span> 轴转 → 距离是 <span class=\"math-inline\">\\(|x|\\)<\/span> → 用 <span class=\"math-inline\">\\(x^2\\)<\/span><\/li>\n<li>绕原点转 → 距离是 <span class=\"math-inline\">\\(\\sqrt{x^2+y^2}\\)<\/span> → 用 <span class=\"math-inline\">\\(x^2+y^2\\)<\/span><\/li>\n<\/ul>\n<\/blockquote>\n<h5 id=\"sec-multiple-full-h43\">(2) <strong>空间立体<\/strong>（体密度 <span class=\"math-inline\">\\(\\mu(x,y,z)\\)<\/span>）<\/h5>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>转动轴<\/th>\n<th>公式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>绕 <span class=\"math-inline\">\\(x\\)<\/span> 轴<\/td>\n<td><span class=\"math-inline\">\\(I_x = \\iiint_\\Omega (y^2+z^2) \\mu(x,y,z) \\, dV\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>绕 <span class=\"math-inline\">\\(y\\)<\/span> 轴<\/td>\n<td><span class=\"math-inline\">\\(I_y = \\iiint_\\Omega (x^2+z^2) \\mu(x,y,z) \\, dV\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>绕 <span class=\"math-inline\">\\(z\\)<\/span> 轴<\/td>\n<td><span class=\"math-inline\">\\(I_z = \\iiint_\\Omega (x^2+y^2) \\mu(x,y,z) \\, dV\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>绕原点<\/td>\n<td><span class=\"math-inline\">\\(I_O = \\iiint_\\Omega (x^2+y^2+z^2) \\mu(x,y,z) \\, dV\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>理解记忆<\/strong>：绕哪个轴转，就<strong>缺哪个变量<\/strong>的平方！<\/p>\n<ul>\n<li>绕 <span class=\"math-inline\">\\(x\\)<\/span> 轴 → 缺 <span class=\"math-inline\">\\(x\\)<\/span> → <span class=\"math-inline\">\\(y^2+z^2\\)<\/span><\/li>\n<li>绕 <span class=\"math-inline\">\\(y\\)<\/span> 轴 → 缺 <span class=\"math-inline\">\\(y\\)<\/span> → <span class=\"math-inline\">\\(x^2+z^2\\)<\/span><\/li>\n<li>绕 <span class=\"math-inline\">\\(z\\)<\/span> 轴 → 缺 <span class=\"math-inline\">\\(z\\)<\/span> → <span class=\"math-inline\">\\(x^2+y^2\\)<\/span><\/li>\n<\/ul>\n<\/blockquote>\n<h4 id=\"sec-multiple-full-h44\">3. 引力<\/h4>\n<p><strong>平面薄片<\/strong>对点 <span class=\"math-inline\">\\(P_0(x_0,y_0)\\)<\/span> 处单位质量质点的引力：<\/p>\n<p><span class=\"math-display\">\\[\\vec{F} = (F_x, F_y) = \\left(\\iint_D \\frac{G\\rho(x,y)(x-x_0)}{r^3} \\, d\\sigma, \\; \\iint_D \\frac{G\\rho(x,y)(y-y_0)}{r^3} \\, d\\sigma\\right)\\]<\/span><\/p>\n<p>其中 <span class=\"math-inline\">\\(r = \\sqrt{(x-x_0)^2 + (y-y_0)^2}\\)<\/span><\/p>\n<p><strong>空间立体<\/strong>对点 <span class=\"math-inline\">\\(P_0(x_0,y_0,z_0)\\)<\/span> 处单位质量质点的引力：<\/p>\n<p><span class=\"math-display\">\\[\\vec{F} = (F_x, F_y, F_z)\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[F_x = \\iiint_\\Omega \\frac{G\\rho(x,y,z)(x-x_0)}{r^3} \\, dV\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[F_y = \\iiint_\\Omega \\frac{G\\rho(x,y,z)(y-y_0)}{r^3} \\, dV\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[F_z = \\iiint_\\Omega \\frac{G\\rho(x,y,z)(z-z_0)}{r^3} \\, dV\\]<\/span><\/p>\n<p>其中 <span class=\"math-inline\">\\(r = \\sqrt{(x-x_0)^2 + (y-y_0)^2 + (z-z_0)^2}\\)<\/span><\/p>\n<hr />\n<h2 id=\"sec-multiple-full-h45\"><strong>本章核心公式速查表<\/strong><\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>内容<\/th>\n<th>公式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>二重积分（直角坐标）<\/td>\n<td><span class=\"math-inline\">\\(\\iint_D f(x,y) \\, dxdy = \\int_a^b dx \\int_{y_1(x)}^{y_2(x)} f(x,y) \\, dy\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>二重积分（极坐标）<\/td>\n<td><span class=\"math-inline\">\\(\\iint_D f(x,y) \\, dxdy = \\int_\\alpha^\\beta d\\theta \\int_{r_1(\\theta)}^{r_2(\\theta)} f(r\\cos\\theta,r\\sin\\theta) \\cdot r \\, dr\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>三重积分（直角坐标-投影法）<\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f \\, dV = \\iint_{D_{xy}} dxdy \\int_{z_1}^{z_2} f \\, dz\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>三重积分（直角坐标-截面法）<\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f \\, dV = \\int_c^d dz \\iint_{D_z} f \\, dxdy\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>三重积分（柱面坐标）<\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f \\, dV = \\iiint_\\Omega f(r\\cos\\theta,r\\sin\\theta,z) \\cdot r \\, drd\\theta dz\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>三重积分（球面坐标）<\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f \\, dV = \\iiint_\\Omega f(r\\sin\\varphi\\cos\\theta,...) \\cdot r^2\\sin\\varphi \\, drd\\varphi d\\theta\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>曲面面积<\/td>\n<td><span class=\"math-inline\">\\(A = \\iint_D \\sqrt{1+z_x^2+z_y^2} \\, dxdy\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>转动惯量（平面绕 <span class=\"math-inline\">\\(x\\)<\/span> 轴）<\/td>\n<td><span class=\"math-inline\">\\(I_x = \\iint_D y^2 \\mu \\, d\\sigma\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>转动惯量（空间绕 <span class=\"math-inline\">\\(x\\)<\/span> 轴）<\/td>\n<td><span class=\"math-inline\">\\(I_x = \\iiint_\\Omega (y^2+z^2) \\mu \\, dV\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n", "summary": "<h2 id=\"sec-multiple-quick-h1\">先读懂区域，再决定积分次序<\/h2>\n<p><span class=\"math-display\">\\[\\iint_D f\\,dxdy\n=\\int_a^b dx\\int_{y_1(x)}^{y_2(x)}f(x,y)\\,dy.\\]<\/span><\/p>\n<p>选次序时同时考虑区域边界与被积函数。内层无法直接积分时，可考虑交换次序。<\/p>\n<h2 id=\"sec-multiple-quick-h2\">换坐标，必须换面积与体积元<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>坐标<\/th>\n<th>微元<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>平面极坐标<\/td>\n<td><span class=\"math-inline\">\\(dxdy=r\\,drd\\theta\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>柱坐标<\/td>\n<td><span class=\"math-inline\">\\(dV=r\\,drd\\theta dz\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>球坐标，<span class=\"math-inline\">\\(\\varphi\\)<\/span> 从正 <span class=\"math-inline\">\\(z\\)<\/span> 轴量起<\/td>\n<td><span class=\"math-inline\">\\(dV=r^2\\sin\\varphi\\,drd\\varphi d\\theta\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>一般二元换元<\/td>\n<td><span class=\"math-inline\">\\(dxdy=\\left|\\partial(x,y)/\\partial(u,v)\\right|\\,dudv\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p>圆域优先考虑极坐标，球域优先考虑球坐标；对称区域先检查奇偶性。选择换元时兼顾“函数变简单”与“区域变规则”。<\/p>\n<\/blockquote>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p>圆域 <span class=\"math-inline\">\\(x^2+y^2\\leq2Rx\\)<\/span>（<span class=\"math-inline\">\\(R&gt;0\\)<\/span>）的常用范围是 <span class=\"math-inline\">\\(-\\pi/2\\leq\\theta\\leq\\pi/2\\)<\/span>、<span class=\"math-inline\">\\(0\\leq r\\leq2R\\cos\\theta\\)<\/span>。<\/p>\n<\/blockquote>\n<p>进一步阅读：<a href=\"#topic-substitution\">换元法<\/a>、<a href=\"#topic-parity\">奇偶性<\/a>、<a href=\"#topic-centroid\">形心公式<\/a>。<\/p>\n", "search": "\n\n---\n\n   8.1 二重积分的概念及性质\n\n    8.1.1 二重积分的概念\n\n     1. 曲顶柱体的体积\n\n  曲顶柱体  ：底面是  xOy  平面上的闭区域  D ，侧面是以  D  的边界曲线为准线、母线平行于  z  轴的柱面，顶部是曲面  z = f(x,y) （ f(x,y)  geq 0 ，且在  D  上连续）\n\n  体积求法  （分割 → 近似 → 求和 → 取极限）：\n\n  V =  iint_D f(x,y)  , d sigma =  lim_  lambda  to 0   sum_ i=1 ^n f( xi_i,  eta_i)  Delta  sigma_i  \n\n其中  d sigma = dxdy  称为  面积元素  \n\n     2. 平面薄片的质量\n\n设平面薄片占有闭区域  D ，面密度为   rho(x,y) ，则质量：\n\n  M =  iint_D  rho(x,y)  , d sigma  \n\n     3. 二重积分的定义\n\n设  f(x,y)  在有界闭区域  D  上有界，将  D  任意分成  n  个小闭区域   Delta  sigma_i ，在每个   Delta  sigma_i  上任取一点  ( xi_i,  eta_i) ，若极限\n\n   iint_D f(x,y)  , d sigma =  lim_  lambda  to 0   sum_ i=1 ^n f( xi_i,  eta_i)  Delta  sigma_i  \n\n存在，则称  f(x,y)  在  D  上  可积  \n\n    注意  ：以后总假设  f(x,y)  在闭区域  D  上连续，则  f(x,y)  在  D  上必可积\n\n---\n\n    8.1.2   二重积分的性质  \n\n设  k_1, k_2  为常数：\n\n| 性质 | 内容 |\n| ------ | ------ |\n|   线性性   |   iint_D [k_1 f + k_2 g]  , d sigma = k_1  iint_D f  , d sigma + k_2  iint_D g  , d sigma  |\n|   区域可加性   | 若  D = D_1  cup D_2 ， D_1  与  D_2  无公共内点，则   iint_D f  , d sigma =  iint_ D_1  f  , d sigma +  iint_ D_2  f  , d sigma  |\n|   面积公式   |   iint_D 1  , d sigma = A （ A  为  D  的面积） |\n|   保号性   | 若在  D  上  f(x,y)  leq g(x,y) ，则   iint_D f  , d sigma  leq  iint_D g  , d sigma  |\n|   估值定理   | 若  m  leq f(x,y)  leq M ，则  mA  leq  iint_D f  , d sigma  leq MA  |\n|   中值定理   | 存在  ( xi,  eta)  in D ，使   iint_D f  , d sigma = f( xi,  eta)  cdot A  |\n\n---\n\n   8.2 二重积分的计算方法\n\n    8.2.1 利用直角坐标计算二重积分\n\n     1. 核心思想\n\n把二重积分化为  二次积分  （累次积分）。\n\n     2. X-型区域\n\n  D =   (x,y)  mid a  leq x  leq b,  ; y_1(x)  leq y  leq y_2(x)    \n\n   iint_D f(x,y)  , dxdy =  int_a^b dx  int_ y_1(x) ^ y_2(x)  f(x,y)  , dy  \n\n    口诀  ：先对  y  积分（穿竖线），后对  x  积分\n\n     3. Y-型区域\n\n  D =   (x,y)  mid c  leq y  leq d,  ; x_1(y)  leq x  leq x_2(y)    \n\n   iint_D f(x,y)  , dxdy =  int_c^d dy  int_ x_1(y) ^ x_2(y)  f(x,y)  , dx  \n\n    口诀  ：先对  x  积分（穿横线），后对  y  积分\n\n     4. 混合型区域\n\n若  D  既不是 X-型也不是 Y-型，用  分割法  ：将  D  分成若干 X-型或 Y-型区域，利用可加性分别计算\n\n   iint_D f  , d sigma =  iint_ D_1  f  , d sigma +  iint_ D_2  f  , d sigma +  iint_ D_3  f  , d sigma  \n\n     5. 利用直角坐标计算的一般步骤\n\n1.   画草图  ：画出积分区域  D \n2.   选次序  ：根据区域形状和被积函数特点，合理选择积分次序，确定积分限\n3.   计算  ：按次序计算两个定积分\n\n  [!TIP]\n    关键  ：选择积分次序时，要兼顾  被积函数  是否易求原函数和  积分区域  的复杂程度。必要时交换积分次序\n\n---\n\n    8.2.2   利用极坐标计算二重积分  \n\n     1. 变换公式\n\n   begin cases  x = r cos theta    y = r sin theta  end cases   \n\n   iint_D f(x,y)  , dxdy =  iint_D f(r cos theta, r sin theta)  cdot r  , drd theta  \n\n  [!WARNING]\n    千万别漏  r ！    d sigma = r  , drd theta \n\n     2. 极坐标下的二次积分\n\n  一般形式  ：\n\n   iint_D f(r cos theta, r sin theta)  cdot r  , drd theta =  int_ alpha^ beta d theta  int_ r_1( theta) ^ r_2( theta)  f(r cos theta, r sin theta)  cdot r  , dr  \n\n     3. 何时用极坐标？\n\n| 情况 | 说明 |\n| ------ | ------ |\n| 积分区域是圆、圆环、扇形等 | 极坐标简化区域描述 |\n| 被积函数含  x^2+y^2 、  frac y  x   等 | 极坐标简化被积函数 |\n| 边界曲线含  x^2+y^2  | 优先考虑极坐标 |\n\n     4. 常见区域的极坐标表示\n\n-   圆域    x^2+y^2  leq R^2 ： 0  leq r  leq R ， 0  leq  theta  leq 2 pi \n-   圆域    x^2+y^2  leq 2Rx （ R 0 ）： 0  leq r  leq 2R cos theta ， - frac  pi  2   leq  theta  leq  frac  pi  2  \n\n  此圆的圆心为  (R,0) ，半径为  R ，位于右半平面。取  r geq0  时须使   cos theta geq0 ；上述极角范围覆盖上、下半圆。\n\n---\n\n    8.2.3   二重积分的对称性  \n\n     1.   关于坐标轴的对称性  \n\n| 条件 | 结论 |\n| ------ | ------ |\n|  D  关于  y  轴对称， f  关于  x  是  奇函数   |   iint_D f(x,y)  , d sigma = 0  |\n|  D  关于  y  轴对称， f  关于  x  是  偶函数   |   iint_D f(x,y)  , d sigma = 2 iint_ D_1  f(x,y)  , d sigma （ D_1  为右半部分） |\n|  D  关于  x  轴对称， f  关于  y  是  奇函数   |   iint_D f(x,y)  , d sigma = 0  |\n|  D  关于  x  轴对称， f  关于  y  是  偶函数   |   iint_D f(x,y)  , d sigma = 2 iint_ D_1  f(x,y)  , d sigma （ D_1  为上半部分） |\n\n     2. 关于直线  y=x  的对称性\n\n若  D  关于  y=x  对称，则：\n\n   iint_D f(x,y)  , d sigma =  iint_D f(y,x)  , d sigma  \n\n  [!TIP]\n  可用来  简化计算  ，如   iint_D x^2  , d sigma =  iint_D y^2  , d sigma =  frac 1  2  iint_D (x^2+y^2)  , d sigma \n\n---\n\n   8.3 三重积分的概念及计算\n\n    8.3.1 三重积分的概念\n\n由二重积分和定积分的定义，类似地定义三重积分：\n\n   iiint_ Omega f(x,y,z)  , dV =  lim_  lambda  to 0   sum_ i=1 ^n f( xi_i,  eta_i,  zeta_i)  Delta V_i  \n\n  物理意义  ：当  f(x,y,z) =  rho(x,y,z)  为密度时，表示空间立体   Omega  的质量\n\n  M =  iiint_ Omega  rho(x,y,z)  , dV  \n\n  体积  ： V =  iiint_ Omega 1  , dV \n\n---\n\n    8.3.2   利用直角坐标计算三重积分  \n\n     1. 方法一：  先一后二法  （投影法）\n\n将   Omega  向  xOy  面投影得  D_ xy  ， z  的范围为  z_1(x,y)  leq z  leq z_2(x,y) ：\n\n   iiint_ Omega f(x,y,z)  , dV =  iint_ D_ xy    left[ int_ z_1(x,y) ^ z_2(x,y)  f(x,y,z)  , dz right] dxdy  \n\n  =  int_a^b dx  int_ y_1(x) ^ y_2(x)  dy  int_ z_1(x,y) ^ z_2(x,y)  f(x,y,z)  , dz  \n\n  [!TIP]\n    口诀  ：先  z  后  y  再  x （或根据投影面调整顺序）\n\n     2. 方法二：  先二后一法  （截面法）\n\n将   Omega  向  z  轴投影得  [c,d] ，在  [c,d]  内任取  z ，作平行于  xOy  面的截面  D_z ：\n\n   iiint_ Omega f(x,y,z)  , dV =  int_c^d  left[ iint_ D_z  f(x,y,z)  , dxdy right] dz  \n\n  [!TIP]\n    适用  ：当  f(x,y,z)  仅与  z  有关，或截面  D_z  形状简单时特别方便\n\n---\n\n    8.3.3 利用柱面坐标计算三重积分\n\n     1. 柱面坐标与直角坐标的关系\n\n   begin cases  x = r cos theta    y = r sin theta    z = z  end cases   \n\n   iiint_ Omega f(x,y,z)  , dV =  iiint_ Omega f(r cos theta, r sin theta, z)  cdot r  , drd theta dz  \n\n    别忘了  r ！    dV = r  , drd theta dz \n\n     2.   何时用柱面坐标  ？\n\n- 积分区域为柱体、锥体、旋转体等\n- 被积函数含  x^2+y^2 、  frac y  x   等\n\n---\n\n    8.3.4   利用球面坐标计算三重积分  \n\n     1.   球面坐标与直角坐标的关系  \n\n   begin cases  x = r sin varphi cos theta    y = r sin varphi sin theta    z = r cos varphi  end cases   \n\n其中：\n\n-  r ：点到原点的距离， 0  leq r < + infty \n-   varphi ： z  轴正向与  OM  的夹角， 0  leq  varphi  leq  pi \n-   theta ： x  轴正向与  OM  在  xOy  面投影的夹角， 0  leq  theta  leq 2 pi \n\n   iiint_ Omega f(x,y,z)  , dV =  iiint_ Omega f(r sin varphi cos theta, r sin varphi sin theta, r cos varphi)  cdot r^2 sin varphi  , drd varphi d theta  \n\n  [!WARNING]\n    别忘了  r^2 sin varphi ！    dV = r^2 sin varphi  , drd varphi d theta \n\n     2.   何时用球面坐标  ？\n\n- 积分区域为球体、球壳、锥球组合体等\n- 被积函数含  x^2+y^2+z^2  等\n\n---\n\n    8.3.5   三重积分的对称性  \n\n| 条件 | 结论 |\n| ------ | ------ |\n|   Omega  关于  xOy  面对称， f  关于  z  是  奇函数   |   iiint_ Omega f(x,y,z)  , dV = 0  |\n|   Omega  关于  xOy  面对称， f  关于  z  是  偶函数   |   iiint_ Omega f(x,y,z)  , dV = 2 iiint_  Omega_1  f(x,y,z)  , dV （  Omega_1  为上半部分） |\n\n  类似地，有关于  yOz  面、 zOx  面对称的情况\n\n---\n\n   8.4   重积分的应用  \n\n    8.4.1 重积分的微元法\n\n类似于定积分的微元法，重积分求某量  U ：\n\n1. 在区域  D （或   Omega ）内取微元  d sigma （或  dV ）\n2. 求微元上的近似值  dU = f(x,y)  , d sigma （或  f(x,y,z)  , dV ）\n3. 积分得总量  U =  iint_D f(x,y)  , d sigma （或   iiint_ Omega f(x,y,z)  , dV ）\n\n---\n\n    8.4.2 重积分在几何上的应用\n\n     1.   曲面的面积  \n\n设曲面   Sigma: z = f(x,y) ，在  xOy  面上的投影区域为  D ，则：\n\n  A =  iint_D  sqrt 1 +  left( frac  partial z   partial x  right)^2 +  left( frac  partial z   partial y  right)^2   , dxdy  \n\n  [!TIP]\n    记忆  ： dA =  sqrt 1 + z_x^2 + z_y^2   , dxdy \n\n     2. 利用参数方程求曲面面积\n\n若曲面   Sigma  由参数方程   begin cases  x = x(u,v)    y = y(u,v)    z = z(u,v)  end cases  ， (u,v)  in D  给出，则：\n\n  A =  iint_D  sqrt EG - F^2   , dudv  \n\n其中：\n\n-  E = x_u^2 + y_u^2 + z_u^2 \n-  F = x_u x_v + y_u y_v + z_u z_v \n-  G = x_v^2 + y_v^2 + z_v^2 \n\n---\n\n    8.4.3   重积分在物理上的应用  \n\n     1.   质心（形心）坐标  \n\n  平面薄片  （面密度   rho(x,y) ）：\n\n   bar x  =  frac  iint_D x rho(x,y)  , d sigma   iint_D  rho(x,y)  , d sigma ,  quad  bar y  =  frac  iint_D y rho(x,y)  , d sigma   iint_D  rho(x,y)  , d sigma   \n\n  均匀薄片  （  rho  为常数）：\n\n   bar x  =  frac 1  A  iint_D x  , d sigma,  quad  bar y  =  frac 1  A  iint_D y  , d sigma  \n\n  空间立体  （体密度   rho(x,y,z) ）：\n\n   bar x  =  frac  iiint_ Omega x rho  , dV   iiint_ Omega  rho  , dV ,  quad  bar y  =  frac  iiint_ Omega y rho  , dV   iiint_ Omega  rho  , dV ,  quad  bar z  =  frac  iiint_ Omega z rho  , dV   iiint_ Omega  rho  , dV   \n\n     2.   转动惯量  \n\n  定义  ：转动惯量 = 质点的质量   times  到转动轴距离的平方\n\n      (1) 平面薄片（面密度   mu(x,y) ）\n\n| 转动轴 | 公式 |\n| -------- | ------ |\n| 绕  x  轴 |  I_x =  iint_D y^2  mu(x,y)  , d sigma  |\n| 绕  y  轴 |  I_y =  iint_D x^2  mu(x,y)  , d sigma  |\n| 绕原点（ z  轴） |  I_O =  iint_D (x^2+y^2)  mu(x,y)  , d sigma  |\n\n  [!TIP]\n    理解记忆  ：\n \n  - 绕  x  轴转 → 距离是  |y|  → 用  y^2 \n  - 绕  y  轴转 → 距离是  |x|  → 用  x^2 \n  - 绕原点转 → 距离是   sqrt x^2+y^2   → 用  x^2+y^2 \n\n      (2)   空间立体  （体密度   mu(x,y,z) ）\n\n| 转动轴 | 公式 |\n| -------- | ------ |\n| 绕  x  轴 |  I_x =  iiint_ Omega (y^2+z^2)  mu(x,y,z)  , dV  |\n| 绕  y  轴 |  I_y =  iiint_ Omega (x^2+z^2)  mu(x,y,z)  , dV  |\n| 绕  z  轴 |  I_z =  iiint_ Omega (x^2+y^2)  mu(x,y,z)  , dV  |\n| 绕原点 |  I_O =  iiint_ Omega (x^2+y^2+z^2)  mu(x,y,z)  , dV  |\n\n  [!TIP]\n    理解记忆  ：绕哪个轴转，就  缺哪个变量  的平方！\n \n  - 绕  x  轴 → 缺  x  →  y^2+z^2 \n  - 绕  y  轴 → 缺  y  →  x^2+z^2 \n  - 绕  z  轴 → 缺  z  →  x^2+y^2 \n\n     3. 引力\n\n  平面薄片  对点  P_0(x_0,y_0)  处单位质量质点的引力：\n\n   vec F  = (F_x, F_y) =  left( iint_D  frac G rho(x,y)(x-x_0)  r^3   , d sigma,  ;  iint_D  frac G rho(x,y)(y-y_0)  r^3   , d sigma right)  \n\n其中  r =  sqrt (x-x_0)^2 + (y-y_0)^2  \n\n  空间立体  对点  P_0(x_0,y_0,z_0)  处单位质量质点的引力：\n\n   vec F  = (F_x, F_y, F_z)  \n\n  F_x =  iiint_ Omega  frac G rho(x,y,z)(x-x_0)  r^3   , dV  \n\n  F_y =  iiint_ Omega  frac G rho(x,y,z)(y-y_0)  r^3   , dV  \n\n  F_z =  iiint_ Omega  frac G rho(x,y,z)(z-z_0)  r^3   , dV  \n\n其中  r =  sqrt (x-x_0)^2 + (y-y_0)^2 + (z-z_0)^2  \n\n---\n\n     本章核心公式速查表  \n\n| 内容 | 公式 |\n| ------ | ------ |\n| 二重积分（直角坐标） |   iint_D f(x,y)  , dxdy =  int_a^b dx  int_ y_1(x) ^ y_2(x)  f(x,y)  , dy  |\n| 二重积分（极坐标） |   iint_D f(x,y)  , dxdy =  int_ alpha^ beta d theta  int_ r_1( theta) ^ r_2( theta)  f(r cos theta,r sin theta)  cdot r  , dr  |\n| 三重积分（直角坐标-投影法） |   iiint_ Omega f  , dV =  iint_ D_ xy   dxdy  int_ z_1 ^ z_2  f  , dz  |\n| 三重积分（直角坐标-截面法） |   iiint_ Omega f  , dV =  int_c^d dz  iint_ D_z  f  , dxdy  |\n| 三重积分（柱面坐标） |   iiint_ Omega f  , dV =  iiint_ Omega f(r cos theta,r sin theta,z)  cdot r  , drd theta dz  |\n| 三重积分（球面坐标） |   iiint_ Omega f  , dV =  iiint_ Omega f(r sin varphi cos theta,...)  cdot r^2 sin varphi  , drd varphi d theta  |\n| 曲面面积 |  A =  iint_D  sqrt 1+z_x^2+z_y^2   , dxdy  |\n| 转动惯量（平面绕  x  轴） |  I_x =  iint_D y^2  mu  , d sigma  |\n| 转动惯量（空间绕  x  轴） |  I_x =  iiint_ Omega (y^2+z^2)  mu  , dV  |\n\n---\n"}, {"id": "sec-vectorcalculus", "number": "09", "kind": "chapter", "title": "曲线积分与曲面积分", "description": "沿曲线、穿曲面，连接边界与内部。", "tags": ["方向与通量", "三大公式", "奇点"], "source": "../../%E6%95%B0%E5%AD%A6/%E9%AB%98%E7%AD%89%E6%95%B0%E5%AD%A6/%E9%AB%98%E7%AD%89%E6%95%B0%E5%AD%A6%E5%9F%BA%E7%A1%80%E6%A6%82%E5%BF%B5/%E7%AC%AC%E4%B9%9D%E7%AB%A0%20%E6%9B%B2%E7%BA%BF%E7%A7%AF%E5%88%86%E4%B8%8E%E6%9B%B2%E9%9D%A2%E7%A7%AF%E5%88%86.md", "full": "<hr />\n<h2 id=\"sec-vectorcalculus-full-h1\">9.1 第一型曲线积分（对弧长的曲线积分）<\/h2>\n<h3 id=\"sec-vectorcalculus-full-h2\">9.1.1 概念与性质<\/h3>\n<p><strong>物理背景<\/strong>：曲线形构件的质量。设曲线弧 <span class=\"math-inline\">\\(L\\)<\/span> 上点 <span class=\"math-inline\">\\((x,y)\\)<\/span> 处的线密度为 <span class=\"math-inline\">\\(\\rho(x,y)\\)<\/span>，则质量：<\/p>\n<p><span class=\"math-display\">\\[M = \\int_L \\rho(x,y) \\, ds\\]<\/span><\/p>\n<p><strong>定义<\/strong>：设 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 在光滑曲线弧 <span class=\"math-inline\">\\(L\\)<\/span> 上有界，将 <span class=\"math-inline\">\\(L\\)<\/span> 分成 <span class=\"math-inline\">\\(n\\)<\/span> 个小弧段，若极限<\/p>\n<p><span class=\"math-display\">\\[\\int_L f(x,y) \\, ds = \\lim_{\\lambda \\to 0} \\sum_{i=1}^n f(\\xi_i, \\eta_i) \\Delta s_i\\]<\/span><\/p>\n<p>存在，则称此极限为 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 在 <span class=\"math-inline\">\\(L\\)<\/span> 上的<strong>第一型曲线积分<\/strong><\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p>第一型曲线积分与曲线的<strong>方向无关<\/strong><\/p>\n<\/blockquote>\n<p><strong>性质<\/strong>：<\/p>\n<ul>\n<li>线性性、可加性（同二重积分）<\/li>\n<li><span class=\"math-inline\">\\(\\int_L ds = l\\)<\/span>（<span class=\"math-inline\">\\(l\\)<\/span> 为曲线 <span class=\"math-inline\">\\(L\\)<\/span> 的长度）<\/li>\n<li>若在 <span class=\"math-inline\">\\(L\\)<\/span> 上 <span class=\"math-inline\">\\(f(x,y) \\leq g(x,y)\\)<\/span>，则 <span class=\"math-inline\">\\(\\int_L f \\, ds \\leq \\int_L g \\, ds\\)<\/span><\/li>\n<li>估值定理、中值定理（同二重积分）<\/li>\n<\/ul>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h3\">9.1.2 <strong>计算<\/strong><\/h3>\n<p><strong>核心思想<\/strong>：化为定积分<\/p>\n<h4 id=\"sec-vectorcalculus-full-h4\">1. <strong>参数方程形式<\/strong><\/h4>\n<p>设 <span class=\"math-inline\">\\(L\\)<\/span> 的参数方程为 <span class=\"math-inline\">\\(\\begin{cases} x = \\varphi(t) \\\\ y = \\psi(t) \\end{cases}\\)<\/span>（<span class=\"math-inline\">\\(\\alpha \\leq t \\leq \\beta\\)<\/span>），则：<\/p>\n<p><span class=\"math-display\">\\[\\int_L f(x,y) \\, ds = \\int_\\alpha^\\beta f(\\varphi(t), \\psi(t)) \\sqrt{\\varphi&#x27;^2(t) + \\psi&#x27;^2(t)} \\, dt\\]<\/span><\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p><strong>注意<\/strong>：<span class=\"math-inline\">\\(ds = \\sqrt{\\varphi&#x27;^2(t) + \\psi&#x27;^2(t)} \\, dt\\)<\/span>，且 <span class=\"math-inline\">\\(\\alpha &lt; \\beta\\)<\/span>（下限 &lt; 上限）<\/p>\n<\/blockquote>\n<h4 id=\"sec-vectorcalculus-full-h5\">2. <strong>显函数形式<\/strong> <span class=\"math-inline\">\\(y = \\varphi(x)\\)<\/span><\/h4>\n<p><span class=\"math-display\">\\[\\int_L f(x,y) \\, ds = \\int_a^b f(x, \\varphi(x)) \\sqrt{1 + \\varphi&#x27;^2(x)} \\, dx\\]<\/span><\/p>\n<h4 id=\"sec-vectorcalculus-full-h6\">3. <strong>极坐标形式<\/strong> <span class=\"math-inline\">\\(r = r(\\theta)\\)<\/span><\/h4>\n<p><span class=\"math-display\">\\[\\int_L f(x,y) \\, ds = \\int_\\alpha^\\beta f(r\\cos\\theta, r\\sin\\theta) \\sqrt{r^2(\\theta) + r&#x27;^2(\\theta)} \\, d\\theta\\]<\/span><\/p>\n<h4 id=\"sec-vectorcalculus-full-h7\">4. <strong>空间曲线<\/strong><\/h4>\n<p>设 <span class=\"math-inline\">\\(\\Gamma: \\begin{cases} x = \\varphi(t) \\\\ y = \\psi(t) \\\\ z = \\omega(t) \\end{cases}\\)<\/span>（<span class=\"math-inline\">\\(\\alpha \\leq t \\leq \\beta\\)<\/span>），则：<\/p>\n<p><span class=\"math-display\">\\[\\int_\\Gamma f(x,y,z) \\, ds = \\int_\\alpha^\\beta f(\\varphi(t), \\psi(t), \\omega(t)) \\sqrt{\\varphi&#x27;^2(t) + \\psi&#x27;^2(t) + \\omega&#x27;^2(t)} \\, dt\\]<\/span><\/p>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h8\">9.1.3 对称性<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">\\(L\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 轴对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f(x,y) \\, ds = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(L\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 轴对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f(x,y) \\, ds = 2\\int_{L_1} f(x,y) \\, ds\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(L\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 轴对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f(x,y) \\, ds = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(L\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 轴对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f(x,y) \\, ds = 2\\int_{L_1} f(x,y) \\, ds\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h9\">9.1.4 应用<\/h3>\n<p><strong>质心坐标<\/strong>（线密度 <span class=\"math-inline\">\\(\\rho(x,y)\\)<\/span>）：<\/p>\n<p><span class=\"math-display\">\\[\\bar{x} = \\frac{\\int_L x\\rho(x,y) \\, ds}{\\int_L \\rho(x,y) \\, ds}, \\quad \\bar{y} = \\frac{\\int_L y\\rho(x,y) \\, ds}{\\int_L \\rho(x,y) \\, ds}\\]<\/span><\/p>\n<p><strong>转动惯量<\/strong>：<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>转动轴<\/th>\n<th>公式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>绕 <span class=\"math-inline\">\\(x\\)<\/span> 轴<\/td>\n<td><span class=\"math-inline\">\\(I_x = \\int_L y^2 \\rho(x,y) \\, ds\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>绕 <span class=\"math-inline\">\\(y\\)<\/span> 轴<\/td>\n<td><span class=\"math-inline\">\\(I_y = \\int_L x^2 \\rho(x,y) \\, ds\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>绕原点<\/td>\n<td><span class=\"math-inline\">\\(I_O = \\int_L (x^2+y^2) \\rho(x,y) \\, ds\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"sec-vectorcalculus-full-h10\">9.2 第一型曲面积分（对面积的曲面积分）<\/h2>\n<h3 id=\"sec-vectorcalculus-full-h11\">9.2.1 概念与性质<\/h3>\n<p><strong>物理背景<\/strong>：曲面形构件的质量。设曲面 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 上点 <span class=\"math-inline\">\\((x,y,z)\\)<\/span> 处的面密度为 <span class=\"math-inline\">\\(\\rho(x,y,z)\\)<\/span>，则质量：<\/p>\n<p><span class=\"math-display\">\\[M = \\iint_\\Sigma \\rho(x,y,z) \\, dS\\]<\/span><\/p>\n<p><strong>定义<\/strong>：类似第一型曲线积分，将曲面分割求和取极限<\/p>\n<p><strong>性质<\/strong>：与第一型曲线积分类似（线性性、可加性、保号性等）<\/p>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h12\">9.2.2 <strong>计算<\/strong><\/h3>\n<p><strong>核心思想<\/strong>：化为二重积分<\/p>\n<p>设曲面 <span class=\"math-inline\">\\(\\Sigma: z = z(x,y)\\)<\/span>，在 <span class=\"math-inline\">\\(xOy\\)<\/span> 面上的投影区域为 <span class=\"math-inline\">\\(D_{xy}\\)<\/span>，则：<\/p>\n<p><span class=\"math-display\">\\[\\iint_\\Sigma f(x,y,z) \\, dS = \\iint_{D_{xy}} f(x,y,z(x,y)) \\sqrt{1 + z_x^2 + z_y^2} \\, dxdy\\]<\/span><\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p><strong>面积元素<\/strong>：<span class=\"math-inline\">\\(dS = \\sqrt{1 + z_x^2 + z_y^2} \\, dxdy\\)<\/span><\/p>\n<\/blockquote>\n<p><strong>其他投影形式<\/strong>：<\/p>\n<ul>\n<li>若 <span class=\"math-inline\">\\(\\Sigma: x = x(y,z)\\)<\/span>，投影到 <span class=\"math-inline\">\\(yOz\\)<\/span> 面：<span class=\"math-inline\">\\(dS = \\sqrt{1 + x_y^2 + x_z^2} \\, dydz\\)<\/span><\/li>\n<li>若 <span class=\"math-inline\">\\(\\Sigma: y = y(x,z)\\)<\/span>，投影到 <span class=\"math-inline\">\\(zOx\\)<\/span> 面：<span class=\"math-inline\">\\(dS = \\sqrt{1 + y_x^2 + y_z^2} \\, dzdx\\)<\/span><\/li>\n<\/ul>\n<p><strong>特别地<\/strong>，若 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 是平行于 <span class=\"math-inline\">\\(xOy\\)<\/span> 面的平面 <span class=\"math-inline\">\\(z = c\\)<\/span>，则 <span class=\"math-inline\">\\(dS = dxdy\\)<\/span><\/p>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h13\">9.2.3 对称性<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">\\(\\Sigma\\)<\/span> 关于 <span class=\"math-inline\">\\(xOy\\)<\/span> 面对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(z\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_\\Sigma f(x,y,z) \\, dS = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(\\Sigma\\)<\/span> 关于 <span class=\"math-inline\">\\(xOy\\)<\/span> 面对称，<span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(z\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_\\Sigma f(x,y,z) \\, dS = 2\\iint_{\\Sigma_1} f(x,y,z) \\, dS\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h14\">9.2.4 应用<\/h3>\n<p><strong>质心坐标<\/strong>：<\/p>\n<p><span class=\"math-display\">\\[\\bar{x} = \\frac{1}{M}\\iint_\\Sigma x\\rho \\, dS, \\quad \\bar{y} = \\frac{1}{M}\\iint_\\Sigma y\\rho \\, dS, \\quad \\bar{z} = \\frac{1}{M}\\iint_\\Sigma z\\rho \\, dS\\]<\/span><\/p>\n<p><strong>转动惯量<\/strong>：<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>转动轴<\/th>\n<th>公式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>绕 <span class=\"math-inline\">\\(x\\)<\/span> 轴<\/td>\n<td><span class=\"math-inline\">\\(I_x = \\iint_\\Sigma (y^2+z^2)\\rho \\, dS\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>绕 <span class=\"math-inline\">\\(y\\)<\/span> 轴<\/td>\n<td><span class=\"math-inline\">\\(I_y = \\iint_\\Sigma (z^2+x^2)\\rho \\, dS\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>绕 <span class=\"math-inline\">\\(z\\)<\/span> 轴<\/td>\n<td><span class=\"math-inline\">\\(I_z = \\iint_\\Sigma (x^2+y^2)\\rho \\, dS\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>绕原点<\/td>\n<td><span class=\"math-inline\">\\(I_O = \\iint_\\Sigma (x^2+y^2+z^2)\\rho \\, dS\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"sec-vectorcalculus-full-h15\">9.3 第二型曲线积分（对坐标的曲线积分）<\/h2>\n<h3 id=\"sec-vectorcalculus-full-h16\">9.3.1 概念与性质<\/h3>\n<p><strong>物理背景<\/strong>：变力沿曲线做功。设质点在力 <span class=\"math-inline\">\\(\\vec{F} = (P(x,y), Q(x,y))\\)<\/span> 作用下沿曲线 <span class=\"math-inline\">\\(L\\)<\/span> 从 <span class=\"math-inline\">\\(A\\)<\/span> 移动到 <span class=\"math-inline\">\\(B\\)<\/span>，则做功：<\/p>\n<p><span class=\"math-display\">\\[W = \\int_L P(x,y) \\, dx + Q(x,y) \\, dy\\]<\/span><\/p>\n<p><strong>定义<\/strong>：<\/p>\n<p><span class=\"math-display\">\\[\\int_L P(x,y) \\, dx = \\lim_{\\lambda \\to 0} \\sum_{i=1}^n P(\\xi_i, \\eta_i) \\Delta x_i\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\int_L Q(x,y) \\, dy = \\lim_{\\lambda \\to 0} \\sum_{i=1}^n Q(\\xi_i, \\eta_i) \\Delta y_i\\]<\/span><\/p>\n<p><strong>合并记作<\/strong>：<\/p>\n<p><span class=\"math-display\">\\[\\int_L P(x,y) \\, dx + Q(x,y) \\, dy\\]<\/span><\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>关键区别<\/strong>：第二型曲线积分与曲线的<strong>方向有关<\/strong>！<\/p>\n<\/blockquote>\n<p><strong>性质<\/strong>：<\/p>\n<ul>\n<li><strong>方向性<\/strong>：<span class=\"math-inline\">\\(\\int_{\\overrightarrow{AB}} P \\, dx + Q \\, dy = -\\int_{\\overrightarrow{BA}} P \\, dx + Q \\, dy\\)<\/span><\/li>\n<li>线性性、可加性<\/li>\n<\/ul>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h17\">9.3.2 <strong>计算<\/strong><\/h3>\n<p><strong>核心思想<\/strong>：化为定积分，注意起点对应下限，终点对应上限<\/p>\n<h4 id=\"sec-vectorcalculus-full-h18\">1.<strong>参数方程形式<\/strong><\/h4>\n<p>设 <span class=\"math-inline\">\\(L: \\begin{cases} x = \\varphi(t) \\\\ y = \\psi(t) \\end{cases}\\)<\/span>，起点对应 <span class=\"math-inline\">\\(t = \\alpha\\)<\/span>，终点对应 <span class=\"math-inline\">\\(t = \\beta\\)<\/span>，则：<\/p>\n<p><span class=\"math-display\">\\[\\int_L P \\, dx + Q \\, dy = \\int_\\alpha^\\beta \\left[ P(\\varphi(t), \\psi(t))\\varphi&#x27;(t) + Q(\\varphi(t), \\psi(t))\\psi&#x27;(t) \\right] dt\\]<\/span><\/p>\n<blockquote class=\"callout important\"><p class=\"callout-label\">关键结论<\/p><p><strong>注意<\/strong>：<span class=\"math-inline\">\\(\\alpha\\)<\/span> 不一定小于 <span class=\"math-inline\">\\(\\beta\\)<\/span>！起点对应参数为下限，终点对应参数为上限<\/p>\n<\/blockquote>\n<h4 id=\"sec-vectorcalculus-full-h19\">2. <strong>显函数形式 <span class=\"math-inline\">\\(y = \\varphi(x)\\)<\/span><\/strong><\/h4>\n<p><span class=\"math-display\">\\[\\int_L P \\, dx + Q \\, dy = \\int_a^b \\left[ P(x, \\varphi(x)) + Q(x, \\varphi(x))\\varphi&#x27;(x) \\right] dx\\]<\/span><\/p>\n<h4 id=\"sec-vectorcalculus-full-h20\">3. <strong>空间曲线<\/strong><\/h4>\n<p>设 <span class=\"math-inline\">\\(\\Gamma: \\begin{cases} x = \\varphi(t) \\\\ y = \\psi(t) \\\\ z = \\omega(t) \\end{cases}\\)<\/span>，则：<\/p>\n<p><span class=\"math-display\">\\[\\int_\\Gamma P \\, dx + Q \\, dy + R \\, dz = \\int_\\alpha^\\beta \\left[ P\\varphi&#x27; + Q\\psi&#x27; + R\\omega&#x27; \\right] dt\\]<\/span><\/p>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h21\">9.3.3 <strong>两类曲线积分的联系<\/strong><\/h3>\n<p>设 <span class=\"math-inline\">\\(L\\)<\/span> 为有向曲线弧，<span class=\"math-inline\">\\(\\cos\\alpha, \\cos\\beta\\)<\/span> 为 <span class=\"math-inline\">\\(L\\)<\/span> 上点 <span class=\"math-inline\">\\((x,y)\\)<\/span> 处<strong>切向量<\/strong>的方向余弦，则：<\/p>\n<p><span class=\"math-display\">\\[\\int_L P \\, dx + Q \\, dy = \\int_L (P\\cos\\alpha + Q\\cos\\beta) \\, ds\\]<\/span><\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p>其中 <span class=\"math-inline\">\\(\\cos\\alpha = \\frac{dx}{ds}\\)<\/span>，<span class=\"math-inline\">\\(\\cos\\beta = \\frac{dy}{ds}\\)<\/span><\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"sec-vectorcalculus-full-h22\">9.4 第二型曲面积分（对坐标的曲面积分）<\/h2>\n<h3 id=\"sec-vectorcalculus-full-h23\">9.4.1 概念与性质<\/h3>\n<p><strong>物理背景<\/strong>：流体穿过曲面的流量。设流速场 <span class=\"math-inline\">\\(\\vec{v} = (P, Q, R)\\)<\/span>，则穿过曲面 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 的流量：<\/p>\n<p><span class=\"math-display\">\\[\\Phi = \\iint_\\Sigma P \\, dydz + Q \\, dzdx + R \\, dxdy\\]<\/span><\/p>\n<p><strong>定义<\/strong>：<\/p>\n<p><span class=\"math-display\">\\[\\iint_\\Sigma R(x,y,z) \\, dxdy = \\lim_{\\lambda \\to 0} \\sum_{i=1}^n R(\\xi_i, \\eta_i, \\zeta_i) (\\Delta S_i)_{xy}\\]<\/span><\/p>\n<p>其中 <span class=\"math-inline\">\\((\\Delta S_i)_{xy}\\)<\/span> 为 <span class=\"math-inline\">\\(\\Delta S_i\\)<\/span> 在 <span class=\"math-inline\">\\(xOy\\)<\/span> 面上的投影（<strong>带符号<\/strong>）<\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p><strong>关键<\/strong>：第二型曲面积分与曲面的<strong>侧（方向）有关<\/strong>！<\/p>\n<\/blockquote>\n<p><strong>曲面的侧<\/strong>：<\/p>\n<ul>\n<li>对于 <span class=\"math-inline\">\\(z = z(x,y)\\)<\/span>：上侧/下侧<\/li>\n<li>对于 <span class=\"math-inline\">\\(x = x(y,z)\\)<\/span>：前侧/后侧<\/li>\n<li>对于 <span class=\"math-inline\">\\(y = y(x,z)\\)<\/span>：右侧/左侧<\/li>\n<\/ul>\n<p><strong>性质<\/strong>：<\/p>\n<ul>\n<li><strong>方向性<\/strong>：<span class=\"math-inline\">\\(\\iint_{-\\Sigma} R \\, dxdy = -\\iint_\\Sigma R \\, dxdy\\)<\/span>（<span class=\"math-inline\">\\(-\\)<\/span> 表示相反侧）<\/li>\n<li>线性性、可加性<\/li>\n<\/ul>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h24\">9.4.2 <strong>计算<\/strong><\/h3>\n<p><strong>核心思想<\/strong>：化为二重积分，注意符号由侧决定。<\/p>\n<p>设 <span class=\"math-inline\">\\(\\Sigma: z = z(x,y)\\)<\/span>，在 <span class=\"math-inline\">\\(xOy\\)<\/span> 面上的投影为 <span class=\"math-inline\">\\(D_{xy}\\)<\/span>，则：<\/p>\n<p><span class=\"math-display\">\\[\\iint_\\Sigma R(x,y,z) \\, dxdy = \\pm \\iint_{D_{xy}} R(x,y,z(x,y)) \\, dxdy\\]<\/span><\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><\/p>\n<ul>\n<li>取<strong>上侧<\/strong>时，符号为 <strong>+<\/strong><\/li>\n<li>取<strong>下侧<\/strong>时，符号为 <strong>-<\/strong><\/li>\n<\/ul>\n<\/blockquote>\n<p><strong>同理<\/strong>：<\/p>\n<ul>\n<li><span class=\"math-inline\">\\(\\iint_\\Sigma P(x,y,z) \\, dydz = \\pm \\iint_{D_{yz}} P(x(y,z),y,z) \\, dydz\\)<\/span>（前侧+，后侧-）<\/li>\n<li><span class=\"math-inline\">\\(\\iint_\\Sigma Q(x,y,z) \\, dzdx = \\pm \\iint_{D_{zx}} Q(x,y(x,z),z) \\, dzdx\\)<\/span>（右侧+，左侧-）<\/li>\n<\/ul>\n<p><strong>特别地<\/strong>：<\/p>\n<ul>\n<li>若 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 是母线垂直于 <span class=\"math-inline\">\\(xOy\\)<\/span> 面的柱面，则 <span class=\"math-inline\">\\(\\iint_\\Sigma R \\, dxdy = 0\\)<\/span><\/li>\n<li>若 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 是母线垂直于 <span class=\"math-inline\">\\(yOz\\)<\/span> 面的柱面，则 <span class=\"math-inline\">\\(\\iint_\\Sigma P \\, dydz = 0\\)<\/span><\/li>\n<li>若 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 是母线垂直于 <span class=\"math-inline\">\\(zOx\\)<\/span> 面的柱面，则 <span class=\"math-inline\">\\(\\iint_\\Sigma Q \\, dzdx = 0\\)<\/span><\/li>\n<\/ul>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h25\">9.4.3 <strong>两类曲面积分的联系<\/strong><\/h3>\n<p>设 <span class=\"math-inline\">\\(\\cos\\alpha, \\cos\\beta, \\cos\\gamma\\)<\/span> 为曲面 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 上点 <span class=\"math-inline\">\\((x,y,z)\\)<\/span> 处<strong>法向量<\/strong>的方向余弦，则：<\/p>\n<p><span class=\"math-display\">\\[\\iint_\\Sigma P \\, dydz + Q \\, dzdx + R \\, dxdy = \\iint_\\Sigma (P\\cos\\alpha + Q\\cos\\beta + R\\cos\\gamma) \\, dS\\]<\/span><\/p>\n<p>其中：<\/p>\n<p><span class=\"math-display\">\\[\\cos\\alpha = \\frac{-z_x}{\\sqrt{1+z_x^2+z_y^2}}, \\quad \\cos\\beta = \\frac{-z_y}{\\sqrt{1+z_x^2+z_y^2}}, \\quad \\cos\\gamma = \\frac{1}{\\sqrt{1+z_x^2+z_y^2}}\\]<\/span><\/p>\n<p>（取上侧时 <span class=\"math-inline\">\\(\\cos\\gamma &gt; 0\\)<\/span>）<\/p>\n<hr />\n<h2 id=\"sec-vectorcalculus-full-h26\">9.5 <strong>格林公式<\/strong><\/h2>\n<h3 id=\"sec-vectorcalculus-full-h27\">9.5.1 <strong>格林公式<\/strong><\/h3>\n<p><strong>区域分类<\/strong>：<\/p>\n<ul>\n<li><strong>单连通区域<\/strong>：没有&quot;洞&quot;的区域<\/li>\n<li><strong>复连通区域<\/strong>：有&quot;洞&quot;的区域<\/li>\n<\/ul>\n<p><strong>正向边界<\/strong>：沿边界 <span class=\"math-inline\">\\(L\\)<\/span> 行走时，区域 <span class=\"math-inline\">\\(D\\)<\/span> 总位于观察者的<strong>左手边<\/strong><\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>注意<\/strong>：外边界逆时针，内边界顺时针<\/p>\n<\/blockquote>\n<p><strong>定理 9.6（<strong>格林公式<\/strong>）<\/strong>：设闭区域 <span class=\"math-inline\">\\(D\\)<\/span> 由分段光滑曲线 <span class=\"math-inline\">\\(L\\)<\/span> 围成，<span class=\"math-inline\">\\(P(x,y), Q(x,y)\\)<\/span> 在 <span class=\"math-inline\">\\(D\\)<\/span> 上具有一阶连续偏导数，则：<\/p>\n<p><span class=\"math-display\">\\[\\oint_L P \\, dx + Q \\, dy = \\iint_D \\left( \\frac{\\partial Q}{\\partial x} - \\frac{\\partial P}{\\partial y} \\right) dxdy\\]<\/span><\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p><\/p>\n<ul>\n<li><span class=\"math-inline\">\\(L\\)<\/span> 为 <span class=\"math-inline\">\\(D\\)<\/span> 的<strong>正向<\/strong>边界<\/li>\n<li>若 <span class=\"math-inline\">\\(L\\)<\/span> 为<strong>顺时针<\/strong>，则右边加<strong>负号<\/strong><\/li>\n<\/ul>\n<\/blockquote>\n<p><strong>用第一型曲线积分表示<\/strong>：<\/p>\n<p><span class=\"math-display\">\\[\\oint_L (P\\cos\\alpha + Q\\sin\\alpha) \\, ds = \\iint_D \\left( \\frac{\\partial Q}{\\partial x} - \\frac{\\partial P}{\\partial y} \\right) dxdy\\]<\/span><\/p>\n<p>其中 <span class=\"math-inline\">\\((\\cos\\alpha, \\sin\\alpha)\\)<\/span> 为 <span class=\"math-inline\">\\(L\\)<\/span> 上点 <span class=\"math-inline\">\\((x,y)\\)<\/span> 处的单位切向量<\/p>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h28\">9.5.2 <strong>平面上曲线积分与路径无关的条件<\/strong><\/h3>\n<p><strong>定义<\/strong>：若对 <span class=\"math-inline\">\\(G\\)<\/span> 内任意两点 <span class=\"math-inline\">\\(A, B\\)<\/span>，沿任意两条从 <span class=\"math-inline\">\\(A\\)<\/span> 到 <span class=\"math-inline\">\\(B\\)<\/span> 的曲线 <span class=\"math-inline\">\\(L_1, L_2\\)<\/span> 都有：<\/p>\n<p><span class=\"math-display\">\\[\\int_{L_1} P \\, dx + Q \\, dy = \\int_{L_2} P \\, dx + Q \\, dy\\]<\/span><\/p>\n<p>则称曲线积分 <span class=\"math-inline\">\\(\\int_L P \\, dx + Q \\, dy\\)<\/span> 在 <span class=\"math-inline\">\\(G\\)<\/span> 内与<strong>路径无关<\/strong><\/p>\n<p><strong>等价条件<\/strong>（在单连通区域 <span class=\"math-inline\">\\(G\\)<\/span> 内）：<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>与路径无关<\/td>\n<td>沿任意闭曲线的积分为零<\/td>\n<\/tr>\n<tr>\n<td><strong><span class=\"math-inline\">\\(\\frac{\\partial Q}{\\partial x} = \\frac{\\partial P}{\\partial y}\\)<\/span><\/strong><\/td>\n<td>在 <span class=\"math-inline\">\\(G\\)<\/span> 内<strong>恒成立<\/strong><\/td>\n<\/tr>\n<tr>\n<td>存在 <span class=\"math-inline\">\\(u(x,y)\\)<\/span><\/td>\n<td>使 <span class=\"math-inline\">\\(du = P \\, dx + Q \\, dy\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p><strong>常见判据<\/strong>：当 <span class=\"math-inline\">\\(G\\)<\/span> 是<strong>单连通开区域<\/strong>，且 <span class=\"math-inline\">\\(P,Q\\in C^1(G)\\)<\/span> 时，<span class=\"math-inline\">\\(Q_x=P_y\\)<\/span> 与路径无关等条件等价。单连通是这一充分性判据的条件；非单连通区域中的具体场仍可能路径无关，但不能只检查 <span class=\"math-inline\">\\(Q_x=P_y\\)<\/span> 就作出判断。<\/p>\n<\/blockquote>\n<p><strong>奇点检查<\/strong>：使用格林公式前，应检查曲线围成的区域内是否存在场无定义或不满足所需光滑性条件的点。即使其他点满足 <span class=\"math-inline\">\\(Q_x=P_y\\)<\/span>，绕这些点的闭曲线积分也可能非零；可考虑直接参数化，或挖去奇点邻域并计入内边界。<\/p>\n<hr />\n<h3 id=\"sec-vectorcalculus-full-h29\">9.5.3 <strong>二元函数的全微分求积<\/strong><\/h3>\n<p><strong>定理 9.8<\/strong>：在单连通区域 <span class=\"math-inline\">\\(G\\)<\/span> 内，<span class=\"math-inline\">\\(P \\, dx + Q \\, dy\\)<\/span> 是某个二元函数 <span class=\"math-inline\">\\(u(x,y)\\)<\/span> 的全微分的<strong>充分必要条件<\/strong>是：<\/p>\n<p><span class=\"math-display\">\\[\\frac{\\partial Q}{\\partial x} = \\frac{\\partial P}{\\partial y}\\]<\/span><\/p>\n<p><strong>求 <span class=\"math-inline\">\\(u(x,y)\\)<\/span> 的方法<\/strong>：<\/p>\n<p>取定点 <span class=\"math-inline\">\\(M_0(x_0, y_0) \\in G\\)<\/span>，则：<\/p>\n<p><span class=\"math-display\">\\[u(x,y) = \\int_{(x_0,y_0)}^{(x,y)} P \\,
