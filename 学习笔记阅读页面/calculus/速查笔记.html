(x\\)<\/span> 变号）<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f dV = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(zOx\\)<\/span> 面<\/strong> 对称（<span class=\"math-inline\">\\(y\\)<\/span> 变号）<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f dV = 0\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>记忆口诀<\/strong>：区域关于哪个坐标面对称，就看函数关于<strong>垂直于该面的那个变量<\/strong>（第三个变量）的奇偶性<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-parity-full-h5\">四、第一型曲线积分（第9章）<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>曲线 <span class=\"math-inline\">\\(L\\)<\/span> 的对称性<\/th>\n<th>函数 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 的奇偶性<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(x\\)<\/span> 轴<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f ds = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(x\\)<\/span> 轴<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f ds = 2\\int_{L_上} f ds\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(y\\)<\/span> 轴<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f ds = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(y\\)<\/span> 轴<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f ds = 2\\int_{L_右} f ds\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-parity-full-h6\">五、第一型曲面积分（第9章）<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>曲面 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 的对称性<\/th>\n<th>函数 <span class=\"math-inline\">\\(f(x,y,z)\\)<\/span> 的奇偶性<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(xOy\\)<\/span> 面<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(z\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_\\Sigma f dS = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(xOy\\)<\/span> 面<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(z\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_\\Sigma f dS = 2\\iint_{\\Sigma_上} f dS\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-parity-full-h7\">六、第二型曲线/曲面积分（第9章）<\/h2>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p><strong>第二型积分一般不能直接用奇偶性简化<\/strong>，因为第二型积分与方向有关，奇偶性结论不成立或需要额外考虑方向<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-parity-full-h8\">总结表：一张图记住所有奇偶性<\/h2>\n<pre><code class=\"language-text\">┌───────────────────────────────────────────────────────┐\n│  积分类型    │  区域对称性        │  看函数的奇偶性      │\n├───────────────────────────────────────────────────────┤\n│  定积分      │  关于原点对称      │  f(x) 关于 x        │\n│  二重积分    │  关于 y 轴对称     │  f 关于 x           │\n│  二重积分    │  关于 x 轴对称     │  f 关于 y           │\n│  三重积分    │  关于 xOy 面对称   │  f 关于 z           │\n│  三重积分    │  关于 yOz 面对称   │  f 关于 x           │\n│  三重积分    │  关于 zOx 面对称   │  f 关于 y           │\n│  曲线积分    │  关于 x 轴对称     │  f 关于 y           │\n│  曲线积分    │  关于 y 轴对称     │  f 关于 x           │\n│  曲面积分    │  关于 xOy 面对称   │  f 关于 z           │\n└───────────────────────────────────────────────────────┘\n<\/code><\/pre>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>统一规律<\/strong>：区域关于某个轴/面对称 → 函数关于<strong>垂直于该轴/面的变量<\/strong>是奇是偶<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-parity-full-h9\">快速判断技巧<\/h2>\n<ol>\n<li><strong>画草图<\/strong>：先看积分区域是否对称<\/li>\n<li><strong>找变量<\/strong>：确定区域关于哪个轴/面对称<\/li>\n<li><strong>验函数<\/strong>：把对称变量的相反数代入函数，看是否变号<\/li>\n<li><strong>下结论<\/strong>：奇函数→0，偶函数→2倍<\/li>\n<\/ol>\n<hr />\n", "summary": "<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p>本文简化规则以相关积分存在为前提。反常积分须先检查每个瑕点和无穷端点的收敛性，不能用对称截断代替通常积分。例如 <span class=\"math-inline\">\\(\\int_{-1}^{1}dx/x\\)<\/span> 发散，尽管柯西主值为零。详见：<a href=\"#topic-improper\">反常积分的拆分与收敛判断<\/a>。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-parity-full-h1\">核心思想<\/h2>\n<blockquote>\n<p><strong>奇函数 × 对称区域 = 0<\/strong>\n<strong>偶函数 × 对称区域 = 2倍半区域<\/strong><\/p>\n<\/blockquote>\n<p>关键是搞清楚：<strong>谁关于谁对称？函数关于哪个变量是奇/偶？<\/strong><\/p>\n<hr />\n<h2 id=\"topic-parity-full-h2\">一、定积分（第6章基础）<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">\\(f(x)\\)<\/span> 是<strong>奇函数<\/strong>，<span class=\"math-inline\">\\([-a,a]\\)<\/span> 关于原点对称<\/td>\n<td><span class=\"math-inline\">\\(\\int_{-a}^{a} f(x)dx = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">\\(f(x)\\)<\/span> 是<strong>偶函数<\/strong>，<span class=\"math-inline\">\\([-a,a]\\)<\/span> 关于原点对称<\/td>\n<td><span class=\"math-inline\">\\(\\int_{-a}^{a} f(x)dx = 2\\int_{0}^{a} f(x)dx\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p><strong>判断奇偶<\/strong>：<span class=\"math-inline\">\\(f(-x) = -f(x)\\)<\/span> → 奇；<span class=\"math-inline\">\\(f(-x) = f(x)\\)<\/span> → 偶<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-parity-full-h3\">二、二重积分（第8章）<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>区域 <span class=\"math-inline\">\\(D\\)<\/span> 的对称性<\/th>\n<th>函数 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 的奇偶性<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(y\\)<\/span> 轴<\/strong> 对称（即 <span class=\"math-inline\">\\((x,y)\\)<\/span> 和 <span class=\"math-inline\">\\((-x,y)\\)<\/span> 都在 <span class=\"math-inline\">\\(D\\)<\/span>）<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>奇函数<\/strong>（<span class=\"math-inline\">\\(f(-x,y)=-f(x,y)\\)<\/span>）<\/td>\n<td><span class=\"math-inline\">\\(\\iint_D f d\\sigma = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(y\\)<\/span> 轴<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>偶函数<\/strong>（<span class=\"math-inline\">\\(f(-x,y)=f(x,y)\\)<\/span>）<\/td>\n<td><span class=\"math-inline\">\\(\\iint_D f d\\sigma = 2\\iint_{D_右} f d\\sigma\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(x\\)<\/span> 轴<\/strong> 对称（即 <span class=\"math-inline\">\\((x,y)\\)<\/span> 和 <span class=\"math-inline\">\\((x,-y)\\)<\/span> 都在 <span class=\"math-inline\">\\(D\\)<\/span>）<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>奇函数<\/strong>（<span class=\"math-inline\">\\(f(x,-y)=-f(x,y)\\)<\/span>）<\/td>\n<td><span class=\"math-inline\">\\(\\iint_D f d\\sigma = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(x\\)<\/span> 轴<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>偶函数<\/strong>（<span class=\"math-inline\">\\(f(x,-y)=f(x,y)\\)<\/span>）<\/td>\n<td><span class=\"math-inline\">\\(\\iint_D f d\\sigma = 2\\iint_{D_上} f d\\sigma\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>记忆口诀<\/strong>：区域关于谁对称，就看函数<strong>关于另一个变量是奇是偶<\/strong><\/p>\n<ul>\n<li>区域关于 <span class=\"math-inline\">\\(y\\)<\/span> 轴对称 → 看 <span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 的奇偶性<\/li>\n<li>区域关于 <span class=\"math-inline\">\\(x\\)<\/span> 轴对称 → 看 <span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 的奇偶性<\/li>\n<\/ul>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-parity-full-h4\">三、三重积分（第8章）<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>区域 <span class=\"math-inline\">\\(\\Omega\\)<\/span> 的对称性<\/th>\n<th>函数 <span class=\"math-inline\">\\(f(x,y,z)\\)<\/span> 的奇偶性<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(xOy\\)<\/span> 面<\/strong> 对称（<span class=\"math-inline\">\\(z\\)<\/span> 变号）<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(z\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f dV = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(xOy\\)<\/span> 面<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(z\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f dV = 2\\iiint_{\\Omega_上} f dV\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(yOz\\)<\/span> 面<\/strong> 对称（<span class=\"math-inline\">\\(x\\)<\/span> 变号）<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f dV = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(zOx\\)<\/span> 面<\/strong> 对称（<span class=\"math-inline\">\\(y\\)<\/span> 变号）<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iiint_\\Omega f dV = 0\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>记忆口诀<\/strong>：区域关于哪个坐标面对称，就看函数关于<strong>垂直于该面的那个变量<\/strong>（第三个变量）的奇偶性<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-parity-full-h5\">四、第一型曲线积分（第9章）<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>曲线 <span class=\"math-inline\">\\(L\\)<\/span> 的对称性<\/th>\n<th>函数 <span class=\"math-inline\">\\(f(x,y)\\)<\/span> 的奇偶性<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(x\\)<\/span> 轴<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f ds = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(x\\)<\/span> 轴<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(y\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f ds = 2\\int_{L_上} f ds\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(y\\)<\/span> 轴<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f ds = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(y\\)<\/span> 轴<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(x\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\int_L f ds = 2\\int_{L_右} f ds\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-parity-full-h6\">五、第一型曲面积分（第9章）<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>曲面 <span class=\"math-inline\">\\(\\Sigma\\)<\/span> 的对称性<\/th>\n<th>函数 <span class=\"math-inline\">\\(f(x,y,z)\\)<\/span> 的奇偶性<\/th>\n<th>结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(xOy\\)<\/span> 面<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(z\\)<\/span> 是<strong>奇函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_\\Sigma f dS = 0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>关于 <strong><span class=\"math-inline\">\\(xOy\\)<\/span> 面<\/strong> 对称<\/td>\n<td><span class=\"math-inline\">\\(f\\)<\/span> 关于 <span class=\"math-inline\">\\(z\\)<\/span> 是<strong>偶函数<\/strong><\/td>\n<td><span class=\"math-inline\">\\(\\iint_\\Sigma f dS = 2\\iint_{\\Sigma_上} f dS\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-parity-full-h7\">六、第二型曲线/曲面积分（第9章）<\/h2>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p><strong>第二型积分一般不能直接用奇偶性简化<\/strong>，因为第二型积分与方向有关，奇偶性结论不成立或需要额外考虑方向<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-parity-full-h8\">总结表：一张图记住所有奇偶性<\/h2>\n<pre><code class=\"language-text\">┌───────────────────────────────────────────────────────┐\n│  积分类型    │  区域对称性        │  看函数的奇偶性      │\n├───────────────────────────────────────────────────────┤\n│  定积分      │  关于原点对称      │  f(x) 关于 x        │\n│  二重积分    │  关于 y 轴对称     │  f 关于 x           │\n│  二重积分    │  关于 x 轴对称     │  f 关于 y           │\n│  三重积分    │  关于 xOy 面对称   │  f 关于 z           │\n│  三重积分    │  关于 yOz 面对称   │  f 关于 x           │\n│  三重积分    │  关于 zOx 面对称   │  f 关于 y           │\n│  曲线积分    │  关于 x 轴对称     │  f 关于 y           │\n│  曲线积分    │  关于 y 轴对称     │  f 关于 x           │\n│  曲面积分    │  关于 xOy 面对称   │  f 关于 z           │\n└───────────────────────────────────────────────────────┘\n<\/code><\/pre>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>统一规律<\/strong>：区域关于某个轴/面对称 → 函数关于<strong>垂直于该轴/面的变量<\/strong>是奇是偶<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-parity-full-h9\">快速判断技巧<\/h2>\n<ol>\n<li><strong>画草图<\/strong>：先看积分区域是否对称<\/li>\n<li><strong>找变量<\/strong>：确定区域关于哪个轴/面对称<\/li>\n<li><strong>验函数<\/strong>：把对称变量的相反数代入函数，看是否变号<\/li>\n<li><strong>下结论<\/strong>：奇函数→0，偶函数→2倍<\/li>\n<\/ol>\n<hr />\n", "search": "\n  [!WARNING]\n  本文简化规则以相关积分存在为前提。反常积分须先检查每个瑕点和无穷端点的收敛性，不能用对称截断代替通常积分。例如   int_ -1 ^ 1 dx/x  发散，尽管柯西主值为零。详见：[反常积分的拆分与收敛判断](反常积分的拆分与收敛判断.md)。\n\n---\n\n   核心思想\n\n    奇函数 × 对称区域 = 0  \n    偶函数 × 对称区域 = 2倍半区域  \n\n关键是搞清楚：  谁关于谁对称？函数关于哪个变量是奇/偶？  \n\n---\n\n   一、定积分（第6章基础）\n\n| 条件 | 结论 |\n| ------ | ------ |\n|  f(x)  是  奇函数  ， [-a,a]  关于原点对称 |   int_ -a ^ a  f(x)dx = 0  |\n|  f(x)  是  偶函数  ， [-a,a]  关于原点对称 |   int_ -a ^ a  f(x)dx = 2 int_ 0 ^ a  f(x)dx  |\n\n  [!NOTE]\n    判断奇偶  ： f(-x) = -f(x)  → 奇； f(-x) = f(x)  → 偶\n\n---\n\n   二、二重积分（第8章）\n\n| 区域  D  的对称性 | 函数  f(x,y)  的奇偶性 | 结论 |\n| ------------------ | ---------------------- | ------ |\n| 关于    y  轴   对称（即  (x,y)  和  (-x,y)  都在  D ） |  f  关于  x  是  奇函数  （ f(-x,y)=-f(x,y) ） |   iint_D f d sigma = 0  |\n| 关于    y  轴   对称 |  f  关于  x  是  偶函数  （ f(-x,y)=f(x,y) ） |   iint_D f d sigma = 2 iint_ D_右  f d sigma  |\n| 关于    x  轴   对称（即  (x,y)  和  (x,-y)  都在  D ） |  f  关于  y  是  奇函数  （ f(x,-y)=-f(x,y) ） |   iint_D f d sigma = 0  |\n| 关于    x  轴   对称 |  f  关于  y  是  偶函数  （ f(x,-y)=f(x,y) ） |   iint_D f d sigma = 2 iint_ D_上  f d sigma  |\n\n  [!TIP]\n    记忆口诀  ：区域关于谁对称，就看函数  关于另一个变量是奇是偶  \n \n  - 区域关于  y  轴对称 → 看  f  关于  x  的奇偶性\n  - 区域关于  x  轴对称 → 看  f  关于  y  的奇偶性\n\n---\n\n   三、三重积分（第8章）\n\n| 区域   Omega  的对称性 | 函数  f(x,y,z)  的奇偶性 | 结论 |\n| ---------------------- | ------------------------ | ------ |\n| 关于    xOy  面   对称（ z  变号） |  f  关于  z  是  奇函数   |   iiint_ Omega f dV = 0  |\n| 关于    xOy  面   对称 |  f  关于  z  是  偶函数   |   iiint_ Omega f dV = 2 iiint_  Omega_上  f dV  |\n| 关于    yOz  面   对称（ x  变号） |  f  关于  x  是  奇函数   |   iiint_ Omega f dV = 0  |\n| 关于    zOx  面   对称（ y  变号） |  f  关于  y  是  奇函数   |   iiint_ Omega f dV = 0  |\n\n  [!TIP]\n    记忆口诀  ：区域关于哪个坐标面对称，就看函数关于  垂直于该面的那个变量  （第三个变量）的奇偶性\n\n---\n\n   四、第一型曲线积分（第9章）\n\n| 曲线  L  的对称性 | 函数  f(x,y)  的奇偶性 | 结论 |\n| ------------------ | ---------------------- | ------ |\n| 关于    x  轴   对称 |  f  关于  y  是  奇函数   |   int_L f ds = 0  |\n| 关于    x  轴   对称 |  f  关于  y  是  偶函数   |   int_L f ds = 2 int_ L_上  f ds  |\n| 关于    y  轴   对称 |  f  关于  x  是  奇函数   |   int_L f ds = 0  |\n| 关于    y  轴   对称 |  f  关于  x  是  偶函数   |   int_L f ds = 2 int_ L_右  f ds  |\n\n---\n\n   五、第一型曲面积分（第9章）\n\n| 曲面   Sigma  的对称性 | 函数  f(x,y,z)  的奇偶性 | 结论 |\n| ---------------------- | ------------------------ | ------ |\n| 关于    xOy  面   对称 |  f  关于  z  是  奇函数   |   iint_ Sigma f dS = 0  |\n| 关于    xOy  面   对称 |  f  关于  z  是  偶函数   |   iint_ Sigma f dS = 2 iint_  Sigma_上  f dS  |\n\n---\n\n   六、第二型曲线/曲面积分（第9章）\n\n  [!WARNING]\n    第二型积分一般不能直接用奇偶性简化  ，因为第二型积分与方向有关，奇偶性结论不成立或需要额外考虑方向\n\n---\n\n   总结表：一张图记住所有奇偶性\n\n```text\n┌───────────────────────────────────────────────────────┐\n│  积分类型    │  区域对称性        │  看函数的奇偶性      │\n├───────────────────────────────────────────────────────┤\n│  定积分      │  关于原点对称      │  f(x) 关于 x        │\n│  二重积分    │  关于 y 轴对称     │  f 关于 x           │\n│  二重积分    │  关于 x 轴对称     │  f 关于 y           │\n│  三重积分    │  关于 xOy 面对称   │  f 关于 z           │\n│  三重积分    │  关于 yOz 面对称   │  f 关于 x           │\n│  三重积分    │  关于 zOx 面对称   │  f 关于 y           │\n│  曲线积分    │  关于 x 轴对称     │  f 关于 y           │\n│  曲线积分    │  关于 y 轴对称     │  f 关于 x           │\n│  曲面积分    │  关于 xOy 面对称   │  f 关于 z           │\n└───────────────────────────────────────────────────────┘\n```\n\n  [!TIP]\n    统一规律  ：区域关于某个轴/面对称 → 函数关于  垂直于该轴/面的变量  是奇是偶\n\n---\n\n   快速判断技巧\n\n1.   画草图  ：先看积分区域是否对称\n2.   找变量  ：确定区域关于哪个轴/面对称\n3.   验函数  ：把对称变量的相反数代入函数，看是否变号\n4.   下结论  ：奇函数→0，偶函数→2倍\n\n---\n"}, {"id": "topic-elements", "number": "T11", "kind": "topic", "title": "积分微元辨析", "description": "在长度、弧长、面积与体积之间选对微元。", "tags": ["ds 与 dS", "通量"], "source": "../../%E6%95%B0%E5%AD%A6/%E9%AB%98%E7%AD%89%E6%95%B0%E5%AD%A6/%E8%A1%A5%E5%85%85%E7%90%86%E8%A7%A3/%E7%A7%AF%E5%88%86%E5%BE%AE%E5%85%83%E8%BE%A8%E6%9E%90.md", "full": "<hr />\n<h2 id=\"topic-elements-full-h1\">一、总览表<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">符号<\/th>\n<th style=\"text-align:left\">名称<\/th>\n<th style=\"text-align:left\">几何意义<\/th>\n<th style=\"text-align:left\">用在什么积分<\/th>\n<th style=\"text-align:left\">典型场景<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dx\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>长度<\/strong>微元<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(x\\)<\/span> 轴上的一小段<\/td>\n<td style=\"text-align:left\"><strong>定积分<\/strong> <span class=\"math-inline\">\\(\\int_a^b\\)<\/span><\/td>\n<td style=\"text-align:left\">细杆质量、变力做功<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(ds\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>弧长<\/strong>微元<\/td>\n<td style=\"text-align:left\">曲线上的一小段弧<\/td>\n<td style=\"text-align:left\"><strong>第一类曲线积分<\/strong> <span class=\"math-inline\">\\(\\int_L\\)<\/span><\/td>\n<td style=\"text-align:left\">曲线形构件质量、曲线长度<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dxdy\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>投影面积<\/strong>微元<\/td>\n<td style=\"text-align:left\">平面上的一小块<\/td>\n<td style=\"text-align:left\"><strong>二重积分<\/strong> <span class=\"math-inline\">\\(\\iint_D\\)<\/span><\/td>\n<td style=\"text-align:left\">平面薄板质量、平面区域面积<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dS\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>曲面面积<\/strong>微元<\/td>\n<td style=\"text-align:left\">曲面上的一小块<\/td>\n<td style=\"text-align:left\"><strong>第一类曲面积分<\/strong> <span class=\"math-inline\">\\(\\iint_\\Sigma\\)<\/span><\/td>\n<td style=\"text-align:left\">曲面壳质量、曲面面积、转动惯量<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dydz, dzdx, dxdy\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>坐标面投影<\/strong>微元<\/td>\n<td style=\"text-align:left\">曲面块在坐标面上的投影<\/td>\n<td style=\"text-align:left\"><strong>第二类曲面积分<\/strong> <span class=\"math-inline\">\\(\\iint_\\Sigma\\)<\/span><\/td>\n<td style=\"text-align:left\">通量、流量、磁场/电场<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dV\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>体积<\/strong>微元<\/td>\n<td style=\"text-align:left\">空间中的一小块<\/td>\n<td style=\"text-align:left\"><strong>三重积分<\/strong> <span class=\"math-inline\">\\(\\iiint_\\Omega\\)<\/span><\/td>\n<td style=\"text-align:left\">实心球质量、体积、重心<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-elements-full-h2\">二、详细辨析<\/h2>\n<h3 id=\"topic-elements-full-h3\">1. <span class=\"math-inline\">\\(dx\\)<\/span> —— 定积分<\/h3>\n<p><strong>什么时候用？<\/strong> 积分区域是<strong>直线段<\/strong>（区间 <span class=\"math-inline\">\\([a,b]\\)<\/span>）<\/p>\n<p><strong>物理意义：<\/strong> 一维物体的长度微元<\/p>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>细直杆（密度不均匀）的质量：<span class=\"math-inline\">\\(m=\\int_a^b \\rho(x)\\,dx\\)<\/span><\/li>\n<li>变力沿直线做功：<span class=\"math-inline\">\\(W=\\int_a^b F(x)\\,dx\\)<\/span><\/li>\n<\/ul>\n<p><strong>特点：<\/strong> 只有一个积分变量，没有方向<\/p>\n<hr />\n<h3 id=\"topic-elements-full-h4\">2. <span class=\"math-inline\">\\(ds\\)<\/span> —— 第一类曲线积分（对弧长）<\/h3>\n<p><strong>什么时候用？<\/strong> 积分区域是<strong>曲线<\/strong>（直线、圆弧、摆线等）<\/p>\n<p><strong>物理意义：<\/strong> 曲线上一小段<strong>弧长<\/strong><\/p>\n<p><strong>计算公式：<\/strong>\n<span class=\"math-display\">\\[ds=\\sqrt{x&#x27;^2(t)+y&#x27;^2(t)}\\,dt\\quad\\text{（参数式）}\\]<\/span>\n<span class=\"math-display\">\\[ds=\\sqrt{1+y&#x27;^2}\\,dx\\quad\\text{（显函数）}\\]<\/span><\/p>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>曲线形构件（铁丝）的质量：<span class=\"math-inline\">\\(\\int_L \\rho\\,ds\\)<\/span><\/li>\n<li>曲线长度：<span class=\"math-inline\">\\(\\int_L ds\\)<\/span><\/li>\n<li>摆线转动惯量（试卷第六题如果是曲线）：<span class=\"math-inline\">\\(\\int_L y^2\\,ds\\)<\/span><\/li>\n<\/ul>\n<p><strong>关键记忆：<\/strong> 只要提到 <strong>&quot;曲线&quot;<\/strong>、 <strong>&quot;弧长&quot;<\/strong>、 <strong>&quot;铁丝&quot;<\/strong>，就用 <span class=\"math-inline\">\\(ds\\)<\/span><\/p>\n<hr />\n<h3 id=\"topic-elements-full-h5\">3. <span class=\"math-inline\">\\(dxdy\\)<\/span> —— 二重积分<\/h3>\n<p><strong>什么时候用？<\/strong> 积分区域是<strong>平面区域<\/strong>（圆、三角形、矩形等）<\/p>\n<p><strong>物理意义：<\/strong> 平面上的一小块<strong>面积<\/strong><\/p>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>平面薄板的质量：<span class=\"math-inline\">\\(\\iint_D \\rho(x,y)\\,dxdy\\)<\/span><\/li>\n<li>平面区域面积：<span class=\"math-inline\">\\(\\iint_D dxdy\\)<\/span><\/li>\n<li>试卷第一题第3小题：<span class=\"math-inline\">\\(\\iint_D e^{-y^2}dxdy\\)<\/span>（三角形区域）<\/li>\n<\/ul>\n<p><strong>注意：<\/strong> 二重积分中的 <span class=\"math-inline\">\\(dxdy\\)<\/span> 是<strong>真正的面积微元<\/strong>，不是投影<\/p>\n<hr />\n<h3 id=\"topic-elements-full-h6\">4. <span class=\"math-inline\">\\(dS\\)<\/span> —— 第一类曲面积分（对面积）<\/h3>\n<p><strong>什么时候用？<\/strong> 积分区域是<strong>曲面<\/strong>（球面、抛物面、锥面等），且与<strong>方向无关<\/strong><\/p>\n<p><strong>物理意义：<\/strong> 曲面上的一小块<strong>真实面积<\/strong><\/p>\n<p><strong>计算公式：<\/strong>\n<span class=\"math-display\">\\[dS=\\sqrt{1+z_x^2+z_y^2}\\,dxdy\\quad\\text{（曲面写成 }z=z(x,y)\\text{ 时）}\\]<\/span><\/p>\n<blockquote>\n<p>第一类曲面积分的面积元 <span class=\"math-inline\">\\(dS\\)<\/span> 非负，与曲面选上侧或下侧无关。<\/p>\n<\/blockquote>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>曲面壳（蛋壳）的质量：<span class=\"math-inline\">\\(\\iint_\\Sigma \\rho\\,dS\\)<\/span><\/li>\n<li>曲面面积：<span class=\"math-inline\">\\(\\iint_\\Sigma dS\\)<\/span><\/li>\n<li>试卷第六题：球面壳对 <span class=\"math-inline\">\\(z\\)<\/span> 轴的转动惯量 <span class=\"math-inline\">\\(\\iint_\\Sigma (x^2+y^2)\\,dS\\)<\/span><\/li>\n<\/ul>\n<p><strong>与 <span class=\"math-inline\">\\(dxdy\\)<\/span> 的区别：<\/strong><\/p>\n<ul>\n<li><span class=\"math-inline\">\\(dxdy\\)<\/span> 是<strong>平面上<\/strong>的面积（比如桌面）<\/li>\n<li><span class=\"math-inline\">\\(dS\\)<\/span> 是<strong>弯曲曲面<\/strong>上的面积（比如蛋壳表面）<\/li>\n<\/ul>\n<p><strong>关系：<\/strong> 对球面 <span class=\"math-inline\">\\(x^2+y^2+z^2=a^2\\)<\/span>（<span class=\"math-inline\">\\(a&gt;0\\)<\/span>），分别将上、下半球写为 <span class=\"math-inline\">\\(z=\\pm\\sqrt{a^2-x^2-y^2}\\)<\/span>，在 <span class=\"math-inline\">\\(z\\neq0\\)<\/span> 处有：<\/p>\n<p><span class=\"math-display\">\\[dS = \\frac{a}{|z|}\\,dxdy\\]<\/span><\/p>\n<p>上半球可写成 <span class=\"math-inline\">\\(a/z\\)<\/span>，下半球须写成 <span class=\"math-inline\">\\(a/(-z)\\)<\/span>。赤道处该投影公式的系数无界，可换投影面，或在积分时按相应的反常积分处理。曲面写成 <span class=\"math-inline\">\\(z=z(x,y)\\)<\/span> 时，<span class=\"math-inline\">\\(dS\\geq dxdy\\)<\/span>，因为曲面有&quot;坡度&quot;。<\/p>\n<hr />\n<h3 id=\"topic-elements-full-h7\">5. <span class=\"math-inline\">\\(dydz, dzdx, dxdy\\)<\/span> —— 第二类曲面积分（对坐标）<\/h3>\n<p><strong>什么时候用？<\/strong> 计算<strong>通量<\/strong>（流体穿过曲面、磁通量、电通量），与<strong>方向有关<\/strong><\/p>\n<p><strong>物理意义：<\/strong> 曲面块在坐标面上的<strong>投影面积<\/strong>（有正负！）<\/p>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>流体穿过曲面的流量：<span class=\"math-inline\">\\(\\iint_\\Sigma P\\,dydz + Q\\,dzdx + R\\,dxdy\\)<\/span><\/li>\n<li>试卷第四题：<span class=\"math-inline\">\\(\\iint_\\Sigma (2x+z)\\,dydz + z\\,dxdy\\)<\/span><\/li>\n<\/ul>\n<p><strong>特点：<\/strong><\/p>\n<ul>\n<li><strong>有方向<\/strong>！上侧为正，下侧为负；前侧为正，后侧为负；右侧为正，左侧为负<\/li>\n<li>三个分量分别对应三个坐标面的投影<\/li>\n<\/ul>\n<p><strong>与 <span class=\"math-inline\">\\(dS\\)<\/span> 的关系：<\/strong>\n<span class=\"math-display\">\\[dydz = \\cos\\alpha\\,dS,\\quad dzdx = \\cos\\beta\\,dS,\\quad dxdy = \\cos\\gamma\\,dS\\]<\/span>\n其中 <span class=\"math-inline\">\\((\\cos\\alpha,\\cos\\beta,\\cos\\gamma)\\)<\/span> 是单位法向量<\/p>\n<hr />\n<h3 id=\"topic-elements-full-h8\">6. <span class=\"math-inline\">\\(dV\\)<\/span> —— 三重积分<\/h3>\n<p><strong>什么时候用？<\/strong> 积分区域是<strong>空间立体<\/strong>（球体、柱体、锥体等）<\/p>\n<p><strong>物理意义：<\/strong> 空间中的一小块<strong>体积<\/strong><\/p>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>实心球的质量：<span class=\"math-inline\">\\(\\iiint_\\Omega \\rho\\,dV\\)<\/span><\/li>\n<li>立体体积：<span class=\"math-inline\">\\(\\iiint_\\Omega dV\\)<\/span><\/li>\n<li>实心球的转动惯量：<span class=\"math-inline\">\\(\\iiint_\\Omega (x^2+y^2)\\,dV\\)<\/span><\/li>\n<\/ul>\n<p><strong>与 <span class=\"math-inline\">\\(dS\\)<\/span> 的区别：<\/strong><\/p>\n<ul>\n<li><span class=\"math-inline\">\\(dV\\)<\/span> 有&quot;厚度&quot;，是三维的<\/li>\n<li><span class=\"math-inline\">\\(dS\\)<\/span> 没有厚度，是二维的（壳）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"topic-elements-full-h9\">三、对比记忆图<\/h2>\n<pre><code class=\"language-text\">维度递增：\n\n一维 ──────────────────────────────────────\n  │   直线段 [a,b]        → 用 dx    （定积分）\n  │   曲线 L              → 用 ds    （第一类曲线积分）\n  │\n二维 ──────────────────────────────────────\n  │   平面区域 D          → 用 dxdy  （二重积分）\n  │   曲面 Σ（无方向）    → 用 dS    （第一类曲面积分）\n  │   曲面 Σ（有方向）    → 用 dydz/dzdx/dxdy （第二类曲面积分）\n  │\n三维 ──────────────────────────────────────\n      空间立体 Ω          → 用 dV    （三重积分）\n<\/code><\/pre>\n<hr />\n<h2 id=\"topic-elements-full-h10\">四、快速判断口诀<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">题目关键词<\/th>\n<th style=\"text-align:left\">用什么微元<\/th>\n<th style=\"text-align:left\">积分类型<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">&quot;曲线&quot;、&quot;弧长&quot;、&quot;铁丝&quot;<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(ds\\)<\/span><\/td>\n<td style=\"text-align:left\">第一类曲线积分<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">&quot;平面区域&quot;、&quot;薄板&quot;<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dxdy\\)<\/span><\/td>\n<td style=\"text-align:left\">二重积分<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">&quot;曲面壳&quot;、&quot;表面&quot;、&quot;蛋壳&quot;<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dS\\)<\/span><\/td>\n<td style=\"text-align:left\">第一类曲面积分<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">&quot;通量&quot;、&quot;流量&quot;、&quot;穿过&quot;<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dydz,dzdx,dxdy\\)<\/span><\/td>\n<td style=\"text-align:left\">第二类曲面积分<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">&quot;实心球&quot;、&quot;立体&quot;、&quot;体积&quot;<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dV\\)<\/span><\/td>\n<td style=\"text-align:left\">三重积分<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-elements-full-h11\">五、一句话总结<\/h2>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>&quot;曲线&quot;用 <span class=\"math-inline\">\\(ds\\)<\/span>，&quot;平面&quot;用 <span class=\"math-inline\">\\(dxdy\\)<\/span>，&quot;曲面壳&quot;用 <span class=\"math-inline\">\\(dS\\)<\/span>，&quot;实心体&quot;用 <span class=\"math-inline\">\\(dV\\)<\/span>，&quot;通量&quot;用 <span class=\"math-inline\">\\(dydz\\)<\/span> 等投影<\/strong><\/p>\n<\/blockquote>\n<hr />\n", "summary": "<hr />\n<h2 id=\"topic-elements-full-h1\">一、总览表<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">符号<\/th>\n<th style=\"text-align:left\">名称<\/th>\n<th style=\"text-align:left\">几何意义<\/th>\n<th style=\"text-align:left\">用在什么积分<\/th>\n<th style=\"text-align:left\">典型场景<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dx\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>长度<\/strong>微元<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(x\\)<\/span> 轴上的一小段<\/td>\n<td style=\"text-align:left\"><strong>定积分<\/strong> <span class=\"math-inline\">\\(\\int_a^b\\)<\/span><\/td>\n<td style=\"text-align:left\">细杆质量、变力做功<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(ds\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>弧长<\/strong>微元<\/td>\n<td style=\"text-align:left\">曲线上的一小段弧<\/td>\n<td style=\"text-align:left\"><strong>第一类曲线积分<\/strong> <span class=\"math-inline\">\\(\\int_L\\)<\/span><\/td>\n<td style=\"text-align:left\">曲线形构件质量、曲线长度<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dxdy\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>投影面积<\/strong>微元<\/td>\n<td style=\"text-align:left\">平面上的一小块<\/td>\n<td style=\"text-align:left\"><strong>二重积分<\/strong> <span class=\"math-inline\">\\(\\iint_D\\)<\/span><\/td>\n<td style=\"text-align:left\">平面薄板质量、平面区域面积<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dS\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>曲面面积<\/strong>微元<\/td>\n<td style=\"text-align:left\">曲面上的一小块<\/td>\n<td style=\"text-align:left\"><strong>第一类曲面积分<\/strong> <span class=\"math-inline\">\\(\\iint_\\Sigma\\)<\/span><\/td>\n<td style=\"text-align:left\">曲面壳质量、曲面面积、转动惯量<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dydz, dzdx, dxdy\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>坐标面投影<\/strong>微元<\/td>\n<td style=\"text-align:left\">曲面块在坐标面上的投影<\/td>\n<td style=\"text-align:left\"><strong>第二类曲面积分<\/strong> <span class=\"math-inline\">\\(\\iint_\\Sigma\\)<\/span><\/td>\n<td style=\"text-align:left\">通量、流量、磁场/电场<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dV\\)<\/span><\/td>\n<td style=\"text-align:left\"><strong>体积<\/strong>微元<\/td>\n<td style=\"text-align:left\">空间中的一小块<\/td>\n<td style=\"text-align:left\"><strong>三重积分<\/strong> <span class=\"math-inline\">\\(\\iiint_\\Omega\\)<\/span><\/td>\n<td style=\"text-align:left\">实心球质量、体积、重心<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-elements-full-h2\">二、详细辨析<\/h2>\n<h3 id=\"topic-elements-full-h3\">1. <span class=\"math-inline\">\\(dx\\)<\/span> —— 定积分<\/h3>\n<p><strong>什么时候用？<\/strong> 积分区域是<strong>直线段<\/strong>（区间 <span class=\"math-inline\">\\([a,b]\\)<\/span>）<\/p>\n<p><strong>物理意义：<\/strong> 一维物体的长度微元<\/p>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>细直杆（密度不均匀）的质量：<span class=\"math-inline\">\\(m=\\int_a^b \\rho(x)\\,dx\\)<\/span><\/li>\n<li>变力沿直线做功：<span class=\"math-inline\">\\(W=\\int_a^b F(x)\\,dx\\)<\/span><\/li>\n<\/ul>\n<p><strong>特点：<\/strong> 只有一个积分变量，没有方向<\/p>\n<hr />\n<h3 id=\"topic-elements-full-h4\">2. <span class=\"math-inline\">\\(ds\\)<\/span> —— 第一类曲线积分（对弧长）<\/h3>\n<p><strong>什么时候用？<\/strong> 积分区域是<strong>曲线<\/strong>（直线、圆弧、摆线等）<\/p>\n<p><strong>物理意义：<\/strong> 曲线上一小段<strong>弧长<\/strong><\/p>\n<p><strong>计算公式：<\/strong>\n<span class=\"math-display\">\\[ds=\\sqrt{x&#x27;^2(t)+y&#x27;^2(t)}\\,dt\\quad\\text{（参数式）}\\]<\/span>\n<span class=\"math-display\">\\[ds=\\sqrt{1+y&#x27;^2}\\,dx\\quad\\text{（显函数）}\\]<\/span><\/p>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>曲线形构件（铁丝）的质量：<span class=\"math-inline\">\\(\\int_L \\rho\\,ds\\)<\/span><\/li>\n<li>曲线长度：<span class=\"math-inline\">\\(\\int_L ds\\)<\/span><\/li>\n<li>摆线转动惯量（试卷第六题如果是曲线）：<span class=\"math-inline\">\\(\\int_L y^2\\,ds\\)<\/span><\/li>\n<\/ul>\n<p><strong>关键记忆：<\/strong> 只要提到 <strong>&quot;曲线&quot;<\/strong>、 <strong>&quot;弧长&quot;<\/strong>、 <strong>&quot;铁丝&quot;<\/strong>，就用 <span class=\"math-inline\">\\(ds\\)<\/span><\/p>\n<hr />\n<h3 id=\"topic-elements-full-h5\">3. <span class=\"math-inline\">\\(dxdy\\)<\/span> —— 二重积分<\/h3>\n<p><strong>什么时候用？<\/strong> 积分区域是<strong>平面区域<\/strong>（圆、三角形、矩形等）<\/p>\n<p><strong>物理意义：<\/strong> 平面上的一小块<strong>面积<\/strong><\/p>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>平面薄板的质量：<span class=\"math-inline\">\\(\\iint_D \\rho(x,y)\\,dxdy\\)<\/span><\/li>\n<li>平面区域面积：<span class=\"math-inline\">\\(\\iint_D dxdy\\)<\/span><\/li>\n<li>试卷第一题第3小题：<span class=\"math-inline\">\\(\\iint_D e^{-y^2}dxdy\\)<\/span>（三角形区域）<\/li>\n<\/ul>\n<p><strong>注意：<\/strong> 二重积分中的 <span class=\"math-inline\">\\(dxdy\\)<\/span> 是<strong>真正的面积微元<\/strong>，不是投影<\/p>\n<hr />\n<h3 id=\"topic-elements-full-h6\">4. <span class=\"math-inline\">\\(dS\\)<\/span> —— 第一类曲面积分（对面积）<\/h3>\n<p><strong>什么时候用？<\/strong> 积分区域是<strong>曲面<\/strong>（球面、抛物面、锥面等），且与<strong>方向无关<\/strong><\/p>\n<p><strong>物理意义：<\/strong> 曲面上的一小块<strong>真实面积<\/strong><\/p>\n<p><strong>计算公式：<\/strong>\n<span class=\"math-display\">\\[dS=\\sqrt{1+z_x^2+z_y^2}\\,dxdy\\quad\\text{（曲面写成 }z=z(x,y)\\text{ 时）}\\]<\/span><\/p>\n<blockquote>\n<p>第一类曲面积分的面积元 <span class=\"math-inline\">\\(dS\\)<\/span> 非负，与曲面选上侧或下侧无关。<\/p>\n<\/blockquote>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>曲面壳（蛋壳）的质量：<span class=\"math-inline\">\\(\\iint_\\Sigma \\rho\\,dS\\)<\/span><\/li>\n<li>曲面面积：<span class=\"math-inline\">\\(\\iint_\\Sigma dS\\)<\/span><\/li>\n<li>试卷第六题：球面壳对 <span class=\"math-inline\">\\(z\\)<\/span> 轴的转动惯量 <span class=\"math-inline\">\\(\\iint_\\Sigma (x^2+y^2)\\,dS\\)<\/span><\/li>\n<\/ul>\n<p><strong>与 <span class=\"math-inline\">\\(dxdy\\)<\/span> 的区别：<\/strong><\/p>\n<ul>\n<li><span class=\"math-inline\">\\(dxdy\\)<\/span> 是<strong>平面上<\/strong>的面积（比如桌面）<\/li>\n<li><span class=\"math-inline\">\\(dS\\)<\/span> 是<strong>弯曲曲面<\/strong>上的面积（比如蛋壳表面）<\/li>\n<\/ul>\n<p><strong>关系：<\/strong> 对球面 <span class=\"math-inline\">\\(x^2+y^2+z^2=a^2\\)<\/span>（<span class=\"math-inline\">\\(a&gt;0\\)<\/span>），分别将上、下半球写为 <span class=\"math-inline\">\\(z=\\pm\\sqrt{a^2-x^2-y^2}\\)<\/span>，在 <span class=\"math-inline\">\\(z\\neq0\\)<\/span> 处有：<\/p>\n<p><span class=\"math-display\">\\[dS = \\frac{a}{|z|}\\,dxdy\\]<\/span><\/p>\n<p>上半球可写成 <span class=\"math-inline\">\\(a/z\\)<\/span>，下半球须写成 <span class=\"math-inline\">\\(a/(-z)\\)<\/span>。赤道处该投影公式的系数无界，可换投影面，或在积分时按相应的反常积分处理。曲面写成 <span class=\"math-inline\">\\(z=z(x,y)\\)<\/span> 时，<span class=\"math-inline\">\\(dS\\geq dxdy\\)<\/span>，因为曲面有&quot;坡度&quot;。<\/p>\n<hr />\n<h3 id=\"topic-elements-full-h7\">5. <span class=\"math-inline\">\\(dydz, dzdx, dxdy\\)<\/span> —— 第二类曲面积分（对坐标）<\/h3>\n<p><strong>什么时候用？<\/strong> 计算<strong>通量<\/strong>（流体穿过曲面、磁通量、电通量），与<strong>方向有关<\/strong><\/p>\n<p><strong>物理意义：<\/strong> 曲面块在坐标面上的<strong>投影面积<\/strong>（有正负！）<\/p>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>流体穿过曲面的流量：<span class=\"math-inline\">\\(\\iint_\\Sigma P\\,dydz + Q\\,dzdx + R\\,dxdy\\)<\/span><\/li>\n<li>试卷第四题：<span class=\"math-inline\">\\(\\iint_\\Sigma (2x+z)\\,dydz + z\\,dxdy\\)<\/span><\/li>\n<\/ul>\n<p><strong>特点：<\/strong><\/p>\n<ul>\n<li><strong>有方向<\/strong>！上侧为正，下侧为负；前侧为正，后侧为负；右侧为正，左侧为负<\/li>\n<li>三个分量分别对应三个坐标面的投影<\/li>\n<\/ul>\n<p><strong>与 <span class=\"math-inline\">\\(dS\\)<\/span> 的关系：<\/strong>\n<span class=\"math-display\">\\[dydz = \\cos\\alpha\\,dS,\\quad dzdx = \\cos\\beta\\,dS,\\quad dxdy = \\cos\\gamma\\,dS\\]<\/span>\n其中 <span class=\"math-inline\">\\((\\cos\\alpha,\\cos\\beta,\\cos\\gamma)\\)<\/span> 是单位法向量<\/p>\n<hr />\n<h3 id=\"topic-elements-full-h8\">6. <span class=\"math-inline\">\\(dV\\)<\/span> —— 三重积分<\/h3>\n<p><strong>什么时候用？<\/strong> 积分区域是<strong>空间立体<\/strong>（球体、柱体、锥体等）<\/p>\n<p><strong>物理意义：<\/strong> 空间中的一小块<strong>体积<\/strong><\/p>\n<p><strong>例子：<\/strong><\/p>\n<ul>\n<li>实心球的质量：<span class=\"math-inline\">\\(\\iiint_\\Omega \\rho\\,dV\\)<\/span><\/li>\n<li>立体体积：<span class=\"math-inline\">\\(\\iiint_\\Omega dV\\)<\/span><\/li>\n<li>实心球的转动惯量：<span class=\"math-inline\">\\(\\iiint_\\Omega (x^2+y^2)\\,dV\\)<\/span><\/li>\n<\/ul>\n<p><strong>与 <span class=\"math-inline\">\\(dS\\)<\/span> 的区别：<\/strong><\/p>\n<ul>\n<li><span class=\"math-inline\">\\(dV\\)<\/span> 有&quot;厚度&quot;，是三维的<\/li>\n<li><span class=\"math-inline\">\\(dS\\)<\/span> 没有厚度，是二维的（壳）<\/li>\n<\/ul>\n<hr />\n<h2 id=\"topic-elements-full-h9\">三、对比记忆图<\/h2>\n<pre><code class=\"language-text\">维度递增：\n\n一维 ──────────────────────────────────────\n  │   直线段 [a,b]        → 用 dx    （定积分）\n  │   曲线 L              → 用 ds    （第一类曲线积分）\n  │\n二维 ──────────────────────────────────────\n  │   平面区域 D          → 用 dxdy  （二重积分）\n  │   曲面 Σ（无方向）    → 用 dS    （第一类曲面积分）\n  │   曲面 Σ（有方向）    → 用 dydz/dzdx/dxdy （第二类曲面积分）\n  │\n三维 ──────────────────────────────────────\n      空间立体 Ω          → 用 dV    （三重积分）\n<\/code><\/pre>\n<hr />\n<h2 id=\"topic-elements-full-h10\">四、快速判断口诀<\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">题目关键词<\/th>\n<th style=\"text-align:left\">用什么微元<\/th>\n<th style=\"text-align:left\">积分类型<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\">&quot;曲线&quot;、&quot;弧长&quot;、&quot;铁丝&quot;<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(ds\\)<\/span><\/td>\n<td style=\"text-align:left\">第一类曲线积分<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">&quot;平面区域&quot;、&quot;薄板&quot;<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dxdy\\)<\/span><\/td>\n<td style=\"text-align:left\">二重积分<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">&quot;曲面壳&quot;、&quot;表面&quot;、&quot;蛋壳&quot;<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dS\\)<\/span><\/td>\n<td style=\"text-align:left\">第一类曲面积分<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">&quot;通量&quot;、&quot;流量&quot;、&quot;穿过&quot;<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dydz,dzdx,dxdy\\)<\/span><\/td>\n<td style=\"text-align:left\">第二类曲面积分<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\">&quot;实心球&quot;、&quot;立体&quot;、&quot;体积&quot;<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(dV\\)<\/span><\/td>\n<td style=\"text-align:left\">三重积分<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-elements-full-h11\">五、一句话总结<\/h2>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>&quot;曲线&quot;用 <span class=\"math-inline\">\\(ds\\)<\/span>，&quot;平面&quot;用 <span class=\"math-inline\">\\(dxdy\\)<\/span>，&quot;曲面壳&quot;用 <span class=\"math-inline\">\\(dS\\)<\/span>，&quot;实心体&quot;用 <span class=\"math-inline\">\\(dV\\)<\/span>，&quot;通量&quot;用 <span class=\"math-inline\">\\(dydz\\)<\/span> 等投影<\/strong><\/p>\n<\/blockquote>\n<hr />\n", "search": "\n---\n\n   一、总览表\n\n| 符号 | 名称 | 几何意义 | 用在什么积分 | 典型场景 |\n| :--- | :--- | :--- | :--- | :--- |\n|  dx  |   长度  微元 |  x  轴上的一小段 |   定积分     int_a^b  | 细杆质量、变力做功 |\n|  ds  |   弧长  微元 | 曲线上的一小段弧 |   第一类曲线积分     int_L  | 曲线形构件质量、曲线长度 |\n|  dxdy  |   投影面积  微元 | 平面上的一小块 |   二重积分     iint_D  | 平面薄板质量、平面区域面积 |\n|  dS  |   曲面面积  微元 | 曲面上的一小块 |   第一类曲面积分     iint_ Sigma  | 曲面壳质量、曲面面积、转动惯量 |\n|  dydz, dzdx, dxdy  |   坐标面投影  微元 | 曲面块在坐标面上的投影 |   第二类曲面积分     iint_ Sigma  | 通量、流量、磁场/电场 |\n|  dV  |   体积  微元 | 空间中的一小块 |   三重积分     iiint_ Omega  | 实心球质量、体积、重心 |\n\n---\n\n   二、详细辨析\n\n    1.  dx  —— 定积分\n\n  什么时候用？   积分区域是  直线段  （区间  [a,b] ）\n\n  物理意义：   一维物体的长度微元\n\n  例子：  \n\n- 细直杆（密度不均匀）的质量： m= int_a^b  rho(x) ,dx \n- 变力沿直线做功： W= int_a^b F(x) ,dx \n\n  特点：   只有一个积分变量，没有方向\n\n---\n\n    2.  ds  —— 第一类曲线积分（对弧长）\n\n  什么时候用？   积分区域是  曲线  （直线、圆弧、摆线等）\n\n  物理意义：   曲线上一小段  弧长  \n\n  计算公式：  \n  ds= sqrt x'^2(t)+y'^2(t)  ,dt quad text （参数式）   \n  ds= sqrt 1+y'^2  ,dx quad text （显函数）   \n\n  例子：  \n\n- 曲线形构件（铁丝）的质量：  int_L  rho ,ds \n- 曲线长度：  int_L ds \n- 摆线转动惯量（试卷第六题如果是曲线）：  int_L y^2 ,ds \n\n  关键记忆：   只要提到   \"曲线\"  、   \"弧长\"  、   \"铁丝\"  ，就用  ds \n\n---\n\n    3.  dxdy  —— 二重积分\n\n  什么时候用？   积分区域是  平面区域  （圆、三角形、矩形等）\n\n  物理意义：   平面上的一小块  面积  \n\n  例子：  \n\n- 平面薄板的质量：  iint_D  rho(x,y) ,dxdy \n- 平面区域面积：  iint_D dxdy \n- 试卷第一题第3小题：  iint_D e^ -y^2 dxdy （三角形区域）\n\n  注意：   二重积分中的  dxdy  是  真正的面积微元  ，不是投影\n\n---\n\n    4.  dS  —— 第一类曲面积分（对面积）\n\n  什么时候用？   积分区域是  曲面  （球面、抛物面、锥面等），且与  方向无关  \n\n  物理意义：   曲面上的一小块  真实面积  \n\n  计算公式：  \n  dS= sqrt 1+z_x^2+z_y^2  ,dxdy quad text （曲面写成  z=z(x,y) text  时）   \n\n  第一类曲面积分的面积元  dS  非负，与曲面选上侧或下侧无关。\n\n  例子：  \n\n- 曲面壳（蛋壳）的质量：  iint_ Sigma  rho ,dS \n- 曲面面积：  iint_ Sigma dS \n- 试卷第六题：球面壳对  z  轴的转动惯量   iint_ Sigma (x^2+y^2) ,dS \n\n  与  dxdy  的区别：  \n\n-  dxdy  是  平面上  的面积（比如桌面）\n-  dS  是  弯曲曲面  上的面积（比如蛋壳表面）\n\n  关系：   对球面  x^2+y^2+z^2=a^2 （ a 0 ），分别将上、下半球写为  z= pm sqrt a^2-x^2-y^2  ，在  z neq0  处有：\n\n  dS =  frac a  |z|  ,dxdy  \n\n上半球可写成  a/z ，下半球须写成  a/(-z) 。赤道处该投影公式的系数无界，可换投影面，或在积分时按相应的反常积分处理。曲面写成  z=z(x,y)  时， dS geq dxdy ，因为曲面有\"坡度\"。\n\n---\n\n    5.  dydz, dzdx, dxdy  —— 第二类曲面积分（对坐标）\n\n  什么时候用？   计算  通量  （流体穿过曲面、磁通量、电通量），与  方向有关  \n\n  物理意义：   曲面块在坐标面上的  投影面积  （有正负！）\n\n  例子：  \n\n- 流体穿过曲面的流量：  iint_ Sigma P ,dydz + Q ,dzdx + R ,dxdy \n- 试卷第四题：  iint_ Sigma (2x+z) ,dydz + z ,dxdy \n\n  特点：  \n\n-   有方向  ！上侧为正，下侧为负；前侧为正，后侧为负；右侧为正，左侧为负\n- 三个分量分别对应三个坐标面的投影\n\n  与  dS  的关系：  \n  dydz =  cos alpha ,dS, quad dzdx =  cos beta ,dS, quad dxdy =  cos gamma ,dS  \n其中  ( cos alpha, cos beta, cos gamma)  是单位法向量\n\n---\n\n    6.  dV  —— 三重积分\n\n  什么时候用？   积分区域是  空间立体  （球体、柱体、锥体等）\n\n  物理意义：   空间中的一小块  体积  \n\n  例子：  \n\n- 实心球的质量：  iiint_ Omega  rho ,dV \n- 立体体积：  iiint_ Omega dV \n- 实心球的转动惯量：  iiint_ Omega (x^2+y^2) ,dV \n\n  与  dS  的区别：  \n\n-  dV  有\"厚度\"，是三维的\n-  dS  没有厚度，是二维的（壳）\n\n---\n\n   三、对比记忆图\n\n```text\n维度递增：\n\n一维 ──────────────────────────────────────\n  │   直线段 [a,b]        → 用 dx    （定积分）\n  │   曲线 L              → 用 ds    （第一类曲线积分）\n  │\n二维 ──────────────────────────────────────\n  │   平面区域 D          → 用 dxdy  （二重积分）\n  │   曲面 Σ（无方向）    → 用 dS    （第一类曲面积分）\n  │   曲面 Σ（有方向）    → 用 dydz/dzdx/dxdy （第二类曲面积分）\n  │\n三维 ──────────────────────────────────────\n      空间立体 Ω          → 用 dV    （三重积分）\n```\n\n---\n\n   四、快速判断口诀\n\n| 题目关键词 | 用什么微元 | 积分类型 |\n| :--- | :--- | :--- |\n| \"曲线\"、\"弧长\"、\"铁丝\" |  ds  | 第一类曲线积分 |\n| \"平面区域\"、\"薄板\" |  dxdy  | 二重积分 |\n| \"曲面壳\"、\"表面\"、\"蛋壳\" |  dS  | 第一类曲面积分 |\n| \"通量\"、\"流量\"、\"穿过\" |  dydz,dzdx,dxdy  | 第二类曲面积分 |\n| \"实心球\"、\"立体\"、\"体积\" |  dV  | 三重积分 |\n\n---\n\n   五、一句话总结\n\n  [!TIP]\n    \"曲线\"用  ds ，\"平面\"用  dxdy ，\"曲面壳\"用  dS ，\"实心体\"用  dV ，\"通量\"用  dydz  等投影  \n\n---\n"}, {"id": "topic-extrema", "number": "T12", "kind": "topic", "title": "区域最值问题", "description": "内部候选点与每条边界，都要逐一检查。", "tags": ["内部与边界", "候选点"], "source": "../../%E6%95%B0%E5%AD%A6/%E9%AB%98%E7%AD%89%E6%95%B0%E5%AD%A6/%E8%A1%A5%E5%85%85%E7%90%86%E8%A7%A3/%E5%8C%BA%E5%9F%9F%E6%9C%80%E5%80%BC%E9%97%AE%E9%A2%98.md", "full": "<hr />\n<h2 id=\"topic-extrema-full-h1\">1. 核心思想<\/h2>\n<p><strong>有界闭区域上的连续函数必有最值<\/strong>（最值存在定理）<\/p>\n<p>对于在有界闭区域上连续的函数，最值的候选点包括：<\/p>\n<ul>\n<li><strong>区域内部<\/strong>的驻点（偏导数为0的点）<\/li>\n<li><strong>区域内部<\/strong>至少一个偏导数不存在的点<\/li>\n<li><strong>边界<\/strong>上的极值点（包括边界的端点/交点）<\/li>\n<\/ul>\n<p>若函数在区域内部处处有偏导数，内部候选点才可简化为驻点。<\/p>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p><strong>求区域最值时，内部与边界都要检查；仅有连续性时，还要检查内部偏导数不存在的点。<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-extrema-full-h2\">2. <strong>标准解题流程<\/strong>（三步法）<\/h2>\n<pre><code class=\"language-text\">┌─────────────────────────────────────────┐\n│  第一步：找区域内部候选点                 │\n│  解 ∂f/∂x = 0, ∂f/∂y = 0，找驻点        │\n│  → 筛选严格内部点，并检查偏导不存在的点    │\n├─────────────────────────────────────────┤\n│  第二步：求边界上的极值                   │\n│  把边界方程代入，化为一元函数求极值        │\n│  或：拉格朗日乘数法（约束极值）            │\n│  → 检查端点、交点及不可导点               │\n├─────────────────────────────────────────┤\n│  第三步：比较所有候选点                   │\n│  内部候选点 + 边界候选点                 │\n│  → 比大小，最大的就是最大值，最小就是最小值 │\n└─────────────────────────────────────────┘\n<\/code><\/pre>\n<hr />\n<h2 id=\"topic-extrema-full-h3\">3. 第一步详解：内部候选点<\/h2>\n<h3 id=\"topic-extrema-full-h4\">(1) 操作方法<\/h3>\n<ol>\n<li>求偏导数 <span class=\"math-inline\">\\(\\dfrac{\\partial f}{\\partial x},\\ \\dfrac{\\partial f}{\\partial y}\\)<\/span>，确定它们的存在范围<\/li>\n<li>在偏导数存在的地方解方程组 <span class=\"math-inline\">\\(\\begin{cases} f_x=0 \\\\ f_y=0 \\end{cases}\\)<\/span>，找出驻点<\/li>\n<li><strong>补查<\/strong>：将区域内部至少一个偏导数不存在的点列为候选点；若这类点组成曲线或其他点集，需在该点集上进一步讨论<\/li>\n<li><strong>筛选<\/strong>：保留严格在区域内部的点（不在边界上）<\/li>\n<\/ol>\n<blockquote>\n<p>例如 <span class=\"math-inline\">\\(f(x,y)=|x|+|y|\\)<\/span> 在单位闭圆盘上连续，原点是最小值点，但两偏导数在原点均不存在，不能只靠驻点方程寻找。<\/p>\n<\/blockquote>\n<h3 id=\"topic-extrema-full-h5\">(2) 示例<\/h3>\n<p><span class=\"math-inline\">\\(f(x,y)=x^2+2y^2-x^2y^2\\)<\/span>，区域 <span class=\"math-inline\">\\(D: x^2+y^2\\le 4,\\ y\\ge 0\\)<\/span>。此例为多项式函数，偏导数处处存在，内部只需寻找驻点。<\/p>\n<ul>\n<li><span class=\"math-inline\">\\(f_x=2x(1-y^2)=0\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\(f_y=2y(2-x^2)=0\\)<\/span><\/li>\n<\/ul>\n<p>解得驻点：<span class=\"math-inline\">\\((0,0),\\ (\\pm\\sqrt{2},1),\\ (\\pm\\sqrt{2},-1)\\)<\/span><\/p>\n<p><strong>筛选结果：<\/strong><\/p>\n<ul>\n<li><span class=\"math-inline\">\\((0,0)\\)<\/span>：在边界 <span class=\"math-inline\">\\(y=0\\)<\/span> 上，<strong>舍去<\/strong><\/li>\n<li><span class=\"math-inline\">\\((\\pm\\sqrt{2},-1)\\)<\/span>：<span class=\"math-inline\">\\(y&lt;0\\)<\/span> 不在区域内，<strong>舍去<\/strong><\/li>\n<li><span class=\"math-inline\">\\((\\pm\\sqrt{2},1)\\)<\/span>：<span class=\"math-inline\">\\(y&gt;0\\)<\/span> 且 <span class=\"math-inline\">\\(x^2+y^2=3&lt;4\\)<\/span>，<strong>保留<\/strong> ✅<\/li>\n<\/ul>\n<p>内部候选值：<span class=\"math-inline\">\\(f(\\pm\\sqrt{2},1)=2\\)<\/span><\/p>\n<hr />\n<h2 id=\"topic-extrema-full-h6\">4. 第二步详解：边界上的极值<\/h2>\n<h3 id=\"topic-extrema-full-h7\">(1) 边界分类处理<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">边界类型<\/th>\n<th style=\"text-align:left\">处理方法<\/th>\n<th style=\"text-align:left\">关键技巧<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><strong>直线段<\/strong>（如 <span class=\"math-inline\">\\(y=0, x=a\\)<\/span>）<\/td>\n<td style=\"text-align:left\"><strong>代入化为一元函数<\/strong><\/td>\n<td style=\"text-align:left\">求导找驻点，并检查不可导点与端点<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>曲线段<\/strong>（如 <span class=\"math-inline\">\\(x^2+y^2=R^2\\)<\/span>）<\/td>\n<td style=\"text-align:left\"><strong>参数法或消元法<\/strong><\/td>\n<td style=\"text-align:left\">用约束条件消去一个变量<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>多条边界<\/strong><\/td>\n<td style=\"text-align:left\"><strong>每条分别处理<\/strong><\/td>\n<td style=\"text-align:left\">别漏边！别漏端点！<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"topic-extrema-full-h8\">(2)示例<\/h3>\n<p><strong>边界 ①：<span class=\"math-inline\">\\(y=0,\\ x\\in[-2,2]\\)<\/span><\/strong><\/p>\n<p>代入：<span class=\"math-inline\">\\(f(x,0)=x^2\\)<\/span><\/p>\n<ul>\n<li>最小值：<span class=\"math-inline\">\\(f(0,0)=0\\)<\/span><\/li>\n<li>最大值：<span class=\"math-inline\">\\(f(\\pm2,0)=4\\)<\/span><\/li>\n<\/ul>\n<p><strong>边界 ②：<span class=\"math-inline\">\\(x^2+y^2=4,\\ y\\ge 0\\)<\/span>（上半圆弧）<\/strong><\/p>\n<p>用 <span class=\"math-inline\">\\(x^2=4-y^2\\)<\/span> 消去 <span class=\"math-inline\">\\(x\\)<\/span>（<span class=\"math-inline\">\\(y\\in[0,2]\\)<\/span>）：<\/p>\n<p><span class=\"math-display\">\\[f=(4-y^2)+2y^2-(4-y^2)y^2=y^4-3y^2+4\\]<\/span><\/p>\n<p>令 <span class=\"math-inline\">\\(g(y)=y^4-3y^2+4\\)<\/span>，求导 <span class=\"math-inline\">\\(g&#x27;(y)=2y(2y^2-3)=0\\)<\/span><\/p>\n<p>临界点：<span class=\"math-inline\">\\(y=0,\\ y=\\dfrac{\\sqrt{6}}{2}\\)<\/span><\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><span class=\"math-inline\">\\(y\\)<\/span><\/th>\n<th style=\"text-align:left\">对应点<\/th>\n<th style=\"text-align:center\"><span class=\"math-inline\">\\(f\\)<\/span> 值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(0\\)<\/span><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((\\pm2,0)\\)<\/span><\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(4\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(\\dfrac{\\sqrt{6}}{2}\\)<\/span><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(\\left(\\pm\\dfrac{\\sqrt{10}}{2},\\dfrac{\\sqrt{6}}{2}\\right)\\)<\/span><\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(\\dfrac{7}{4}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(2\\)<\/span>（消元变量 <span class=\"math-inline\">\\(y\\)<\/span> 的端点）<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((0,2)\\)<\/span><\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(8\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-extrema-full-h9\">5. 第三步：比较所有候选点<\/h2>\n<p>汇总所有候选点，<strong>直接比大小<\/strong>：<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">点<\/th>\n<th style=\"text-align:left\">类型<\/th>\n<th style=\"text-align:center\"><span class=\"math-inline\">\\(f\\)<\/span> 值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((\\pm\\sqrt{2},1)\\)<\/span><\/td>\n<td style=\"text-align:left\">内部驻点<\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(2\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((0,0)\\)<\/span><\/td>\n<td style=\"text-align:left\">直线段内部点<\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((\\pm2,0)\\)<\/span><\/td>\n<td style=\"text-align:left\">边界端点<\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(4\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(\\left(\\pm\\dfrac{\\sqrt{10}}{2},\\dfrac{\\sqrt{6}}{2}\\right)\\)<\/span><\/td>\n<td style=\"text-align:left\">圆弧临界点<\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(\\dfrac{7}{4}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((0,2)\\)<\/span><\/td>\n<td style=\"text-align:left\">圆弧最高点（消元变量 <span class=\"math-inline\">\\(y\\)<\/span> 的端点对应点）<\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(8\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>结果：<\/strong>\n<span class=\"math-display\">\\[\\boxed{f_{\\min}=0\\ (\\text{在 }(0,0)),\\quad f_{\\max}=8\\ (\\text{在 }(0,2))}\\]<\/span><\/p>\n<hr />\n<h2 id=\"topic-extrema-full-h10\">6. <strong>边界处理的常用技巧<\/strong><\/h2>\n<h3 id=\"topic-extrema-full-h11\">(1) 技巧一：代入消元（显式边界）<\/h3>\n<p>边界方程能解出 <span class=\"math-inline\">\\(y=g(x)\\)<\/span> 或 <span class=\"math-inline\">\\(x=h(y)\\)<\/span>，直接代入 <span class=\"math-inline\">\\(f\\)<\/span> 化为一元函数<\/p>\n<h3 id=\"topic-extrema-full-h12\">(2) 技巧二：参数法（圆/椭圆）<\/h3>\n<ul>\n<li>圆 <span class=\"math-inline\">\\(x^2+y^2=R^2\\)<\/span>：令 <span class=\"math-inline\">\\(x=R\\cos t,\\ y=R\\sin t\\)<\/span><\/li>\n<li>椭圆 <span class=\"math-inline\">\\(\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}=1\\)<\/span>：令 <span class=\"math-inline\">\\(x=a\\cos t,\\ y=b\\sin t\\)<\/span><\/li>\n<\/ul>\n<h3 id=\"topic-extrema-full-h13\">(3) 技巧三：拉格朗日乘数法（复杂约束）<\/h3>\n<p>边界 <span class=\"math-inline\">\\(g(x,y)=0\\)<\/span>，构造 <span class=\"math-inline\">\\(L=f+\\lambda g\\)<\/span>，解 <span class=\"math-inline\">\\(\\begin{cases} L_x=0 \\\\ L_y=0 \\\\ g=0 \\end{cases}\\)<\/span><\/p>\n<hr />\n<h2 id=\"topic-extrema-full-h14\">7. <strong>常见错误清单<\/strong><\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">错误<\/th>\n<th style=\"text-align:left\">后果<\/th>\n<th style=\"text-align:left\">避免方法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><strong>只算内部驻点<\/strong><\/td>\n<td style=\"text-align:left\">漏掉边界上的最值<\/td>\n<td style=\"text-align:left\">记住：区域最值 = 内部 + 边界<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>连续函数只查驻点，漏查偏导数不存在的点<\/strong><\/td>\n<td style=\"text-align:left\">漏掉内部最值，如 <span class=\"math-inline\">\\(\\vert x\\vert+\\vert y\\vert\\)<\/span> 在原点的最小值<\/td>\n<td style=\"text-align:left\">内部候选点 = 驻点 + 至少一个偏导数不存在的点<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>漏掉某条边界<\/strong><\/td>\n<td style=\"text-align:left\">区域有多个边界，只算了一个<\/td>\n<td style=\"text-align:left\">画图，把边界列全<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>边界端点没算<\/strong><\/td>\n<td style=\"text-align:left\">端点可能恰好是最值<\/td>\n<td style=\"text-align:left\">每条边界都算端点<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>把边界上的点当内部点<\/strong><\/td>\n<td style=\"text-align:left\">如 <span class=\"math-inline\">\\((0,0)\\)<\/span> 在 <span class=\"math-inline\">\\(y=0\\)<\/span> 边界上<\/td>\n<td style=\"text-align:left\">严格内部要求：不在任何边界上<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>边界化一元后忘求导<\/strong><\/td>\n<td style=\"text-align:left\">只算了端点，漏了临界点<\/td>\n<td style=\"text-align:left\">一元函数也要求导找极值<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>参数范围搞错<\/strong><\/td>\n<td style=\"text-align:left\">如上半圆 <span class=\"math-inline\">\\(t\\in[0,\\pi]\\)<\/span> 不是 <span class=\"math-inline\">\\([0,2\\pi]\\)<\/span><\/td>\n<td style=\"text-align:left\">根据区域确定参数范围<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-extrema-full-h15\">8. 快速检查清单<\/h2>\n<p>做完题后对照检查：<\/p>\n<ul>\n<li>[ ] 内部驻点都找到了吗？偏导数解全了吗？<\/li>\n<li>[ ] 内部至少一个偏导数不存在的点都检查了吗？<\/li>\n<li>[ ] 内部驻点都严格在区域内部吗？（不在边界上）<\/li>\n<li>[ ] 边界有几条？都单独处理了吗？<\/li>\n<li>[ ] 每条边界都求导找临界点了吗？<\/li>\n<li>[ ] 每条边界的端点都代入了吗？<\/li>\n<li>[ ] 所有候选点的函数值都计算了吗？<\/li>\n<li>[ ] 最后比较大小了吗？<\/li>\n<\/ul>\n<hr />\n<h2 id=\"topic-extrema-full-h16\">9. 一句话总结<\/h2>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>区域最值三步走：内部驻点与偏导不存在的点都检查，每条边界单独算，端点和不可导点别漏掉，全部放在一起比大小<\/strong><\/p>\n<\/blockquote>\n<hr />\n", "summary": "<hr />\n<h2 id=\"topic-extrema-full-h1\">1. 核心思想<\/h2>\n<p><strong>有界闭区域上的连续函数必有最值<\/strong>（最值存在定理）<\/p>\n<p>对于在有界闭区域上连续的函数，最值的候选点包括：<\/p>\n<ul>\n<li><strong>区域内部<\/strong>的驻点（偏导数为0的点）<\/li>\n<li><strong>区域内部<\/strong>至少一个偏导数不存在的点<\/li>\n<li><strong>边界<\/strong>上的极值点（包括边界的端点/交点）<\/li>\n<\/ul>\n<p>若函数在区域内部处处有偏导数，内部候选点才可简化为驻点。<\/p>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p><strong>求区域最值时，内部与边界都要检查；仅有连续性时，还要检查内部偏导数不存在的点。<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-extrema-full-h2\">2. <strong>标准解题流程<\/strong>（三步法）<\/h2>\n<pre><code class=\"language-text\">┌─────────────────────────────────────────┐\n│  第一步：找区域内部候选点                 │\n│  解 ∂f/∂x = 0, ∂f/∂y = 0，找驻点        │\n│  → 筛选严格内部点，并检查偏导不存在的点    │\n├─────────────────────────────────────────┤\n│  第二步：求边界上的极值                   │\n│  把边界方程代入，化为一元函数求极值        │\n│  或：拉格朗日乘数法（约束极值）            │\n│  → 检查端点、交点及不可导点               │\n├─────────────────────────────────────────┤\n│  第三步：比较所有候选点                   │\n│  内部候选点 + 边界候选点                 │\n│  → 比大小，最大的就是最大值，最小就是最小值 │\n└─────────────────────────────────────────┘\n<\/code><\/pre>\n<hr />\n<h2 id=\"topic-extrema-full-h3\">3. 第一步详解：内部候选点<\/h2>\n<h3 id=\"topic-extrema-full-h4\">(1) 操作方法<\/h3>\n<ol>\n<li>求偏导数 <span class=\"math-inline\">\\(\\dfrac{\\partial f}{\\partial x},\\ \\dfrac{\\partial f}{\\partial y}\\)<\/span>，确定它们的存在范围<\/li>\n<li>在偏导数存在的地方解方程组 <span class=\"math-inline\">\\(\\begin{cases} f_x=0 \\\\ f_y=0 \\end{cases}\\)<\/span>，找出驻点<\/li>\n<li><strong>补查<\/strong>：将区域内部至少一个偏导数不存在的点列为候选点；若这类点组成曲线或其他点集，需在该点集上进一步讨论<\/li>\n<li><strong>筛选<\/strong>：保留严格在区域内部的点（不在边界上）<\/li>\n<\/ol>\n<blockquote>\n<p>例如 <span class=\"math-inline\">\\(f(x,y)=|x|+|y|\\)<\/span> 在单位闭圆盘上连续，原点是最小值点，但两偏导数在原点均不存在，不能只靠驻点方程寻找。<\/p>\n<\/blockquote>\n<h3 id=\"topic-extrema-full-h5\">(2) 示例<\/h3>\n<p><span class=\"math-inline\">\\(f(x,y)=x^2+2y^2-x^2y^2\\)<\/span>，区域 <span class=\"math-inline\">\\(D: x^2+y^2\\le 4,\\ y\\ge 0\\)<\/span>。此例为多项式函数，偏导数处处存在，内部只需寻找驻点。<\/p>\n<ul>\n<li><span class=\"math-inline\">\\(f_x=2x(1-y^2)=0\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\(f_y=2y(2-x^2)=0\\)<\/span><\/li>\n<\/ul>\n<p>解得驻点：<span class=\"math-inline\">\\((0,0),\\ (\\pm\\sqrt{2},1),\\ (\\pm\\sqrt{2},-1)\\)<\/span><\/p>\n<p><strong>筛选结果：<\/strong><\/p>\n<ul>\n<li><span class=\"math-inline\">\\((0,0)\\)<\/span>：在边界 <span class=\"math-inline\">\\(y=0\\)<\/span> 上，<strong>舍去<\/strong><\/li>\n<li><span class=\"math-inline\">\\((\\pm\\sqrt{2},-1)\\)<\/span>：<span class=\"math-inline\">\\(y&lt;0\\)<\/span> 不在区域内，<strong>舍去<\/strong><\/li>\n<li><span class=\"math-inline\">\\((\\pm\\sqrt{2},1)\\)<\/span>：<span class=\"math-inline\">\\(y&gt;0\\)<\/span> 且 <span class=\"math-inline\">\\(x^2+y^2=3&lt;4\\)<\/span>，<strong>保留<\/strong> ✅<\/li>\n<\/ul>\n<p>内部候选值：<span class=\"math-inline\">\\(f(\\pm\\sqrt{2},1)=2\\)<\/span><\/p>\n<hr />\n<h2 id=\"topic-extrema-full-h6\">4. 第二步详解：边界上的极值<\/h2>\n<h3 id=\"topic-extrema-full-h7\">(1) 边界分类处理<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">边界类型<\/th>\n<th style=\"text-align:left\">处理方法<\/th>\n<th style=\"text-align:left\">关键技巧<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><strong>直线段<\/strong>（如 <span class=\"math-inline\">\\(y=0, x=a\\)<\/span>）<\/td>\n<td style=\"text-align:left\"><strong>代入化为一元函数<\/strong><\/td>\n<td style=\"text-align:left\">求导找驻点，并检查不可导点与端点<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>曲线段<\/strong>（如 <span class=\"math-inline\">\\(x^2+y^2=R^2\\)<\/span>）<\/td>\n<td style=\"text-align:left\"><strong>参数法或消元法<\/strong><\/td>\n<td style=\"text-align:left\">用约束条件消去一个变量<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>多条边界<\/strong><\/td>\n<td style=\"text-align:left\"><strong>每条分别处理<\/strong><\/td>\n<td style=\"text-align:left\">别漏边！别漏端点！<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"topic-extrema-full-h8\">(2)示例<\/h3>\n<p><strong>边界 ①：<span class=\"math-inline\">\\(y=0,\\ x\\in[-2,2]\\)<\/span><\/strong><\/p>\n<p>代入：<span class=\"math-inline\">\\(f(x,0)=x^2\\)<\/span><\/p>\n<ul>\n<li>最小值：<span class=\"math-inline\">\\(f(0,0)=0\\)<\/span><\/li>\n<li>最大值：<span class=\"math-inline\">\\(f(\\pm2,0)=4\\)<\/span><\/li>\n<\/ul>\n<p><strong>边界 ②：<span class=\"math-inline\">\\(x^2+y^2=4,\\ y\\ge 0\\)<\/span>（上半圆弧）<\/strong><\/p>\n<p>用 <span class=\"math-inline\">\\(x^2=4-y^2\\)<\/span> 消去 <span class=\"math-inline\">\\(x\\)<\/span>（<span class=\"math-inline\">\\(y\\in[0,2]\\)<\/span>）：<\/p>\n<p><span class=\"math-display\">\\[f=(4-y^2)+2y^2-(4-y^2)y^2=y^4-3y^2+4\\]<\/span><\/p>\n<p>令 <span class=\"math-inline\">\\(g(y)=y^4-3y^2+4\\)<\/span>，求导 <span class=\"math-inline\">\\(g&#x27;(y)=2y(2y^2-3)=0\\)<\/span><\/p>\n<p>临界点：<span class=\"math-inline\">\\(y=0,\\ y=\\dfrac{\\sqrt{6}}{2}\\)<\/span><\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\"><span class=\"math-inline\">\\(y\\)<\/span><\/th>\n<th style=\"text-align:left\">对应点<\/th>\n<th style=\"text-align:center\"><span class=\"math-inline\">\\(f\\)<\/span> 值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(0\\)<\/span><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((\\pm2,0)\\)<\/span><\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(4\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(\\dfrac{\\sqrt{6}}{2}\\)<\/span><\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(\\left(\\pm\\dfrac{\\sqrt{10}}{2},\\dfrac{\\sqrt{6}}{2}\\right)\\)<\/span><\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(\\dfrac{7}{4}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(2\\)<\/span>（消元变量 <span class=\"math-inline\">\\(y\\)<\/span> 的端点）<\/td>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((0,2)\\)<\/span><\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(8\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-extrema-full-h9\">5. 第三步：比较所有候选点<\/h2>\n<p>汇总所有候选点，<strong>直接比大小<\/strong>：<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">点<\/th>\n<th style=\"text-align:left\">类型<\/th>\n<th style=\"text-align:center\"><span class=\"math-inline\">\\(f\\)<\/span> 值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((\\pm\\sqrt{2},1)\\)<\/span><\/td>\n<td style=\"text-align:left\">内部驻点<\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(2\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((0,0)\\)<\/span><\/td>\n<td style=\"text-align:left\">直线段内部点<\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((\\pm2,0)\\)<\/span><\/td>\n<td style=\"text-align:left\">边界端点<\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(4\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\(\\left(\\pm\\dfrac{\\sqrt{10}}{2},\\dfrac{\\sqrt{6}}{2}\\right)\\)<\/span><\/td>\n<td style=\"text-align:left\">圆弧临界点<\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(\\dfrac{7}{4}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><span class=\"math-inline\">\\((0,2)\\)<\/span><\/td>\n<td style=\"text-align:left\">圆弧最高点（消元变量 <span class=\"math-inline\">\\(y\\)<\/span> 的端点对应点）<\/td>\n<td style=\"text-align:center\"><span class=\"math-inline\">\\(8\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>结果：<\/strong>\n<span class=\"math-display\">\\[\\boxed{f_{\\min}=0\\ (\\text{在 }(0,0)),\\quad f_{\\max}=8\\ (\\text{在 }(0,2))}\\]<\/span><\/p>\n<hr />\n<h2 id=\"topic-extrema-full-h10\">6. <strong>边界处理的常用技巧<\/strong><\/h2>\n<h3 id=\"topic-extrema-full-h11\">(1) 技巧一：代入消元（显式边界）<\/h3>\n<p>边界方程能解出 <span class=\"math-inline\">\\(y=g(x)\\)<\/span> 或 <span class=\"math-inline\">\\(x=h(y)\\)<\/span>，直接代入 <span class=\"math-inline\">\\(f\\)<\/span> 化为一元函数<\/p>\n<h3 id=\"topic-extrema-full-h12\">(2) 技巧二：参数法（圆/椭圆）<\/h3>\n<ul>\n<li>圆 <span class=\"math-inline\">\\(x^2+y^2=R^2\\)<\/span>：令 <span class=\"math-inline\">\\(x=R\\cos t,\\ y=R\\sin t\\)<\/span><\/li>\n<li>椭圆 <span class=\"math-inline\">\\(\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}=1\\)<\/span>：令 <span class=\"math-inline\">\\(x=a\\cos t,\\ y=b\\sin t\\)<\/span><\/li>\n<\/ul>\n<h3 id=\"topic-extrema-full-h13\">(3) 技巧三：拉格朗日乘数法（复杂约束）<\/h3>\n<p>边界 <span class=\"math-inline\">\\(g(x,y)=0\\)<\/span>，构造 <span class=\"math-inline\">\\(L=f+\\lambda g\\)<\/span>，解 <span class=\"math-inline\">\\(\\begin{cases} L_x=0 \\\\ L_y=0 \\\\ g=0 \\end{cases}\\)<\/span><\/p>\n<hr />\n<h2 id=\"topic-extrema-full-h14\">7. <strong>常见错误清单<\/strong><\/h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th style=\"text-align:left\">错误<\/th>\n<th style=\"text-align:left\">后果<\/th>\n<th style=\"text-align:left\">避免方法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align:left\"><strong>只算内部驻点<\/strong><\/td>\n<td style=\"text-align:left\">漏掉边界上的最值<\/td>\n<td style=\"text-align:left\">记住：区域最值 = 内部 + 边界<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>连续函数只查驻点，漏查偏导数不存在的点<\/strong><\/td>\n<td style=\"text-align:left\">漏掉内部最值，如 <span class=\"math-inline\">\\(\\vert x\\vert+\\vert y\\vert\\)<\/span> 在原点的最小值<\/td>\n<td style=\"text-align:left\">内部候选点 = 驻点 + 至少一个偏导数不存在的点<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>漏掉某条边界<\/strong><\/td>\n<td style=\"text-align:left\">区域有多个边界，只算了一个<\/td>\n<td style=\"text-align:left\">画图，把边界列全<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>边界端点没算<\/strong><\/td>\n<td style=\"text-align:left\">端点可能恰好是最值<\/td>\n<td style=\"text-align:left\">每条边界都算端点<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>把边界上的点当内部点<\/strong><\/td>\n<td style=\"text-align:left\">如 <span class=\"math-inline\">\\((0,0)\\)<\/span> 在 <span class=\"math-inline\">\\(y=0\\)<\/span> 边界上<\/td>\n<td style=\"text-align:left\">严格内部要求：不在任何边界上<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>边界化一元后忘求导<\/strong><\/td>\n<td style=\"text-align:left\">只算了端点，漏了临界点<\/td>\n<td style=\"text-align:left\">一元函数也要求导找极值<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align:left\"><strong>参数范围搞错<\/strong><\/td>\n<td style=\"text-align:left\">如上半圆 <span class=\"math-inline\">\\(t\\in[0,\\pi]\\)<\/span> 不是 <span class=\"math-inline\">\\([0,2\\pi]\\)<\/span><\/td>\n<td style=\"text-align:left\">根据区域确定参数范围<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />\n<h2 id=\"topic-extrema-full-h15\">8. 快速检查清单<\/h2>\n<p>做完题后对照检查：<\/p>\n<ul>\n<li>[ ] 内部驻点都找到了吗？偏导数解全了吗？<\/li>\n<li>[ ] 内部至少一个偏导数不存在的点都检查了吗？<\/li>\n<li>[ ] 内部驻点都严格在区域内部吗？（不在边界上）<\/li>\n<li>[ ] 边界有几条？都单独处理了吗？<\/li>\n<li>[ ] 每条边界都求导找临界点了吗？<\/li>\n<li>[ ] 每条边界的端点都代入了吗？<\/li>\n<li>[ ] 所有候选点的函数值都计算了吗？<\/li>\n<li>[ ] 最后比较大小了吗？<\/li>\n<\/ul>\n<hr />\n<h2 id=\"topic-extrema-full-h16\">9. 一句话总结<\/h2>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>区域最值三步走：内部驻点与偏导不存在的点都检查，每条边界单独算，端点和不可导点别漏掉，全部放在一起比大小<\/strong><\/p>\n<\/blockquote>\n<hr />\n", "search": "\n---\n\n   1. 核心思想\n\n  有界闭区域上的连续函数必有最值  （最值存在定理）\n\n对于在有界闭区域上连续的函数，最值的候选点包括：\n\n- ==  区域内部  的驻点==（偏导数为0的点）\n- ==  区域内部  至少一个偏导数不存在的点==\n- ==  边界  上的极值点==（包括边界的端点/交点）\n\n若函数在区域内部处处有偏导数，内部候选点才可简化为驻点。\n\n  [!WARNING]\n    求区域最值时，内部与边界都要检查；仅有连续性时，还要检查内部偏导数不存在的点。  \n\n---\n\n   2.   标准解题流程  （三步法）\n\n```text\n┌─────────────────────────────────────────┐\n│  第一步：找区域内部候选点                 │\n│  解 ∂f/∂x = 0, ∂f/∂y = 0，找驻点        │\n│  → 筛选严格内部点，并检查偏导不存在的点    │\n├─────────────────────────────────────────┤\n│  第二步：求边界上的极值                   │\n│  把边界方程代入，化为一元函数求极值        │\n│  或：拉格朗日乘数法（约束极值）            │\n│  → 检查端点、交点及不可导点               │\n├─────────────────────────────────────────┤\n│  第三步：比较所有候选点                   │\n│  内部候选点 + 边界候选点                 │\n│  → 比大小，最大的就是最大值，最小就是最小值 │\n└─────────────────────────────────────────┘\n```\n\n---\n\n   3. 第一步详解：内部候选点\n\n    (1) 操作方法\n\n1. 求偏导数   dfrac  partial f   partial x ,   dfrac  partial f   partial y  ，确定它们的存在范围\n2. 在偏导数存在的地方解方程组   begin cases  f_x=0    f_y=0  end cases  ，找出驻点\n3.   补查  ：将区域内部至少一个偏导数不存在的点列为候选点；若这类点组成曲线或其他点集，需在该点集上进一步讨论\n4.   筛选  ：保留严格在区域内部的点（不在边界上）\n\n  例如  f(x,y)=|x|+|y|  在单位闭圆盘上连续，原点是最小值点，但两偏导数在原点均不存在，不能只靠驻点方程寻找。\n\n    (2) 示例\n\n f(x,y)=x^2+2y^2-x^2y^2 ，区域  D: x^2+y^2 le 4,  y ge 0 。此例为多项式函数，偏导数处处存在，内部只需寻找驻点。\n\n-  f_x=2x(1-y^2)=0 \n-  f_y=2y(2-x^2)=0 \n\n解得驻点： (0,0),  ( pm sqrt 2 ,1),  ( pm sqrt 2 ,-1) \n\n  筛选结果：  \n\n-  (0,0) ：在边界  y=0  上，  舍去  \n-  ( pm sqrt 2 ,-1) ： y<0  不在区域内，  舍去  \n-  ( pm sqrt 2 ,1) ： y 0  且  x^2+y^2=3<4 ，  保留   ✅\n\n内部候选值： f( pm sqrt 2 ,1)=2 \n\n---\n\n   4. 第二步详解：边界上的极值\n\n    (1) 边界分类处理\n\n| 边界类型 | 处理方法 | 关键技巧 |\n| :--- | :--- | :--- |\n|   直线段  （如  y=0, x=a ） |   代入化为一元函数   | 求导找驻点，并检查不可导点与端点 |\n|   曲线段  （如  x^2+y^2=R^2 ） |   参数法或消元法   | 用约束条件消去一个变量 |\n|   多条边界   |   每条分别处理   | 别漏边！别漏端点！ |\n\n    (2)示例\n\n  边界 ①： y=0,  x in[-2,2]   \n\n代入： f(x,0)=x^2 \n\n- 最小值： f(0,0)=0 \n- 最大值： f( pm2,0)=4 \n\n  边界 ②： x^2+y^2=4,  y ge 0 （上半圆弧）  \n\n用  x^2=4-y^2  消去  x （ y in[0,2] ）：\n\n  f=(4-y^2)+2y^2-(4-y^2)y^2=y^4-3y^2+4  \n\n令  g(y)=y^4-3y^2+4 ，求导  g'(y)=2y(2y^2-3)=0 \n\n临界点： y=0,  y= dfrac  sqrt 6   2  \n\n|  y  | 对应点 |  f  值 |\n|:---|:---|:---:|\n|  0  |  ( pm2,0)  |  4  |\n|   dfrac  sqrt 6   2   |   left( pm dfrac  sqrt 10   2 , dfrac  sqrt 6   2  right)  |   dfrac 7  4   |\n|  2 （消元变量  y  的端点） |  (0,2)  |  8  |\n\n---\n\n   5. 第三步：比较所有候选点\n\n汇总所有候选点，  直接比大小  ：\n\n| 点 | 类型 |  f  值 |\n| :--- | :--- | :---: |\n|  ( pm sqrt 2 ,1)  | 内部驻点 |  2  |\n|  (0,0)  | 直线段内部点 |  0  |\n|  ( pm2,0)  | 边界端点 |  4  |\n|   left( pm dfrac  sqrt 10   2 , dfrac  sqrt 6   2  right)  | 圆弧临界点 |   dfrac 7  4   |\n|  (0,2)  | 圆弧最高点（消元变量  y  的端点对应点） |  8  |\n\n  结果：  \n   boxed f_  min =0  ( text 在  (0,0)), quad f_  max =8  ( text 在  (0,2))   \n\n---\n\n   6.   边界处理的常用技巧  \n\n    (1) 技巧一：代入消元（显式边界）\n\n边界方程能解出  y=g(x)  或  x=h(y) ，直接代入  f  化为一元函数\n\n    (2) 技巧二：参数法（圆/椭圆）\n\n- 圆  x^2+y^2=R^2 ：令  x=R cos t,  y=R sin t \n- 椭圆   dfrac x^2  a^2 + dfrac y^2  b^2 =1 ：令  x=a cos t,  y=b sin t \n\n    (3) 技巧三：拉格朗日乘数法（复杂约束）\n\n边界  g(x,y)=0 ，构造  L=f+ lambda g ，解   begin cases  L_x=0    L_y=0    g=0  end cases  \n\n---\n\n   7.   常见错误清单  \n\n| 错误 | 后果 | 避免方法 |\n| :--- | :--- | :--- |\n|   只算内部驻点   | 漏掉边界上的最值 | 记住：区域最值 = 内部 + 边界 |\n|   连续函数只查驻点，漏查偏导数不存在的点   | 漏掉内部最值，如   vert x vert+ vert y vert  在原点的最小值 | 内部候选点 = 驻点 + 至少一个偏导数不存在的点 |\n|   漏掉某条边界   | 区域有多个边界，只算了一个 | 画图，把边界列全 |\n|   边界端点没算   | 端点可能恰好是最值 | 每条边界都算端点 |\n|   把边界上的点当内部点   | 如  (0,0)  在  y=0  边界上 | 严格内部要求：不在任何边界上 |\n|   边界化一元后忘求导   | 只算了端点，漏了临界点 | 一元函数也要求导找极值 |\n|   参数范围搞错   | 如上半圆  t in[0, pi]  不是  [0,2 pi]  | 根据区域确定参数范围 |\n\n---\n\n   8. 快速检查清单\n\n做完题后对照检查：\n\n- [ ] 内部驻点都找到了吗？偏导数解全了吗？\n- [ ] 内部至少一个偏导数不存在的点都检查了吗？\n- [ ] 内部驻点都严格在区域内部吗？（不在边界上）\n- [ ] 边界有几条？都单独处理了吗？\n- [ ] 每条边界都求导找临界点了吗？\n- [ ] 每条边界的端点都代入了吗？\n- [ ] 所有候选点的函数值都计算了吗？\n- [ ] 最后比较大小了吗？\n\n---\n\n   9. 一句话总结\n\n  [!TIP]\n    区域最值三步走：内部驻点与偏导不存在的点都检查，每条边界单独算，端点和不可导点别漏掉，全部放在一起比大小  \n\n---\n"}, {"id": "topic-wallis", "number": "T13", "kind": "topic", "title": "华莱士公式", "description": "用双阶乘计算三角函数幂次积分。", "tags": ["双阶乘", "区间对称"], "source": "../../%E6%95%B0%E5%AD%A6/%E9%AB%98%E7%AD%89%E6%95%B0%E5%AD%A6/%E8%A1%A5%E5%85%85%E7%90%86%E8%A7%A3/%E5%8D%8E%E8%8E%B1%E5%A3%AB%E5%85%AC%E5%BC%8F.md", "full": "<hr />\n<h2 id=\"topic-wallis-full-h1\">一、纯点火（基础华莱士）<\/h2>\n<p>设 <span class=\"math-inline\">\\(n\\)<\/span> 为正整数<\/p>\n<p><span class=\"math-display\">\\[\\int_{0}^{\\frac{\\pi}{2}} \\sin^n x \\, dx = \\int_{0}^{\\frac{\\pi}{2}} \\cos^n x \\, dx\\]<\/span><\/p>\n<ul>\n<li><strong>当 <span class=\"math-inline\">\\(n\\)<\/span> 为偶数时<\/strong>：\n<span class=\"math-display\">\\[\\int_{0}^{\\frac{\\pi}{2}} \\sin^n x \\, dx = \\frac{n-1}{n} \\cdot \\frac{n-3}{n-2} \\cdots \\frac12 \\cdot \\frac{\\pi}{2}\\]<\/span><\/li>\n<li><strong>当 <span class=\"math-inline\">\\(n\\)<\/span> 为奇数时<\/strong>：\n<span class=\"math-display\">\\[\\int_{0}^{\\frac{\\pi}{2}} \\sin^n x \\, dx = \\frac{n-1}{n} \\cdot \\frac{n-3}{n-2} \\cdots \\frac23 \\cdot 1\\]<\/span><\/li>\n<\/ul>\n<hr />\n<h2 id=\"topic-wallis-full-h2\">二、混合点火公式<\/h2>\n<p><span class=\"math-display\">\\[I = \\int_{0}^{\\frac{\\pi}{2}} \\sin^m x \\cdot \\cos^n x \\, dx\\]<\/span><\/p>\n<h3 id=\"topic-wallis-full-h3\">规则口诀（考试直接背）<\/h3>\n<p>以下双阶乘公式适用于 <span class=\"math-inline\">\\(m,n\\)<\/span> 为<strong>非负整数<\/strong>，约定 <span class=\"math-inline\">\\((-1)!!=0!!=1\\)<\/span>。<\/p>\n<ol>\n<li><strong>分子<\/strong>：<span class=\"math-inline\">\\(m\\)<\/span>、<span class=\"math-inline\">\\(n\\)<\/span> 各减 1，再分别每次减 2 连乘，得到 <span class=\"math-inline\">\\((m-1)!!(n-1)!!\\)<\/span><\/li>\n<li><strong>分母<\/strong>：从<strong>幂次之和 <span class=\"math-inline\">\\(m+n\\)<\/span><\/strong> 开始，每次减 2 连乘，得到 <span class=\"math-inline\">\\((m+n)!!\\)<\/span><\/li>\n<li><strong>最后看<\/strong>：\n<ul>\n<li><strong>两个都是偶数<\/strong>：末尾乘 <span class=\"math-inline\">\\(\\dfrac{\\pi}{2}\\)<\/span><\/li>\n<li><strong>只要有一个奇数<\/strong>：末尾乘 <span class=\"math-inline\">\\(1\\)<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><span class=\"math-display\">\\[\\boxed{\nI=\\frac{(m-1)!!(n-1)!!}{(m+n)!!}\n\\begin{cases}\n\\dfrac{\\pi}{2}, &amp; m,n\\text{ 均为偶数}\\\\\n1, &amp; \\text{其他情况}\n\\end{cases}\n}\\]<\/span><\/p>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p>分母是 <span class=\"math-inline\">\\((m+n)!!\\)<\/span>，不能写成 <span class=\"math-inline\">\\(m!!n!!\\)<\/span>，也不能把两个单独的华莱士积分结果相乘。<\/p>\n<\/blockquote>\n<h3 id=\"topic-wallis-full-h4\">通用公式（Gamma函数形式）<\/h3>\n<p>以下公式适用于实数 <span class=\"math-inline\">\\(m&gt;-1,\\ n&gt;-1\\)<\/span>：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{\n\\int_{0}^{\\frac{\\pi}{2}} \\sin^m x \\cos^n x \\, dx\n= \\frac{\\Gamma\\left(\\frac{m+1}{2}\\right) \\, \\Gamma\\left(\\frac{n+1}{2}\\right)}{2 \\, \\Gamma\\left(\\frac{m+n+2}{2}\\right)}\n}\\]<\/span><\/p>\n<p><strong>做题只用口算约分版<\/strong>（见下举例）<\/p>\n<hr />\n<h2 id=\"topic-wallis-full-h5\">三、举例秒懂<\/h2>\n<p><strong>例1<\/strong><br />\n<span class=\"math-display\">\\[\\int_{0}^{\\frac{\\pi}{2}} \\sin^2 x \\cos^2 x \\, dx\n\\qquad m=2\\ (\\text{偶}),\\ n=2\\ (\\text{偶})\\]<\/span><br />\n<span class=\"math-display\">\\[= \\frac{1!! \\cdot 1!!}{4!!} \\cdot \\frac{\\pi}{2}\n= \\frac{1}{4 \\cdot 2} \\cdot \\frac{\\pi}{2} = \\frac{\\pi}{16}\\]<\/span><\/p>\n<p><strong>例2<\/strong><br />\n<span class=\"math-display\">\\[\\int_{0}^{\\frac{\\pi}{2}} \\sin^3 x \\cos^2 x \\, dx\n\\qquad m=3\\ (\\text{奇}),\\ n=2\\ (\\text{偶})\\]<\/span><br />\n<span class=\"math-display\">\\[= \\frac{2!! \\cdot 1!!}{5!!}\n= \\frac{2 \\cdot 1}{5 \\cdot 3 \\cdot 1} = \\frac{2}{15}\\]<\/span><\/p>\n<hr />\n<h2 id=\"topic-wallis-full-h6\">四、最简背诵口诀（考场必用）<\/h2>\n<blockquote class=\"callout important\"><p class=\"callout-label\">关键结论<\/p><p><strong>分子各减一，分母幂次和；各自隔二乘，\n双偶乘二分之π，有奇直接末尾一<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"topic-wallis-full-h7\">五、常考区间变换（直接套结论）<\/h2>\n<p>以下设 <span class=\"math-inline\">\\(m,n\\)<\/span> 为非负整数，利用对称性和周期性转化为 <span class=\"math-inline\">\\(\\int_{0}^{\\frac{\\pi}{2}}\\)<\/span> 的结果<\/p>\n<h3 id=\"topic-wallis-full-h8\">1. <span class=\"math-inline\">\\(\\displaystyle \\color{blue}{\\int_{0}^{\\pi}} \\sin^m x \\cos^n x \\, dx\\)<\/span><\/h3>\n<ul>\n<li><strong>若 <span class=\"math-inline\">\\(\\cos\\)<\/span> 的次方 <span class=\"math-inline\">\\(n\\)<\/span> 为奇数：直接 <span class=\"math-inline\">\\(= \\boldsymbol{0}\\)<\/span><\/strong><\/li>\n<li>若 <span class=\"math-inline\">\\(n\\)<\/span> 为偶数：<span class=\"math-inline\">\\(= \\boldsymbol{2 \\times \\displaystyle \\int_{0}^{\\frac{\\pi}{2}}}\\)<\/span> 的混合点火结果<\/li>\n<\/ul>\n<h3 id=\"topic-wallis-full-h9\">2. <span class=\"math-inline\">\\(\\displaystyle \\color{blue}{\\int_{0}^{2\\pi}} \\sin^m x \\cos^n x \\, dx\\)<\/span><\/h3>\n<ul>\n<li><strong>若 <span class=\"math-inline\">\\(\\sin\\)<\/span> 或 <span class=\"math-inline\">\\(\\cos\\)<\/span> 只要有一个奇次：<span class=\"math-inline\">\\(= \\boldsymbol{0}\\)<\/span><\/strong><\/li>\n<li>若全为偶次：<span class=\"math-inline\">\\(= \\boldsymbol{4 \\times \\displaystyle \\int_{0}^{\\frac{\\pi}{2}}}\\)<\/span> 的混合点火结果<\/li>\n<\/ul>\n<h3 id=\"topic-wallis-full-h10\">3. 对称区间 <span class=\"math-inline\">\\(\\displaystyle \\color{blue}{\\int_{-\\frac{\\pi}{2}}^{\\frac{\\pi}{2}}} \\sin^m x \\cos^n x \\, dx\\)<\/span><\/h3>\n<p><strong>利用奇偶性<\/strong>：<\/p>\n<ul>\n<li><strong>被积函数为奇函数 → 直接为 <span class=\"math-inline\">\\(0\\)<\/span><\/strong><\/li>\n<li><strong>被积函数为偶函数 → <span class=\"math-inline\">\\(= \\boldsymbol{2 \\times \\displaystyle \\int_{0}^{\\frac{\\pi}{2}}}\\)<\/span> 的混合点火结果<\/strong><\/li>\n<\/ul>\n<p><strong>注<\/strong>：<span class=\"math-inline\">\\(\\sin^m x \\cos^n x\\)<\/span> 的奇偶性由 <span class=\"math-inline\">\\(m\\)<\/span> 决定：<span class=\"math-inline\">\\(\\sin\\)<\/span> 为奇，<span class=\"math-inline\">\\(\\cos\\)<\/span> 为偶，故整体奇偶性 = <span class=\"math-inline\">\\((-1)^m\\)<\/span>。即 <strong><span class=\"math-inline\">\\(m\\)<\/span> 为奇数时函数为奇函数，<span class=\"math-inline\">\\(m\\)<\/span> 为偶数时为偶函数<\/strong><\/p>\n<hr />\n", "summary": "<hr />\n<h2 id=\"topic-wallis-full-h1\">一、纯点火（基础华莱士）<\/h2>\n<p>设 <span class=\"math-inline\">\\(n\\)<\/span> 为正整数<\/p>\n<p><span class=\"math-display\">\\[\\int_{0}^{\\frac{\\pi}{2}} \\sin^n x \\, dx = \\int_{0}^{\\frac{\\pi}{2}} \\cos^n x \\, dx\\]<\/span><\/p>\n<ul>\n<li><strong>当 <span class=\"math-inline\">\\(n\\)<\/span> 为偶数时<\/strong>：\n<span class=\"math-display\">\\[\\int_{0}^{\\frac{\\pi}{2}} \\sin^n x \\, dx = \\frac{n-1}{n} \\cdot \\frac{n-3}{n-2} \\cdots \\frac12 \\cdot \\frac{\\pi}{2}\\]<\/span><\/li>\n<li><strong>当 <span class=\"math-inline\">\\(n\\)<\/span> 为奇数时<\/strong>：\n<span class=\"math-display\">\\[\\int_{0}^{\\frac{\\pi}{2}} \\sin^n x \\, dx = \\frac{n-1}{n} \\cdot \\frac{n-3}{n-2} \\cdots \\frac23 \\cdot 1\\]<\/span><\/li>\n<\/ul>\n<hr />\n<h2 id=\"topic-wallis-full-h2\">二、混合点火公式<\/h2>\n<p><span class=\"math-display\">\\[I = \\int_{0}^{\\frac{\\pi}{2}} \\sin^m x \\cdot \\cos^n x \\, dx\\]<\/span><\/p>\n<h3 id=\"topic-wallis-full-h3\">规则口诀（考试直接背）<\/h3>\n<p>以下双阶乘公式适用于 <span class=\"math-inline\">\\(m,n\\)<\/span> 为<strong>非负整数<\/strong>，约定 <span class=\"math-inline\">\\((-1)!!=0!!=1\\)<\/span>。<\/p>\n<ol>\n<li><strong>分子<\/strong>：<span class=\"math-inline\">\\(m\\)<\/span>、<span class=\"math-inline\">\\(n\\)<\/span> 各减 1，再分别每次减 2 连乘，得到 <span class=\"math-inline\">\\((m-1)!!(n-1)!!\\)<\/span><\/li>\n<li><strong>分母<\/strong>：从<strong>幂次之和 <span class=\"math-inline\">\\(m+n\\)<\/span><\/strong> 开始，每次减 2 连乘，得到 <span class=\
