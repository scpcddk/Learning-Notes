顺序主子式全部 <span class=\"math-inline\">\\(0\\)<\/span>”不能简单改成“全部 <span class=\"math-inline\">\\(\\geq0\\)<\/span>”来判半正定。例如 <span class=\"math-inline\">\\(A=\\operatorname{diag}(0,-1)\\)<\/span> 的顺序主子式为 <span class=\"math-inline\">\\(0,0\\)<\/span>，但 <span class=\"math-inline\">\\(x^\\mathrm{T}Ax=-x_2^2\\)<\/span> 可为负；它还有一个一阶主子式 <span class=\"math-inline\">\\(a_{22}=-1&lt;0\\)<\/span>。<\/p>\n<\/blockquote>\n<p><strong>例<\/strong>：<span class=\"math-inline\">\\(A=\\operatorname{diag}(1,0,2)\\)<\/span> 的一阶主子式为 <span class=\"math-inline\">\\(1,0,2\\)<\/span>，二阶主子式为 <span class=\"math-inline\">\\(0,2,0\\)<\/span>，三阶主子式为 <span class=\"math-inline\">\\(0\\)<\/span>，全部非负，因此半正定；但取 <span class=\"math-inline\">\\(x=(0,1,0)^\\mathrm{T}\\)<\/span> 时 <span class=\"math-inline\">\\(x^\\mathrm{T}Ax=0\\)<\/span>，所以不正定。<\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p>本笔记采用“半正定包含正定”的定义。若要强调半正定但非正定，可补充 <span class=\"math-inline\">\\(R(A)&lt;n\\)<\/span>，即至少有一个零特征值。高阶矩阵的全部主子式较多，实际计算可优先考虑特征值或配方。<\/p>\n<\/blockquote>\n<h3 id=\"sec-quad-full-h21\">4. 正定矩阵的重要性质<\/h3>\n<p>设 <span class=\"math-inline\">\\(A\\)<\/span> 正定，则：<\/p>\n<ol>\n<li><span class=\"math-inline\">\\(A^{-1}\\)<\/span> 也正定；<\/li>\n<li><span class=\"math-inline\">\\(A^*\\)<\/span>（伴随矩阵）也正定<\/li>\n<li><span class=\"math-inline\">\\(A^k\\)<\/span>（<span class=\"math-inline\">\\(k\\)<\/span> 为正整数）也正定<\/li>\n<li>若 <span class=\"math-inline\">\\(B\\)<\/span> 正定（或半正定），则 <span class=\"math-inline\">\\(A+B\\)<\/span> 正定<\/li>\n<li><span class=\"math-inline\">\\(A\\)<\/span> 的主对角线元素都大于 <span class=\"math-inline\">\\(0\\)<\/span><\/li>\n<li>正定二次型经过可逆线性替换后仍是正定的<\/li>\n<\/ol>\n<blockquote class=\"callout important\"><p class=\"callout-label\">关键结论<\/p><p>对于 <span class=\"math-inline\">\\(n\\)<\/span> 阶实对称矩阵：正定 <span class=\"math-inline\">\\(\\Leftrightarrow\\)<\/span> 正惯性指数 <span class=\"math-inline\">\\(=n\\)<\/span> <span class=\"math-inline\">\\(\\Leftrightarrow\\)<\/span> <span class=\"math-inline\">\\(n\\)<\/span> 个特征值全 <span class=\"math-inline\">\\(0\\)<\/span> <span class=\"math-inline\">\\(\\Leftrightarrow\\)<\/span> <span class=\"math-inline\">\\(A\\simeq E\\)<\/span> <span class=\"math-inline\">\\(\\Leftrightarrow\\)<\/span> 标准形系数全 <span class=\"math-inline\">\\(0\\)<\/span> <span class=\"math-inline\">\\(\\Leftrightarrow\\)<\/span> 各阶顺序主子式全 <span class=\"math-inline\">\\(0\\)<\/span>。<\/p>\n<p>正定 <span class=\"math-inline\">\\(\\Rightarrow |A|&gt;0\\)<\/span>，反向一般不成立。例如 <span class=\"math-inline\">\\(A=\\operatorname{diag}(-1,-1)\\)<\/span> 有 <span class=\"math-inline\">\\(|A|=1&gt;0\\)<\/span>，但 <span class=\"math-inline\">\\(A\\)<\/span> 负定。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"sec-quad-full-h22\">第五节 贯通例题：对角化、标准形、规范形与正定性<\/h2>\n<p>承接第五章，考虑<\/p>\n<p><span class=\"math-display\">\\[f=2x_1^2+2x_2^2+3x_3^2+2x_1x_2,\\qquad\nA=\\begin{pmatrix}2&amp;1&amp;0\\\\1&amp;2&amp;0\\\\0&amp;0&amp;3\\end{pmatrix}.\\]<\/span><\/p>\n<p><strong>1. 写出矩阵。<\/strong> 交叉项 <span class=\"math-inline\">\\(2x_1x_2\\)<\/span> 的系数除以 <span class=\"math-inline\">\\(2\\)<\/span>，得到 <span class=\"math-inline\">\\(a_{12}=a_{21}=1\\)<\/span>。<\/p>\n<p><strong>2. 用正交变换化为标准形。<\/strong> 第五章已求出<\/p>\n<p><span class=\"math-display\">\\[Q=\\begin{pmatrix}1/\\sqrt2&amp;1/\\sqrt2&amp;0\\\\-1/\\sqrt2&amp;1/\\sqrt2&amp;0\\\\0&amp;0&amp;1\\end{pmatrix},\n\\qquad Q^\\mathrm{T}AQ=\\operatorname{diag}(1,3,3).\\]<\/span><\/p>\n<p>令 <span class=\"math-inline\">\\(x=Qy\\)<\/span>，即<\/p>\n<p><span class=\"math-display\">\\[x_1=\\frac{y_1+y_2}{\\sqrt2},\\qquad x_2=\\frac{-y_1+y_2}{\\sqrt2},\\qquad x_3=y_3,\\]<\/span><\/p>\n<p>代入得到标准形<\/p>\n<p><span class=\"math-display\">\\[\\boxed{f=y_1^2+3y_2^2+3y_3^2.}\\]<\/span><\/p>\n<p><strong>3. 继续化为规范形。<\/strong> 令 <span class=\"math-inline\">\\(z_1=y_1,z_2=\\sqrt3y_2,z_3=\\sqrt3y_3\\)<\/span>，则<\/p>\n<p><span class=\"math-display\">\\[f=z_1^2+z_2^2+z_3^2.\\]<\/span><\/p>\n<p>总变换为 <span class=\"math-inline\">\\(x=Cz\\)<\/span>，其中 <span class=\"math-inline\">\\(C=Q\\operatorname{diag}(1,1/\\sqrt3,1/\\sqrt3)\\)<\/span>，满足 <span class=\"math-inline\">\\(C^\\mathrm{T}AC=E\\)<\/span>。这里 <span class=\"math-inline\">\\(C\\)<\/span> 可逆，但不再是正交矩阵；化规范形通常需要额外缩放。<\/p>\n<p><strong>4. 用三种方式交叉判断正定。<\/strong><\/p>\n<ul>\n<li>特征值为 <span class=\"math-inline\">\\(1,3,3\\)<\/span>，全为正，所以 <span class=\"math-inline\">\\(A\\)<\/span> 正定。<\/li>\n<li>顺序主子式 <span class=\"math-inline\">\\(D_1=2,D_2=3,D_3=9\\)<\/span>，全为正，所以 <span class=\"math-inline\">\\(A\\)<\/span> 正定。<\/li>\n<li>直接配方：<span class=\"math-inline\">\\(f=2(x_1+x_2/2)^2+\\frac32x_2^2+3x_3^2\\)<\/span>。只有 <span class=\"math-inline\">\\(x=0\\)<\/span> 时三个平方项才能同时为零，所以正定。<\/li>\n<\/ul>\n<p>因此 <span class=\"math-inline\">\\(R(A)=3\\)<\/span>，正惯性指数为 <span class=\"math-inline\">\\(3\\)<\/span>，负惯性指数为 <span class=\"math-inline\">\\(0\\)<\/span>，符号差为 <span class=\"math-inline\">\\(3\\)<\/span>。<\/p>\n<hr />\n<h2 id=\"sec-quad-full-h23\">第六节 二次型应用实例（概要）<\/h2>\n<h3 id=\"sec-quad-full-h24\">1. 二次曲面图形的判定<\/h3>\n<p>利用正交变换（保持图形形状不变）和平移变换，将二次曲面方程化为标准形，从而判定曲面类型（椭球面、双曲面、抛物面等）。<\/p>\n<h3 id=\"sec-quad-full-h25\">2. 多元函数极值的判定（Hesse 矩阵）<\/h3>\n<p>设 <span class=\"math-inline\">\\(n\\)<\/span> 元函数 <span class=\"math-inline\">\\(f(\\boldsymbol{x})\\)<\/span> 在内点 <span class=\"math-inline\">\\(\\boldsymbol{x}_0\\)<\/span> 的某邻域内具有二阶连续偏导数，则\n<span class=\"math-display\">\\[H(\\boldsymbol{x}_0)=\\begin{pmatrix}\nf&#x27;&#x27;_{11}&amp;f&#x27;&#x27;_{12}&amp;\\cdots&amp;f&#x27;&#x27;_{1n}\\\\\nf&#x27;&#x27;_{21}&amp;f&#x27;&#x27;_{22}&amp;\\cdots&amp;f&#x27;&#x27;_{2n}\\\\\n\\vdots&amp;\\vdots&amp;\\ddots&amp;\\vdots\\\\\nf&#x27;&#x27;_{n1}&amp;f&#x27;&#x27;_{n2}&amp;\\cdots&amp;f&#x27;&#x27;_{nn}\n\\end{pmatrix}\\]<\/span>\n称为 <span class=\"math-inline\">\\(f\\)<\/span> 在 <span class=\"math-inline\">\\(\\boldsymbol{x}_0\\)<\/span> 处的 Hesse 矩阵。<\/p>\n<p><strong>以下判别均以 <span class=\"math-inline\">\\(\\boldsymbol{x}_0\\)<\/span> 为驻点，即 <span class=\"math-inline\">\\(\\nabla f(\\boldsymbol{x}_0)=\\boldsymbol{0}\\)<\/span> 为前提：<\/strong><\/p>\n<ul>\n<li><span class=\"math-inline\">\\(H(\\boldsymbol{x}_0)\\)<\/span> 正定 <span class=\"math-inline\">\\(\\Rightarrow\\)<\/span> <span class=\"math-inline\">\\(f\\)<\/span> 在 <span class=\"math-inline\">\\(\\boldsymbol{x}_0\\)<\/span> 取严格极小值；<\/li>\n<li><span class=\"math-inline\">\\(H(\\boldsymbol{x}_0)\\)<\/span> 负定 <span class=\"math-inline\">\\(\\Rightarrow\\)<\/span> <span class=\"math-inline\">\\(f\\)<\/span> 在 <span class=\"math-inline\">\\(\\boldsymbol{x}_0\\)<\/span> 取严格极大值；<\/li>\n<li><span class=\"math-inline\">\\(H(\\boldsymbol{x}_0)\\)<\/span> 不定 <span class=\"math-inline\">\\(\\Rightarrow\\)<\/span> <span class=\"math-inline\">\\(\\boldsymbol{x}_0\\)<\/span> 不是极值点；<\/li>\n<li><span class=\"math-inline\">\\(H(\\boldsymbol{x}_0)\\)<\/span> 半正定/半负定 <span class=\"math-inline\">\\(\\Rightarrow\\)<\/span> 需另行判定<\/li>\n<\/ul>\n<hr />\n<hr />\n", "search": "\n\n   第一节 二次型的基本概念\n\n    1. 定义\n\n  定义 6.1  :\n\n n  个变量  x_1,x_2, cdots,x_n  的二次齐次函数\n\n  \nf(x_1,x_2, cdots,x_n)= sum_ i,j=1 ^ n a_ ij x_ix_j\n  \n\n称为一个  n  元二次型，简称  二次型  \n\n  当系数  a_ ij   均为实数时称为实二次型（本章仅讨论实二次型）\n\n    2. 矩阵表示\n\n由于  x_ix_j=x_jx_i ，令  a_ ij =a_ ji  （ i neq j ），则二次型可写成：\n\n  \n boxed f( boldsymbol x )= boldsymbol x ^ mathrm T A boldsymbol x  \n  \n\n其中   boldsymbol x =(x_1, cdots,x_n)^ mathrm T  ， A=(a_ ij )_ n times n   为实对称矩阵\n\n  [!NOTE]\n    关键性质  ：二次型  f  与实对称矩阵  A  一一对应\n\n  定义 6.2  ：\n\n称上式为  n  元二次型的矩阵表示，实对称矩阵  A  称为二次型  f  的矩阵， f  称为实对称矩阵  A  的二次型，  R(A)  称为二次型  f  的秩\n\n  [!NOTE]\n  1. 平方项系数直接放主对角线\n  2. 交叉项系数除以 2，分别放在两个对称位置上\n   例： -x_2x_3  的系数为  -1 ，则  a_ 23 =a_ 32 =- frac 1  2  \n\n    3. 标准形与规范形\n\n-   标准形（定义 6.3）  ：只含平方项的二次型\n    \n  f=d_1y_1^2+d_2y_2^2+ cdots+d_ny_n^2\n    \n  其矩阵为对角矩阵\n-   规范形  ：标准形中系数  d_i  只  在    1,-1,0    中取值  的形式(先1，后-1，最后0)：\n    \n  f=y_1^2+ cdots+y_p^2-y_ p+1 ^2- cdots-y_r^2\n    \n\n---\n\n   第二节 用正交变换化二次型为标准形\n\n    1.   线性变换与合同  \n\n设   boldsymbol x =C boldsymbol y  （ C  为  n  阶方阵）：\n\n-    C  可逆   Rightarrow  可逆线性变换，逆变换   boldsymbol y =C^ -1  boldsymbol x    \n-    C  正交矩阵   Rightarrow  正交变换（必可逆）  \n\n代入二次型：\n  \nf= boldsymbol x ^ mathrm T A boldsymbol x = boldsymbol y ^ mathrm T (C^ mathrm T AC) boldsymbol y = boldsymbol y ^ mathrm T B boldsymbol y \n  \n其中  B=C^ mathrm T AC \n\n  定义 6.4（合同）  ：\n\n设  A,B  为同阶方阵，若存在可逆矩阵  C  ，使  B=C^ mathrm T AC 。则称  A  与  B    合同  ，记作  A simeq B ，或称矩阵B是A的  合同矩阵  ，对方阵A作运算 C^ mathrm T AC 称为对A进行  合同变换  ，可逆矩阵C称为把A变为B的  合同变换矩阵  \n\n  [!NOTE]\n    定理 6.1  ：\n \n  对二次型作线性变换仍变为二次型；若变换可逆，则二次型的秩不变\n\n  [!WARNING]\n  合同   Rightarrow  等价   Rightarrow  等秩；但等价不一定合同\n\n     合同的基本性质\n\n若  A simeq B ，则：\n1.  R(A)=R(B) \n2.  A  对称   Leftrightarrow   B  对称\n3.  A,B  可逆   Rightarrow   A^ -1  simeq B^ -1  \n4.  A^ mathrm T  simeq B^ mathrm T  \n\n    2. 正交变换化标准形\n\n  定理 6.2  ：\n\n任意  n  元实二次型  f= boldsymbol x ^ mathrm T A boldsymbol x  ，都可经正交变换   boldsymbol x =Q boldsymbol y   化为标准形：\n\n  \n boxed f= boldsymbol y ^ mathrm T  Lambda boldsymbol y = lambda_1y_1^2+ lambda_2y_2^2+ cdots+ lambda_ny_n^2 \n  \n其中   Lambda= mathrm diag ( lambda_1, cdots, lambda_n) ，  lambda_i  恰为  A  的  n  个特征值\n\n  [!NOTE]\n    步骤  （与实对称矩阵正交相似对角化完全一致）：\n \n  1. 写出二次型矩阵  A \n  2. 求  A  的特征值\n  3. 求特征向量并正交单位化\n  4. 构造正交矩阵  Q=( xi_1, xi_2, cdots, xi_n) ，得   boldsymbol x =Q boldsymbol y  \n\n- 正交变换不唯一，所得标准形也不一定相同（特征值排列顺序可不同）\n-   保范性  ：正交变换保持向量长度不变： | boldsymbol x |=| boldsymbol y | \n\n    3. 等价、相似、正交相似、合同的关系\n\n| 关系 | 条件 | 公式 |\n|------|------|------|\n|   等价   |  A,B  同型，存在可逆  P,Q  |  PAQ=B  |\n|   相似   |  A,B  同阶，存在可逆  P  |  P^ -1 AP=B  |\n|   正交相似   |  A,B  同阶，存在正交  P  |  P^ -1 AP=P^ mathrm T AP=B  |\n|   合同   |  A,B  同阶，存在可逆  P  |  P^ mathrm T AP=B  |\n\n  [!NOTE]\n \n    推论 1  ： A,B  为  n  阶实对称矩阵，若  A sim B （相似），则  A simeq B （合同）\n    推论 2  ：任意实二次型都可经可逆变换化为规范形\n\n```mermaid\ngraph TD\n    A[相似] --  D[等价]\n\n    B[合同] --  D\n\n    C[正交相似] --  A\n    C --  B\n    C --  D\n```\n\n---\n\n   第三节   用配方法化二次型为标准形  \n\n    1. 配方法步骤\n\n  情形一：含有平方项  （如  a_ 11  neq 0 ）\n\n把所有含  x_1  的项集中配成完全平方，使配方后其余项中不再含  x_1 ；再对  x_2  配方，以此类推\n\n  情形二：不含平方项，只有交叉项  （如  a_ ii =0  但  a_ ij  neq 0 ）\n\n先作可逆线性变换产生平方项：\n  \n begin cases \nx_i=y_i+y_j  \nx_j=y_i-y_j  \nx_k=y_k quad(k neq i,j)\n end cases \n  \n再按情形一配方\n\n    2. 初等变换法（合同变换法）\n\n在竖向分块矩阵   begin pmatrix A  E end pmatrix   上，对上半块  A  成对作对应的初等行、列变换；对下半块  E  只作相应的列变换。具体地，每次先仅对上半块左乘初等矩阵  R ，再对整个竖向分块矩阵右乘  R^ mathrm T  ，使上半块成为  RAR^ mathrm T  。重复后：\n\n  \n begin pmatrix A    hline E end pmatrix  xrightarrow  text 上半块作对应行、列变换，下半块只作列变换   begin pmatrix  Lambda    hline C end pmatrix \n  \n则  C^ mathrm T AC= Lambda ，令   boldsymbol x =C boldsymbol y   即得标准形。这里的“对应”指行变换矩阵与列变换矩阵互为转置；例如  r_i leftarrow r_i+kr_j  对应  c_i leftarrow c_i+kc_j ，不能任意搭配。\n\n---\n\n   第四节 正定二次型\n\n    1. 惯性定理\n\n  定理 6.3（惯性定理）  ：\n\n设实二次型  f= boldsymbol x ^ mathrm T A boldsymbol x   的秩为  r ，在不同可逆线性变换下的标准形分别为\n  \nf= lambda_1y_1^2+ cdots+ lambda_ry_r^2, quad f= mu_1z_1^2+ cdots+ mu_rz_r^2\n  \n则   lambda_1, cdots, lambda_r  中正数的个数与   mu_1, cdots, mu_r  中正数的个数  相同  \n\n  定义 6.5  ：\n\n- 标准形中正系数的个数   rightarrow    正惯性指数  （记为  p ）\n- 标准形中负系数的个数   rightarrow    负惯性指数  （记为  r-p ）\n-   符号差    =  正惯性指数  -  负惯性指数  =2p-r \n\n  [!NOTE]\n    推论  ： n  阶实对称矩阵  A  与  B    合同的充要条件  是： A  与  B  的大于  0  的特征值个数和小于  0  的特征值个数  分别相同  \n\n    2. 正定性定义\n\n  定义 6.6  ：\n\n设  f= boldsymbol x ^ mathrm T A boldsymbol x   为实二次型，\n- 若对任意   boldsymbol x  neq boldsymbol 0  ，都有  f 0 ，称  f  为  正定二次型  ， A  为  正定矩阵  \n- 若对任意   boldsymbol x  neq boldsymbol 0  ，都有  f<0 ，称  f  为  负定二次型  ， A  为  负定矩阵  \n\n  定义 6.7  ：\n\n- 若对任意   boldsymbol x  neq boldsymbol 0  ，都有  f geq 0 ，称  f  为  半正定二次型  ， A  为  半正定矩阵  \n- 若对任意   boldsymbol x  neq boldsymbol 0  ，都有  f leq 0 ，称  f  为  半负定二次型  ， A  为  半负定矩阵  \n\n  [!TIP]\n    注意区分：   半正定允许  f=0 （如  f=x_1^2+2x_2^2+0 cdot x_3^2 ，取  (0,0,1)  时  f=0 ）\n\n    3. 正定性判定定理\n\n  补充定义：不定。   若存在向量  u,v ，使  u^ mathrm T Au 0 、 v^ mathrm T Av<0 ，则称二次型（及其实对称矩阵）  不定  。例如  f=x_1^2-x_2^2 。\n\n     方法一：惯性指数法\n\n  定理 6.4  ：\n\n n  元实二次型  f= boldsymbol x ^ mathrm T A boldsymbol x   为  正定的充要条件  是  f  的正惯性指数等于  n \n\n f  为负定的  充要条件  是  f  的负惯性指数等于  n \n\n  推论 1  ：半正定的充要条件是负惯性指数等于  0 ；半负定的充要条件是正惯性指数等于  0 \n\n     方法二：特征值法\n\n  推论 2  ： n  阶实对称矩阵  A \n\n- 正定   Leftrightarrow   A  的  n  个特征值全是正数\n- 负定   Leftrightarrow   A  的  n  个特征值全是负数\n- 半正定   Leftrightarrow   A  没有负特征值（特征值   geq 0 ）\n- 半负定   Leftrightarrow   A  没有正特征值（特征值   leq 0 ）\n\n     方法三：顺序主子式法（最实用）\n\n  定义 6.8  ：\n\n n  阶方阵  A=(a_ ij )  的左上角的  k  阶子式\n  \nD_k= begin vmatrix \na_ 11 & cdots&a_ 1k   \n vdots& ddots& vdots  \na_ k1 & cdots&a_ kk \n end vmatrix  quad(k=1,2, cdots,n)\n  \n称为  A  的  k  阶顺序主子式\n\n  定理 6.5（Hurwitz 赫尔维茨定理）  ：\n\n以下设  A  为实对称矩阵。\n\n-  A  正定   Leftrightarrow    各阶  顺序主子式  都大于    0 \n    D_1 0, ;D_2 0, ; cdots, ;D_n=|A| 0  \n-  A  负定   Leftrightarrow    奇数阶  顺序主子式  <0 ，  偶数阶  顺序主子式   0 \n    D_1<0, ;D_2 0, ;D_3<0, ; cdots  \n\n     方法四：半正定的全部主子式判据\n\n  主子式与顺序主子式的区别：   在  A  中选取同一组下标对应的行和列，得到的子式称为  主子式  。顺序主子式只取下标  1, dots,k ，是主子式的一部分。\n\n例如三阶矩阵的二阶主子式有  A[  1,2  ] 、 A[  1,3  ] 、 A[  2,3  ]  的行列式，顺序二阶主子式仅为第一种。这里  A[I]  表示同时保留下标集合  I  对应的行、列所得的方阵。\n\n对实对称矩阵  A ：\n\n   boxed A text  半正定    Longleftrightarrow  A text  的所有主子式均非负 .   \n\n因为  A  半负定等价于  -A  半正定，所以半负定的对应判据为：每个  k  阶主子式  M  都满足  (-1)^kM geq0 。\n\n  [!WARNING]\n  正定的“顺序主子式全部   0 ”不能简单改成“全部   geq0 ”来判半正定。例如  A= operatorname diag (0,-1)  的顺序主子式为  0,0 ，但  x^ mathrm T Ax=-x_2^2  可为负；它还有一个一阶主子式  a_ 22 =-1<0 。\n\n  例  ： A= operatorname diag (1,0,2)  的一阶主子式为  1,0,2 ，二阶主子式为  0,2,0 ，三阶主子式为  0 ，全部非负，因此半正定；但取  x=(0,1,0)^ mathrm T   时  x^ mathrm T Ax=0 ，所以不正定。\n\n  [!NOTE]\n  本笔记采用“半正定包含正定”的定义。若要强调半正定但非正定，可补充  R(A)<n ，即至少有一个零特征值。高阶矩阵的全部主子式较多，实际计算可优先考虑特征值或配方。\n\n    4. 正定矩阵的重要性质\n\n设  A  正定，则：\n\n1.  A^ -1   也正定；\n2.  A^  （伴随矩阵）也正定\n3.  A^k （ k  为正整数）也正定\n4. 若  B  正定（或半正定），则  A+B  正定\n5.  A  的主对角线元素都大于  0 \n6. 正定二次型经过可逆线性替换后仍是正定的\n\n  [!IMPORTANT]\n  对于  n  阶实对称矩阵：正定   Leftrightarrow  正惯性指数  =n    Leftrightarrow   n  个特征值全   0    Leftrightarrow   A simeq E    Leftrightarrow  标准形系数全   0    Leftrightarrow  各阶顺序主子式全   0 。\n \n  正定   Rightarrow |A| 0 ，反向一般不成立。例如  A= operatorname diag (-1,-1)  有  |A|=1 0 ，但  A  负定。\n\n---\n\n   第五节 贯通例题：对角化、标准形、规范形与正定性\n\n承接第五章，考虑\n\n  \nf=2x_1^2+2x_2^2+3x_3^2+2x_1x_2, qquad\nA= begin pmatrix 2&1&0  1&2&0  0&0&3 end pmatrix .\n  \n\n  1. 写出矩阵。   交叉项  2x_1x_2  的系数除以  2 ，得到  a_ 12 =a_ 21 =1 。\n\n  2. 用正交变换化为标准形。   第五章已求出\n\n  \nQ= begin pmatrix 1/ sqrt2&1/ sqrt2&0  -1/ sqrt2&1/ sqrt2&0  0&0&1 end pmatrix ,\n qquad Q^ mathrm T AQ= operatorname diag (1,3,3).\n  \n\n令  x=Qy ，即\n\n  x_1= frac y_1+y_2   sqrt2 , qquad x_2= frac -y_1+y_2   sqrt2 , qquad x_3=y_3,  \n\n代入得到标准形\n\n   boxed f=y_1^2+3y_2^2+3y_3^2.   \n\n  3. 继续化为规范形。   令  z_1=y_1,z_2= sqrt3y_2,z_3= sqrt3y_3 ，则\n\n  f=z_1^2+z_2^2+z_3^2.  \n\n总变换为  x=Cz ，其中  C=Q operatorname diag (1,1/ sqrt3,1/ sqrt3) ，满足  C^ mathrm T AC=E 。这里  C  可逆，但不再是正交矩阵；化规范形通常需要额外缩放。\n\n  4. 用三种方式交叉判断正定。  \n\n- 特征值为  1,3,3 ，全为正，所以  A  正定。\n- 顺序主子式  D_1=2,D_2=3,D_3=9 ，全为正，所以  A  正定。\n- 直接配方： f=2(x_1+x_2/2)^2+ frac32x_2^2+3x_3^2 。只有  x=0  时三个平方项才能同时为零，所以正定。\n\n因此  R(A)=3 ，正惯性指数为  3 ，负惯性指数为  0 ，符号差为  3 。\n\n---\n\n   第六节 二次型应用实例（概要）\n\n    1. 二次曲面图形的判定\n\n利用正交变换（保持图形形状不变）和平移变换，将二次曲面方程化为标准形，从而判定曲面类型（椭球面、双曲面、抛物面等）。\n\n    2. 多元函数极值的判定（Hesse 矩阵）\n\n设  n  元函数  f( boldsymbol x )  在内点   boldsymbol x _0  的某邻域内具有二阶连续偏导数，则\n  \nH( boldsymbol x _0)= begin pmatrix \nf''_ 11 &f''_ 12 & cdots&f''_ 1n   \nf''_ 21 &f''_ 22 & cdots&f''_ 2n   \n vdots& vdots& ddots& vdots  \nf''_ n1 &f''_ n2 & cdots&f''_ nn \n end pmatrix \n  \n称为  f  在   boldsymbol x _0  处的 Hesse 矩阵。\n\n  以下判别均以   boldsymbol x _0  为驻点，即   nabla f( boldsymbol x _0)= boldsymbol 0   为前提：  \n\n-  H( boldsymbol x _0)  正定   Rightarrow   f  在   boldsymbol x _0  取严格极小值；\n-  H( boldsymbol x _0)  负定   Rightarrow   f  在   boldsymbol x _0  取严格极大值；\n-  H( boldsymbol x _0)  不定   Rightarrow    boldsymbol x _0  不是极值点；\n-  H( boldsymbol x _0)  半正定/半负定   Rightarrow  需另行判定\n\n---\n\n---\n\n"}, {"id": "sec-space", "number": "07", "title": "线性空间与变换", "description": "用基、核与像，把前六章连成一个整体。", "tags": ["换基", "核与像", "正交投影"], "source": "../../数学/线性代数/基础概念/笔记/%E7%AC%AC%E4%B8%83%E7%AB%A0%20%E7%BA%BF%E6%80%A7%E7%A9%BA%E9%97%B4%E4%B8%8E%E7%BA%BF%E6%80%A7%E5%8F%98%E6%8D%A2.md", "summary": "<h2 id=\"sec-space-quick-h1\">基是坐标的参照，换基解释相似<\/h2>\n<p>若新基＝旧基乘 <span class=\"math-inline\">\\(C\\)<\/span>，则旧坐标 <span class=\"math-inline\">\\(x\\)<\/span> 与新坐标 <span class=\"math-inline\">\\(y\\)<\/span> 满足<\/p>\n<p><span class=\"math-display\">\\[x=Cy,\\qquad B=C^{-1}AC.\\]<\/span><\/p>\n<p><span class=\"math-inline\">\\(A,B\\)<\/span> 是同一线性变换在两组基下的矩阵。<\/p>\n<h2 id=\"sec-space-quick-h2\">核与像，连接空间和方程组<\/h2>\n<p><span class=\"math-display\">\\[\\ker T=\\{v:T(v)=0\\},\\qquad\\operatorname{Im}T=\\{T(v):v\\in V\\}.\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\boxed{\\dim\\ker T+\\dim\\operatorname{Im}T=\\dim V.}\\]<\/span><\/p>\n<p>对 <span class=\"math-inline\">\\(T(x)=Ax\\)<\/span>，核就是齐次解空间，像就是列空间。核为零等价于单射，像等于目标空间等价于满射。<\/p>\n<h2 id=\"sec-space-quick-h3\">子空间的和、交与直和<\/h2>\n<p><span class=\"math-display\">\\[\\dim(U+W)=\\dim U+\\dim W-\\dim(U\\cap W).\\]<\/span><\/p>\n<p><span class=\"math-inline\">\\(U\\cap W=\\{0\\}\\)<\/span> 时，<span class=\"math-inline\">\\(U+W\\)<\/span> 是直和，每个向量的分解唯一。<\/p>\n<h2 id=\"sec-space-quick-h4\">正交投影：空间里最近的点<\/h2>\n<p>若 <span class=\"math-inline\">\\(Q\\)<\/span> 的列是 <span class=\"math-inline\">\\(U\\)<\/span> 的规范正交基，则<\/p>\n<p><span class=\"math-display\">\\[p=QQ^\\mathrm{T}x,\\qquad x-p\\in U^\\perp.\\]<\/span><\/p>\n<p>若基矩阵 <span class=\"math-inline\">\\(M\\)<\/span> 非空、列满秩但不正交，使用 <span class=\"math-inline\">\\(p=M(M^\\mathrm{T}M)^{-1}M^\\mathrm{T}x\\)<\/span>。<\/p>\n<p>完整笔记还包括换基计算、核与像例题、到平面的投影，以及矩阵四个基本子空间的对照表。<\/p>\n", "full": "<h2 id=\"sec-space-full-h1\">第一节 线性空间的概念与性质<\/h2>\n<h3 id=\"sec-space-full-h2\">一、线性空间的定义<\/h3>\n<p><strong>定义 7.1<\/strong>：<\/p>\n<p>设 <span class=\"math-inline\">\\(V\\)<\/span> 是一个非空集合，<span class=\"math-inline\">\\(\\mathbb{R}\\)<\/span> 是实数域。在 <span class=\"math-inline\">\\(V\\)<\/span> 中元素间定义了加法运算（对任意 <span class=\"math-inline\">\\(\\alpha,\\beta \\in V\\)<\/span>，有唯一的 <span class=\"math-inline\">\\(\\gamma=\\alpha+\\beta \\in V\\)<\/span>），在实数与 <span class=\"math-inline\">\\(V\\)<\/span> 中元素间定义了数乘运算（对任意 <span class=\"math-inline\">\\(k \\in \\mathbb{R}, \\alpha \\in V\\)<\/span>，有唯一的 <span class=\"math-inline\">\\(\\delta=k\\alpha \\in V\\)<\/span>），且这两种运算满足以下八条规则：<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>加法规则<\/th>\n<th>数乘规则<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>(1) <span class=\"math-inline\">\\(\\alpha+\\beta=\\beta+\\alpha\\)<\/span>（交换律）<\/td>\n<td>(5) <span class=\"math-inline\">\\(1\\alpha=\\alpha\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>(2) <span class=\"math-inline\">\\((\\alpha+\\beta)+\\gamma=\\alpha+(\\beta+\\gamma)\\)<\/span>（结合律）<\/td>\n<td>(6) <span class=\"math-inline\">\\(k(l\\alpha)=(kl)\\alpha\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>(3) 存在零元素 <span class=\"math-inline\">\\(\\mathbf{0}\\)<\/span>，使 <span class=\"math-inline\">\\(\\alpha+\\mathbf{0}=\\alpha\\)<\/span><\/td>\n<td>(7) <span class=\"math-inline\">\\((k+l)\\alpha=k\\alpha+l\\alpha\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>(4) 对任意 <span class=\"math-inline\">\\(\\alpha\\)<\/span>，存在负元素 <span class=\"math-inline\">\\(-\\alpha\\)<\/span>，使 <span class=\"math-inline\">\\(\\alpha+(-\\alpha)=\\mathbf{0}\\)<\/span><\/td>\n<td>(8) <span class=\"math-inline\">\\(k(\\alpha+\\beta)=k\\alpha+k\\beta\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>则称 <span class=\"math-inline\">\\(V\\)<\/span> 是（实数域 <span class=\"math-inline\">\\(\\mathbb{R}\\)<\/span> 上的）<strong>线性空间<\/strong>（或向量空间）。<span class=\"math-inline\">\\(V\\)<\/span> 中的元素不论其本来性质如何，统称为<strong>向量<\/strong><\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>核心理解<\/strong>：线性空间 = <strong>定义了线性运算<\/strong>（加法+数乘）且<strong>满足八条规则<\/strong>的集合。向量不一定是 <span class=\"math-inline\">\\(n\\)<\/span> 元有序数组，也可以是矩阵、多项式、函数等<\/p>\n<\/blockquote>\n<p><strong>常见例子（务必熟悉）<\/strong>：<\/p>\n<ul>\n<li><span class=\"math-inline\">\\(\\mathbb{R}^{m \\times n}\\)<\/span>：所有 <span class=\"math-inline\">\\(m \\times n\\)<\/span> 实矩阵，对矩阵加法和数乘构成线性空间<\/li>\n<li><span class=\"math-inline\">\\(\\mathbb{R}[x]_n\\)<\/span>：次数小于 <span class=\"math-inline\">\\(n\\)<\/span> 的实多项式全体，基为 <span class=\"math-inline\">\\(1, x, x^2, \\dots, x^{n-1}\\)<\/span>，是 <span class=\"math-inline\">\\(n\\)<\/span> 维线性空间<\/li>\n<li><span class=\"math-inline\">\\(C[a,b]\\)<\/span>：<span class=\"math-inline\">\\([a,b]\\)<\/span> 上所有连续函数，是无限维线性空间<\/li>\n<li><strong>反例<\/strong>：<span class=\"math-inline\">\\(n\\)<\/span> 次实多项式全体 <span class=\"math-inline\">\\(P_n\\)<\/span>（<span class=\"math-inline\">\\(n \\geq 1\\)<\/span>）不是线性空间（无零元素，对加法不封闭）<\/li>\n<\/ul>\n<h3 id=\"sec-space-full-h3\">二、<strong>线性空间的基本性质<\/strong><\/h3>\n<p><strong>性质 7.1<\/strong>：<\/p>\n<p>一个线性空间的<strong>零向量是唯一<\/strong>的<\/p>\n<p><strong>性质 7.2<\/strong>：<\/p>\n<p>线性空间中每个向量的负向量是唯一的<\/p>\n<p><strong>性质 7.3<\/strong>：<\/p>\n<p><span class=\"math-inline\">\\(0\\alpha=\\mathbf{0}\\)<\/span>，<span class=\"math-inline\">\\((-1)\\alpha=-\\alpha\\)<\/span>，<span class=\"math-inline\">\\(k\\mathbf{0}=\\mathbf{0}\\)<\/span><\/p>\n<p><strong>性质 7.4<\/strong>：<\/p>\n<p>若 <span class=\"math-inline\">\\(k\\alpha=\\mathbf{0}\\)<\/span>，则 <span class=\"math-inline\">\\(k=0\\)<\/span> 或 <span class=\"math-inline\">\\(\\alpha=\\mathbf{0}\\)<\/span><\/p>\n<h3 id=\"sec-space-full-h4\">三、线性子空间<\/h3>\n<p><strong>定义 7.2<\/strong>：<\/p>\n<p>设 <span class=\"math-inline\">\\(U\\)<\/span> 是线性空间 <span class=\"math-inline\">\\(V\\)<\/span> 的一个非空子集，如果它对 <span class=\"math-inline\">\\(V\\)<\/span> 中定义的加法和数乘两种运算也构成线性空间，则称 <span class=\"math-inline\">\\(U\\)<\/span> 是 <span class=\"math-inline\">\\(V\\)<\/span> 的一个<strong>线性子空间<\/strong>（简称<strong>子空间<\/strong>）<\/p>\n<p><strong>特殊子空间<\/strong>：<\/p>\n<ul>\n<li><strong>零子空间<\/strong>：<span class=\"math-inline\">\\(\\{\\mathbf{0}\\}\\)<\/span> ,仅由零向量组成的集合<\/li>\n<li><strong>平凡子空间<\/strong>：<span class=\"math-inline\">\\(\\{\\mathbf{0}\\}\\)<\/span> 和 <span class=\"math-inline\">\\(V\\)<\/span> 本身<\/li>\n<li><strong>非平凡子空间<\/strong>：<span class=\"math-inline\">\\(V\\)<\/span> 的其他子空间<\/li>\n<\/ul>\n<p><strong>定理 7.1（子空间判定定理）<\/strong>：<\/p>\n<p>设 <span class=\"math-inline\">\\(U\\)<\/span> 是 <span class=\"math-inline\">\\(V\\)<\/span> 的非空子集，则 <span class=\"math-inline\">\\(U\\)<\/span> 是 <span class=\"math-inline\">\\(V\\)<\/span> 子空间的充要条件是它对 <span class=\"math-inline\">\\(V\\)<\/span> 的加法和数乘运算封闭：<\/p>\n<ol>\n<li>若 <span class=\"math-inline\">\\(\\alpha,\\beta \\in U\\)<\/span>，则 <span class=\"math-inline\">\\(\\alpha+\\beta \\in U\\)<\/span>；<\/li>\n<li>若 <span class=\"math-inline\">\\(\\alpha \\in U, k \\in \\mathbb{R}\\)<\/span>，则 <span class=\"math-inline\">\\(k\\alpha \\in U\\)<\/span>。<\/li>\n<\/ol>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p>快速判断口诀：非空 + 加法封闭 + 数乘封闭<\/p>\n<\/blockquote>\n<p>例 7.6 结论（常考）：<\/p>\n<ul>\n<li><strong>是子空间<\/strong>：<span class=\"math-inline\">\\(n\\)<\/span> 阶实对角矩阵、实对称矩阵、实反对称矩阵、实上（下）三角矩阵的集合<\/li>\n<li><strong>不是子空间<\/strong>：<span class=\"math-inline\">\\(n\\)<\/span> 阶实可逆矩阵集合（不含零矩阵，也不对加法封闭）；当 <span class=\"math-inline\">\\(n\\geq 2\\)<\/span> 时，<span class=\"math-inline\">\\(n\\)<\/span> 阶实不可逆矩阵集合也不是子空间（对加法不封闭）。注意 <span class=\"math-inline\">\\(n=1\\)<\/span> 时，不可逆矩阵集合仅为 <span class=\"math-inline\">\\(\\{(0)\\}\\)<\/span>，是零子空间。<\/li>\n<\/ul>\n<hr />\n<h3 id=\"sec-space-full-h5\">四、子空间的交、和与直和<\/h3>\n<p>设 <span class=\"math-inline\">\\(U,W\\)<\/span> 是同一线性空间 <span class=\"math-inline\">\\(V\\)<\/span> 的子空间。<\/p>\n<ul>\n<li><strong>交空间<\/strong>：<span class=\"math-inline\">\\(U\\cap W=\\{x\\mid x\\in U\\text{ 且 }x\\in W\\}\\)<\/span>，仍是子空间。<\/li>\n<li><strong>和空间<\/strong>：<span class=\"math-inline\">\\(U+W=\\{u+w\\mid u\\in U,w\\in W\\}\\)<\/span>，是包含 <span class=\"math-inline\">\\(U,W\\)<\/span> 的最小子空间。<\/li>\n<li><strong>直和<\/strong>：若 <span class=\"math-inline\">\\(U\\cap W=\\{0\\}\\)<\/span>，称 <span class=\"math-inline\">\\(U+W\\)<\/span> 为直和，记作 <span class=\"math-inline\">\\(U\\oplus W\\)<\/span>。等价地，和空间中的每个向量都能<strong>唯一<\/strong>写成 <span class=\"math-inline\">\\(u+w\\)<\/span>。<\/li>\n<\/ul>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p><span class=\"math-inline\">\\(U\\cup W\\)<\/span> 一般不是子空间。例如 <span class=\"math-inline\">\\(\\mathbb{R}^2\\)<\/span> 中的两条坐标轴，其并集不含 <span class=\"math-inline\">\\((1,1)^\\mathrm{T}\\)<\/span>，不对加法封闭。不要把“和空间”理解为“并集”。<\/p>\n<\/blockquote>\n<p><strong>维数公式（有限维）<\/strong>：<\/p>\n<p><span class=\"math-display\">\\[\\boxed{\\dim(U+W)=\\dim U+\\dim W-\\dim(U\\cap W).}\\]<\/span><\/p>\n<p><strong>理解<\/strong>：先取 <span class=\"math-inline\">\\(U\\cap W\\)<\/span> 的基，再分别扩充为 <span class=\"math-inline\">\\(U\\)<\/span> 和 <span class=\"math-inline\">\\(W\\)<\/span> 的基；合并时交空间的基只保留一份，就得到和空间的基。因此两边的维数相加后，要减去重复计数的交空间维数。<\/p>\n<p><strong>例<\/strong>：在 <span class=\"math-inline\">\\(\\mathbb{R}^3\\)<\/span> 中取<\/p>\n<p><span class=\"math-display\">\\[U=\\operatorname{span}\\{e_1,e_2\\},\\qquad W=\\operatorname{span}\\{e_2,e_3\\}.\\]<\/span><\/p>\n<p>则 <span class=\"math-inline\">\\(U\\cap W=\\operatorname{span}\\{e_2\\}\\)<\/span>，<span class=\"math-inline\">\\(U+W=\\mathbb{R}^3\\)<\/span>，维数满足 <span class=\"math-inline\">\\(3=2+2-1\\)<\/span>。因为交空间非零，这不是直和；而 <span class=\"math-inline\">\\(\\mathbb{R}^3=U\\oplus\\operatorname{span}\\{e_3\\}\\)<\/span>。<\/p>\n<p><strong>求基的方法<\/strong>：<\/p>\n<ol>\n<li>求 <span class=\"math-inline\">\\(U+W\\)<\/span> 的基：把两组基按列合并成矩阵，选取原矩阵主元列对应的向量。<\/li>\n<li>求 <span class=\"math-inline\">\\(U\\cap W\\)<\/span> 的基：设 <span class=\"math-inline\">\\(U\\)<\/span>、<span class=\"math-inline\">\\(W\\)<\/span> 的基矩阵分别为 <span class=\"math-inline\">\\(M,N\\)<\/span>，解 <span class=\"math-inline\">\\(Ma=Nb\\)<\/span>，即 <span class=\"math-inline\">\\((M,-N)(a,b)^\\mathrm{T}=0\\)<\/span>；将参数解代回 <span class=\"math-inline\">\\(x=Ma\\)<\/span>，再选出线性无关的生成向量。<\/li>\n<\/ol>\n<hr />\n<h2 id=\"sec-space-full-h6\">第二节 维数、基与坐标<\/h2>\n<h3 id=\"sec-space-full-h7\">一、基与维数<\/h3>\n<p><strong>定义 7.3<\/strong>：<\/p>\n<p>在线性空间 <span class=\"math-inline\">\\(V\\)<\/span> 中，如果有 <span class=\"math-inline\">\\(n\\)<\/span> 个向量 <span class=\"math-inline\">\\(\\alpha_1,\\alpha_2,\\dots,\\alpha_n\\)<\/span> <strong>线性无关<\/strong>，并且 <span class=\"math-inline\">\\(V\\)<\/span> 中任意向量都可以由它们线性表示，那么称 <span class=\"math-inline\">\\(\\alpha_1,\\alpha_2,\\dots,\\alpha_n\\)<\/span> 为 <span class=\"math-inline\">\\(V\\)<\/span> 的一个<strong>基<\/strong>，<span class=\"math-inline\">\\(n\\)<\/span> 称为 <span class=\"math-inline\">\\(V\\)<\/span> 的<strong>维数<\/strong>，<strong><span class=\"math-inline\">\\(V\\)<\/span> 称为 <span class=\"math-inline\">\\(n\\)<\/span> 维线性空间<\/strong>，记作 <span class=\"math-inline\">\\(V_n\\)<\/span><\/p>\n<ul>\n<li>仅含零向量的空间维数为 <span class=\"math-inline\">\\(0\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\(\\mathbb{R}[x], C[a,b]\\)<\/span> 是无限维线性空间，本书只讨论有限维<\/li>\n<\/ul>\n<p><strong>定理 7.2（基的扩充定理）<\/strong>：<\/p>\n<p>设 <span class=\"math-inline\">\\(V\\)<\/span> 是 <span class=\"math-inline\">\\(n\\)<\/span> 维线性空间，如果向量组 <span class=\"math-inline\">\\(\\alpha_1,\\dots,\\alpha_m\\)<\/span> <strong>线性无关<\/strong>且 <span class=\"math-inline\">\\(m &lt; n\\)<\/span>，那么在 <span class=\"math-inline\">\\(V\\)<\/span> 中必有 <span class=\"math-inline\">\\(n-m\\)<\/span> 个向量，使得它们与 <span class=\"math-inline\">\\(\\alpha_1,\\dots,\\alpha_m\\)<\/span> 一起构成 <span class=\"math-inline\">\\(V\\)<\/span> 的一个基<\/p>\n<p><strong>推论<\/strong> 如果 <span class=\"math-inline\">\\(U\\)<\/span> 是 <span class=\"math-inline\">\\(V\\)<\/span> 的子空间，则 <span class=\"math-inline\">\\(\\dim U \\leq \\dim V\\)<\/span> (维数) ；且当 <span class=\"math-inline\">\\(\\dim U = \\dim V\\)<\/span> 时，必有 <span class=\"math-inline\">\\(U=V\\)<\/span><\/p>\n<h3 id=\"sec-space-full-h8\">二、坐标<\/h3>\n<p><strong>定义 7.4<\/strong>：<\/p>\n<p>设 <span class=\"math-inline\">\\(\\alpha_1,\\dots,\\alpha_n\\)<\/span> 是线性空间 <span class=\"math-inline\">\\(V_n\\)<\/span> 的一个基，若 <span class=\"math-inline\">\\(\\alpha \\in V_n\\)<\/span> 可以表示为\n<span class=\"math-display\">\\[\\alpha = x_1\\alpha_1 + x_2\\alpha_2 + \\dots + x_n\\alpha_n\\]<\/span>\n则称 <span class=\"math-inline\">\\((x_1, x_2, \\dots, x_n)^T\\)<\/span> 为向量 <span class=\"math-inline\">\\(\\alpha\\)<\/span> 在基 <span class=\"math-inline\">\\(\\alpha_1,\\dots,\\alpha_n\\)<\/span> 下的<strong>坐标<\/strong><\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>关键<\/strong>：基不唯一，所以同一向量在不同基下的坐标一般不同<\/p>\n<\/blockquote>\n<h3 id=\"sec-space-full-h9\">三、同构<\/h3>\n<p><strong>定义 7.5<\/strong>：<\/p>\n<p>设 <span class=\"math-inline\">\\(U\\)<\/span> 和 <span class=\"math-inline\">\\(V\\)<\/span> 是两个线性空间，如果在它们的元素之间存在一一对应关系，且这种对应关系保持元素之间线性运算的对应，则称 <span class=\"math-inline\">\\(U\\)<\/span> 与 <span class=\"math-inline\">\\(V\\)<\/span> <strong>同构<\/strong><\/p>\n<p><strong>同构的性质<\/strong>：<\/p>\n<ul>\n<li><strong>反身性<\/strong>：<span class=\"math-inline\">\\(U\\)<\/span> 与 <span class=\"math-inline\">\\(U\\)<\/span> 同构<\/li>\n<li><strong>对称性<\/strong>：若 <span class=\"math-inline\">\\(U\\)<\/span> 与 <span class=\"math-inline\">\\(V\\)<\/span> 同构，则 <span class=\"math-inline\">\\(V\\)<\/span> 与 <span class=\"math-inline\">\\(U\\)<\/span> 同构<\/li>\n<li><strong>传递性<\/strong>：若 <span class=\"math-inline\">\\(U\\)<\/span> 与 <span class=\"math-inline\">\\(V\\)<\/span> 同构，<span class=\"math-inline\">\\(V\\)<\/span> 与 <span class=\"math-inline\">\\(W\\)<\/span> 同构，则 <span class=\"math-inline\">\\(U\\)<\/span> 与 <span class=\"math-inline\">\\(W\\)<\/span> 同构<\/li>\n<\/ul>\n<p><strong>重要结论<\/strong>：任意 <span class=\"math-inline\">\\(n\\)<\/span> 维线性空间 <span class=\"math-inline\">\\(V_n\\)<\/span> 都与 <span class=\"math-inline\">\\(\\mathbb{R}^n\\)<\/span> (实数域上的 n 维向量空间) 同构<\/p>\n<p><strong>有限维线性空间同构 <span class=\"math-inline\">\\(\\Leftrightarrow\\)<\/span> 维数相等<\/strong><\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p><strong>意义<\/strong>：<span class=\"math-inline\">\\(V_n\\)<\/span> 中抽象的线性运算可以转化为 <span class=\"math-inline\">\\(\\mathbb{R}^n\\)<\/span> 中的具体运算。但注意，<span class=\"math-inline\">\\(\\mathbb{R}^n\\)<\/span> 中的内积、长度、夹角等度量概念在一般的 <span class=\"math-inline\">\\(V_n\\)<\/span> 中<strong>不一定具备<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"sec-space-full-h10\">第三节 基变换与坐标变换<\/h2>\n<h3 id=\"sec-space-full-h11\">一、<strong>过渡矩阵<\/strong><\/h3>\n<p>设 <span class=\"math-inline\">\\(\\alpha_1,\\dots,\\alpha_n\\)<\/span> 和 <span class=\"math-inline\">\\(\\beta_1,\\dots,\\beta_n\\)<\/span> 是 <span class=\"math-inline\">\\(V_n\\)<\/span> 的两个基，则：\n<span class=\"math-display\">\\[(\\beta_1, \\beta_2, \\dots, \\beta_n) = (\\alpha_1, \\alpha_2, \\dots, \\alpha_n) C\\]<\/span><\/p>\n<p>其中\n<span class=\"math-display\">\\[C = \\begin{pmatrix}\nc_{11} &amp; c_{12} &amp; \\dots &amp; c_{1n} \\\\\nc_{21} &amp; c_{22} &amp; \\dots &amp; c_{2n} \\\\\n\\vdots &amp; \\vdots &amp; &amp; \\vdots \\\\\nc_{n1} &amp; c_{n2} &amp; \\dots &amp; c_{nn}\n\\end{pmatrix}\\]<\/span><\/p>\n<p><strong>定义 7.6<\/strong>：<\/p>\n<p>称上式为<strong>基变换公式<\/strong>，称可逆矩阵 <span class=\"math-inline\">\\(C\\)<\/span> 为由基 <span class=\"math-inline\">\\(\\alpha_1,\\dots,\\alpha_n\\)<\/span> 到基 <span class=\"math-inline\">\\(\\beta_1,\\dots,\\beta_n\\)<\/span> 的<strong>过渡矩阵<\/strong><\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p><strong>记忆技巧<\/strong>：<span class=\"math-inline\">\\(C\\)<\/span> 的第 <span class=\"math-inline\">\\(j\\)<\/span> 列就是 <span class=\"math-inline\">\\(\\beta_j\\)<\/span> 在基 <span class=\"math-inline\">\\(\\alpha\\)<\/span> 下的坐标。由于 <span class=\"math-inline\">\\(\\beta_1,\\dots,\\beta_n\\)<\/span> 线性无关，所以 <span class=\"math-inline\">\\(C\\)<\/span> 必可逆<\/p>\n<\/blockquote>\n<h3 id=\"sec-space-full-h12\">二、<strong>坐标变换公式<\/strong><\/h3>\n<p><strong>定理 7.3<\/strong>：<\/p>\n<p>设向量 <span class=\"math-inline\">\\(\\xi\\)<\/span> 在基 <span class=\"math-inline\">\\(\\alpha\\)<\/span> 和基 <span class=\"math-inline\">\\(\\beta\\)<\/span> 下的坐标分别为 <span class=\"math-inline\">\\(x=(x_1,\\dots,x_n)^T\\)<\/span> 和 <span class=\"math-inline\">\\(y=(y_1,\\dots,y_n)^T\\)<\/span>，则\n<span class=\"math-display\">\\[\\boxed{x = Cy}\\]<\/span>\n其中 <span class=\"math-inline\">\\(C\\)<\/span> 是由基 <span class=\"math-inline\">\\(\\alpha\\)<\/span> 到基 <span class=\"math-inline\">\\(\\beta\\)<\/span> 的过渡矩阵<\/p>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p><strong>注意方向<\/strong>：<span class=\"math-inline\">\\(x\\)<\/span> 是旧基（<span class=\"math-inline\">\\(\\alpha\\)<\/span>）下的坐标，<span class=\"math-inline\">\\(y\\)<\/span> 是新基（<span class=\"math-inline\">\\(\\beta\\)<\/span>）下的坐标。若已知 <span class=\"math-inline\">\\(x\\)<\/span> 求 <span class=\"math-inline\">\\(y\\)<\/span>，则 <span class=\"math-inline\">\\(y = C^{-1}x\\)<\/span><\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"sec-space-full-h13\">第四节 线性变换及其矩阵表示<\/h2>\n<h3 id=\"sec-space-full-h14\">一、线性变换的定义<\/h3>\n<p><strong>定义 7.7<\/strong>：<\/p>\n<p>设 <span class=\"math-inline\">\\(T\\)<\/span> 是线性空间 <span class=\"math-inline\">\\(V_n\\)<\/span> 到自身的一个映射，且对任意 <span class=\"math-inline\">\\(\\alpha,\\beta \\in V_n, k \\in \\mathbb{R}\\)<\/span>，都有：\n<span class=\"math-display\">\\[T(\\alpha+\\beta) = T(\\alpha)+T(\\beta), \\quad T(k\\alpha) = kT(\\alpha)\\]<\/span>\n那么称 <span class=\"math-inline\">\\(T\\)<\/span> 是 <span class=\"math-inline\">\\(V_n\\)<\/span> 的一个<strong>线性变换<\/strong><\/p>\n<p><strong>常见例子<\/strong>：<\/p>\n<ul>\n<li><span class=\"math-inline\">\\(T(A)=A^T\\)<\/span>（<strong>转置变换<\/strong>，这里取 <span class=\"math-inline\">\\(V=\\mathbb{R}^{n\\times n}\\)<\/span>，确保转置后仍在同一空间中）<\/li>\n<li><span class=\"math-inline\">\\(T(\\alpha)=A\\alpha\\)<\/span>（<strong>矩阵变换<\/strong>）<\/li>\n<li><span class=\"math-inline\">\\(D(p(x))=p&#x27;(x)\\)<\/span>（<strong>求导变换<\/strong>）<\/li>\n<li><span class=\"math-inline\">\\(T(\\alpha)=\\lambda\\alpha\\)<\/span>（<strong>数乘变换<\/strong>；<span class=\"math-inline\">\\(\\lambda=1\\)<\/span> 为恒等变换，<span class=\"math-inline\">\\(\\lambda=0\\)<\/span> 为零变换）<\/li>\n<\/ul>\n<p>线性变换的<strong>基本性质<\/strong>：<\/p>\n<ol>\n<li><span class=\"math-inline\">\\(T(\\mathbf{0})=\\mathbf{0}\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\(T(-\\alpha)=-T(\\alpha)\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\(T(k_1\\alpha_1+\\dots+k_m\\alpha_m) = k_1T(\\alpha_1)+\\dots+k_mT(\\alpha_m)\\)<\/span><\/li>\n<\/ol>\n<h3 id=\"sec-space-full-h15\">二、线性变换的矩阵<\/h3>\n<p><strong>定义 7.8<\/strong>：<\/p>\n<p>设 <span class=\"math-inline\">\\(T\\)<\/span> 是 <span class=\"math-inline\">\\(n\\)<\/span> 维线性空间 <span class=\"math-inline\">\\(V_n\\)<\/span> 的一个线性变换，<span class=\"math-inline\">\\(\\alpha_1,\\dots,\\alpha_n\\)<\/span> 是 <span class=\"math-inline\">\\(V_n\\)<\/span> 的一个基，如果\n<span class=\"math-display\">\\[T(\\alpha_i) = a_{1i}\\alpha_1 + a_{2i}\\alpha_2 + \\dots + a_{ni}\\alpha_n \\quad (i=1,2,\\dots,n)\\]<\/span>\n则称 <span class=\"math-inline\">\\(n\\)<\/span> 阶矩阵\n<span class=\"math-display\">\\[A = \\begin{pmatrix}\na_{11} &amp; a_{12} &amp; \\dots &amp; a_{1n} \\\\\na_{21} &amp; a_{22} &amp; \\dots &amp; a_{2n} \\\\\n\\vdots &amp; \\vdots &amp; &amp; \\vdots \\\\\na_{n1} &amp; a_{n2} &amp; \\dots &amp; a_{nn}\n\\end{pmatrix}\\]<\/span>\n是线性变换 <span class=\"math-inline\">\\(T\\)<\/span> 在基 <span class=\"math-inline\">\\(\\alpha_1,\\dots,\\alpha_n\\)<\/span> 下的<strong>矩阵<\/strong><\/p>\n<p><strong>矩阵表示<\/strong>：<\/p>\n<p><span class=\"math-display\">\\[T(\\alpha_1, \\alpha_2, \\dots, \\alpha_n) = (\\alpha_1, \\alpha_2, \\dots, \\alpha_n) A\\]<\/span><\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p><strong>核心<\/strong>：<span class=\"math-inline\">\\(A\\)<\/span> 的第 <span class=\"math-inline\">\\(i\\)<\/span> 列就是 <span class=\"math-inline\">\\(T(\\alpha_i)\\)<\/span> 在基 <span class=\"math-inline\">\\(\\alpha\\)<\/span> 下的坐标<\/p>\n<\/blockquote>\n<p><strong>运算对应<\/strong>：若 <span class=\"math-inline\">\\(\\alpha\\)<\/span> 在基 <span class=\"math-inline\">\\(\\alpha\\)<\/span> 下的坐标为 <span class=\"math-inline\">\\(x\\)<\/span>，则 <span class=\"math-inline\">\\(T(\\alpha)\\)<\/span> 在同一基下的坐标为 <span class=\"math-inline\">\\(Ax\\)<\/span><\/p>\n<hr />\n<h3 id=\"sec-space-full-h16\">三、同一线性变换在不同基下的矩阵<\/h3>\n<p>设旧基为 <span class=\"math-inline\">\\(\\mathcal{A}=(\\alpha_1,\\dots,\\alpha_n)\\)<\/span>，新基为 <span class=\"math-inline\">\\(\\mathcal{B}=(\\beta_1,\\dots,\\beta_n)\\)<\/span>，且 <span class=\"math-inline\">\\(\\mathcal{B}=\\mathcal{A}C\\)<\/span>。同一线性变换 <span class=\"math-inline\">\\(T\\)<\/span> 在旧基、新基下的矩阵分别为 <span class=\"math-inline\">\\(A,B\\)<\/span>，则<\/p>\n<p><span class=\"math-display\">\\[\\boxed{B=C^{-1}AC.}\\]<\/span><\/p>\n<p><strong>推导<\/strong>：对任一向量，旧坐标 <span class=\"math-inline\">\\(x\\)<\/span> 与新坐标 <span class=\"math-inline\">\\(y\\)<\/span> 满足 <span class=\"math-inline\">\\(x=Cy\\)<\/span>。变换后有 <span class=\"math-inline\">\\(x&#x27;=Ax\\)<\/span>、<span class=\"math-inline\">\\(y&#x27;=By\\)<\/span>，同时 <span class=\"math-inline\">\\(x&#x27;=Cy&#x27;\\)<\/span>，所以<\/p>\n<p><span class=\"math-display\">\\[ACy=CBy\\quad(\\text{对任意 }y),\\qquad AC=CB,\\qquad B=C^{-1}AC.\\]<\/span><\/p>\n<p>这说明第五章的相似矩阵，可以理解为<strong>同一个线性变换在不同基下的表示<\/strong>。选取特征向量作为基，就能在可对角化时得到对角矩阵。<\/p>\n<p><strong>例<\/strong>：<span class=\"math-inline\">\\(T\\)<\/span> 在标准基下的矩阵为 <span class=\"math-inline\">\\(A=\\operatorname{diag}(2,3)\\)<\/span>，新基为 <span class=\"math-inline\">\\(\\beta_1=e_1,\\beta_2=e_1+e_2\\)<\/span>，则<\/p>\n<p><span class=\"math-display\">\\[C=\\begin{pmatrix}1&amp;1\\\\0&amp;1\\end{pmatrix},\\qquad\nB=C^{-1}AC=\\begin{pmatrix}2&amp;-1\\\\0&amp;3\\end{pmatrix}.\\]<\/span><\/p>\n<p>也可直接检查：<span class=\"math-inline\">\\(T(\\beta_1)=2\\beta_1\\)<\/span>，<span class=\"math-inline\">\\(T(\\beta_2)=-\\beta_1+3\\beta_2\\)<\/span>，其坐标正是 <span class=\"math-inline\">\\(B\\)<\/span> 的两列。<\/p>\n<blockquote class=\"callout important\"><p class=\"callout-label\">关键结论<\/p><p>本笔记约定新基＝旧基乘 <span class=\"math-inline\">\\(C\\)<\/span>，因此旧坐标＝<span class=\"math-inline\">\\(C\\)<\/span> 乘新坐标，而新矩阵＝<span class=\"math-inline\">\\(C^{-1}AC\\)<\/span>。先写出基变换的方向，再使用公式。<\/p>\n<\/blockquote>\n<h3 id=\"sec-space-full-h17\">四、线性映射的核、像与秩—零度定理<\/h3>\n<p>将线性变换推广到两个空间之间：若 <span class=\"math-inline\">\\(T:V\\to W\\)<\/span> 保持加法、数乘，则称其为<strong>线性映射<\/strong>。前文的线性变换是 <span class=\"math-inline\">\\(W=V\\)<\/span> 的情形。<\/p>\n<p><strong>定义<\/strong>：<\/p>\n<p><span class=\"math-display\">\\[\\ker T=\\{v\\in V\\mid T(v)=0\\},\\qquad\n\\operatorname{Im}T=\\{T(v)\\mid v\\in V\\}.\\]<\/span><\/p>\n<p>其中 <span class=\"math-inline\">\\(\\ker T\\)<\/span> 称为<strong>核<\/strong>，是定义域 <span class=\"math-inline\">\\(V\\)<\/span> 的子空间；<span class=\"math-inline\">\\(\\operatorname{Im}T\\)<\/span> 称为<strong>像<\/strong>，是目标空间 <span class=\"math-inline\">\\(W\\)<\/span> 的子空间。<span class=\"math-inline\">\\(\\dim\\operatorname{Im}T\\)<\/span> 称为 <span class=\"math-inline\">\\(T\\)<\/span> 的<strong>秩<\/strong>，<span class=\"math-inline\">\\(\\dim\\ker T\\)<\/span> 称为<strong>零度<\/strong>。<\/p>\n<p>若 <span class=\"math-inline\">\\(V\\)<\/span> 有限维，则<\/p>\n<p><span class=\"math-display\">\\[\\boxed{\\dim\\ker T+\\dim\\operatorname{Im}T=\\dim V.}\\]<\/span><\/p>\n<p><strong>证明思路<\/strong>：取核的一组基 <span class=\"math-inline\">\\(v_1,\\dots,v_k\\)<\/span>，扩充为 <span class=\"math-inline\">\\(V\\)<\/span> 的基 <span class=\"math-inline\">\\(v_1,\\dots,v_n\\)<\/span>。前 <span class=\"math-inline\">\\(k\\)<\/span> 个基向量的像全为零，其余 <span class=\"math-inline\">\\(T(v_{k+1}),\\dots,T(v_n)\\)<\/span> 张成像空间。若它们的一个线性组合为零，对应的 <span class=\"math-inline\">\\(\\sum_{i=k+1}^n c_i v_i\\)<\/span> 就落在核中；利用整组基线性无关，得所有 <span class=\"math-inline\">\\(c_i=0\\)<\/span>。故像空间维数为 <span class=\"math-inline\">\\(n-k\\)<\/span>。<\/p>\n<p>对矩阵映射 <span class=\"math-inline\">\\(T(x)=Ax\\)<\/span>（<span class=\"math-inline\">\\(A\\)<\/span> 为 <span class=\"math-inline\">\\(m\\times n\\)<\/span> 实矩阵），有<\/p>\n<p><span class=\"math-display\">\\[\\ker T=\\{x\\mid Ax=0\\},\\quad\n\\operatorname{Im}T=\\operatorname{Col}(A),\\quad\n\\dim\\ker T=n-R(A).\\]<\/span><\/p>\n<p>这正是第四章“齐次方程组基础解系含 <span class=\"math-inline\">\\(n-R(A)\\)<\/span> 个向量”的来源。<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>映射性质<\/th>\n<th>等价条件<\/th>\n<th>矩阵条件<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>单射<\/td>\n<td><span class=\"math-inline\">\\(\\ker T=\\{0\\}\\)<\/span><\/td>\n<td><span class=\"math-inline\">\\(R(A)=n\\)<\/span>，列满秩<\/td>\n<\/tr>\n<tr>\n<td>满射到 <span class=\"math-inline\">\\(\\mathbb{R}^m\\)<\/span><\/td>\n<td><span class=\"math-inline\">\\(\\operatorname{Im}T=\\mathbb{R}^m\\)<\/span><\/td>\n<td><span class=\"math-inline\">\\(R(A)=m\\)<\/span>，行满秩<\/td>\n<\/tr>\n<tr>\n<td>同构 <span class=\"math-inline\">\\(\\mathbb{R}^n\\to\\mathbb{R}^n\\)<\/span><\/td>\n<td>同时单射、满射<\/td>\n<td><span class=\"math-inline\">\\(A\\)<\/span> 可逆<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>对于维数相等的有限维空间，线性映射为单射、满射、同构三者等价；若定义域、目标空间维数不同，则不能直接套用此等价关系。<\/p>\n<p><strong>例<\/strong>：取<\/p>\n<p><span class=\"math-display\">\\[T\\bigl((x_1,x_2,x_3)^\\mathrm{T}\\bigr)=(x_1+x_2,x_2+x_3)^\\mathrm{T},\\qquad\nA=\\begin{pmatrix}1&amp;1&amp;0\\\\0&amp;1&amp;1\\end{pmatrix}.\\]<\/span><\/p>\n<p>解 <span class=\"math-inline\">\\(Ax=0\\)<\/span> 得 <span class=\"math-inline\">\\(x=t(1,-1,1)^\\mathrm{T}\\)<\/span>，故核维数为 <span class=\"math-inline\">\\(1\\)<\/span>；<span class=\"math-inline\">\\(A\\)<\/span> 的两行线性无关，秩为 <span class=\"math-inline\">\\(2\\)<\/span>，像为 <span class=\"math-inline\">\\(\\mathbb{R}^2\\)<\/span>。于是 <span class=\"math-inline\">\\(1+2=3\\)<\/span>，<span class=\"math-inline\">\\(T\\)<\/span> 是满射但不是单射。<\/p>\n<h3 id=\"sec-space-full-h18\">五、线性映射的复合与矩阵乘法<\/h3>\n<p>若 <span class=\"math-inline\">\\(S,T\\)<\/span> 是 <span class=\"math-inline\">\\(V\\)<\/span> 上的线性变换，在同一基下的矩阵分别为 <span class=\"math-inline\">\\(B,A\\)<\/span>，则<\/p>\n<p><span class=\"math-display\">\\[[T\\circ S]=AB.\\]<\/span><\/p>\n<p>因为向量的坐标先经过 <span class=\"math-inline\">\\(B\\)<\/span> 变为 <span class=\"math-inline\">\\(Bx\\)<\/span>，再经过 <span class=\"math-inline\">\\(A\\)<\/span> 变为 <span class=\"math-inline\">\\(A(Bx)\\)<\/span>。复合顺序从右向左读取；若 <span class=\"math-inline\">\\(T\\)<\/span> 可逆，则 <span class=\"math-inline\">\\([T^{-1}]=A^{-1}\\)<\/span>。<\/p>\n<hr />\n<h2 id=\"sec-space-full-h19\">第五节 欧几里得空间<\/h2>\n<h3 id=\"sec-space-full-h20\">一、内积<\/h3>\n<p><strong>定义 7.9<\/strong>：<\/p>\n<p>设 <span class=\"math-inline\">\\(V\\)<\/span> 是实数域 <span class=\"math-inline\">\\(\\mathbb{R}\\)<\/span> 上的线性空间，若对 <span class=\"math-inline\">\\(V\\)<\/span> 中任意两个向量 <span class=\"math-inline\">\\(\\alpha,\\beta\\)<\/span> 都有一个实数 <span class=\"math-inline\">\\([\\alpha,\\beta]\\)<\/span> 与之对应，且满足：<\/p>\n<ol>\n<li><span class=\"math-inline\">\\([\\alpha,\\beta]=[\\beta,\\alpha]\\)<\/span>（对称性）<\/li>\n<li><span class=\"math-inline\">\\([\\alpha+\\beta,\\gamma]=[\\alpha,\\gamma]+[\\beta,\\gamma]\\)<\/span>（线性性）<\/li>\n<li><span class=\"math-inline\">\\([k\\alpha,\\beta]=k[\\alpha,\\beta]\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\([\\alpha,\\alpha] \\geq 0\\)<\/span>，且 <span class=\"math-inline\">\\([\\alpha,\\alpha]=0 \\Leftrightarrow \\alpha=\\mathbf{0}\\)<\/span>（正定性）<\/li>\n<\/ol>\n<p>则称 <span class=\"math-inline\">\\([\\alpha,\\beta]\\)<\/span> 为 <span class=\"math-inline\">\\(\\alpha\\)<\/span> 与 <span class=\"math-inline\">\\(\\beta\\)<\/span> 的<strong>内积<\/strong>，定义了内积的实线性空间称为<strong>实内积空间<\/strong>；有限维实内积空间通常称为<strong>欧几里得空间<\/strong>（<strong>欧氏空间<\/strong>）。<\/p>\n<p><strong>常见内积<\/strong>：<\/p>\n<ul>\n<li><span class=\"math-inline\">\\(\\mathbb{R}^n\\)<\/span> 中：<span class=\"math-inline\">\\([\\alpha,\\beta] = \\alpha^T\\beta = \\sum a_i b_i\\)<\/span><\/li>\n<li><span class=\"math-inline\">\\(C[a,b]\\)<\/span> 中（<span class=\"math-inline\">\\(a&lt;b\\)<\/span>）：<span class=\"math-inline\">\\([f,g] = \\int_a^b f(x)g(x)\\,dx\\)<\/span>，这是无限维实内积空间的例子。<\/li>\n<li><span class=\"math-inline\">\\(\\mathbb{R}^{m \\times n}\\)<\/span> 中：<span class=\"math-inline\">\\([A,B] = \\sum_{i,j} a_{ij}b_{ij}\\)<\/span><\/li>\n<\/ul>\n<h3 id=\"sec-space-full-h21\">二、长度、夹角与正交<\/h3>\n<p><strong>定义 7.10<\/strong>：<\/p>\n<p>在欧氏空间中，非负实数 <span class=\"math-inline\">\\(\\sqrt{[\\alpha,\\alpha]}\\)<\/span> 称为向量 <span class=\"math-inline\">\\(\\alpha\\)<\/span> 的<strong>长度<\/strong>（或范数），记为 <span class=\"math-inline\">\\(|\\alpha|\\)<\/span> 或 <span class=\"math-inline\">\\(\\|\\alpha\\|\\)<\/span><\/p>\n<p><strong>定义 7.11<\/strong>：<\/p>\n<p>两个非零向量 <span class=\"math-inline\">\\(\\alpha,\\beta\\)<\/span> 的<strong>夹角<\/strong>为\n<span class=\"math-display\">\\[\\langle \\alpha,\\beta \\rangle = \\arccos\\frac{[\\alpha,\\beta]}{|\\alpha||\\beta|}, \\quad 0 \\leq \\langle \\alpha,\\beta \\rangle \\leq \\pi\\]<\/span><\/p>\n<p><strong>定义 7.12<\/strong>：<\/p>\n<p>若 <span class=\"math-inline\">\\([\\alpha,\\beta]=0\\)<\/span>，则称 <span class=\"math-inline\">\\(\\alpha\\)<\/span> 与 <span class=\"math-inline\">\\(\\beta\\)<\/span> <strong>正交<\/strong><\/p>\n<p>（零向量与任意向量正交，但零向量与其他向量的夹角未定义；对两个非零向量，夹角为 <span class=\"math-inline\">\\(\\frac{\\pi}{2}\\)<\/span> <span class=\"math-inline\">\\(\\Leftrightarrow\\)<\/span> 正交。）<\/p>\n<h3 id=\"sec-space-full-h22\">三、正交基与 Schmidt 正交化<\/h3>\n<p><strong>定义 7.13<\/strong>：<\/p>\n<p>在欧氏空间中，一组两两正交的非零向量称为<strong>正交向量组<\/strong>。由单位向量构成的正交向量组称为<strong>规范正交向量组<\/strong><\/p>\n<p><strong>定理 7.5<\/strong>：<\/p>\n<p>正交向量组必线性无关<\/p>\n<p><strong>定理 7.6<\/strong>：<\/p>\n<p>在欧氏空间中，如果向量组 <span class=\"math-inline\">\\(\\alpha_1,\\dots,\\alpha_m\\)<\/span> 线性无关，则必有规范正交向量组 <span class=\"math-inline\">\\(\\varepsilon_1,\\dots,\\varepsilon_m\\)<\/span> 与之等价<\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p><strong>方法<\/strong>：<strong>Schmidt 正交化过程<\/strong>（与 <span class=\"math-inline\">\\(\\mathbb{R}^n\\)<\/span> 中形式完全相同，只是向量含义不同）<\/p>\n<\/blockquote>\n<p><strong>定义 7.14<\/strong>：<\/p>\n<p>在 <span class=\"math-inline\">\\(n\\)<\/span> 维欧氏空间 <span class=\"math-inline\">\\(V\\)<\/span> 中，含有 <span class=\"math-inline\">\\(n\\)<\/span> 个向量的正交向量组称为 <span class=\"math-inline\">\\(V\\)<\/span> 的<strong>正交基<\/strong>。由单位向量构成的正交基称为<strong>规范正交基<\/strong><\/p>\n<p>任意非零有限维欧氏空间都存在规范正交基。<\/p>\n<hr />\n<h3 id=\"sec-space-full-h23\">四、正交补与正交分解<\/h3>\n<p>在有限维欧氏空间 <span class=\"math-inline\">\\(V\\)<\/span> 中，子空间 <span class=\"math-inline\">\\(U\\)<\/span> 的<strong>正交补<\/strong>定义为<\/p>\n<p><span class=\"math-display\">\\[U^\\perp=\\{v\\in V\\mid [v,u]=0\\text{ 对所有 }u\\in U\\}.\\]<\/span><\/p>\n<p><span class=\"math-inline\">\\(U^\\perp\\)<\/span> 也是子空间，而且<\/p>\n<p><span class=\"math-display\">\\[\\boxed{V=U\\oplus U^\\perp,\\qquad \\dim U+\\dim U^\\perp=\\dim V.}\\]<\/span><\/p>\n<p>因此每个 <span class=\"math-inline\">\\(x\\in V\\)<\/span> 都可唯一写成 <span class=\"math-inline\">\\(x=p+r\\)<\/span>，其中 <span class=\"math-inline\">\\(p\\in U\\)<\/span>、<span class=\"math-inline\">\\(r\\in U^\\perp\\)<\/span>。称 <span class=\"math-inline\">\\(p\\)<\/span> 为 <span class=\"math-inline\">\\(x\\)<\/span> 在 <span class=\"math-inline\">\\(U\\)<\/span> 上的<strong>正交投影<\/strong>。<\/p>\n<h3 id=\"sec-space-full-h24\">五、投影公式与最短距离<\/h3>\n<p>若 <span class=\"math-inline\">\\(q_1,\\dots,q_r\\)<\/span> 是 <span class=\"math-inline\">\\(U\\)<\/span> 的规范正交基，则<\/p>\n<p><span class=\"math-display\">\\[\\boxed{\\operatorname{proj}_U x=\\sum_{i=1}^r[q_i,x]q_i.}\\]<\/span><\/p>\n<p>在 <span class=\"math-inline\">\\(\\mathbb{R}^n\\)<\/span> 的标准内积下，令 <span class=\"math-inline\">\\(Q=(q_1,\\dots,q_r)\\)<\/span>，则 <span class=\"math-inline\">\\(p=QQ^\\mathrm{T}x\\)<\/span>。注意 <span class=\"math-inline\">\\(Q\\)<\/span> 此时可为 <span class=\"math-inline\">\\(n\\times r\\)<\/span> 的长方形矩阵；当 <span class=\"math-inline\">\\(r&lt;n\\)<\/span> 时，它不是前文定义的正交方阵，但仍满足 <span class=\"math-inline\">\\(Q^\\mathrm{T}Q=E_r\\)<\/span>。<\/p>\n<p>若 <span class=\"math-inline\">\\(M\\)<\/span> 的列是 <span class=\"math-inline\">\\(U\\)<\/span> 的任意一组基（不必正交，且 <span class=\"math-inline\">\\(r\\geq1\\)<\/span>），则<\/p>\n<p><span class=\"math-display\">\\[p=M(M^\\mathrm{T}M)^{-1}M^\\mathrm{T}x.\\]<\/span><\/p>\n<p>因为基向量线性无关，<span class=\"math-inline\">\\(M\\)<\/span> 列满秩，从而 <span class=\"math-inline\">\\(M^\\mathrm{T}M\\)<\/span> 可逆。若 <span class=\"math-inline\">\\(U=\\{0\\}\\)<\/span>，则投影恒为零。<\/p>\n<p><strong>最短距离性质<\/strong>：对任意 <span class=\"math-inline\">\\(u\\in U\\)<\/span>，<span class=\"math-inline\">\\(x-p\\perp p-u\\)<\/span>，所以<\/p>\n<p><span class=\"math-display\">\\[\\|x-u\\|^2=\\|x-p\\|^2+\\|p-u\\|^2\\geq\\|x-p\\|^2.\\]<\/span><\/p>\n<p>故 <span class=\"math-inline\">\\(p\\)<\/span> 是 <span class=\"math-inline\">\\(U\\)<\/span> 中距离 <span class=\"math-inline\">\\(x\\)<\/span> 最近的唯一向量，距离为 <span class=\"math-inline\">\\(\\|x-p\\|\\)<\/span>。<\/p>\n<p><strong>例<\/strong>：设 <span class=\"math-inline\">\\(U=\\{x\\in\\mathbb{R}^3\\mid x_1+x_2+x_3=0\\}\\)<\/span>，求 <span class=\"math-inline\">\\(x=(1,2,3)^\\mathrm{T}\\)<\/span> 到 <span class=\"math-inline\">\\(U\\)<\/span> 的投影及距离。<\/p>\n<p>法向量为 <span class=\"math-inline\">\\(n=(1,1,1)^\\mathrm{T}\\)<\/span>，故 <span class=\"math-inline\">\\(U^\\perp=\\operatorname{span}\\{n\\}\\)<\/span>。先求法向分量，再减去：<\/p>\n<p><span class=\"math-display\">\\[r=\\frac{n^\\mathrm{T}x}{n^\\mathrm{T}n}n=2n=(2,2,2)^\\mathrm{T},\\qquad\np=x-r=(-1,0,1)^\\mathrm{T}.\\]<\/span><\/p>\n<p>检查 <span class=\"math-inline\">\\(-1+0+1=0\\)<\/span>，故 <span class=\"math-inline\">\\(p\\in U\\)<\/span>。距离为 <span class=\"math-inline\">\\(\\|r\\|=2\\sqrt3\\)<\/span>。对应投影矩阵<\/p>\n<p><span class=\"math-display\">\\[P=E-\\frac13nn^\\mathrm{T}=\\frac13\\begin{pmatrix}2&amp;-1&amp;-1\\\\-1&amp;2&amp;-1\\\\-1&amp;-1&amp;2\\end{pmatrix}.\\]<\/span><\/p>\n<p>它满足 <span class=\"math-inline\">\\(P^\\mathrm{T}=P,P^2=P\\)<\/span>；投影矩阵只可能有特征值 <span class=\"math-inline\">\\(0,1\\)<\/span>。<\/p>\n<h3 id=\"sec-space-full-h25\">六、矩阵的四个基本子空间<\/h3>\n<p>对 <span class=\"math-inline\">\\(m\\times n\\)<\/span> 实矩阵 <span class=\"math-inline\">\\(A\\)<\/span>，在标准内积下：<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>子空间<\/th>\n<th>所在空间<\/th>\n<th>维数<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>列空间 <span class=\"math-inline\">\\(\\operatorname{Col}(A)\\)<\/span><\/td>\n<td><span class=\"math-inline\">\\(\\mathbb{R}^m\\)<\/span><\/td>\n<td><span class=\"math-inline\">\\(R(A)\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>零空间 <span class=\"math-inline\">\\(\\ker A\\)<\/span><\/td>\n<td><span class=\"math-inline\">\\(\\mathbb{R}^n\\)<\/span><\/td>\n<td><span class=\"math-inline\">\\(n-R(A)\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>行空间 <span class=\"math-inline\">\\(\\operatorname{Col}(A^\\mathrm{T})\\)<\/span>（将行向量转为列向量）<\/td>\n<td><span class=\"math-inline\">\\(\\mathbb{R}^n\\)<\/span><\/td>\n<td><span class=\"math-inline\">\\(R(A)\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>左零空间 <span class=\"math-inline\">\\(\\ker A^\\mathrm{T}\\)<\/span><\/td>\n<td><span class=\"math-inline\">\\(\\mathbb{R}^m\\)<\/span><\/td>\n<td><span class=\"math-inline\">\\(m-R(A)\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>它们满足<\/p>\n<p><span class=\"math-display\">\\[\\ker A=\\operatorname{Col}(A^\\mathrm{T})^\\perp,\\qquad\n\\ker A^\\mathrm{T}=\\operatorname{Col}(A)^\\perp.\\]<\/span><\/p>\n<p>原因是 <span class=\"math-inline\">\\(Ax=0\\)<\/span> 恰好表示 <span class=\"math-inline\">\\(x\\)<\/span> 与 <span class=\"math-inline\">\\(A\\)<\/span> 的每一行都正交。因此 <span class=\"math-inline\">\\(Ax=b\\)<\/span> 有解，等价于 <span class=\"math-inline\">\\(b\\)<\/span> 与左零空间中的每个向量都正交。<\/p>\n<blockquote class=\"callout tip\"><p class=\"callout-label\">解题提示<\/p><p>第四章研究零空间与方程组，第五章研究在适当基下表示变换，第七章把它们统一为核、像、换基与正交分解。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"sec-space-full-h26\">第六节 线性空间应用实例<\/h2>\n<h3 id=\"sec-space-full-h27\">一、计算机图形学中的线性变换<\/h3>\n<p>图形由有限个顶点确定，每个顶点对应一个向量。常用变换：<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>变换<\/th>\n<th>矩阵形式<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>旋转变换<\/td>\n<td><span class=\"math-inline\">\\(\\begin{pmatrix} \\cos\\theta &amp; -\\sin\\theta \\\\ \\sin\\theta &amp; \\cos\\theta \\end{pmatrix}\\)<\/span><\/td>\n<td>绕原点逆时针旋转 <span class=\"math-inline\">\\(\\theta\\)<\/span> 角<\/td>\n<\/tr>\n<tr>\n<td>伸缩变换<\/td>\n<td><span class=\"math-inline\">\\(\\begin{pmatrix} k &amp; 0 \\\\ 0 &amp; k \\end{pmatrix}\\)<\/span><\/td>\n<td>沿坐标轴方向缩放 <span class=\"math-inline\">\\(k\\)<\/span> 倍<\/td>\n<\/tr>\n<tr>\n<td>平移变换<\/td>\n<td>引入齐次坐标后用矩阵实现<\/td>\n<td>本身不是线性变换，但在齐次坐标下可线性化<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>多个线性变换的复合 = 对应矩阵的乘积<\/p>\n<\/blockquote>\n<h3 id=\"sec-space-full-h28\">二、调味品配制问题（线性组合与基的应用）<\/h3>\n<p>将每种调味品的成分含量视为向量，问题转化为：<\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p>以下按允许任意实数系数的线性组合模型讨论。实际调配用量必须非负，还可能要求比例和为 <span class=\"math-inline\">\\(1\\)<\/span>；若有这些约束，不能仅凭秩或极大无关组确定最少购买种类，还需检验非负系数等条件。<\/p>\n<\/blockquote>\n<ul>\n<li>求生成子空间 <span class=\"math-inline\">\\(L(\\alpha_1,\\dots,\\alpha_6)\\)<\/span> 的维数 → 最少需要购买几种调味品<\/li>\n<li>求一组基 → 确定购买哪几种<\/li>\n<li>其余向量用基线性表示 → 如何调配<\/li>\n<\/ul>\n<p><strong>关键步骤<\/strong>：将成分矩阵化为行最简形，找出极大线性无关组<\/p>\n<p><strong>拓展阅读<\/strong>：<a href=\"../../数学/线性代数/基础概念/笔记/%E6%8B%93%E5%B1%95%E9%98%85%E8%AF%BB%20Cayley%E2%80%93Hamilton%E3%80%81%E6%9C%80%E5%B0%8F%E4%BA%8C%E4%B9%98%E4%B8%8ESVD.md\">最小二乘、SVD 与伪逆<\/a>，继续应用列空间、正交投影及核的概念。<\/p>\n<hr />\n<hr />\n", "search": "\n\n   第一节 线性空间的概念与性质\n\n    一、线性空间的定义\n\n  定义 7.1  ：\n\n设  V  是一个非空集合，  mathbb R   是实数域。在  V  中元素间定义了加法运算（对任意   alpha, beta  in V ，有唯一的   gamma= alpha+ beta  in V ），在实数与  V  中元素间定义了数乘运算（对任意  k  in  mathbb R ,  alpha  in V ，有唯一的   delta=k alpha  in V ），且这两种运算满足以下八条规则：\n\n| 加法规则 | 数乘规则 |\n|----------|----------|\n| (1)   alpha+ beta= beta+ alpha （交换律） | (5)  1 alpha= alpha  |\n| (2)  ( alpha+ beta)+ gamma= alpha+( beta+ gamma) （结合律） | (6)  k(l alpha)=(kl) alpha  |\n| (3) 存在零元素   mathbf 0  ，使   alpha+ mathbf 0 = alpha  | (7)  (k+l) alpha=k alpha+l alpha  |\n| (4) 对任意   alpha ，存在负元素  - alpha ，使   alpha+(- alpha)= mathbf 0   | (8)  k( alpha+ beta)=k alpha+k beta  |\n\n则称  V  是（实数域   mathbb R   上的）  线性空间  （或向量空间）。 V  中的元素不论其本来性质如何，统称为  向量  \n\n  [!TIP]\n    核心理解  ：线性空间 =   定义了线性运算  （加法+数乘）且  满足八条规则  的集合。向量不一定是  n  元有序数组，也可以是矩阵、多项式、函数等\n\n  常见例子（务必熟悉）  ：\n\n-   mathbb R ^ m  times n  ：所有  m  times n  实矩阵，对矩阵加法和数乘构成线性空间\n-   mathbb R [x]_n ：次数小于  n  的实多项式全体，基为  1, x, x^2,  dots, x^ n-1  ，是  n  维线性空间\n-  C[a,b] ： [a,b]  上所有连续函数，是无限维线性空间\n-   反例  ： n  次实多项式全体  P_n （ n  geq 1 ）不是线性空间（无零元素，对加法不封闭）\n\n    二、  线性空间的基本性质  \n\n  性质 7.1  ：\n\n一个线性空间的  零向量是唯一  的\n\n  性质 7.2  ：\n\n线性空间中每个向量的负向量是唯一的\n\n  性质 7.3  ：\n\n 0 alpha= mathbf 0  ， (-1) alpha=- alpha ， k mathbf 0 = mathbf 0  \n\n  性质 7.4  ：\n\n若  k alpha= mathbf 0  ，则  k=0  或   alpha= mathbf 0  \n\n    三、线性子空间\n\n  定义 7.2  ：\n\n设  U  是线性空间  V  的一个非空子集，如果它对  V  中定义的加法和数乘两种运算也构成线性空间，则称  U  是  V  的一个  线性子空间  （简称  子空间  ）\n\n  特殊子空间  ：\n\n-   零子空间  ：    mathbf 0     ,仅由零向量组成的集合\n-   平凡子空间  ：    mathbf 0     和  V  本身\n-   非平凡子空间  ： V  的其他子空间\n\n  定理 7.1（子空间判定定理）  ：\n\n设  U  是  V  的非空子集，则  U  是  V  子空间的充要条件是它对  V  的加法和数乘运算封闭：\n\n1. 若   alpha, beta  in U ，则   alpha+ beta  in U ；\n2. 若   alpha  in U, k  in  mathbb R  ，则  k alpha  in U 。\n\n  [!TIP]\n  快速判断口诀：非空 + 加法封闭 + 数乘封闭\n\n例 7.6 结论（常考）：\n\n-   是子空间  ： n  阶实对角矩阵、实对称矩阵、实反对称矩阵、实上（下）三角矩阵的集合\n-   不是子空间  ： n  阶实可逆矩阵集合（不含零矩阵，也不对加法封闭）；当  n geq 2  时， n  阶实不可逆矩阵集合也不是子空间（对加法不封闭）。注意  n=1  时，不可逆矩阵集合仅为    (0)   ，是零子空间。\n\n---\n\n    四、子空间的交、和与直和\n\n设  U,W  是同一线性空间  V  的子空间。\n\n-   交空间  ： U cap W=  x mid x in U text  且  x in W   ，仍是子空间。\n-   和空间  ： U+W=  u+w mid u in U,w in W   ，是包含  U,W  的最小子空间。\n-   直和  ：若  U cap W=  0   ，称  U+W  为直和，记作  U oplus W 。等价地，和空间中的每个向量都能  唯一  写成  u+w 。\n\n  [!WARNING]\n   U cup W  一般不是子空间。例如   mathbb R ^2  中的两条坐标轴，其并集不含  (1,1)^ mathrm T  ，不对加法封闭。不要把“和空间”理解为“并集”。\n\n  维数公式（有限维）  ：\n\n   boxed  dim(U+W)= dim U+ dim W- dim(U cap W).   \n\n  理解  ：先取  U cap W  的基，再分别扩充为  U  和  W  的基；合并时交空间的基只保留一份，就得到和空间的基。因此两边的维数相加后，要减去重复计数的交空间维数。\n\n  例  ：在   mathbb R ^3  中取\n\n  U= operatorname span   e_1,e_2  , qquad W= operatorname span   e_2,e_3  .  \n\n则  U cap W= operatorname span   e_2   ， U+W= mathbb R ^3 ，维数满足  3=2+2-1 。因为交空间非零，这不是直和；而   mathbb R ^3=U oplus operatorname span   e_3   。\n\n  求基的方法  ：\n\n1. 求  U+W  的基：把两组基按列合并成矩阵，选取原矩阵主元列对应的向量。\n2. 求  U cap W  的基：设  U 、 W  的基矩阵分别为  M,N ，解  Ma=Nb ，即  (M,-N)(a,b)^ mathrm T =0 ；将参数解代回  x=Ma ，再选出线性无关的生成向量。\n\n---\n\n   第二节 维数、基与坐标\n\n    一、基与维数\n\n  定义 7.3  ：\n\n在线性空间  V  中，如果有  n  个向量   alpha_1, alpha_2, dots, alpha_n    线性无关  ，并且  V  中任意向量都可以由它们线性表示，那么称   alpha_1, alpha_2, dots, alpha_n  为  V  的一个  基  ， n  称为  V  的  维数  ，   V  称为  n  维线性空间  ，记作  V_n \n\n- 仅含零向量的空间维数为  0 \n-   mathbb R [x], C[a,b]  是无限维线性空间，本书只讨论有限维\n\n  定理 7.2（基的扩充定理）  ：\n\n设  V  是  n  维线性空间，如果向量组   alpha_1, dots, alpha_m    线性无关  且  m < n ，那么在  V  中必有  n-m  个向量，使得它们与   alpha_1, dots, alpha_m  一起构成  V  的一个基\n\n  推论   如果  U  是  V  的子空间，则   dim U  leq  dim V  (维数) ；且当   dim U =  dim V  时，必有  U=V \n\n    二、坐标\n\n  定义 7.4  ：\n\n设   alpha_1, dots, alpha_n  是线性空间  V_n  的一个基，若   alpha  in V_n  可以表示为\n   alpha = x_1 alpha_1 + x_2 alpha_2 +  dots + x_n alpha_n  \n则称  (x_1, x_2,  dots, x_n)^T  为向量   alpha  在基   alpha_1, dots, alpha_n  下的  坐标  \n\n  [!TIP]\n    关键  ：基不唯一，所以同一向量在不同基下的坐标一般不同\n\n    三、同构\n\n  定义 7.5  ：\n\n设  U  和  V  是两个线性空间，如果在它们的元素之间存在一一对应关系，且这种对应关系保持元素之间线性运算的对应，则称  U  与  V    同构  \n\n  同构的性质  ：\n\n-   反身性  ： U  与  U  同构\n-   对称性  ：若  U  与  V  同构，则  V  与  U  同构\n-   传递性  ：若  U  与  V  同构， V  与  W  同构，则  U  与  W  同构\n\n  重要结论  ：任意  n  维线性空间  V_n  都与   mathbb R ^n  (实数域上的 n 维向量空间) 同构\n\n  有限维线性空间同构   Leftrightarrow  维数相等  \n\n  [!NOTE]\n    意义  ： V_n  中抽象的线性运算可以转化为   mathbb R ^n  中的具体运算。但注意，  mathbb R ^n  中的内积、长度、夹角等度量概念在一般的  V_n  中  不一定具备  \n\n---\n\n   第三节 基变换与坐标变换\n\n    一、  过渡矩阵  \n\n设   alpha_1, dots, alpha_n  和   beta_1, dots, beta_n  是  V_n  的两个基，则：\n  ( beta_1,  beta_2,  dots,  beta_n) = ( alpha_1,  alpha_2,  dots,  alpha_n) C  \n\n其中\n  C =  begin pmatrix \nc_ 11  & c_ 12  &  dots & c_ 1n    \nc_ 21  & c_ 22  &  dots & c_ 2n    \n vdots &  vdots & &  vdots   \nc_ n1  & c_ n2  &  dots & c_ nn \n end pmatrix   \n\n  定义 7.6  ：\n\n称上式为  基变换公式  ，称可逆矩阵  C  为由基   alpha_1, dots, alpha_n  到基   beta_1, dots, beta_n  的  过渡矩阵  \n\n  [!TIP]\n    记忆技巧  ： C  的第  j  列就是   beta_j  在基   alpha  下的坐标。由于   beta_1, dots, beta_n  线性无关，所以  C  必可逆\n\n    二、  坐标变换公式  \n\n  定理 7.3  ：\n\n设向量   xi  在基   alpha  和基   beta  下的坐标分别为  x=(x_1, dots,x_n)^T  和  y=(y_1, dots,y_n)^T ，则\n   boxed x = Cy   \n其中  C  是由基   alpha  到基   beta  的过渡矩阵\n\n  [!WARNING]\n    注意方向  ： x  是旧基（  alpha ）下的坐标， y  是新基（  beta ）下的坐标。若已知  x  求  y ，则  y = C^ -1 x \n\n---\n\n   第四节 线性变换及其矩阵表示\n\n    一、线性变换的定义\n\n  定义 7.7  ：\n\n设  T  是线性空间  V_n  到自身的一个映射，且对任意   alpha, beta  in V_n, k  in  mathbb R  ，都有：\n  T( alpha+ beta) = T( alpha)+T( beta),  quad T(k alpha) = kT( alpha)  \n那么称  T  是  V_n  的一个  线性变换  \n\n  常见例子  ：\n\n-  T(A)=A^T （  转置变换  ，这里取  V= mathbb R ^ n times n  ，确保转置后仍在同一空间中）\n-  T( alpha)=A alpha （  矩阵变换  ）\n-  D(p(x))=p'(x) （  求导变换  ）\n-  T( alpha)= lambda alpha （  数乘变换  ；  lambda=1  为恒等变换，  lambda=0  为零变换）\n\n线性变换的  基本性质  ：\n1.  T( mathbf 0 )= mathbf 0  \n2.  T(- alpha)=-T( alpha) \n3.  T(k_1 alpha_1+ dots+k_m alpha_m) = k_1T( alpha_1)+ dots+k_mT( alpha_m) \n\n    二、线性变换的矩阵\n\n  定义 7.8  ：\n\n设  T  是  n  维线性空间  V_n  的一个线性变换，  alpha_1, dots, alpha_n  是  V_n  的一个基，如果\n  T( alpha_i) = a_ 1i  alpha_1 + a_ 2i  alpha_2 +  dots + a_ ni  alpha_n  quad (i=1,2, dots,n)  \n则称  n  阶矩阵\n  A =  begin pmatrix \na_ 11  & a_ 12  &  dots & a_ 1n    \na_ 21  & a_ 22  &  dots & a_ 2n    \n vdots &  vdots & &  vdots   \na_ n1  & a_ n2  &  dots & a_ nn \n end pmatrix   \n是线性变换  T  在基   alpha_1, dots, alpha_n  下的  矩阵  \n\n  矩阵表示  ：\n\n  T( alpha_1,  alpha_2,  dots,  alpha_n) = ( alpha_1,  alpha_2,  dots,  alpha_n) A  \n\n  [!NOTE]\n    核心  ： A  的第  i  列就是  T( alpha_i)  在基   alpha  下的坐标\n\n  运算对应  ：若   alpha  在基   alpha  下的坐标为  x ，则  T( alpha)  在同一基下的坐标为  Ax \n\n---\n\n    三、同一线性变换在不同基下的矩阵\n\n设旧基为   mathcal A =( alpha_1, dots, alpha_n) ，新基为   mathcal B =( beta_1, dots, beta_n) ，且   mathcal B = mathcal A C 。同一线性变换  T  在旧基、新基下的矩阵分别为  A,B ，则\n\n   boxed B=C^ -1 AC.   \n\n  推导  ：对任一向量，旧坐标  x  与新坐标  y  满足  x=Cy 。变换后有  x'=Ax 、 y'=By ，同时  x'=Cy' ，所以\n\n  ACy=CBy quad( text 对任意  y), qquad AC=CB, qquad B=C^ -1 AC.  \n\n这说明第五章的相似矩阵，可以理解为  同一个线性变换在不同基下的表示  。选取特征向量作为基，就能在可对角化时得到对角矩阵。\n\n  例  ： T  在标准基下的矩阵为  A= operatorname diag (2,3) ，新基为   beta_1=e_1, beta_2=e_1+e_2 ，则\n\n  \nC= begin pmatrix 1&1  0&1 end pmatrix , qquad\nB=C^ -1 AC= begin pmatrix 2&-1  0&3 end pmatrix .\n  \n\n也可直接检查： T( beta_1)=2 beta_1 ， T( beta_2)=- beta_1+3 beta_2 ，其坐标正是  B  的两列。\n\n  [!IMPORTANT]\n  本笔记约定新基＝旧基乘  C ，因此旧坐标＝ C  乘新坐标，而新矩阵＝ C^ -1 AC 。先写出基变换的方向，再使用公式。\n\n    四、线性映射的核、像与秩—零度定理\n\n将线性变换推广到两个空间之间：若  T:V to W  保持加法、数乘，则称其为  线性映射  。前文的线性变换是  W=V  的情形。\n\n  定义  ：\n\n  \n ker T=  v in V mid T(v)=0  , qquad\n operatorname Im T=  T(v) mid v in V  .\n  \n\n其中   ker T  称为  核  ，是定义域  V  的子空间；  operatorname Im T  称为  像  ，是目标空间  W  的子空间。  dim operatorname Im T  称为  T  的  秩  ，  dim ker T  称为  零度  。\n\n若  V  有限维，则\n\n   boxed  dim ker T+ dim operatorname Im T= dim V.   \n\n  证明思路  ：取核的一组基  v_1, dots,v_k ，扩充为  V  的基  v_1, dots,v_n 。前  k  个基向量的像全为零，其余  T(v_ k+1 ), dots,T(v_n)  张成像空间。若它们的一个线性组合为零，对应的   sum_ i=k+1 ^n c_i v_i  就落在核中；利用整组基线性无关，得所有  c_i=0 。故像空间维数为  n-k 。\n\n对矩阵映射  T(x)=Ax （ A  为  m times n  实矩阵），有\n\n  \n ker T=  x mid Ax=0  , quad\n operatorname Im T= operatorname Col (A), quad\n dim ker T=n-R(A).\n  \n\n这正是第四章“齐次方程组基础解系含  n-R(A)  个向量”的来源。\n\n| 映射性质 | 等价条件 | 矩阵条件 |\n|----------|----------|----------|\n| 单射 |   ker T=  0    |  R(A)=n ，列满秩 |\n| 满射到   mathbb R ^m  |   operatorname Im T= mathbb R ^m  |  R(A)=m ，行满秩 |\n| 同构   mathbb R ^n to mathbb R ^n  | 同时单射、满射 |  A  可逆 |\n\n对于维数相等的有限维空间，线性映射为单射、满射、同构三者等价；若定义域、目标空间维数不同，则不能直接套用此等价关系。\n\n  例  ：取\n\n  T bigl((x_1,x_2,x_3)^ mathrm T  bigr)=(x_1+x_2,x_2+x_3)^ mathrm T , qquad\nA= begin pmatrix 1&1&0  0&1&1 end pmatrix .  \n\n解  Ax=0  得  x=t(1,-1,1)^ mathrm T  ，故核维数为  1 ； A  的两行线性无关，秩为  2 ，像为   mathbb R ^2 。于是  1+2=3 ， T  是满射但不是单射。\n\n    五、线性映射的复合与矩阵乘法\n\n若  S,T  是  V  上的线性变换，在同一基下的矩阵分别为  B,A ，则\n\n  [T circ S]=AB.  \n\n因为向量的坐标先经过  B  变为  Bx ，再经过  A  变为  A(Bx) 。复合顺序从右向左读取；若  T  可逆，则  [T^ -1 ]=A^ -1  。\n\n---\n\n   第五节 欧几里得空间\n\n    一、内积\n\n  定义 7.9  ：\n\n设  V  是实数域   mathbb R   上的线性空间，若对  V  中任意两个向量   alpha, beta  都有一个实数  [ alpha, beta]  与之对应，且满足：\n\n1.  [ alpha, beta]=[ beta, alpha] （对称性）\n2.  [ alpha+ beta, gamma]=[ alpha, gamma]+[ beta, gamma] （线性性）\n3.  [k alpha, beta]=k[ alpha, beta] \n4.  [ alpha, alpha]  geq 0 ，且  [ alpha, alpha]=0  Leftrightarrow  alpha= mathbf 0  （正定性）\n\n则称  [ alpha, beta]  为   alpha  与   beta  的  内积  ，定义了内积的实线性空间称为  实内积空间  ；有限维实内积空间通常称为  欧几里得空间  （  欧氏空间  ）。\n\n  常见内积  ：\n\n-   mathbb R ^n  中： [ alpha, beta] =  alpha^T beta =  sum a_i b_i \n-  C[a,b]  中（ a<b ）： [f,g] =  int_a^b f(x)g(x) ,dx ，这是无限维实内积空间的例子。\n-   mathbb R ^ m  times n   中： [A,B] =  sum_ i,j  a_ ij b_ ij  \n\n    二、长度、夹角与正交\n\n  定义 7.10  ：\n\n在欧氏空间中，非负实数   sqrt [ alpha, alpha]   称为向量   alpha  的  长度  （或范数），记为  | alpha|  或   | alpha | \n\n  定义 7.11  ：\n\n两个非零向量   alpha, beta  的  夹角  为\n   langle  alpha, beta  rangle =  arccos frac [ alpha, beta]  | alpha|| beta| ,  quad 0  leq  langle  alpha, beta  rangle  leq  pi  \n\n  定义 7.12  ：\n\n若  [ alpha, beta]=0 ，则称   alpha  与   beta    正交  \n\n（零向量与任意向量正交，但零向量与其他向量的夹角未定义；对两个非零向量，夹角为   frac  pi  2     Leftrightarrow  正交。）\n\n    三、正交基与 Schmidt 正交化\n\n  定义 7.13  ：\n\n在欧氏空间中，一组两两正交的非零向量称为  正交向量组  。由单位向量构成的正交向量组称为  规范正交向量组  \n\n  定理 7.5  ：\n\n正交向量组必线性无关\n\n  定理 7.6  ：\n\n在欧氏空间中，如果向量组   alpha_1, dots, alpha_m  线性无关，则必有规范正交向量组   varepsilon_1, dots, varepsilon_m  与之等价\n\n  [!NOTE]\n    方法  ：  Schmidt 正交化过程  （与   mathbb R ^n  中形式完全相同，只是向量含义不同）\n\n  定义 7.14  ：\n\n在  n  维欧氏空间  V  中，含有  n  个向量的正交向量组称为  V  的  正交基  。由单位向量构成的正交基称为  规范正交基  \n\n任意非零有限维欧氏空间都存在规范正交基。\n\n---\n\n    四、正交补与正交分解\n\n在有限维欧氏空间  V  中，子空间  U  的  正交补  定义为\n\n  U^ perp=  v in V mid [v,u]=0 text  对所有  u in U  .  \n\n U^ perp  也是子空间，而且\n\n   boxed V=U oplus U^ perp, qquad  dim U+ dim U^ perp= dim V.   \n\n因此每个  x in V  都可唯一写成  x=p+r ，其中  p in U 、 r in U^ perp 。称  p  为  x  在  U  上的  正交投影  。\n\n    五、投影公式与最短距离\n\n若  q_1, dots,q_r  是  U  的规范正交基，则\n\n   boxed  operatorname proj _U x= sum_ i=1 ^r[q_i,x]q_i.   \n\n在   mathbb R ^n  的标准内积下，令  Q=(q_1, dots,q_r) ，则  p=QQ^ mathrm T x 。注意  Q  此时可为  n times r  的长方形矩阵；当  r<n  时，它不是前文定义的正交方阵，但仍满足  Q^ mathrm T Q=E_r 。\n\n若  M  的列是  U  的任意一组基（不必正交，且  r geq1 ），则\n\n  p=M(M^ mathrm T M)^ -1 M^ mathrm T x.  \n\n因为基向量线性无关， M  列满秩，从而  M^ mathrm T M  可逆。若  U=  0   ，则投影恒为零。\n\n  最短距离性质  ：对任意  u in U ， x-p perp p-u ，所以\n\n   |x-u |^2= |x-p |^2+ |p-u |^2 geq |x-p |^2.  \n\n故  p  是  U  中距离  x  最近的唯一向量，距离为   |x-p | 。\n\n  例  ：设  U=  x in mathbb R ^3 mid x_1+x_2+x_3=0   ，求  x=(1,2,3)^ mathrm T   到  U  的投影及距离。\n\n法向量为  n=(1,1,1)^ mathrm T  ，故  U^ perp= operatorname span   n   。先求法向分量，再减去：\n\n  r= frac n^ mathrm T x  n^ mathrm T n n=2n=(2,2,2)^ mathrm T , qquad\np=x-r=(-1,0,1)^ mathrm T .  \n\n检查  -1+0+1=0 ，故  p in U 。距离为   |r |=2 sqrt3 。对应投影矩阵\n\n  P=E- frac13nn^ mathrm T = frac13 begin pmatrix 2&-1&-1  -1&2&-1  -1&-1&2 end pmatrix .  \n\n它满足  P^ mathrm T =P,P^2=P ；投影矩阵只可能有特征值  0,1 。\n\n    六、矩阵的四个基本子空间\n\n对  m times n  实矩阵  A ，在标准内积下：\n\n| 子空间 | 所在空间 | 维数 |\n|--------|----------|------|\n| 列空间   operatorname Col (A)  |   mathbb R ^m  |  R(A)  |\n| 零空间   ker A  |   mathbb R ^n  |  n-R(A)  |\n| 行空间   operatorname Col (A^ mathrm T ) （将行向量转为列向量） |   mathbb R ^n  |  R(A)  |\n| 左零空间   ker A^ mathrm T   |   mathbb R ^m  |  m-R(A)  |\n\n它们满足\n\n  \n ker A= operatorname Col (A^ mathrm T )^ perp, qquad\n ker A^ mathrm T = operatorname Col (A)^ perp.\n  \n\n原因是  Ax=0  恰好表示  x  与  A  的每一行都正交。因此  Ax=b  有解，等价于  b  与左零空间中的每个向量都正交。\n\n  [!TIP]\n  第四章研究零空间与方程组，第五章研究在适当基下表示变换，第七章把它们统一为核、像、换基与正交分解。\n\n---\n\n   第六节 线性空间应用实例\n\n    一、计算机图形学中的线性变换\n\n图形由有限个顶点确定，每个顶点对应一个向量。常用变换：\n\n| 变换 | 矩阵形式 | 说明 |\n|------|----------|------|\n| 旋转变换 |   begin pmatrix   cos theta & - sin theta     sin theta &  cos theta  end pmatrix   | 绕原点逆时针旋转   theta  角 |\n| 伸缩变换 |   begin pmatrix  k & 0    0 & k  end pmatrix   | 沿坐标轴方向缩放  k  倍 |\n| 平移变换 | 引入齐次坐标后用矩阵实现 | 本身不是线性变换，但在齐次坐标下可线性化 |\n\n  多个线性变换的复合 = 对应矩阵的乘积\n\n    二、调味品配制问题（线性组合与基的应用）\n\n将每种调味品的成分含量视为向量，问题转化为：\n\n  [!NOTE]\n  以下按允许任意实数系数的线性组合模型讨论。实际调配用量必须非负，还可能要求比例和为  1 ；若有这些约束，不能仅凭秩或极大无关组确定最少购买种类，还需检验非负系数等条件。\n\n- 求生成子空间  L( alpha_1, dots, alpha_6)  的维数 → 最少需要购买几种调味品\n- 求一组基 → 确定购买哪几种\n- 其余向量用基线性表示 → 如何调配\n\n  关键步骤  ：将成分矩阵化为行最简形，找出极大线性无关组\n\n  拓展阅读  ：[最小二乘、SVD 与伪逆](<拓展阅读 Cayley–Hamilton、最小二乘与SVD.md )，继续应用列空间、正交投影及核的概念。\n\n---\n\n---\n\n"}, {"id": "sec-extra", "number": "08", "title": "拓展阅读", "description": "连接矩阵计算、数据拟合与奇异值分解。", "tags": ["Cayley–Hamilton", "最小二乘", "SVD"], "source": "../../数学/线性代数/基础概念/笔记/%E6%8B%93%E5%B1%95%E9%98%85%E8%AF%BB%20Cayley%E2%80%93Hamilton%E3%80%81%E6%9C%80%E5%B0%8F%E4%BA%8C%E4%B9%98%E4%B8%8ESVD.md", "summary": "<h2 id=\"sec-extra-quick-h1\">矩阵满足自己的特征方程<\/h2>\n<p>若 <span class=\"math-inline\">\\(p(\\lambda)=\\det(\\lambda E-A)\\)<\/span>，则 Cayley–Hamilton 定理给出 <span class=\"math-inline\">\\(p(A)=O\\)<\/span>。它可以降低矩阵幂的次数，也可在矩阵可逆时求逆。<\/p>\n<h2 id=\"sec-extra-quick-h2\">没有精确解，仍然能求最佳拟合<\/h2>\n<p>最小二乘解使 <span class=\"math-inline\">\\(\\|Ax-b\\|^2\\)<\/span> 最小，其正规方程为<\/p>\n<p><span class=\"math-display\">\\[A^\\mathrm{T}A\\hat x=A^\\mathrm{T}b.\\]<\/span><\/p>\n<p>若 <span class=\"math-inline\">\\(A\\)<\/span> 列满秩，解唯一。几何上，<span class=\"math-inline\">\\(A\\hat x\\)<\/span> 就是 <span class=\"math-inline\">\\(b\\)<\/span> 到列空间的正交投影。<\/p>\n<h2 id=\"sec-extra-quick-h3\">SVD：从方阵走向一般矩阵<\/h2>\n<p><span class=\"math-display\">\\[A=U\\Sigma V^\\mathrm{T}.\\]<\/span><\/p>\n<p>任意实矩阵都存在 SVD，奇异值均非负，正奇异值的个数等于秩。对实对称矩阵，奇异值是特征值的绝对值。<\/p>\n<h2 id=\"sec-extra-quick-h4\">完整例题<\/h2>\n<p>用特征方程计算矩阵幂和逆；拟合三个点的最佳直线；秩为一的矩阵的 SVD、伪逆与最小范数解。<\/p>\n", "full": "<p>本篇承接第二、四、五、七章，介绍矩阵多项式降阶、无精确解时的最佳拟合，以及适用于长方形矩阵的分解方法。<\/p>\n<h2 id=\"sec-extra-full-h1\">一、Cayley–Hamilton 定理：矩阵满足自己的特征方程<\/h2>\n<p>设 <span class=\"math-inline\">\\(A\\)<\/span> 为 <span class=\"math-inline\">\\(n\\)<\/span> 阶实矩阵，特征多项式为<\/p>\n<p><span class=\"math-display\">\\[p(\\lambda)=\\det(\\lambda E-A)=\\lambda^n+c_{n-1}\\lambda^{n-1}+\\cdots+c_1\\lambda+c_0.\\]<\/span><\/p>\n<p>则<\/p>\n<p><span class=\"math-display\">\\[\\boxed{p(A)=A^n+c_{n-1}A^{n-1}+\\cdots+c_1A+c_0E=O.}\\]<\/span><\/p>\n<p>这里常数项对应 <span class=\"math-inline\">\\(c_0E\\)<\/span>，结果为零矩阵；该定理不要求 <span class=\"math-inline\">\\(A\\)<\/span> 可对角化。<\/p>\n<p><strong>用途<\/strong>：把高次幂降到低于 <span class=\"math-inline\">\\(n\\)<\/span> 次；若 <span class=\"math-inline\">\\(c_0\\neq0\\)<\/span>，还可以解出逆矩阵：<\/p>\n<p><span class=\"math-display\">\\[A^{-1}=-\\frac1{c_0}\\left(A^{n-1}+c_{n-1}A^{n-2}+\\cdots+c_1E\\right).\\]<\/span><\/p>\n<p><strong>例<\/strong>：取 <span class=\"math-inline\">\\(A=\\begin{pmatrix}1&amp;1\\\\0&amp;2\\end{pmatrix}\\)<\/span>，有<\/p>\n<p><span class=\"math-display\">\\[p(\\lambda)=(\\lambda-1)(\\lambda-2)=\\lambda^2-3\\lambda+2.\\]<\/span><\/p>\n<p>于是 <span class=\"math-inline\">\\(A^2-3A+2E=O\\)<\/span>，从而<\/p>\n<p><span class=\"math-display\">\\[A^3=3A^2-2A=7A-6E,\\qquad A^{-1}=\\frac12(3E-A)=\\begin{pmatrix}1&amp;-1/2\\\\0&amp;1/2\\end{pmatrix}.\\]<\/span><\/p>\n<blockquote class=\"callout warning\"><p class=\"callout-label\">易错提醒<\/p><p><span class=\"math-inline\">\\(p(A)\\)<\/span> 表示先将特征多项式展开，再用矩阵幂代入。不能把行列式中的标量变量直接替换成矩阵后，仍按普通数值行列式来解释。<\/p>\n<\/blockquote>\n<h2 id=\"sec-extra-full-h2\">二、最小二乘：没有精确解时，求残差最小的解<\/h2>\n<h3 id=\"sec-extra-full-h3\">1. 从方程组到优化问题<\/h3>\n<p>对 <span class=\"math-inline\">\\(A\\in\\mathbb{R}^{m\\times n}\\)<\/span>、<span class=\"math-inline\">\\(b\\in\\mathbb{R}^m\\)<\/span>，若 <span class=\"math-inline\">\\(Ax=b\\)<\/span> 无解，可寻找使<\/p>\n<p><span class=\"math-display\">\\[\\|Ax-b\\|^2\\]<\/span><\/p>\n<p>最小的 <span class=\"math-inline\">\\(x\\)<\/span>，称为<strong>最小二乘解<\/strong>。<\/p>\n<p><span class=\"math-inline\">\\(Ax\\)<\/span> 总在列空间 <span class=\"math-inline\">\\(\\operatorname{Col}(A)\\)<\/span> 内，所以最优的拟合向量 <span class=\"math-inline\">\\(A\\hat x\\)<\/span> 是 <span class=\"math-inline\">\\(b\\)<\/span> 在列空间上的正交投影。最优残差 <span class=\"math-inline\">\\(b-A\\hat x\\)<\/span> 与列空间正交，故<\/p>\n<p><span class=\"math-display\">\\[\\boxed{A^\\mathrm{T}(b-A\\hat x)=0\\quad\\Longleftrightarrow\\quad A^\\mathrm{T}A\\hat x=A^\\mathrm{T}b.}\\]<\/span><\/p>\n<p>此方程称为<strong>正规方程<\/strong>。反之，只要 <span class=\"math-inline\">\\(\\hat x\\)<\/span> 满足正规方程，正交分解就能保证它使残差平方和最小。<\/p>\n<ul>\n<li>若 <span class=\"math-inline\">\\(A\\)<\/span> 列满秩，则 <span class=\"math-inline\">\\(A^\\mathrm{T}A\\)<\/span> 正定、可逆，最小二乘解唯一：<span class=\"math-inline\">\\(\\hat x=(A^\\mathrm{T}A)^{-1}A^\\mathrm{T}b\\)<\/span>。<\/li>\n<li>若 <span class=\"math-inline\">\\(A\\)<\/span> 列不满秩，最小二乘解不唯一；但拟合向量 <span class=\"math-inline\">\\(A\\hat x\\)<\/span> 仍唯一。全部最小二乘解相差一个 <span class=\"math-inline\">\\(\\ker A\\)<\/span> 中的向量。<\/li>\n<\/ul>\n<h3 id=\"sec-extra-full-h4\">2. 完整例题：用直线拟合三个数据点<\/h3>\n<p>用直线 <span class=\"math-inline\">\\(y=a+bt\\)<\/span> 拟合 <span class=\"math-inline\">\\((0,1),(1,2),(2,2)\\)<\/span>。目标是使三个纵向误差的平方和最小，矩阵形式为<\/p>\n<p><span class=\"math-display\">\\[M\\begin{pmatrix}a\\\\b\\end{pmatrix}\\approx d,\\qquad\nM=\\begin{pmatrix}1&amp;0\\\\1&amp;1\\\\1&amp;2\\end{pmatrix},\\qquad d=\\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}.\\]<\/span><\/p>\n<p>正规方程为<\/p>\n<p><span class=\"math-display\">\\[\\begin{pmatrix}3&amp;3\\\\3&amp;5\\end{pmatrix}\\begin{pmatrix}a\\\\b\\end{pmatrix}\n=\\begin{pmatrix}5\\\\6\\end{pmatrix}.\\]<\/span><\/p>\n<p>两式相减得 <span class=\"math-inline\">\\(2b=1\\)<\/span>，故 <span class=\"math-inline\">\\(b=1/2\\)<\/span>，再得 <span class=\"math-inline\">\\(a=7/6\\)<\/span>。最佳拟合直线为<\/p>\n<p><span class=\"math-display\">\\[\\boxed{y=\\frac76+\\frac12t.}\\]<\/span><\/p>\n<p>拟合值、残差及平方和分别为<\/p>\n<p><span class=\"math-display\">\\[M\\hat x=\\begin{pmatrix}7/6\\\\5/3\\\\13/6\\end{pmatrix},\\quad\nr=d-M\\hat x=\\begin{pmatrix}-1/6\\\\1/3\\\\-1/6\\end{pmatrix},\\quad\n\\|r\\|^2=\\frac16.\\]<\/span><\/p>\n<p>检查 <span class=\"math-inline\">\\(M^\\mathrm{T}r=0\\)<\/span>，即残差分别与常数列 <span class=\"math-inline\">\\((1,1,1)^\\mathrm{T}\\)<\/span> 和自变量列 <span class=\"math-inline\">\\((0,1,2)^\\mathrm{T}\\)<\/span> 正交。<\/p>\n<blockquote class=\"callout note\"><p class=\"callout-label\">理解与联系<\/p><p>正规方程便于理解理论；实际浮点计算中，形成 <span class=\"math-inline\">\\(A^\\mathrm{T}A\\)<\/span> 可能放大数值误差，常用 QR 分解或 SVD 求解。这里的直线拟合最小化纵向误差，并非点到直线的垂直距离平方和。<\/p>\n<\/blockquote>\n<h2 id=\"sec-extra-full-h5\">三、奇异值分解（SVD）：长方形矩阵也能分解<\/h2>\n<h3 id=\"sec-extra-full-h6\">1. 定义与矩阵尺寸<\/h3>\n<p>任意实矩阵 <span class=\"math-inline\">\\(A\\in\\mathbb{R}^{m\\times n}\\)<\/span> 均可写成<\/p>\n<p><span class=\"math-display\">\\[\\boxed{A=U\\Sigma V^\\mathrm{T},}\\]<\/span><\/p>\n<p>其中 <span class=\"math-inline\">\\(U\\)<\/span> 为 <span class=\"math-inline\">\\(m\\)<\/span> 阶正交矩阵，<span class=\"math-inline\">\\(V\\)<\/span> 为 <span class=\"math-inline\">\\(n\\)<\/span> 阶正交矩阵，<span class=\"math-inline\">\\(\\Sigma\\)<\/span> 为 <span class=\"math-inline\">\\(m\\times n\\)<\/span> 矩阵，其主对角线元素满足<\/p>\n<p><span class=\"math-display\">\\[\\sigma_1\\geq\\sigma_2\\geq\\cdots\\geq\\sigma_p\\geq0,\\qquad p=\\min(m,n),\\]<\/span><\/p>\n<p>其他元素均为零。<span class=\"math-inline\">\\(\\sigma_i\\)<\/span> 称为<strong>奇异值<\/strong>，正奇异值的个数等于 <span class=\"math-inline\">\\(R(A)\\)<\/span>。<\/p>\n<p>由<\/p>\n<p><span class=\"math-display\">\\[A^\\mathrm{T}A=V(\\Sigma^\\mathrm{T}\\Sigma)V^\\mathrm{T}\\]<\/span><\/p>\n<p>可知，正奇异值是 <span class=\"math-inline\">\\(A^\\mathrm{T}A\\)<\/span> 的正特征值的平方根；当 <span class=\"math-inline\">\\(n&gt;m\\)<\/span> 时，<span class=\"math-inline\">\\(A^\\mathrm{T}A\\)<\/span> 还至少有 <span class=\"math-inline\">\\(n-m\\)<\/span> 个额外的零特征值。<\/p>\n<h3 id=\"sec-extra-full-h7\">2. 与特征值、对角化的区别<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>对比项<\/th>\n<th>相似对角化<\/th>\n<th>SVD<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>矩阵形状<\/td>\n<td>方阵<\/td>\n<td>方阵或长方形矩阵<\/td>\n<\/tr>\n<tr>\n<td>是否总存在<\/td>\n<td>不一定<\/td>\n<td>对任意实矩阵都存在<\/td>\n<\/tr>\n<tr>\n<td>变换方式<\/td>\n<td><span class=\"math-inline\">\\(A=P\\Lambda P^{-1}\\)<\/span>，同一空间换基<\/td>\n<td><span class=\"math-inline\">\\(A=U\\Sigma V^\\mathrm{T}\\)<\/span>，输入、输出各选正交基<\/td>\n<\/tr>\n<tr>\n<td>数值<\/td>\n<td>特征值可能为负或复数<\/td>\n<td>奇异值都是非负实数<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>对实对称矩阵，奇异值等于特征值的绝对值（再按大小排序）。一般矩阵没有这种简单对应。<\/p>\n<h3 id=\"sec-extra-full-h8\">3. 可直接验证的例子<\/h3>\n<p>设<\/p>\n<p><span class=\"math-display\">\\[A=\\begin{pmatrix}1&amp;1\\\\1&amp;1\\end{pmatrix},\\quad\nU=V=\\frac1{\\sqrt2}\\begin{pmatrix}1&amp;1\\\\1&amp;-1\\end{pmatrix},\\quad\n\\Sigma=\\begin{pmatrix}2&amp;0\\\\0&amp;0\\end{pmatrix}.\\]<\/span><\/p>\n<p>则 <span class=\"math-inline\">\\(U^\\mathrm{T}U=V^\\mathrm{T}V=E\\)<\/span>，直接相乘得到 <span class=\"math-inline\">\\(U\\Sigma V^\\mathrm{T}=A\\)<\/span>。奇异值为 <span class=\"math-inline\">\\(2,0\\)<\/span>，所以秩为 <span class=\"math-inline\">\\(1\\)<\/span>。<\/p>\n<p>几何上，先用 <span class=\"math-inline\">\\(V^\\mathrm{T}\\)<\/span> 把输入坐标转到两个正交方向，再沿第一个方向放大 <span class=\"math-inline\">\\(2\\)<\/span> 倍、沿第二个方向压缩为零，最后用 <span class=\"math-inline\">\\(U\\)<\/span> 表示输出方向。<\/p>\n<h3 id=\"sec-extra-full-h9\">4. 伪逆与最小范数解<\/h3>\n<p>在 <span class=\"math-inline\">\\(\\Sigma^\\mathrm{T}\\)<\/span> 中，将所有正奇异值替换为倒数、零仍保留为零，得到 <span class=\"math-inline\">\\(n\\times m\\)<\/span> 矩阵 <span class=\"math-inline\">\\(\\Sigma^+\\)<\/span>。定义<\/p>\n<p><span class=\"math-display\">\\[A^+=V\\Sigma^+U^\\mathrm{T}.\\]<\/span><\/p>\n<p>则 <span class=\"math-inline\">\\(\\hat x=A^+b\\)<\/span> 是最小二乘解中长度最小的唯一一个；若 <span class=\"math-inline\">\\(Ax=b\\)<\/span> 有解，它也是所有精确解中长度最小的一个。<\/p>\n<p>上例中 <span class=\"math-inline\">\\(A^+=\\frac14\\begin{pmatrix}1&amp;1\\\\1&amp;1\\end{pmatrix}\\)<\/span>。对 <span class=\"math-inline\">\\(b=(2,2)^\\mathrm{T}\\)<\/span>，精确解满足 <span class=\"math-inline\">\\(x_1+x_2=2\\)<\/span>；伪逆给出 <span class=\"math-inline\">\\(\\hat x=(1,1)^\\mathrm{T}\\)<\/span>，其长度最小。<\/p>\n<h2 id=\"sec-extra-full-h10\">四、与原七章的衔接<\/h2>\n<ul>\n<li>第二、五章：矩阵幂、逆矩阵与特征多项式 → Cayley–Hamilton 定理。<\/li>\n<li>第四、七章：列空间、方程组、正交投影 → 最小二乘。<\/li>\n<li>第三、五、七章：正交基、实对称矩阵对角化、核与像 → SVD。<\/li>\n<\/ul>\n<hr />\n", "search": "\n\n本篇承接第二、四、五、七章，介绍矩阵多项式降阶、无精确解时的最佳拟合，以及适用于长方形矩阵的分解方法。\n\n   一、Cayley–Hamilton 定理：矩阵满足自己的特征方程\n\n设  A  为  n  阶实矩阵，特征多项式为\n\n  p( lambda)= det( lambda E-A)= lambda^n+c_ n-1  lambda^ n-1 + cdots+c_1 lambda+c_0.  \n\n则\n\n   boxed p(A)=A^n+c_ n-1 A^ n-1 + cdots+c_1A+c_0E=O.   \n\n这里常数项对应  c_0E ，结果为零矩阵；该定理不要求  A  可对角化。\n\n  用途  ：把高次幂降到低于  n  次；若  c_0 neq0 ，还可以解出逆矩阵：\n\n  A^ -1 =- frac1 c_0  left(A^ n-1 +c_ n-1 A^ n-2 + cdots+c_1E right).  \n\n  例  ：取  A= begin pmatrix 1&1  0&2 end pmatrix  ，有\n\n  p( lambda)=( lambda-1)( lambda-2)= lambda^2-3 lambda+2.  \n\n于是  A^2-3A+2E=O ，从而\n\n  A^3=3A^2-2A=7A-6E, qquad A^ -1 = frac12(3E-A)= begin pmatrix 1&-1/2  0&1/2 end pmatrix .  \n\n  [!WARNING]\n   p(A)  表示先将特征多项式展开，再用矩阵幂代入。不能把行列式中的标量变量直接替换成矩阵后，仍按普通数值行列式来解释。\n\n   二、最小二乘：没有精确解时，求残差最小的解\n\n    1. 从方程组到优化问题\n\n对  A in mathbb R ^ m times n  、 b in mathbb R ^m ，若  Ax=b  无解，可寻找使\n\n   |Ax-b |^2  \n\n最小的  x ，称为  最小二乘解  。\n\n Ax  总在列空间   operatorname Col (A)  内，所以最优的拟合向量  A hat x  是  b  在列空间上的正交投影。最优残差  b-A hat x  与列空间正交，故\n\n   boxed A^ mathrm T (b-A hat x)=0 quad Longleftrightarrow quad A^ mathrm T A hat x=A^ mathrm T b.   \n\n此方程称为  正规方程  。反之，只要   hat x  满足正规方程，正交分解就能保证它使残差平方和最小。\n\n- 若  A  列满秩，则  A^ mathrm T A  正定、可逆，最小二乘解唯一：  hat x=(A^ mathrm T A)^ -1 A^ mathrm T b 。\n- 若  A  列不满秩，最小二乘解不唯一；但拟合向量  A hat x  仍唯一。全部最小二乘解相差一个   ker A  中的向量。\n\n    2. 完整例题：用直线拟合三个数据点\n\n用直线  y=a+bt  拟合  (0,1),(1,2),(2,2) 。目标是使三个纵向误差的平方和最小，矩阵形式为\n\n  \nM begin pmatrix a  b end pmatrix  approx d, qquad\nM= begin pmatrix 1&0  1&1  1&2 end pmatrix , qquad d= begin pmatrix 1  2  2 end pmatrix .\n  \n\n正规方程为\n\n  \n begin pmatrix 3&3  3&5 end pmatrix  begin pmatrix a  b end pmatrix \n= begin pmatrix 5  6 end pmatrix .\n  \n\n两式相减得  2b=1 ，故  b=1/2 ，再得  a=7/6 。最佳拟合直线为\n\n   boxed y= frac76+ frac12t.   \n\n拟合值、残差及平方和分别为\n\n  \nM hat x= begin pmatrix 7/6  5/3  13/6 end pmatrix , quad\nr=d-M hat x= begin pmatrix -1/6  1/3  -1/6 end pmatrix , quad\n |r |^2= frac16.\n  \n\n检查  M^ mathrm T r=0 ，即残差分别与常数列  (1,1,1)^ mathrm T   和自变量列  (0,1,2)^ mathrm T   正交。\n\n  [!NOTE]\n  正规方程便于理解理论；实际浮点计算中，形成  A^ mathrm T A  可能放大数值误差，常用 QR 分解或 SVD 求解。这里的直线拟合最小化纵向误差，并非点到直线的垂直距离平方和。\n\n   三、奇异值分解（SVD）：长方形矩阵也能分解\n\n    1. 定义与矩阵尺寸\n\n任意实矩阵  A in mathbb R ^ m times n   均可写成\n\n   boxed A=U Sigma V^ mathrm T ,   \n\n其中  U  为  m  阶正交矩阵， V  为  n  阶正交矩阵，  Sigma  为  m times n  矩阵，其主对角线元素满足\n\n   sigma_1 geq sigma_2 geq cdots geq sigma_p geq0, qquad p= min(m,n),  \n\n其他元素均为零。  sigma_i  称为  奇异值  ，正奇异值的个数等于  R(A) 。\n\n由\n\n  A^ mathrm T A=V( Sigma^ mathrm T  Sigma)V^ mathrm T   \n\n可知，正奇异值是  A^ mathrm T A  的正特征值的平方根；当  n m  时， A^ mathrm T A  还至少有  n-m  个额外的零特征值。\n\n    2. 与特征值、对角化的区别\n\n| 对比项 | 相似对角化 | SVD |\n|--------|------------|-----|\n| 矩阵形状 | 方阵 | 方阵或长方形矩阵 |\n| 是否总存在 | 不一定 | 对任意实矩阵都存在 |\n| 变换方式 |  A=P Lambda P^ -1  ，同一空间换基 |  A=U Sigma V^ mathrm T  ，输入、输出各选正交基 |\n| 数值 | 特征值可能为负或复数 | 奇异值都是非负实数 |\n\n对实对称矩阵，奇异值等于特征值的绝对值（再按大小排序）。一般矩阵没有这种简单对应。\n\n    3. 可直接验证的例子\n\n设\n\n  \nA= begin pmatrix 1&1  1&1 end pmatrix , quad\nU=V= frac1  sqrt2  begin pmatrix 1&1  1&-1 end pmatrix , quad\n Sigma= begin pmatrix 2&0  0&0 end pmatrix .\n  \n\n则  U^ mathrm T U=V^ mathrm T V=E ，直接相乘得到  U Sigma V^ mathrm T =A 。奇异值为  2,0 ，所以秩为  1 。\n\n几何上，先用  V^ mathrm T   把输入坐标转到两个正交方向，再沿第一个方向放大  2  倍、沿第二个方向压缩为零，最后用  U  表示输出方向。\n\n    4. 伪逆与最小范数解\n\n在   Sigma^ mathrm T   中，将所有正奇异值替换为倒数、零仍保留为零，得到  n times m  矩阵   Sigma^+ 。定义\n\n  A^+=V Sigma^+U^ mathrm T .  \n\n则   hat x=A^+b  是最小二乘解中长度最小的唯一一个；若  Ax=b  有解，它也是所有精确解中长度最小的一个。\n\n上例中  A^+= frac14 begin pmatrix 1&1  1&1 end pmatrix  。对  b=(2,2)^ mathrm T  ，精确解满足  x_1+x_2=2 ；伪逆给出   hat x=(1,1)^ mathrm T  ，其长度最小。\n\n   四、与原七章的衔接\n\n- 第二、五章：矩阵幂、逆矩阵与特征多项式 → Cayley–Hamilton 定理。\n- 第四、七章：列空间、方程组、正交投影 → 最小二乘。\n- 第三、五、七章：正交基、实对称矩阵对角化、核与像 → SVD。\n\n---\n\n"}, {"id": "sec-formula", "number": "∑", "title": "公式速查", "description": "把最常用的结论，放在同一页。", "tags": ["条件先行", "联系记忆"], "source": "", "summary": "<h2 id=\"formulas-h1\">可逆性<\/h2>\n<p><span class=\"m
