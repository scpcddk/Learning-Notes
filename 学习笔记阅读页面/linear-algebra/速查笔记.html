ath-display\">\\[\\det A\\neq0\\iff R(A)=n\\iff A\\text{ 可逆}\\iff Ax=0\\text{ 只有零解}.\\]<\/span><\/p>\n<p>这里 <span class=\"math-inline\">\\(A\\)<\/span> 为 <span class=\"math-inline\">\\(n\\)<\/span> 阶方阵。<\/p>\n<h2 id=\"formulas-h2\">线性表示与通解<\/h2>\n<p><span class=\"math-display\">\\[Ax=b\\text{ 有解}\\iff R(A)=R(A\\mid b).\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[x=\\eta_0+\\sum_{i=1}^{n-r}c_i\\xi_i,\\qquad \\dim\\ker A=n-R(A).\\]<\/span><\/p>\n<h2 id=\"formulas-h3\">相似、合同与换基<\/h2>\n<p><span class=\"math-display\">\\[B=P^{-1}AP\\quad\\text{（相似）},\\qquad B=C^\\mathrm{T}AC\\quad\\text{（合同）}.\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\text{新基}=\\text{旧基}\\cdot C,\\quad x=Cy,\\quad B=C^{-1}AC.\\]<\/span><\/p>\n<h2 id=\"formulas-h4\">特征值与正交对角化<\/h2>\n<p><span class=\"math-display\">\\[\\sum_i\\lambda_i=\\operatorname{tr}A,\\qquad\\prod_i\\lambda_i=\\det A.\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[Q^\\mathrm{T}AQ=\\Lambda,\\quad A^k=Q\\Lambda^kQ^\\mathrm{T}\\quad(A\\text{ 实对称}).\\]<\/span><\/p>\n<h2 id=\"formulas-h5\">维数与投影<\/h2>\n<p><span class=\"math-display\">\\[\\dim\\ker T+\\dim\\operatorname{Im}T=\\dim V.\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\dim(U+W)=\\dim U+\\dim W-\\dim(U\\cap W).\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\operatorname{proj}_U x=QQ^\\mathrm{T}x\\quad(Q\\text{ 的列为 }U\\text{ 的规范正交基}).\\]<\/span><\/p>\n", "full": "<h2 id=\"formulas-h1\">可逆性<\/h2>\n<p><span class=\"math-display\">\\[\\det A\\neq0\\iff R(A)=n\\iff A\\text{ 可逆}\\iff Ax=0\\text{ 只有零解}.\\]<\/span><\/p>\n<p>这里 <span class=\"math-inline\">\\(A\\)<\/span> 为 <span class=\"math-inline\">\\(n\\)<\/span> 阶方阵。<\/p>\n<h2 id=\"formulas-h2\">线性表示与通解<\/h2>\n<p><span class=\"math-display\">\\[Ax=b\\text{ 有解}\\iff R(A)=R(A\\mid b).\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[x=\\eta_0+\\sum_{i=1}^{n-r}c_i\\xi_i,\\qquad \\dim\\ker A=n-R(A).\\]<\/span><\/p>\n<h2 id=\"formulas-h3\">相似、合同与换基<\/h2>\n<p><span class=\"math-display\">\\[B=P^{-1}AP\\quad\\text{（相似）},\\qquad B=C^\\mathrm{T}AC\\quad\\text{（合同）}.\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\text{新基}=\\text{旧基}\\cdot C,\\quad x=Cy,\\quad B=C^{-1}AC.\\]<\/span><\/p>\n<h2 id=\"formulas-h4\">特征值与正交对角化<\/h2>\n<p><span class=\"math-display\">\\[\\sum_i\\lambda_i=\\operatorname{tr}A,\\qquad\\prod_i\\lambda_i=\\det A.\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[Q^\\mathrm{T}AQ=\\Lambda,\\quad A^k=Q\\Lambda^kQ^\\mathrm{T}\\quad(A\\text{ 实对称}).\\]<\/span><\/p>\n<h2 id=\"formulas-h5\">维数与投影<\/h2>\n<p><span class=\"math-display\">\\[\\dim\\ker T+\\dim\\operatorname{Im}T=\\dim V.\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\dim(U+W)=\\dim U+\\dim W-\\dim(U\\cap W).\\]<\/span><\/p>\n<p><span class=\"math-display\">\\[\\operatorname{proj}_U x=QQ^\\mathrm{T}x\\quad(Q\\text{ 的列为 }U\\text{ 的规范正交基}).\\]<\/span><\/p>\n", "search": "## 可逆性\n\n$$\\det A\\neq0\\iff R(A)=n\\iff A\\text{ 可逆}\\iff Ax=0\\text{ 只有零解}.$$\n\n这里 $A$ 为 $n$ 阶方阵。\n\n## 线性表示与通解\n\n$$Ax=b\\text{ 有解}\\iff R(A)=R(A\\mid b).$$\n\n$$x=\\eta_0+\\sum_{i=1}^{n-r}c_i\\xi_i,\\qquad \\dim\\ker A=n-R(A).$$\n\n## 相似、合同与换基\n\n$$B=P^{-1}AP\\quad\\text{（相似）},\\qquad B=C^\\mathrm{T}AC\\quad\\text{（合同）}.$$\n\n$$\\text{新基}=\\text{旧基}\\cdot C,\\quad x=Cy,\\quad B=C^{-1}AC.$$\n\n## 特征值与正交对角化\n\n$$\\sum_i\\lambda_i=\\operatorname{tr}A,\\qquad\\prod_i\\lambda_i=\\det A.$$\n\n$$Q^\\mathrm{T}AQ=\\Lambda,\\quad A^k=Q\\Lambda^kQ^\\mathrm{T}\\quad(A\\text{ 实对称}).$$\n\n## 维数与投影\n\n$$\\dim\\ker T+\\dim\\operatorname{Im}T=\\dim V.$$\n\n$$\\dim(U+W)=\\dim U+\\dim W-\\dim(U\\cap W).$$\n\n$$\\operatorname{proj}_U x=QQ^\\mathrm{T}x\\quad(Q\\text{ 的列为 }U\\text{ 的规范正交基}).$$"}]</script>
  <script>
  (()=>{

      if(anchor)requestAnimationFrame(()=>gotoHeading(hash));
      if(pendingQuery){const query=pendingQuery.toLowerCase();pendingQuery='';requestAnimationFrame(()=>{const target=[...main.querySelectorAll('.prose h2,.prose h3,.prose h4,.prose p,.prose li')].find(el=>el.textContent.toLowerCase().includes(query));if(target){const d=target.closest('details');if(d)d.open=true;target.scrollIntoView({block:'center'});target.classList.add('search-hit');setTimeout(()=>target.classList.remove('search-hit'),4000)}})}
    }
    main.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;store.set('linalg-mode',mode);render()});
    function updateProgress(){
      const article=main.querySelector('.prose');let progress=0;
      if(article){const top=article.getBoundingClientRect().top+scrollY;const bottom=top+article.offsetHeight;const available=bottom-top-innerHeight+110;progress=available<=0?1:Math.min(1,Math.max(0,(scrollY-top+110)/available));}
      document.documentElement.style.setProperty('--progress',progress);$('progress-label').textContent=Math.round(progress*100)+'%';
      let active=tocItems[0];for(const h of tocItems){if(h.closest('details:not([open])'))continue;if(h.getBoundingClientRect().top<170)active=h}
      $('toc').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.anchor===active?.id));
    }
    let scheduled=false;window.addEventListener('scroll',()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;updateProgress()})},{passive:true});window.addEventListener('resize',updateProgress);main.addEventListener('toggle',updateProgress,true);
    $('menu-btn').addEventListener('click',()=>{const open=!$('sidebar').classList.contains('open');$('sidebar').classList.toggle('open',open);$('mobile-shade').classList.toggle('show',open);$('menu-btn').setAttribute('aria-expanded',String(open))});$('mobile-shade').addEventListener('click',closeMenu);
    function updateThemeButton(){const dark=document.documentElement.dataset.theme==='dark';$('theme-btn').setAttribute('aria-label',dark?'切换为浅色模式':'切换为深色模式');$('theme-btn').setAttribute('aria-pressed',String(dark))}updateThemeButton();
    $('theme-btn').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;store.set('linalg-theme',theme);updateThemeButton()});
    let printState=[];window.addEventListener('beforeprint',()=>{printState=[...main.querySelectorAll('details')].map(d=>[d,d.open]);printState.forEach(([d])=>d.open=true)});window.addEventListener('afterprint',()=>{printState.forEach(([d,open])=>d.open=open);printState=[]});$('print-btn').addEventListener('click',()=>window.print());
    function search(){const value=$('search-input').value.trim().toLowerCase(),terms=value.split(/\s+/);const results=value?chapters.filter(c=>terms.every(t=>(c.title+' '+c.tags.join(' ')+' '+c.search).toLowerCase().includes(t))):chapters.slice(0,7);$('search-results').replaceChildren();if(!results.length){$('search-results').innerHTML='<div class="search-empty">没有找到相关内容，试试“秩”“投影”或“基础解系”。</div>';return}results.slice(0,9).forEach(c=>{const button=document.createElement('button');button.className='search-result';const strong=document.createElement('strong');strong.textContent=(c.number==='∑'?'':c.number+' · ')+c.title;const p=document.createElement('p');const pos=c.search.toLowerCase().indexOf(terms[0]);p.textContent=value&&pos>=0?c.search.slice(Math.max(0,pos-18),pos+95).replace(/\s+/g,' '):c.description;button.append(strong,p);button.addEventListener('click',()=>{$('search-dialog').close();mode='full';store.set('linalg-mode',mode);pendingQuery=$('search-input').value.trim();navigate(c.id)});$('search-results').append(button)})}
    function openSearch(){search();$('search-dialog').showModal();$('search-input').focus()}
    $('search-trigger').addEventListener('click',openSearch);$('search-close').addEventListener('click',()=>$('search-dialog').close());$('search-input').addEventListener('input',search);$('search-dialog').addEventListener('click',e=>{if(e.target===$('search-dialog'))$('search-dialog').close()});
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('search-dialog').open)openSearch()}if(e.key==='Escape'){const menuOpen=$('sidebar').classList.contains('open');closeMenu();if(menuOpen)$('menu-btn').focus()}});
    window.addEventListener('hashchange',render);render();
    const script=document.createElement('script');script.src='阅读资源/tex-svg.js';script.async=true;script.onload=typeset;script.onerror=()=>{const fallback=document.createElement('script');fallback.src='https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js';fallback.async=true;fallback.onload=typeset;fallback.onerror=()=>{mathFailed=true;showMathNotice()};document.head.append(fallback)};document.head.append(script);
  })();
  </script>
</body>
