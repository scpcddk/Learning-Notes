        <button class="icon-btn" id="print-btn" aria-label="打印当前章节"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7zM17 11h1"/></svg></button>
      </div>
    </header>
    <div class="reading-progress" aria-hidden="true"></div>
    <div class="layout home-layout" id="layout">
      <main class="content-main" id="main-content" tabindex="-1"></main>
      <aside class="reading-rail" id="reading-rail" hidden><p class="rail-label">ON THIS PAGE / 本章目录</p><nav class="toc" id="toc" aria-label="本章小节"></nav><div class="rail-footer">本章阅读位置<span id="progress-label">0%</span></div></aside>
    </div>
    <footer class="page-footer"><span>线性代数 · 个人学习笔记</span><span>理解概念 · 看懂例题 · 连接知识</span></footer>
  </div>
  <dialog id="search-dialog" aria-label="搜索全部笔记">
    <div class="search-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search-input" type="search" placeholder="搜索概念、公式、例题…" aria-label="搜索内容" autocomplete="off"><button class="icon-btn" id="search-close" aria-label="关闭搜索">×</button></div>
    <div class="search-results" id="search-results"></div><div class="search-help">搜索全部七章与拓展笔记 · Esc 关闭</div>
  </dialog>
  <noscript><div class="noscript">阅读页需要 JavaScript 来切换章节。你也可以直接打开<a href="../基础概念/笔记/阅读指南.md">Markdown 阅读指南</a>查看全部原始笔记。</div></noscript>
  <script type="application/json" id="chapter-data"><!--CHAPTER_DATA--></script>
  <script>
  (()=>{
    'use strict';
    const chapters=JSON.parse(document.getElementById('chapter-data').textContent);
    const $=id=>document.getElementById(id), main=$('main-content'), layout=$('layout'), rail=$('reading-rail');
    const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h15m-5-5 5 5-5 5"/></svg>';
    const store={get(k,f=''){try{return localStorage.getItem(k)||f}catch(_){return f}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
    let current='overview',mode=store.get('linalg-mode','summary'),tocItems=[],mathQueue=Promise.resolve(),pendingQuery='',routeNumber=0;
    if(!['summary','full'].includes(mode))mode='summary';
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function tags(list){return '<div class="tags">'+list.map(t=>'<span class="tag">'+escape(t)+'</span>').join('')+'</div>'}
    $('chapter-nav').innerHTML=chapters.map(c=>'<button class="nav-link" data-page="'+c.id+'"><span class="nav-number">'+c.number+'</span><span>'+escape(c.title)+'</span></button>').join('');
    function closeMenu(){ $('sidebar').classList.remove('open');$('mobile-shade').classList.remove('show');$('menu-btn').setAttribute('aria-expanded','false'); }
    function navigate(id){if(location.hash==='#'+id)render();else location.hash=id;closeMenu()}
    document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav)navigate(nav.dataset.page)});
    function home(){
      const last=chapters.find(c=>c.id===store.get('linalg-last'))||chapters[0];
      main.innerHTML='<section class="hero"><div class="eyebrow">A NOTEBOOK FOR UNDERSTANDING</div><h1>线性代数，<br>从计算，<em>到理解。</em></h1><p>把公式放回概念，把例题连成方法。<br>在七章笔记里，找到清晰的知识脉络。</p><svg class="hero-math" viewBox="0 0 260 240" aria-hidden="true"><path class="axis" d="M12 182h235M65 223V18"/><path class="square" d="M65 182h96V86H65z"/><path class="square" d="m65 182 134-28 32-100L97 82Z"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="m65 182 134-28m-5-4 5 4-3 6M65 182 97 82m-5 4 5-4 3 6"/><text x="171" y="193">T(v)</text><text x="47" y="58">v</text><text class="small" x="130" y="31">[ a₁₁ a₁₂ ]</text><text class="small" x="130" y="48">[ a₂₁ a₂₂ ]</text><circle cx="65" cy="182" r="3" fill="currentColor"/></svg><div class="hero-meta"><span><b>07</b> 个基础章节</span><span><b>03</b> 个拓展主题</span><span>公式 · 方法 · 完整例题</span></div></section>'+
      '<div class="home-tools"><div class="section-label">沿着知识脉络阅读 <small>THE CHAPTERS</small></div><button class="text-btn" data-page="'+last.id+'">'+(store.get('linalg-last')?'继续阅读':'从第一章开始')+arrow+'</button></div><div class="chapter-grid">'+chapters.slice(0,8).map((c,i)=>'<button class="chapter-card '+(i===7?'extra':'')+'" data-page="'+c.id+'"><span class="card-number">'+(i===7?'FURTHER READING':'CHAPTER '+c.number)+'</span><span class="card-arrow" aria-hidden="true">↗</span><h2>'+escape(c.title)+'</h2><p>'+escape(c.description)+'</p>'+tags(c.tags)+'</button>').join('')+'</div>'+
      '<section class="learning-route"><div class="section-label">一条贯穿七章的线索</div><div class="route"><div><strong>矩阵与向量</strong>计算与线性关系</div><span class="arrow">→</span><div><strong>秩与方程组</strong>独立方向与解</div><span class="arrow">→</span><div><strong>基与线性变换</strong>结构与几何</div></div></section><p class="home-note">先用「精要速查」建立框架，再切换「完整笔记」阅读推导和例题。最近阅读的章节与显示偏好仅保存在当前浏览器中。</p>';
    }
    function wrapExamples(body){
      const heads=[...body.querySelectorAll('h2,h3,h4')].filter(h=>/完整例题|贯通例题|含参数方程组|反例：/.test(h.textContent));
      for(const head of heads){
        if(head.closest('details'))continue;
        const level=Number(head.tagName[1]),items=[];let node=head.nextSibling;
        while(node){if(node.nodeType===1&&/^H[1-6]$/.test(node.tagName)&&Number(node.tagName[1])<=level)break;items.push(node);node=node.nextSibling}
        const details=document.createElement('details');details.className='worked-example';
        const summary=document.createElement('summary');summary.textContent=head.textContent.replace(/^(完整例题|贯通例题)[：:]/,'');details.append(summary);
        const content=document.createElement('div');content.className='example-body';head.before(details);content.append(head,...items);details.append(content);
      }
    }
    function makeToc(){
      tocItems=[...main.querySelectorAll('.prose h2,.prose h3')];
      $('toc').innerHTML=tocItems.map(h=>'<a class="'+(h.tagName==='H3'?'sub':'')+'" href="#'+h.id+'" data-anchor="'+h.id+'">'+escape(h.textContent)+'</a>').join('');
      updateProgress();
    }
    function gotoHeading(id){const el=document.getElementById(id);if(!el)return;let details=el.closest('details');while(details){details.open=true;details=details.parentElement.closest('details')}el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
    $('toc').addEventListener('click',e=>{const a=e.target.closest('[data-anchor]');if(!a)return;e.preventDefault();gotoHeading(a.dataset.anchor)});
    function typeset(){
      if(!window.MathJax?.typesetPromise)return;
      const body=main.querySelector('.prose'),token=routeNumber;if(!body)return;
      mathQueue=mathQueue.catch(()=>{}).then(async()=>{if(token!==routeNumber||!body.isConnected)return;await MathJax.startup.promise;await MathJax.typesetPromise([body]);updateProgress()}).catch(()=>{showMathNotice()});
    }
    function showMathNotice(){if(current==='overview'||$('math-notice'))return;const message=document.createElement('p');message.id='math-notice';message.className='math-notice';message.textContent='公式排版组件未加载。联网后刷新即可显示标准公式；文字和原始公式仍可阅读。';main.querySelector('.prose')?.before(message)}
    let mathFailed=false;
    function render(){
      routeNumber++;const hash=decodeURIComponent(location.hash.slice(1)),anchor=hash.match(/^(sec-[a-z]+)-(?:quick|full)-h\d+$/);
      if(anchor){if(current!==anchor[1]){current=anchor[1];mode=hash.includes('-full-')?'full':'summary';}else{gotoHeading(hash);return}}
      else current=chapters.some(c=>c.id===hash)?hash:'overview';
      if(window.MathJax?.typesetClear)MathJax.typesetClear([main]);
      const isHome=current==='overview';layout.classList.toggle('home-layout',isHome);rail.hidden=isHome;
      document.querySelectorAll('[data-page]').forEach(b=>{if(b.closest('.sidebar')){if(b.dataset.page===current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}});
      const chapter=chapters.find(c=>c.id===current);$('breadcrumb-title').textContent=chapter?.title||'学习总览';document.title=(chapter?chapter.title:'学习总览')+' · 线性代数笔记';
      if(isHome)home();else{
        const index=chapters.indexOf(chapter);if(chapter.id!=='sec-formula')store.set('linalg-last',chapter.id);
        const buttons=chapter.id==='sec-formula'?'':'<div class="mode-switch" role="group" aria-label="阅读模式"><button data-mode="summary" aria-pressed="'+(mode==='summary')+'">精要速查</button><button data-mode="full" aria-pressed="'+(mode==='full')+'">完整笔记</button></div>';
        main.innerHTML='<header class="chapter-header"><div class="eyebrow">'+(index<7?'CHAPTER '+chapter.number+' / 第'+['一','二','三','四','五','六','七'][index]+'章':index===7?'FURTHER READING / 拓展阅读':'FORMULA INDEX / 常用公式')+'</div><h1>'+escape(chapter.title)+'</h1><p>'+escape(chapter.description)+'</p>'+tags(chapter.tags)+'<div class="chapter-tools">'+buttons+(chapter.source?'<a class="source-link" href="'+chapter.source+'">查看 Markdown 原笔记 ↗</a>':'')+'</div></header>'+
          '<p class="reading-note"><span class="dot"></span>'+(chapter.id==='sec-formula'?'使用公式时，先检查它的适用条件。':mode==='summary'?'先理清主线，再进入完整笔记看推导。':'完整笔记 · 例题可展开阅读与核算。')+'</p><article class="prose">'+chapter[mode]+'</article><nav class="chapter-footer" aria-label="前后章节"><button class="page-nav" data-page="'+(chapters[index-1]?.id||'overview')+'"><small>← '+(index?'上一章':'返回')+'</small>'+escape(chapters[index-1]?.title||'学习总览')+'</button><button class="page-nav next" data-page="'+(chapters[index+1]?.id||'overview')+'"><small>'+(index<chapters.length-1?'下一篇':'返回')+' →</small>'+escape(chapters[index+1]?.title||'学习总览')+'</button></nav>';
        if(mode==='full')wrapExamples(main.querySelector('.prose'));makeToc();typeset();if(mathFailed)showMathNotice();
      }
      window.scrollTo({top:0,behavior:'instant'});updateProgress();
      if(anchor)requestAnimationFrame(()=>gotoHeading(hash));
      if(pendingQuery){const query=pendingQuery.toLowerCase();pendingQuery='';requestAnimationFrame(()=>{const target=[...main.querySelectorAll('.prose h2,.prose h3,.prose h4,.prose p,.prose li')].find(el=>el.textContent.toLowerCase().includes(query));if(target){const d=target.closest('details');if(d)d.open=true;target.scrollIntoView({block:'center'});target.classList.add('search-hit');setTimeout(()=>target.classList.remove('search-hit'),4000)}})}
    }
    main.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;store.set('linalg-mode',mode);render()});
    function updateProgress(){
      const article=main.querySelector('.prose');let progress=0;
      if(article){const top=article.getBoundingClientRect().top+scrollY;const bottom=top+article.offsetHeight;const available=bottom-top-innerHeight+110;progress=available<=0?1:Math.min(1,Math.max(0,(scrollY-top+110)/available));}
      document.documentElement.style.setProperty('--progress',progress);$('progress-label').textContent=Math.round(progress*100)+'%';
      let active=tocItems[0];for(const h of tocItems){if(h.closest('details:not([open])'))continue;if(h.getBoundingClientRect().top<170)active=h}
      $('toc').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.anchor===active?.id));
    }
    let scheduled=false;window.addEventListener('scroll',()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;updateProgress()})},{passive:true});window.addEventListener('resize',updateProgress);main.addEventListener('toggle',updateProgress,true);
    $('menu-btn').addEventListener('click',()=>{const open=!$('sidebar').classList.contains('open');$('sidebar').classList.toggle('open',open);$('mobile-shade').classList.toggle('show',open);$('menu-btn').setAttribute('aria-expanded',String(open))});$('mobile-shade').addEventListener('click',closeMenu);
    function updateThemeButton(){const dark=document.documentElement.dataset.theme==='dark';$('theme-btn').setAttribute('aria-label',dark?'切换为浅色模式':'切换为深色模式');$('theme-btn').setAttribute('aria-pressed',String(dark))}updateThemeButton();
    $('theme-btn').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;store.set('linalg-theme',theme);updateThemeButton()});
    let printState=[];window.addEventListener('beforeprint',()=>{printState=[...main.querySelectorAll('details')].map(d=>[d,d.open]);printState.forEach(([d])=>d.open=true)});window.addEventListener('afterprint',()=>{printState.forEach(([d,open])=>d.open=open);printState=[]});$('print-btn').addEventListener('click',()=>window.print());
    function search(){const value=$('search-input').value.trim().toLowerCase(),terms=value.split(/\s+/);const results=value?chapters.filter(c=>terms.every(t=>(c.title+' '+c.tags.join(' ')+' '+c.search).toLowerCase().includes(t))):chapters.slice(0,7);$('search-results').replaceChildren();if(!results.length){$('search-results').innerHTML='<div class="search-empty">没有找到相关内容，试试“秩”“投影”或“基础解系”。</div>';return}results.slice(0,9).forEach(c=>{const button=document.createElement('button');button.className='search-result';const strong=document.createElement('strong');strong.textContent=(c.number==='∑'?'':c.number+' · ')+c.title;const p=document.createElement('p');const pos=c.search.toLowerCase().indexOf(terms[0]);p.textContent=value&&pos>=0?c.search.slice(Math.max(0,pos-18),pos+95).replace(/\s+/g,' '):c.description;button.append(strong,p);button.addEventListener('click',()=>{$('search-dialog').close();mode='full';store.set('linalg-mode',mode);pendingQuery=$('search-input').value.trim();navigate(c.id)});$('search-results').append(button)})}
    function openSearch(){search();$('search-dialog').showModal();$('search-input').focus()}
    $('search-trigger').addEventListener('click',openSearch);$('search-close').addEventListener('click',()=>$('search-dialog').close());$('search-input').addEventListener('input',search);$('search-dialog').addEventListener('click',e=>{if(e.target===$('search-dialog'))$('search-dialog').close()});
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('search-dialog').open)openSearch()}if(e.key==='Escape'){const menuOpen=$('sidebar').classList.contains('open');closeMenu();if(menuOpen)$('menu-btn').focus()}});
    window.addEventListener('hashchange',render);render();
    const script=document.createElement('script');script.src='阅读资源/tex-svg.js';script.async=true;script.onload=typeset;script.onerror=()=>{const fallback=document.createElement('script');fallback.src='https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js';fallback.async=true;fallback.onload=typeset;fallback.onerror=()=>{mathFailed=true;showMathNotice()};document.head.append(fallback)};document.head.append(script);
  })();
  </script>
