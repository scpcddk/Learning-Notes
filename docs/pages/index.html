<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="<!--SEO_DESCRIPTION-->">
  <meta name="color-scheme" content="light dark">
  <title><!--TITLE--> · Learning Notes</title>
  <style>
:root{color-scheme:light dark;--bg:#fafbf8;--paper:#fff;--ink:#25362f;--muted:#6f7e73;--green:#286249;--soft:#e7efe5;--line:#e0e7dd;--sand:#f5f2e8;--serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.85 var(--sans);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid var(--green);outline-offset:5px}.skip{position:fixed;top:-60px;left:20px;background:var(--green);color:var(--paper);padding:10px 18px;z-index:5}.skip:focus{top:10px}header,main,footer{width:min(1100px,calc(100% - 88px));margin:auto}header{height:94px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:650;letter-spacing:.05em}.brand small{display:block;font-size:9px;letter-spacing:.18em;font-weight:400;color:var(--muted)}.symbol{width:40px;height:44px;border-radius:10px;background:var(--green);color:var(--paper);display:grid;place-items:center;font:italic 32px Georgia,serif}.repo{font-size:12px;color:var(--muted)}.repo:hover,.more a:hover{color:var(--green)}.intro{padding:64px 0 43px}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--green);display:flex;gap:12px;align-items:center}.eyebrow::before{content:'';width:23px;height:1px;background:currentColor}h1{font:500 clamp(36px,4.8vw,58px)/1.45 var(--serif);letter-spacing:.045em;margin:23px 0 19px}h1 em{font-style:normal;color:var(--green)}.intro p{color:var(--muted);font-size:14px;line-height:2;margin:0}.intro-meta{display:flex;gap:18px;color:var(--muted);font-size:10px;margin-top:25px}.intro-meta span+span::before{content:'·';margin-right:18px;color:var(--green)}.subjects{display:grid;grid-template-columns:1fr 1fr;gap:24px}.subject{background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden;transition:transform .18s,border-color .18s}.subject:hover{transform:translateY(-3px);border-color:var(--green)}.art{height:230px;overflow:hidden;background:var(--sand);display:grid;place-items:center;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}.art img{width:100%;height:100%;min-width:0;min-height:0;object-fit:cover}.subject-copy{padding:26px 29px 25px}.number{font:italic 12px Georgia,serif;color:var(--muted);letter-spacing:.04em}.subject h2{font:500 29px/1.5 var(--serif);letter-spacing:.04em;margin:9px 0 10px}.subject p{font-size:13px;line-height:1.95;color:var(--muted);margin:0}.chips{display:flex;gap:7px;margin-top:20px;flex-wrap:wrap}.chips span{font-size:10px;border:1px solid var(--line);background:var(--bg);padding:2px 8px;border-radius:4px}.subject strong{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--green);font-weight:550;border-top:1px solid var(--line);padding-top:16px;margin-top:23px}.subject strong span{font-size:20px;font-weight:400}.more{margin:42px 0 0;padding:25px 0;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.more h2{font-size:15px;margin:0 0 7px;font-weight:600}.more p{font-size:12px;color:var(--muted);margin:0}.more a{font-size:12px;white-space:nowrap;color:var(--green)}.reading-tip{font-size:11px;line-height:2;color:var(--muted);margin:23px 0 38px}footer{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:22px 0 28px;border-top:1px solid var(--line)}
@media(prefers-color-scheme:dark){:root{--bg:#171f1b;--paper:#1e2822;--ink:#dce6dc;--muted:#9aa99e;--green:#a0c9a1;--soft:#2b4031;--line:#344237;--sand:#333329}.art{background:#e7e8da}.art img{opacity:.87}}
@media(max-width:760px){header,main,footer{width:calc(100% - 42px)}header{height:77px}.brand{font-size:16px}.repo{font-size:10px}.intro{padding:43px 0 33px}h1{font-size:38px}.intro p{font-size:12px}.subjects{gap:15px}.art{height:160px}.subject-copy{padding:19px}.subject h2{font-size:24px}.subject p{font-size:12px}.chips{gap:5px}.chips span{font-size:9px;padding:2px 6px}.subject strong{font-size:11px}.more{margin-top:30px}.more p{font-size:11px;max-width:280px}}
@media(max-width:540px){.subjects{grid-template-columns:1fr}.art{height:195px}.subject-copy{padding:23px}.more{align-items:flex-start;flex-direction:column;gap:12px}.more p{max-width:none}.reading-tip{font-size:10px}.repo{font-size:10px}h1{font-size:35px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.subject{transition:none}}
.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}.subject-copy{padding:24px}.number{font-size:10px}.art{height:240px}
@media(max-width:900px){.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:190px}}
@media(max-width:540px){.subjects{grid-template-columns:1fr}.art{height:215px}}

.catalog-trail{display:flex;gap:10px;padding-top:27px;font-size:11px;color:var(--muted)}.catalog-trail a{color:var(--green)}.catalog-trail+.intro{padding-top:30px}.root-catalog .art{height:245px}.subject.compact .subject-copy{padding:26px}.subject.compact h2{font-size:23px;margin:12px 0 10px}.subject.compact strong{margin-top:21px}.board-mark{display:flex;justify-content:space-between;align-items:center}.board-mark>span{font:italic 27px Georgia,serif;color:var(--green)}.subject.compact .chips{margin-top:15px}.math-catalog{grid-template-columns:repeat(3,minmax(0,1fr))}.math-catalog .art{height:205px}.directory-catalog .subject h2{font-size:23px}.directory-catalog .subject p{overflow-wrap:anywhere}@media(max-width:900px){.math-catalog{grid-template-columns:repeat(2,minmax(0,1fr))}.root-catalog .art{height:200px}}@media(max-width:540px){.math-catalog{grid-template-columns:1fr}.root-catalog .art{height:215px}.subject.compact .subject-copy{padding:23px}.catalog-trail{padding-top:22px}.catalog-trail+.intro{padding-top:26px}}

.intro.with-cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center;gap:24px;padding:28px 0 37px}.intro.with-cover h1{font-size:clamp(35px,4vw,50px)}.catalog-cover{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:contain;mix-blend-mode:multiply}.programming-catalog{grid-template-columns:repeat(3,minmax(0,1fr))}.programming-catalog .art{height:200px}.programming-catalog .subject-copy{padding:23px}.programming-catalog .subject h2{font-size:27px}.programming-catalog .subject p{min-height:52px}.intro-copy{min-width:0}@media(prefers-color-scheme:dark){.catalog-cover{mix-blend-mode:normal;opacity:.85}}@media(max-width:900px){.programming-catalog{grid-template-columns:repeat(2,minmax(0,1fr))}.intro.with-cover{gap:15px}.intro.with-cover h1{font-size:36px}}@media(max-width:600px){.intro.with-cover{grid-template-columns:1fr;padding-top:33px;gap:15px}.intro.with-cover h1{font-size:37px}.catalog-cover{max-width:470px;justify-self:center}.programming-catalog{grid-template-columns:1fr}.programming-catalog .art{height:210px}.programming-catalog .subject p{min-height:0}}
</style>
  <link rel="icon" href="<!--ASSET_BASE-->favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#subjects">选择板块</a>
  <header>
    <a class="brand" href="<!--HOME_URL-->"><span class="symbol">∫</span><span>学习笔记<small>LEARNING NOTES</small></span></a>
    <a class="repo" href="<!--REPO_URL-->">在 GitHub 查看 ↗</a>
  </header>
  <main>
    <!--BREADCRUMB-->
    <section class="intro <!--INTRO_CLASS-->"><div class="intro-copy">
      <div class="eyebrow"><!--EYEBROW--></div>
      <h1><!--HEADING--></h1>
      <p><!--DESCRIPTION--></p>
      <div class="intro-meta"><!--META--></div>
      </div><!--HERO_ART-->
    </section>
    <section id="subjects" class="subjects <!--GRID_CLASS-->" aria-label="<!--SECTION_LABEL-->">
      <!--CARDS-->
    </section>
    <section class="more"><div><h2><!--MORE_TITLE--></h2><p><!--MORE_TEXT--></p></div><a href="<!--SOURCE_URL-->">查看仓库目录 ↗</a></section>
    <p class="reading-tip"><!--READING_TIP--></p>
  </main>
  <footer><span>个人学习笔记 · 持续整理</span><a href="<!--REPO_URL-->">Learning Notes ↗</a></footer>
</body>
</html>
