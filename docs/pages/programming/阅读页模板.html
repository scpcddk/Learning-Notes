  <script>try{if(localStorage.getItem('<!--THEME_KEY-->')==='dark')document.documentElement.dataset.theme='dark'}catch{}</script>
  <style>

    .document-layout{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:38px}.article-main{min-width:0;max-width:900px}.document-head{padding:5px 0 23px;border-bottom:1px solid var(--line);margin-bottom:26px}.document-head h1{font:500 clamp(27px,3vw,39px)/1.6 var(--serif);margin:12px 0 15px;overflow-wrap:anywhere}.document-meta{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:10px}.reading-tools{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-top:22px}.mode-switch{display:inline-flex;padding:3px;background:var(--sidebar);border:1px solid var(--line);border-radius:6px}.mode-switch button{border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:11px;padding:6px 13px}.mode-switch button[aria-pressed=true]{background:var(--paper);color:var(--green)}.source-link{font-size:11px;text-decoration:underline;text-underline-offset:4px}.prose{font-size:14px;line-height:1.95;overflow-wrap:anywhere;min-width:0}.prose h1{font:500 29px/1.6 var(--serif);margin:30px 0 18px}.prose h2{font-size:22px;line-height:1.7;font-weight:600;margin:38px 0 17px;padding-bottom:8px;border-bottom:1px solid var(--line)}.prose h3{font-size:18px;font-weight:600;margin:28px 0 14px}.prose h4{font-size:15px;margin:23px 0 12px}.prose h5,.prose h6{font-size:14px;margin:20px 0 10px}.prose p{margin:13px 0}.prose li{margin:5px 0}.prose hr{border:0;border-top:1px solid var(--line);margin:29px 0}.prose a{text-decoration:underline;text-underline-offset:3px}.prose img{max-width:100%;height:auto;border-radius:6px}.prose blockquote{border-left:3px solid var(--green);padding:8px 18px;margin:22px 0;background:var(--soft);color:var(--ink)}.prose blockquote p{margin:7px 0}.prose code{font:12px/1.8 Consolas,'Cascadia Code',monospace;background:var(--soft);padding:2px 5px;border-radius:3px;overflow-wrap:anywhere}.prose mark{background:var(--soft);color:var(--green);padding:1px 3px}.prose pre{overflow:auto;background:var(--sidebar);padding:17px;border-radius:6px}.code-block{background:var(--code);color:var(--code-ink);border:1px solid #3a5040;border-radius:8px;overflow:hidden;margin:21px 0}.code-block figcaption{display:flex;justify-content:space-between;align-items:center;padding:8px 15px;border-bottom:1px solid #3a5040;color:#bfd0c0;font-size:9px;letter-spacing:.1em}.copy-code{border:1px solid #627668;background:transparent;color:#e3ebdf;border-radius:4px;font-size:10px;padding:3px 8px}.prose .code-block pre{padding:17px 19px;margin:0;background:none;border-radius:0;tab-size:4}.prose .code-block code{display:block;padding:0;background:none;white-space:pre;overflow-wrap:normal;color:inherit;font:12px/1.9 Consolas,'Cascadia Code',monospace}.tok-comment{color:#99b49a}.tok-string{color:#e0c88f}.tok-keyword{color:#b9d8f4}.tok-number{color:#d6b6dd}.table-scroll{overflow:auto;border:1px solid var(--line);border-radius:6px;margin:22px 0}.prose table{width:100%;border-collapse:collapse;font-size:12px}.prose th,.prose td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:90px}.prose th{background:var(--sidebar);font-weight:600}.prose tr:last-child td{border-bottom:0}.prose details{border:1px solid var(--line);border-radius:7px;padding:0 19px;margin:25px 0;background:var(--paper)}.prose details>summary{padding:14px 0;cursor:pointer;color:var(--green);font-size:12px;font-weight:600}.prose details[open]{padding-bottom:15px}.reading-rail{align-self:start;position:sticky;top:106px;border-left:1px solid var(--line);padding-left:17px;max-height:calc(100vh - 140px);overflow:auto;scrollbar-width:thin}.rail-label{font-size:10px;color:var(--muted);margin:0 0 13px}.toc a{display:block;font-size:10px;line-height:1.9;padding:4px 0;color:var(--muted)}.toc a.sub{padding-left:9px}.toc a:hover,.toc a.active{color:var(--green)}.document-pager{display:flex;justify-content:space-between;gap:25px;padding-top:22px;margin-top:35px;border-top:1px solid var(--line);font-size:11px}.document-pager a{max-width:47%;overflow-wrap:anywhere}.document-pager a:last-child{text-align:right;margin-left:auto}.guide{padding:23px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.guide h2{font:500 23px var(--serif);margin:0 0 12px}.guide p{font-size:12px;color:var(--muted);margin:0 0 17px}.guide a{display:block;border-top:1px solid var(--line);padding:10px 0;font-size:12px}.guide a.sub{padding-left:16px;font-size:11px;color:var(--muted)}.resource-panel{padding:23px;border:1px solid var(--line);border-radius:8px;background:var(--paper);margin-bottom:21px}.resource-panel p{color:var(--muted);font-size:12px;margin:0 0 17px}.resource-frame{display:block;width:100%;height:76vh;min-height:490px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}.read-highlight{outline:2px solid #b79a55;outline-offset:5px;border-radius:3px}.mobile-toc{display:none;margin-bottom:20px;padding:13px 17px;border:1px solid var(--line);border-radius:6px}.mobile-toc summary{cursor:pointer;font-size:12px;color:var(--green)}#shade{position:fixed;inset:0;border:0;background:#15251c66;z-index:45}html[data-theme=dark] .hero img{mix-blend-mode:normal;opacity:.85}html[data-theme=dark] .primary{background:var(--green);color:#17251b}
    .section-card{display:flex;flex-direction:column;min-height:208px;color:var(--ink);transition:transform .15s,border-color .15s}.section-card:hover{transform:translateY(-2px);border-color:var(--green)}.section-card h3{font-size:25px;margin:17px 0 9px}.section-card p{font-size:12px;color:var(--muted);margin:0 0 19px;line-height:1.9}.section-card .section-bottom{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.section-card .section-bottom b{color:var(--green);font-weight:500}.section-card .folder-top>span:last-child{font:17px var(--sans);color:var(--green)}.section-page-head{padding:4px 0 27px;margin-bottom:28px;border-bottom:1px solid var(--line)}.section-page-head>a{font-size:11px}.section-page-head h1{font:500 clamp(30px,3.3vw,41px)/1.6 var(--serif);margin:21px 0 9px}.section-page-head p{font-size:13px;color:var(--muted);margin:0 0 15px}.section-page-head .eyebrow{margin-top:26px}.nav-section-link{display:flex;align-items:center;gap:9px;padding:11px 10px;color:var(--ink);border-radius:6px;font-size:12px;margin-top:4px}.nav-section-link:hover{background:var(--paper);color:var(--green)}.nav-section-link[aria-expanded=true]{background:var(--soft);color:var(--green)}.nav-section-link .section-chevron{display:inline-block;font:16px/1 var(--sans);color:var(--muted)}.nav-section-link[aria-expanded=true] .section-chevron{transform:rotate(90deg)}.nav-section-link .section-count{margin-left:auto;color:var(--muted);font:10px Georgia,serif}.section-notes{margin:4px 0 12px 10px;padding-left:8px;border-left:1px solid var(--line)}.section-notes .nav-group{margin-top:16px}.search-scope{font-size:10px;color:var(--muted);padding:13px 10px 4px}.breadcrumb .level-crumb{max-width:160px;overflow:hidden;text-overflow:ellipsis}.document-back{display:inline-block;font-size:11px;margin-bottom:18px}
    @media(max-width:1230px){.document-layout{grid-template-columns:minmax(0,1fr)}.reading-rail{display:none}.mobile-toc{display:block}.hero h1{font-size:39px}main{padding:32px 30px 0}.hero{min-height:300px}}
    @media(max-width:840px){#sidebar{transform:translateX(-100%);transition:transform .2s}body.nav-open #sidebar{transform:none}.workspace{margin-left:0}.progress{left:0}#menu{display:block}header{padding:0 22px}.hero h1{font-size:42px}}

<body>
  <a class="skip" href="#main">跳到阅读区</a>
  <aside id="sidebar" aria-label="<!--DIRECTORY_LABEL-->">
    <a class="brand" href="#overview"><span class="brand-symbol" aria-hidden="true"><!--BRAND_SYMBOL--></span><span><strong><!--TITLE--></strong><small><!--BRAND_TAGLINE--></small></span></a>
    <div class="sidebar-tools">
      <label class="language-label" <!--SWITCH_HIDDEN-->>切换语言<select id="language-select" aria-label="选择编程语言"></select></label>
      <label class="search-label"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索笔记、代码与知识点" aria-label="全文搜索笔记"><kbd>Ctrl K</kbd></label>
      <div class="filters" role="group" aria-label="按内容类型筛选"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="note" aria-pressed="false">笔记</button><button data-filter="practice" aria-pressed="false">习题</button><button data-filter="diagram" aria-pressed="false">图解</button><button data-filter="material" aria-pressed="false">资料</button></div>
    </div>
    <nav id="catalog" aria-label="笔记目录"></nav>
    <div class="sidebar-footer"><a href="../"><!--BACK_SHORT--></a><span>持续学习 · 持续整理</span></div>
  </aside>
  <button id="shade" aria-label="关闭目录" hidden></button>
  <div class="workspace">
    <header><nav class="breadcrumb" aria-label="位置"><button id="menu" aria-label="打开目录" aria-expanded="false" aria-controls="sidebar">☰</button><a class="home-crumb" href="<!--HOME_URL-->">学习笔记</a><span class="home-crumb">/</span><!--PARENT_CRUMB--><a id="language-crumb" class="level-crumb" href="#overview" hidden></a><span id="language-divider" class="level-divider" hidden>/</span><a id="section-crumb" class="level-crumb" hidden></a><span id="section-divider" class="level-divider" hidden>/</span><b id="breadcrumb-title"><!--TITLE--></b></nav><div class="top-actions"><button id="theme" aria-label="切换深色模式" aria-pressed="false">深色</button><button id="print">打印</button></div></header>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    <main id="main" tabindex="-1">
      <section id="overview"></section>
      <section id="document" class="document-layout" hidden aria-label="当前笔记">
        <div class="article-main"><a id="document-back" class="document-back" hidden></a><div class="document-head"><div id="doc-group" class="eyebrow"></div><h1 id="doc-title"></h1><div id="doc-meta" class="document-meta"></div><div class="reading-tools"><div id="mode-switch" class="mode-switch" role="group" aria-label="阅读模式"><button data-mode="guide" aria-pressed="false">目录速览</button><button data-mode="full" aria-pressed="true">完整笔记</button></div><a id="source" class="source-link" target="_blank" rel="noopener">查看原笔记 ↗</a></div></div>
          <details id="mobile-toc" class="mobile-toc"><summary>本篇目录</summary><nav id="mobile-toc-links" class="toc" aria-label="本篇目录"></nav></details>
          <div id="guide" class="guide" hidden></div><div id="resource" hidden></div><article id="note-body" class="prose"></article><nav id="pager" class="document-pager" aria-label="相邻笔记"></nav>
        </div><aside id="rail" class="reading-rail" aria-label="本篇目录"><p class="rail-label">ON THIS PAGE / 本篇目录</p><nav id="toc" class="toc"></nav></aside>
      </section>
      <footer class="page-footer"><span><!--TITLE--> · 个人学习笔记</span><a href="../"><!--BACK_TEXT--></a></footer>
      <noscript>章节切换和搜索需要启用 JavaScript。</noscript>
    </main>
  </div>
  <script type="application/json" id="chapter-data"><!--CHAPTER_DATA--></script>
  <script type="application/json" id="language-data"><!--LANGUAGE_DATA--></script>
  <script>
  (()=>{
    'use strict';
    const $=id=>document.getElementById(id), pages=JSON.parse($('chapter-data').textContent), config=JSON.parse($('language-data').textContent);
    const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const get=key=>{try{return localStorage.getItem('programming-'+config.slug+'-'+key)}catch{return null}};
    const save=(key,value)=>{try{localStorage.setItem('programming-'+config.slug+'-'+key,value)}catch{}};
    const labels={note:'笔记',practice:'习题',diagram:'图解',pdf:'PDF',resource:'资料',...(config.kindLabels||{})};
    if(config.kindLabels){document.querySelector('[data-filter=practice]').hidden=true;document.querySelector('[data-filter=material]').hidden=!pages.some(p=>['pdf','resource'].includes(p.kind));document.querySelector('[data-filter=note]').textContent='计划';document.querySelector('[data-filter=diagram]').textContent='HTML';document.querySelector('#document').setAttribute('aria-label','当前计划');document.querySelector('#search').placeholder='搜索计划、任务与学习方向'}
    let active='overview', filter='all', mode=get('mode')||'full', currentPage=null, currentSection=null, tocNodes=[], pendingQuery='';
    if(!['guide','full'].includes(mode))mode='full';
    const groups=[...new Set(pages.map(p=>p.group))];
    const sections=config.sections||[];
    $('language-select').innerHTML=config.languages.map(item=>'<option value="'+escape(item.slug)+'"'+(item.slug===config.slug?' selected':'')+'>'+escape(item.title)+'</option>').join('');
    $('language-select').addEventListener('change',()=>location.href='../'+encodeURIComponent($('language-select').value)+'/');
    function catalog(){
      const terms=$('search').value.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);
      const found=pages.filter(p=>(filter==='all'||(filter==='material'?['pdf','resource'].includes(p.kind):p.kind===filter))&&terms.every(term=>(p.title+' '+p.group+' '+p.search).toLocaleLowerCase().includes(term))&&(!currentSection||terms.length||p.section===currentSection.key));
      const home='<a class="nav-home" href="#overview"'+(active==='overview'?' aria-current="page"':'')+'>⌂　'+escape(config.title)+' 总览</a>';
      if(sections.length&&!terms.length&&filter==='all'){
        $('catalog').innerHTML=home+sections.map(section=>{const selected=currentSection?.id===section.id;return '<div class="nav-section"><a class="nav-section-link" href="#'+section.id+'" aria-expanded="'+selected+'"'+(active===section.id?' aria-current="page"':'')+'><span class="section-chevron" aria-hidden="true">›</span><span>'+escape(section.title)+'</span><span class="section-count">'+section.count+'</span></a>'+(selected?'<div class="section-notes">'+noteLinks(pages.filter(p=>p.section===section.key),true)+'</div>':'')+'</div>'}).join('');
      }else{
        $('catalog').innerHTML=home+(sections.length?'<p class="search-scope">'+(terms.length?'搜索全部 '+escape(config.title)+' 笔记':escape(currentSection?.title||config.title)+' · 按类型筛选')+' · '+found.length+' 项</p>':'')+noteLinks(found,false)+(!found.length?'<p class="empty" role="status">没有找到对应内容，试试其他关键词或选择“全部”。</p>':'');
      }
      document.querySelectorAll('[data-filter]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.filter===filter)));
    }
    function noteLinks(entries,scoped){let group='';return entries.map(p=>{const label=scoped?p.subgroup:p.group,heading=group===label?'':'<div class="nav-group">'+escape(label)+'</div>';group=label;return heading+'<a class="nav-link" href="#'+p.id+'"'+(active===p.id?' aria-current="page"':'')+'><span class="badge">'+(p.pending?'待补充':labels[p.kind])+'</span><span>'+escape(p.title)+'</span></a>'}).join('')}
    function link(p){return '<li><a href="#'+p.id+'"><span>'+escape(p.title)+'</span><span>'+ (p.pending?'待补充':labels[p.kind]+' ↗')+'</span></a></li>'}
    function folderGrid(entries,scoped){const key=p=>scoped?p.subgroup:p.group,labels=[...new Set(entries.map(key))];return '<div class="folders">'+labels.map((group,index)=>{const notes=entries.filter(p=>key(p)===group);return '<section class="folder"><div class="folder-top"><span>'+String(index+1).padStart(2,'0')+'</span><span>'+notes.length+' 篇</span></div><h3>'+escape(group)+'</h3><ul class="folder-list">'+notes.slice(0,5).map(link).join('')+'</ul>'+(notes.length>5?'<details><summary>展开其余 '+(notes.length-5)+' 篇</summary><ul class="folder-list">'+notes.slice(5).map(link).join('')+'</ul></details>':'')+'</section>'}).join('')+'</div>'}
    function overview(section){
      if(section){const entries=pages.filter(p=>p.section===section.key);$('overview').innerHTML='<div class="section-page-head"><a href="#overview">← 返回 '+escape(config.title)+' 总览</a><div class="eyebrow">'+escape(config.label)+' / '+escape(section.title)+'</div><h1>'+escape(section.title)+'</h1><p>'+escape(section.description)+'</p><div class="document-meta"><span>'+section.notes+' '+escape(config.itemNoun||'篇笔记')+'</span><span>'+section.resources+' 份图解与资料</span></div></div>'+folderGrid(entries,true);return}
      const last=pages.find(p=>p.id===get('last'))||pages.find(p=>!p.pending&&['note','practice'].includes(p.kind));
      const start=sections.length&&!get('last')?sections[0].id:last?.id;
      const cards=sections.length?'<div class="folders section-cards">'+sections.map((item,index)=>'<a class="folder section-card'+(item.cover?' has-cover':'')+'" href="#'+item.id+'">'+(item.cover?'<img class="section-cover" src="'+escape(item.cover)+'" alt="" width="1536" height="1024" loading="lazy" decoding="async"><div class="section-copy">':'')+'<div class="folder-top"><span>SECTION '+String(index+1).padStart(2,'0')+'</span><span aria-hidden="true">↗</span></div><h3>'+escape(item.title)+'</h3><p>'+escape(item.description)+'</p><div class="section-bottom"><span>'+item.notes+' '+escape(config.itemNoun||'篇笔记')+' · '+item.resources+' 份资料'+(item.pending?' · '+item.pending+' 篇待补充':'')+'</span><b>进入板块 →</b></div>'+(item.cover?'</div>':'')+'</a>').join('')+'</div>':folderGrid(pages,false);
      $('overview').innerHTML='<section class="hero"><div><div class="eyebrow">'+escape(config.label)+' / LEARNING NOTES</div><h1>'+escape(config.heroLines[0])+'<br><em>'+escape(config.heroLines[1])+'</em></h1><p>'+escape(config.description)+'</p><div class="hero-links">'+(start?'<a class="primary" href="#'+start+'">'+(get('last')?'继续阅读':sections.length?'选择学习板块':'开始阅读')+' <span aria-hidden="true">↗</span></a>':'')+'<a class="text-link" href="'+escape(config.source)+'" target="_blank" rel="noopener">查看原笔记 ↗</a></div></div><img src="'+escape(config.coverUrl)+'" alt="" width="1536" height="1024"></section><div class="stats"><div><strong>'+config.notes+'</strong><span>'+escape(config.noteNoun||'篇学习笔记')+'</span></div><div><strong>'+(sections.length||groups.length)+'</strong><span>'+(sections.length?(config.sectionNoun||'个学习板块'):'个内容分类')+'</span></div><div><strong>'+config.resources+'</strong><span>'+escape(config.resourceNoun||'份图解与资料')+'</span></div></div><section aria-labelledby="folder-heading"><div class="section-heading"><div><div class="eyebrow">FOLLOW THE NOTES / 沿着目录阅读</div><h2 id="folder-heading">'+(config.sectionHeading||(sections.length?'选择一个板块，继续学习。':'把知识，一点点连起来。'))+'</h2><p>'+(config.sectionIntro||(sections.length?'先理清方向，再进入具体的笔记与练习。':'从基础语法到补充理解，再在习题与实践中检验。'))+'</p></div><span class="text-link">'+(sections.length?sections.length+' 个板块':pages.length+' 个阅读条目')+'</span></div>'+cards+'</section>'+(sections.length?'':'<section class="study-note"><h2>学会一个概念，<br>也试着写一段代码。</h2><p>先理解例子，再独立实现。遇到疑问时回到笔记，把使用条件、错误原因和自己的解释一起留下来。</p></section>');
    }
    function highlight(){
      const keywords=new Set('abstract assert async await auto boolean break byte case catch char class const continue def default delete do double elif else enum except extends false final finally float for from if implements import in int interface is lambda let long namespace new None nonlocal not null or package pass private protected public raise record return short sizeof static String struct super switch synchronized template this throw throws true try typedef typename union unsigned using var virtual void volatile while with yield and as bool self select from where insert update delete join into values set create table'.split(' '));
      for(const code of $('note-body').querySelectorAll('.code-block code')){
        const language=code.className.replace('language-','');
        if(!/^(c|cpp|c\+\+|java|python|py|javascript|js|typescript|ts|sql|bash|sh|shell|powershell)$/.test(language))continue;
        const text=code.textContent, pattern=/("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*)|\b([A-Za-z_]\w*)\b|\b(\d+(?:\.\d+)?)\b/g;
        let result='',pos=0;
        for(const match of text.matchAll(pattern)){result+=escape(text.slice(pos,match.index));const kind=match[1]?'string':match[2]?'comment':match[4]?'number':keywords.has(match[3])?'keyword':'';result+=kind?'<span class="tok-'+kind+'">'+escape(match[0])+'</span>':escape(match[0]);pos=match.index+match[0].length}
        code.innerHTML=result+escape(text.slice(pos));
      }
    }
    function anchor(id){
      const target=document.getElementById(id);if(!target)return;
      let details=target.closest('details');while(details){details.open=true;details=details.parentElement.closest('details')}
      target.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});
    }
    function render(){
      let hash;try{hash=decodeURIComponent(location.hash.slice(1))}catch{hash='overview'}
      const page=pages.find(p=>p.id===hash||p.headings.some(h=>h.id===hash));
      currentSection=page?sections.find(section=>section.key===page.section)||null:sections.find(section=>section.id===hash)||null;
      active=page?.id||currentSection?.id||'overview';currentPage=page||null;
      $('overview').hidden=!!page;$('document').hidden=!page;$('breadcrumb-title').textContent=page?.title||currentSection?.title||config.title;
      $('language-crumb').textContent=config.title;$('language-crumb').hidden=$('language-divider').hidden=!page&&!currentSection;
      $('section-crumb').hidden=$('section-divider').hidden=!page||!currentSection;
      if(currentSection){$('section-crumb').textContent=currentSection.title;$('section-crumb').href='#'+currentSection.id}
      document.title=(page?page.title+' · ':currentSection?currentSection.title+' · ':'')+config.title+' · 学习笔记';
      if(!page){$('note-body').replaceChildren();$('resource').replaceChildren();tocNodes=[];overview(currentSection);catalog();menu(false);window.scrollTo(0,0);progress();return}
      const isNote=['note','practice'].includes(page.kind), headingTarget=page.headings.some(h=>h.id===hash);
      if(headingTarget)mode='full';
      save('last',page.id);$('doc-title').textContent=page.title;$('doc-group').textContent=page.group;
      $('document-back').hidden=!currentSection;
      if(currentSection){$('document-back').href='#'+currentSection.id;$('document-back').textContent='← 返回 '+currentSection.title}
      $('doc-meta').innerHTML='<span>'+labels[page.kind]+'</span>'+(!isNote?'<span>'+escape(page.format)+'</span>':'')+(page.pending?'<span>内容待补充</span>':'')+(page.tasks?.total?'<span>原文勾选记录 '+page.tasks.done+' / '+page.tasks.total+' 项</span>':'');
      $('source').href=page.source;$('source').textContent=isNote?'查看 Markdown 原笔记 ↗':'查看与下载原文件 ↗';
      $('mode-switch').hidden=!isNote||page.pending;$('guide').hidden=!isNote||page.pending||mode!=='guide';
      $('note-body').hidden=!isNote||(!page.pending&&mode==='guide');$('resource').hidden=isNote;
      $('note-body').innerHTML=page.pending?'<div class="resource-panel"><p>这篇笔记还在整理中。先阅读其他内容，之后再回来补上这一部分。</p><a href="#overview">返回目录 ↗</a></div>':page.full;
      const outline=page.headings.filter(h=>h.level<=3), links=outline.map(h=>'<a class="'+(h.level===3?'sub':'')+'" href="#'+h.id+'">'+escape(h.title)+'</a>').join('');
      $('guide').innerHTML='<h2>本篇内容</h2><p>选择一个小节，进入完整笔记继续阅读。这里沿用原笔记的章节结构。</p>'+(links||'<a href="#'+page.id+'" data-full>阅读完整笔记 ↗</a>');
      $('toc').innerHTML=links;$('mobile-toc-links').innerHTML=links;
      $('rail').hidden=!isNote||mode!=='full'||!outline.length||page.pending;$('mobile-toc').hidden=$('rail').hidden;
      $('mobile-toc').open=false;
      $('resource').replaceChildren();
      if(!isNote){
        const panel=document.createElement('div');panel.className='resource-panel';const p=document.createElement('p');
        p.textContent=page.kind==='diagram'?(config.diagramDescription||'保留原笔记中的交互图解，可在下方探索或独立打开。'):page.kind==='pdf'?'课件保留原始排版，可翻页、搜索、缩放和下载。':'这份资料保留原始格式，下载后使用对应软件打开。';panel.append(p);
        const a=document.createElement('a');a.textContent=page.kind==='resource'?'查看与下载原文件 ↗':'独立打开 ↗';a.href=page.embed||page.pdf||page.source;a.target='_blank';a.rel='noopener';panel.append(a);$('resource').append(panel);
        if(page.embed||page.pdf){const frame=document.createElement('iframe');frame.className='resource-frame';frame.title=page.title;if(page.embed){frame.setAttribute('sandbox','allow-scripts');frame.src=page.embed}else{frame.src='<!--PDF_BASE-->pdfjs/web/viewer.html?file='+encodeURIComponent(new URL(page.pdf,location.href).href)+'#zoom=page-width&pagemode=none'}$('resource').append(frame)}
      }
      const sequence=currentSection?pages.filter(p=>p.section===currentSection.key):pages,index=sequence.indexOf(page),previous=sequence[index-1],next=sequence[index+1],back=currentSection?.id||'overview',backTitle=currentSection?'返回 '+currentSection.title:'返回总览';
      $('pager').innerHTML='<a href="#'+(previous?.id||back)+'">← '+escape(previous?.title||backTitle)+'</a><a href="#'+(next?.id||back)+'">'+escape(next?.title||backTitle)+' →</a>';
      document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));
      highlight();tocNodes=[...$('note-body').querySelectorAll('h1,h2,h3')];catalog();menu(false);window.scrollTo(0,0);progress();
      if(headingTarget)requestAnimationFrame(()=>anchor(hash));
      if(pendingQuery){const terms=pendingQuery.toLocaleLowerCase().split(/\s+/).filter(Boolean);pendingQuery='';requestAnimationFrame(()=>{const found=[...$('note-body').querySelectorAll('h1,h2,h3,h4,p,li,pre')].find(node=>terms.every(term=>node.textContent.toLocaleLowerCase().includes(term)));if(found){let details=found.closest('details');while(details){details.open=true;details=details.parentElement.closest('details')}found.scrollIntoView({block:'center'});found.classList.add('read-highlight');setTimeout(()=>found.classList.remove('read-highlight'),4000)}})}
    }
    function progress(){
      const body=$('note-body');let value=0;
      if(currentPage&&!body.hidden){const top=body.getBoundingClientRect().top+scrollY,available=body.offsetHeight-innerHeight+110;value=available<=0?1:Math.min(1,Math.max(0,(scrollY-top+110)/available))}
      $('progress').style.width=(value*100)+'%';
      let activeHeading=tocNodes[0];for(const heading of tocNodes){if(heading.closest('details:not([open])'))continue;if(heading.getBoundingClientRect().top<170)activeHeading=heading}
      $('toc').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.hash==='#'+activeHeading?.id));
    }
    function menu(open){document.body.classList.toggle('nav-open',open);$('shade').hidden=!open;$('menu').setAttribute('aria-expanded',String(open));$('sidebar').inert=matchMedia('(max-width:840px)').matches&&!open}
    $('menu').addEventListener('click',()=>{menu(!document.body.classList.contains('nav-open'));if(document.body.classList.contains('nav-open'))$('search').focus()});
    $('shade').addEventListener('click',()=>{menu(false);$('menu').focus()});
    $('catalog').addEventListener('click',event=>{const link=event.target.closest('a');if(link){pendingQuery=link.classList.contains('nav-link')?$('search').value.trim():'';if(pendingQuery){mode='full';save('mode',mode)}else if(!link.classList.contains('nav-link')){filter='all';$('search').value=''}menu(false);if(link.hash===location.hash)render()}});
    $('search').addEventListener('input',catalog);
    document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;catalog()}));
    document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;save('mode',mode);if(currentPage)history.replaceState(null,'','#'+currentPage.id);render()}));
    document.addEventListener('click',event=>{const full=event.target.closest('[data-full]');if(full){event.preventDefault();mode='full';save('mode',mode);render()}const link=event.target.closest('a[href^="#"]');if(link&&(link.hash==='#overview'||sections.some(section=>link.hash==='#'+section.id))){$('search').value='';filter='all';pendingQuery=''}});
    document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(matchMedia('(max-width:840px)').matches)menu(true);$('search').focus()}if(event.key==='Escape'&&document.body.classList.contains('nav-open')){menu(false);$('menu').focus()}});
    $('note-body').addEventListener('click',async event=>{const button=event.target.closest('.copy-code');if(!button)return;const text=button.closest('.code-block').querySelector('code').textContent;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const field=document.createElement('textarea');field.value=text;field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();const copied=document.execCommand('copy');field.remove();if(!copied)throw new Error('copy failed')}button.textContent='已复制'}catch{button.textContent='请选择代码复制'}setTimeout(()=>button.textContent='复制代码',1800)});
    function themeButton(){const dark=document.documentElement.dataset.theme==='dark';$('theme').textContent=dark?'浅色':'深色';$('theme').setAttribute('aria-pressed',String(dark));$('theme').setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式')}
    $('theme').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('<!--THEME_KEY-->',theme)}catch{}themeButton()});
    let printState=[],printGuide=false;
    window.addEventListener('beforeprint',()=>{printGuide=!!currentPage&&mode==='guide';if(printGuide){$('guide').hidden=true;$('note-body').hidden=false}printState=[...$('note-body').querySelectorAll('details')].map(d=>[d,d.open]);printState.forEach(([d])=>d.open=true)});
    window.addEventListener('afterprint',()=>{printState.forEach(([d,open])=>d.open=open);if(printGuide){$('guide').hidden=false;$('note-body').hidden=true}printState=[]});$('print').addEventListener('click',()=>window.print());
    let scheduled=false;window.addEventListener('scroll',()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;progress()})},{passive:true});
    window.addEventListener('resize',()=>{menu(matchMedia('(max-width:840px)').matches&&document.body.classList.contains('nav-open'));progress()});$('note-body').addEventListener('toggle',progress,true);window.addEventListener('hashchange',render);
    themeButton();menu(false);render();
  })();
  </script>
